# gitleaks configuration for KAPSORA.
#
# Starts from the upstream default rules and allows the few things that are high-entropy
# by construction and are not credentials. Real credentials never enter the repository:
# .env is git-ignored and every example value is a placeholder.
#
# The allowlist is the singular [allowlist] table on purpose. gitleaks 8.24 silently
# ignores the plural [[allowlists]] form when [extend] useDefault is set, so a config
# written that way reports success over an empty set — which is what this file did from
# the day it was added until 2026-09-04. Verified both ways with the gitleaks binary:
# the entries below suppress their findings, and a planted secret in any other file is
# still reported.

[extend]
useDefault = true

[allowlist]
description = """
Paths that are high-entropy by construction:

- web/packages/api-client/src/generated and the lock files carry long generated strings.
  All of them are reproduced from their sources by CI, which fails on any drift, so a
  secret could not survive there unnoticed.
- .env.example, docs, deploy and the native scripts hold placeholders such as CHANGE_ME
  and local-only passwords the runbooks print anyway.
- tools/ is the git-ignored working directory of the local MinIO and ClamAV binaries.

And one value that is not a secret at all: an idempotency key. A client chooses one per
command so a retry cannot act twice; it authenticates nothing and grants nothing, and the
generic rules cannot tell it from an API key because the field is called a key. It is
matched on the line, so only that context is excused rather than the file around it.
"""
regexTarget = "line"
regexes = [
  '''(?i)idempotency[-_]?key''',
]
paths = [
  '''^api/generated/''',
  '''^web/packages/api-client/src/generated/''',
  '''^pnpm-lock\.yaml$''',
  '''^go\.sum$''',
  '''^\.env\.example$''',
  '''^docs/''',
  '''^deploy/''',
  '''^scripts/native/''',
  '''^tools/''',
]
