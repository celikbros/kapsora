# gitleaks configuration for KAPSORA.
#
# Starts from the upstream default rules and adds allowlists for files that are
# high-entropy by construction and contain no secrets. Real credentials never enter the
# repository: .env is git-ignored and every example value is a placeholder.

[extend]
useDefault = true

[[allowlists]]
description = """
Generated code and lock files. The TypeScript client and the lock files carry long
high-entropy strings by construction. All of them are reproduced from their sources by CI,
which fails on any drift, so a secret could not survive there unnoticed.

The Go server types used to embed the whole OpenAPI document as base64 and needed this
allowlist most of all; embedded-spec is off now, so the blob is gone rather than excused.
"""
paths = [
  '''^api/generated/''',
  '''^web/packages/api-client/src/generated/''',
  '''^pnpm-lock\.yaml$''',
  '''^go\.sum$''',
]

[[allowlists]]
description = """
Documentation and examples: placeholder values such as CHANGE_ME, the sample keys in
.env.example and the local-only passwords used by the runbooks and the native scripts.
"""
paths = [
  '''^\.env\.example$''',
  '''^docs/''',
  '''^deploy/''',
  '''^scripts/native/''',
]
