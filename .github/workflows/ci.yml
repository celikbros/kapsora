name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: unit tests
        run: go test -race -count=1 -timeout 30m -coverprofile=coverage.out ./internal/... ./cmd/...
      - name: build
        run: go build ./...

  db:
    name: schema tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kapsora_owner
          POSTGRES_PASSWORD: kapsora_owner_ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kapsora_owner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: hold enrollment boundary preflight
        env:
          KAPSORA_TEST_ADMIN_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_ci@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 -v -timeout 5m ./internal/accommodation/transport/http -run '^(TestHoldAmbiguousProgramsRefuseBeforeEffects|TestHoldExplicitProgramPinsEvaluationPriceAndAccount|TestHoldSameProgramAmbiguityAndPinnedWaitlistContinuity|TestPinnedEnrollmentUnavailableLeavesQueueWaiting|TestPinnedUnfundedEnrollmentDoesNotBorrowSecondPlan|TestPinnedHoldRejectsWrongPersonProgramAndUnknownEnrollment)$'
      - name: NIGHT entitlement conversion reproduction (expected semantic failures)
        env:
          KAPSORA_TEST_ADMIN_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_ci@localhost:5432/postgres?sslmode=disable
          KAPSORA_TEST_NIGHT_CONVERSION_REPRODUCTION: '1'
        run: |
          python3 - <<'PY'
          import subprocess

          expected = {
              'TestNightConversionBalance3Factor2Stay2': 'NIGHT_CONVERSION_BALANCE3_COVERAGE:',
              'TestNightConversionBalance4Factor2Stay2': 'NIGHT_CONVERSION_BALANCE4_UNITS:',
              'TestNightConversionBalanceOnePointFiveFactorHalfStay3': 'NIGHT_CONVERSION_BALANCE1_5_COVERAGE:',
              'TestNightConversionAdoptionRetainsFactor': 'NIGHT_CONVERSION_ADOPTION_FACTOR:',
          }
          result = subprocess.run([
              'go', 'test', '-count=1', '-v', '-timeout', '5m',
              './internal/accommodation/transport/http',
              '-run', '^(' + '|'.join(expected) + ')$',
          ], capture_output=True, text=True)
          output = result.stdout + result.stderr
          print(output)
          if result.returncode != 1 or '[build failed]' in output or '--- SKIP:' in output:
              raise SystemExit('NIGHT reproduction did not produce compiled, unskipped test failures')
          failures = [line for line in output.splitlines() if line.startswith('--- FAIL: ')]
          if len(failures) != len(expected):
              raise SystemExit('NIGHT reproduction did not fail exactly the four targeted tests')
          for case, assertion in expected.items():
              if not any(line.startswith('--- FAIL: ' + case + ' ') for line in failures):
                  raise SystemExit('NIGHT reproduction did not reach ' + case)
              if assertion not in output:
                  raise SystemExit('NIGHT reproduction failed outside intended assertion: ' + case)
          print('All four NIGHT conversion defects reproduced at their intended semantic assertions')
          PY
      - name: eligibility selected enrollment and shared account regression
        env:
          KAPSORA_TEST_ADMIN_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_ci@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 -v -timeout 30m ./internal/benefit/eligibility
      - name: migrations and schema invariants
        env:
          KAPSORA_TEST_ADMIN_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_ci@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 -v -timeout 30m ./db/tests/...
      - name: tenant user directory authorization and HTTP integration
        env:
          KAPSORA_TEST_ADMIN_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_ci@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 -v -timeout 30m ./internal/identity/transport/http -run '^(TestDirectory|TestInvitation)'
      - name: accommodation HTTP, contract and enrollment coherence regression
        env:
          KAPSORA_TEST_ADMIN_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_ci@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 -v -timeout 30m ./internal/accommodation/transport/http
      - name: accommodation payer boundary negative control
        env:
          KAPSORA_TEST_ADMIN_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_ci@localhost:5432/postgres?sslmode=disable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('internal/platform/sqlcgen/accommodation.sql.go')
          original = path.read_text()
          predicate = 'AND c.payer_organization_id = ANY($3::uuid[])'
          if original.count(predicate) != 1:
              raise SystemExit('Expected exactly one accommodation price payer predicate')
          cases = ['TestPriceCandidatesRespectProgramPayerBeforePriority',
                   'TestWrongPayerEqualRankDoesNotCauseAmbiguity']
          try:
              # Preserve parameter typing while restoring the old unrestricted behavior.
              path.write_text(original.replace(predicate,
                  'AND ($3::uuid[] IS NULL OR $3::uuid[] IS NOT NULL)'))
              result = subprocess.run(['go', 'test', '-count=1', '-v', '-timeout', '5m',
                  './internal/accommodation/transport/http',
                  '-run', '^(' + '|'.join(cases) + ')$'],
                  capture_output=True, text=True)
              output = result.stdout + result.stderr
              print(output)
              if result.returncode != 1 or '[build failed]' in output:
                  raise SystemExit('Negative control did not fail as a compiled test')
              for case in cases:
                  if '--- FAIL: ' + case + ' ' not in output:
                      raise SystemExit('Negative control did not expose ' + case)
              for assertion in ["want payer A's 3000 despite B's priority",
                                'wrong-payer tie changed A quote']:
                  if assertion not in output:
                      raise SystemExit('Negative control failed outside its payer assertion')
              print('Both regressions detected the removed payer boundary')
          finally:
              path.write_text(original)
          PY
      - name: accommodation confirmation contract negative control
        env:
          KAPSORA_TEST_ADMIN_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_ci@localhost:5432/postgres?sslmode=disable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          booking = Path('internal/accommodation/application/booking.go')
          decision = Path('internal/accommodation/application/bookingdecision.go')
          originals = {p: p.read_text() for p in [booking, decision]}
          helper = r'''
          // Runner-only negative control: reproduce the old provider-wide policy lookup.
          func (s *Service) negativeControlPolicyVersion(ctx context.Context,
              rc identity.RequestContext, bookingID uuid.UUID) uuid.UUID {
              var versionID uuid.UUID
              err := s.withTx(ctx, rc, func(ctx context.Context, tx pgx.Tx) error {
                  return tx.QueryRow(ctx, `
                      SELECT cv.id
                        FROM accommodation.booking b
                        JOIN contract.contract_version cv ON cv.tenant_id = b.tenant_id
                        JOIN contract.contract c
                          ON c.tenant_id = cv.tenant_id AND c.id = cv.contract_id
                       WHERE b.tenant_id = $1 AND b.id = $2
                         AND c.provider_profile_id = (
                             SELECT pp.id FROM provider.provider_profile pp
                             JOIN accommodation.property p ON p.tenant_id = pp.tenant_id
                              AND p.provider_organization_id = pp.tenant_organization_id
                             WHERE pp.tenant_id = b.tenant_id AND p.id = b.property_id
                               AND pp.status = 'ACTIVE' ORDER BY pp.id LIMIT 1)
                         AND c.status = 'ACTIVE' AND cv.status = 'PUBLISHED'
                         AND cv.valid_from <= b.check_in
                         AND (cv.valid_to IS NULL OR cv.valid_to > b.check_in)
                       ORDER BY (c.domain_code = 'ACCOMMODATION') DESC, cv.valid_from DESC, cv.id
                       LIMIT 1`, rc.TenantID, bookingID).Scan(&versionID)
              })
              if err != nil { panic("negative control policy lookup failed") }
              return versionID
          }
          '''
          replacements = {
              booking: ('s.policies.SnapshotPolicy(ctx, rc, prepared.contractVersionID, timeZone)',
                  's.policies.SnapshotPolicy(ctx, rc, s.negativeControlPolicyVersion(ctx, rc, id), timeZone)'),
              decision: ('s.policies.SnapshotPolicy(ctx, rc, versionID, timeZone)',
                  's.policies.SnapshotPolicy(ctx, rc, s.negativeControlPolicyVersion(ctx, rc, record.ID), timeZone)')
          }
          case = 'TestBookingContractBindingFirstNightPolicyWinsPreflightAndApproval'
          try:
              for path, (needle, replacement) in replacements.items():
                  if originals[path].count(needle) != 1:
                      raise SystemExit('Expected one exact policy lookup in ' + str(path))
                  mutated = originals[path].replace(needle, replacement)
                  path.write_text(mutated + (helper if path == booking else ''))
              result = subprocess.run(['go', 'test', '-count=1', '-v', '-timeout', '5m',
                  './internal/accommodation/transport/http', '-run', '^' + case + '$'],
                  capture_output=True, text=True)
              output = result.stdout + result.stderr
              print(output)
              if result.returncode != 1 or '[build failed]' in output:
                  raise SystemExit('Negative control did not fail as a compiled test')
              if '--- FAIL: ' + case + ' ' not in output or \
                      "want selected A's version, 48 hours and 100 percent" not in output:
                  raise SystemExit('Negative control did not expose the wrong frozen policy')
              print('Exact contract regression detected the old provider-wide policy lookup')
          finally:
              for path, original in originals.items():
                  path.write_text(original)
          PY

      - name: accommodation enrollment coherence negative controls
        env:
          KAPSORA_TEST_ADMIN_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_ci@localhost:5432/postgres?sslmode=disable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          query = Path('internal/platform/sqlcgen/accommodation_booking.sql.go')
          eligibility = Path('internal/benefit/eligibility/service.go')
          originals = {p: p.read_text() for p in [query, eligibility]}
          controls = [
              (query, 'count(*) OVER () AS matching_count', '1::bigint AS matching_count',
               'TestHoldAmbiguousProgramsRefuseBeforeEffects', 'ambiguous hold = 201',
               './internal/accommodation/transport/http'),
              (query, 'AND ($5::uuid IS NULL OR e.id = $5::uuid)',
               'AND ($5::uuid IS NULL OR $5::uuid IS NOT NULL)',
               'TestHoldSameProgramAmbiguityAndPinnedWaitlistContinuity',
               'pinned same-program offer =', './internal/accommodation/transport/http'),
              (eligibility, 'if in.EnrollmentID != nil {\n\t\t\tif _, ok := selectedAccounts[a.ID]; !ok {',
               'if false {\n\t\t\tif _, ok := selectedAccounts[a.ID]; !ok {',
               'TestHoldExplicitProgramPinsEvaluationPriceAndAccount', 'incoherent frozen quote:',
               './internal/accommodation/transport/http'),
              (eligibility, 'if in.EnrollmentID != nil {\n\t\t\tif _, ok := selectedAccounts[a.ID]; !ok {',
               'if false {\n\t\t\tif _, ok := selectedAccounts[a.ID]; !ok {',
               'TestPinnedEligibilityUsesOnlySelectedSharedPlanAccounts',
               'selected A shared balance = 20', './internal/benefit/eligibility'),
          ]
          try:
              for path, needle, replacement, case, assertion, package in controls:
                  original = originals[path]
                  if original.count(needle) != 1:
                      raise SystemExit('Expected one enrollment control target in ' + str(path))
                  path.write_text(original.replace(needle, replacement))
                  try:
                      result = subprocess.run(['go', 'test', '-count=1', '-v', '-timeout', '5m',
                          package, '-run', '^' + case + '$'],
                          capture_output=True, text=True)
                      output = result.stdout + result.stderr
                      print(output)
                      if result.returncode != 1 or '[build failed]' in output:
                          raise SystemExit('Enrollment control did not fail as a compiled test')
                      if '--- FAIL: ' + case + ' ' not in output or assertion not in output:
                          raise SystemExit('Enrollment control failed outside its intended assertion')
                      print('Detected removed enrollment boundary: ' + case)
                  finally:
                      path.write_text(original)
          finally:
              for path, original in originals.items():
                  path.write_text(original)
          PY

  contracts:
    name: OpenAPI lint, generated code, breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: spectral
        run: npx --yes @stoplight/spectral-cli lint api/openapi/kapsora-v1.yaml --ruleset .spectral.yaml --fail-severity error
      - name: generated code is current
        # oapi-codegen resolves the config's output path against the working directory,
        # and that path is ../generated/... — run from the repository root it writes
        # outside the checkout, git sees no change and this guard passes over nothing.
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
          cd api/openapi && oapi-codegen -config oapi-codegen.yaml kapsora-v1.yaml && cd ../..
          git diff --exit-code -- api/generated
      - name: breaking changes against base
        if: github.event_name == 'pull_request'
        run: |
          go install github.com/oasdiff/oasdiff@latest
          git show origin/${{ github.base_ref }}:api/openapi/kapsora-v1.yaml > /tmp/base.yaml
          oasdiff breaking /tmp/base.yaml api/openapi/kapsora-v1.yaml --fail-on ERR

  security:
    name: secrets and dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks reads the PR commit range before scanning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allowlists for generated, high-entropy-by-construction files (see the file).
          GITLEAKS_CONFIG: .gitleaks.toml
          # Findings remain in the job summary/artifact; no PR write permission needed.
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  release-binaries:
    name: static binaries (container-free runtime, ADR-021)
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build linux/amd64 and windows/amd64
        run: |
          mkdir -p dist
          for bin in api worker scheduler migrate; do
            CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/linux-amd64/kapsora-$bin   ./cmd/$bin
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/windows-amd64/kapsora-$bin.exe ./cmd/$bin
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kapsora-binaries-${{ github.sha }}
          path: dist/
          retention-days: 14

  web:
    name: web workspace (lint, typecheck, unit, build, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: generated client types are current
        run: |
          pnpm generate
          git diff --exit-code -- web/packages/api-client/src/generated
      - name: format
        run: pnpm format
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: load test tooling
        run: |
          pnpm load:test
          pnpm exec eslint scripts/load tests/load --max-warnings 0
          pnpm exec prettier --check "scripts/load/*.mjs" "tests/load/*.{js,mjs}"
      - name: unit tests
        run: pnpm test
      - name: build
        run: pnpm build
      - name: design anti-pattern detector (impeccable)
        run: pnpm design
      - name: playwright browsers
        # Playwright installs its own Chromium; the runner's Google Chrome apt source is
        # not needed and has failed `apt-get update` with hash mismatches. Drop it, then
        # retry the install, because the OS package mirrors flake too.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome*.sources
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $attempt); retrying in 20s"
            sleep 20
          done
          exit 1
      - name: smoke tests (mock API)
        run: pnpm e2e
      - name: playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
