name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./internal/... ./cmd/...
      - name: build
        run: go build ./...

  db:
    name: schema tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kapsora_owner
          POSTGRES_PASSWORD: kapsora_owner_ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kapsora_owner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: migrations and schema invariants
        env:
          KAPSORA_TEST_ADMIN_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_ci@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 -v ./db/tests/...

  contracts:
    name: OpenAPI lint, generated code, breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: spectral
        run: npx --yes @stoplight/spectral-cli lint api/openapi/kapsora-v1.yaml --ruleset .spectral.yaml --fail-severity error
      - name: generated code is current
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
          oapi-codegen -config api/openapi/oapi-codegen.yaml api/openapi/kapsora-v1.yaml
          git diff --exit-code -- api/generated
      - name: breaking changes against base
        if: github.event_name == 'pull_request'
        run: |
          go install github.com/oasdiff/oasdiff@latest
          git show origin/${{ github.base_ref }}:api/openapi/kapsora-v1.yaml > /tmp/base.yaml
          oasdiff breaking /tmp/base.yaml api/openapi/kapsora-v1.yaml --fail-on ERR

  security:
    name: secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  release-binaries:
    name: static binaries (container-free runtime, ADR-021)
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build linux/amd64 and windows/amd64
        run: |
          mkdir -p dist
          for bin in api worker scheduler migrate; do
            CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/linux-amd64/kapsora-$bin   ./cmd/$bin
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/windows-amd64/kapsora-$bin.exe ./cmd/$bin
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kapsora-binaries-${{ github.sha }}
          path: dist/
          retention-days: 14

  web:
    name: web workspace (lint, typecheck, unit, build, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: generated client types are current
        run: |
          pnpm generate
          git diff --exit-code -- web/packages/api-client/src/generated
      - name: format
        run: pnpm format
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: unit tests
        run: pnpm test
      - name: build
        run: pnpm build
      - name: design anti-pattern detector (impeccable)
        run: pnpm design
      - name: playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: smoke tests (mock API)
        run: pnpm e2e
      - name: playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
