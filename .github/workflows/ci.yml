name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./internal/... ./cmd/...
      - name: build
        run: go build ./...

  db:
    name: schema tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kapsora_owner
          POSTGRES_PASSWORD: kapsora_owner_ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kapsora_owner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: migrations and schema invariants
        env:
          KAPSORA_TEST_ADMIN_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_ci@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 -v ./db/tests/...

  contracts:
    name: OpenAPI lint, generated code, breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: spectral
        run: npx --yes @stoplight/spectral-cli lint api/openapi/kapsora-v1.yaml --ruleset .spectral.yaml --fail-severity error
      - name: generated code is current
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
          oapi-codegen -config api/openapi/oapi-codegen.yaml api/openapi/kapsora-v1.yaml
          git diff --exit-code -- api/generated
      - name: breaking changes against base
        if: github.event_name == 'pull_request'
        run: |
          go install github.com/oasdiff/oasdiff@latest
          git show origin/${{ github.base_ref }}:api/openapi/kapsora-v1.yaml > /tmp/base.yaml
          oasdiff breaking /tmp/base.yaml api/openapi/kapsora-v1.yaml --fail-on ERR

  security:
    name: secrets, dependencies, container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: container build
        run: docker build -f deploy/docker/Dockerfile -t kapsora:ci .
      - name: trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: kapsora:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
