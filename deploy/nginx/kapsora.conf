# /etc/nginx/sites-available/kapsora.conf  (symlink into sites-enabled)
# TLS termination and reverse proxy for the KAPSORA API and the three web apps.
# Security headers follow v1.2 19.2; rate limiting is a second line behind the API's own.
# Replace kapsora.example.com and the certificate paths (certbot or the customer's CA).

limit_req_zone $binary_remote_addr zone=kapsora_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=kapsora_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=kapsora_conn:10m;

# X-Request-ID passthrough: keep the client's id (the web apps send a UUID), else mint one.
map $http_x_request_id $request_id_passthrough {
    default $http_x_request_id;
    ""      $request_id;
}

upstream kapsora_api {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirect plain HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name kapsora.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kapsora.example.com;

    ssl_certificate     /etc/letsencrypt/live/kapsora.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kapsora.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:kapsora_ssl:10m;
    ssl_session_tickets off;

    # Security headers (also on error responses: always)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # The apps use no inline scripts; connect-src stays same-origin. Adjust if fonts are self-hosted.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    server_tokens off;
    client_max_body_size 25m;          # document uploads go through signed URLs; API bodies are small
    client_body_timeout 30s;
    limit_conn kapsora_conn 50;

    access_log /var/log/nginx/kapsora.access.log combined;
    error_log  /var/log/nginx/kapsora.error.log warn;

    # Health endpoints are for the load balancer / monitoring only.
    location /health/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://kapsora_api;
    }

    # Login gets the tight limit (the API also locks accounts and limits per address).
    location = /api/v1/session/login {
        limit_req zone=kapsora_login burst=5 nodelay;
        include /etc/nginx/snippets/kapsora-proxy.conf;
    }

    location /api/ {
        limit_req zone=kapsora_api burst=60 nodelay;
        include /etc/nginx/snippets/kapsora-proxy.conf;
    }

    # The three apps (dist/ of each, built with pnpm build) on ONE origin: the backoffice at /,
    # the provider portal at /portal/, the member app at /uye/. One origin is one session
    # cookie, and that is what makes the single sign-in single: a person signs in at any of
    # the three and is handed to the app their account has work in without signing in again.
    # Separate hosts per app would break that (the __Host- cookie is bound to one host).
    location ^~ /portal/assets/ {
        alias /opt/kapsora/web/provider/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /portal/ {
        alias /opt/kapsora/web/provider/;
        try_files $uri $uri/ /portal/index.html;
        add_header Cache-Control "no-store" always;   # authenticated SPA shell
    }
    location ^~ /uye/assets/ {
        alias /opt/kapsora/web/member/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /uye/ {
        alias /opt/kapsora/web/member/;
        try_files $uri $uri/ /uye/index.html;
        add_header Cache-Control "no-store" always;
    }
    location /assets/ {
        root /opt/kapsora/web/backoffice;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        root /opt/kapsora/web/backoffice;
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;   # authenticated SPA shell
    }
}
