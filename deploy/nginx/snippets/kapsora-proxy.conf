# /etc/nginx/snippets/kapsora-proxy.conf  (included by the API locations)
proxy_pass http://kapsora_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Keep the client's correlation id when present, otherwise mint one.
proxy_set_header X-Request-ID $request_id_passthrough;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_buffering off;
# Never cache API responses at the proxy.
proxy_no_cache 1;
proxy_cache_bypass 1;
