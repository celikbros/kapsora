# KAPSORA local development stack. Local only: never reuse these credentials elsewhere.
# `make dev-up` starts the infrastructure and applies migrations; the Go processes are
# normally run from source (`make run-api`) but can also be started with `--profile app`.
name: kapsora

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kapsora
      POSTGRES_USER: kapsora_owner
      POSTGRES_PASSWORD: kapsora_owner_local
      KAPSORA_APP_PASSWORD: kapsora_app_local
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_min_duration_statement=500"]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/compose/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapsora_owner -d kapsora"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--http-port=8081", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_local
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_local
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./deploy/compose/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:9.1
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Local S3 emulation only; production uses the customer's S3-compatible storage.
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: kapsora_minio
      MINIO_ROOT_PASSWORD: kapsora_minio_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kapsora_minio kapsora_minio_local &&
      for b in quarantine secure exports immutable fiscal; do mc mb --ignore-existing local/$$b; done &&
      mc retention set --default COMPLIANCE 3650d local/immutable || true"

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/compose/otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: ["/app/migrate", "up"]
    environment:
      KAPSORA_ENV: local
      KAPSORA_DATABASE_URL: postgres://kapsora_owner:kapsora_owner_local@postgres:5432/kapsora?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app", "migrate"]

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: ["/app/api"]
    environment: &app-env
      KAPSORA_ENV: local
      KAPSORA_LOG_LEVEL: debug
      KAPSORA_HTTP_ADDR: ":8080"
      KAPSORA_DATABASE_URL: postgres://kapsora_app:kapsora_app_local@postgres:5432/kapsora?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: ["/app/worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]

  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: ["/app/scheduler"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]

volumes:
  postgres-data:
  minio-data:
  clamav-data:
