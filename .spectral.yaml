# Spectral ruleset for the KAPSORA OpenAPI contract.
extends: ["spectral:oas"]
rules:
  operation-operationId: error
  operation-tags: error
  operation-description: warn
  oas3-unused-component: error
  no-$ref-siblings: off
  kapsora-tenant-header-on-api-v1:
    description: Tenant-scoped /api/v1 operations must declare the X-Tenant-ID header.
    severity: error
    # Every /api/v1 operation except the session and account ones, which are how an actor
    # gets a tenant in the first place. Enumerating the covered paths instead goes stale
    # silently every time a module is added, which is exactly what happened.
    # Single-quoted so YAML leaves the regex escapes alone.
    given: '$.paths[?(@property.match(/^\/api\/v1\/(?!me$|tenants$|session)/))][get,post,patch,put,delete]'
    # Spectral resolves $refs before a rule runs, so the parameter arrives here as the
    # header object itself. Matching on the unresolved "$ref" string, as this rule did
    # until 2026-09-04, matches nothing and the rule silently checks no operation at all.
    then:
      field: parameters
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            required: [name, in]
            properties:
              name:
                const: X-Tenant-ID
              in:
                const: header
  kapsora-problem-json-errors:
    description: 4xx/5xx responses must use application/problem+json.
    severity: error
    given: "$.paths[*][*].responses[?(@property.match(/^[45]\\d\\d$/))].content"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: ["application/problem+json"]
