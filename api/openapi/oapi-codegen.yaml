# oapi-codegen v2 configuration: contract-first server types for /api/v1.
package: kapsorav1
output: ../generated/kapsorav1/kapsora_v1.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  # No embedded spec: nothing reads it, and the base64 of the deflated document is
  # indistinguishable from a credential to every secret scanner that looks at the file.
  embedded-spec: false
output-options:
  skip-prune: false
