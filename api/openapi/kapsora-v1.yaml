    PriceList:
      type: object
      additionalProperties: false
      required: [id, contractVersionId, code, name, priority, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        contractVersionId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        priority:
          type: integer
          description: Higher wins when two equally specific price items tie.
        seasonFrom:
          type: [string, 'null']
          format: date
        seasonTo:
          type: [string, 'null']
          format: date
        weekdayMask:
          type: [integer, 'null']
          minimum: 1
          maximum: 127
          description: Bit 0 is Monday through bit 6 Sunday; null means every day.
        itemCount:
          type: integer
          minimum: 0
          description: How many price items the list currently holds.
        rowVersion:
          type: integer
          minimum: 1
    PriceListInput:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{1,39}$'
        name:
          type: string
          minLength: 2
          maxLength: 200
        priority:
          type: integer
          minimum: 0
          maximum: 10000
          default: 100
        seasonFrom:
          type: [string, 'null']
          format: date
        seasonTo:
          type: [string, 'null']
          format: date
        weekdayMask:
          type: [integer, 'null']
          minimum: 1
          maximum: 127
