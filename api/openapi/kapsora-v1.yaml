  headers:
    ETag:
      description: Strong optimistic concurrency tag based on row_version.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required or session expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated actor lacks permission or scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible in the selected tenant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Business state, duplicate idempotency key, or uniqueness conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request is syntactically valid but violates validation or business preconditions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded for tenant + actor + route
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED, DOWN]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string
    Problem:
      type: object
      description: |
        RFC 9457 problem detail. Extension members are permitted and are serialised flat
        beside the standard members: a problem type may carry the one fact that makes it
        actionable rather than forcing a second request. Today
        `WORK_ITEM_ALREADY_CLAIMED` carries `assigneeActorId` (uuid) and, when it is
        known, `assigneeDisplayName` (string). A client must ignore members it does not
        recognise.
      additionalProperties: true
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_.-]{2,79}$'
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    UserContext:
      type: object
      additionalProperties: false
      required: [actorId, displayName, tenants]
      properties:
        actorId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantContext'
    SessionInfo:
      type: object
      additionalProperties: false
      required: [actorId, csrfToken, expiresAt, activeTenantId, stepUpExpiresAt, mustChangePassword]
      properties:
        actorId:
          type: string
          format: uuid
        displayName:
          type: string
        activeTenantId:
          type: [string, 'null']
          format: uuid
        csrfToken:
          type: string
          description: Echo this in X-CSRF-Token on every state-changing call.
        expiresAt:
          type: string
          format: date-time
          description: Absolute end of the session, regardless of activity.
        stepUpExpiresAt:
          type: [string, 'null']
          format: date-time
        mustChangePassword:
          type: boolean
          description: True when an administrator issued a temporary password.
    TenantContext:
      type: object
      additionalProperties: false
      required: [tenant, permissions, apps]
      properties:
        tenant:
          $ref: '#/components/schemas/TenantSummary'
        personId:
          type: [string, 'null']
          format: uuid
          description: |
            The person this account acts for in this tenant, from its PERSON-scoped access
            grant (migration 000039). It is null for every actor that is not a member: a
            reviewer, a provider clerk and an administrator act for the tenant or for an
            organization, not for a person. A member client reads it to know it is bound;
            the server never trusts it back, and resolves the person from the grant on
            every call.
        selfPersonId:
          type: [string, 'null']
          format: uuid
          description: |
            The person this account is in this tenant, from its PERSON grant, whichever app
            is asking. Unlike personId it is also set while the account acts as staff: a
            reviewer who is also a member sees their own files marked and cannot decide them.
        apps:
          type: array
          description: |
            The apps the account has work in here, from all of its grants. The single
            sign-in sends a person straight to the one app, or offers the choice.
          items:
            type: string
            enum: [backoffice, provider, member]
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type]
            properties:
              type:
                type: string
              id:
                type: [string, 'null']
                format: uuid
    TenantSummary:
      type: object
      additionalProperties: false
      required: [id, code, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [PROVISIONING, ACTIVE, SUSPENDED, CLOSED]
        defaultLocale:
          type: string
        defaultTimeZone:
          type: string
    Organization:
      description: |
        Tenant relationship with a global organization. `id` identifies the relationship
        (tenant_organization); `organizationId` identifies the shared legal entity.
      allOf:
        - $ref: '#/components/schemas/OrganizationSummary'
        - type: object
          additionalProperties: false
          required: [legalName, countryCode, organizationStatus, identifiers, validFrom, rowVersion]
          properties:
            legalName:
              type: string
            countryCode:
              type: string
              pattern: '^[A-Z]{2}$'
            organizationStatus:
              type: string
              description: Status of the global legal entity, independent of this tenant.
              enum: [ACTIVE, SUSPENDED, CLOSED]
            identifiers:
              type: array
              items:
                $ref: '#/components/schemas/OrganizationIdentifier'
            tenantCode:
              type: [string, 'null']
            validFrom:
              type: string
              format: date
            validTo:
              type: [string, 'null']
              format: date
            rowVersion:
              type: integer
              minimum: 1
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, organizationId, displayName, organizationKind, relationshipRole, relationshipStatus]
      properties:
        id:
          type: string
          format: uuid
          description: Tenant relationship id (directory.tenant_organization).
        organizationId:
          type: string
          format: uuid
          description: Global legal entity id (directory.organization).
        displayName:
          type: string
        organizationKind:
          type: string
          enum: [BANK, INSURER, SPONSOR, PROVIDER, VENDOR, PUBLIC_BODY, OTHER]
        relationshipRole:
          type: string
          enum: [PAYER, SPONSOR, PROVIDER, VENDOR, PARTNER]
        relationshipStatus:
          type: string
          description: Status of this tenant's relationship with the organization.
          enum: [PENDING, ACTIVE, SUSPENDED, TERMINATED]
    OrganizationIdentifier:
      type: object
      additionalProperties: false
      required: [type, maskedValue, primary]
      properties:
        type:
          type: string
          enum: [VKN, TCKN, MERSIS, PROVIDER_REGISTRY, OTHER]
        maskedValue:
          type: string
        primary:
          type: boolean
    OrganizationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSummary'
        nextCursor:
          type: [string, 'null']
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [legalName, displayName, organizationKind, relationshipRole, identifiers]
      properties:
        legalName:
          type: string
          minLength: 2
          maxLength: 300
        displayName:
          type: string
          minLength: 2
          maxLength: 200
        organizationKind:
          type: string
          enum: [BANK, INSURER, SPONSOR, PROVIDER, VENDOR, PUBLIC_BODY, OTHER]
        relationshipRole:
          type: string
          enum: [PAYER, SPONSOR, PROVIDER, VENDOR, PARTNER]
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          default: TR
        tenantCode:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$'
        identifiers:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            Registry identifiers used to find or create the global legal entity. For TR a
            VKN (10 digits) or, for sole proprietors, a TCKN (11 digits) is mandatory; the
            server validates the checksum and deduplicates by blind index.
          items:
            type: object
            additionalProperties: false
            required: [type, value]
            properties:
              type:
                type: string
                enum: [VKN, TCKN, MERSIS, PROVIDER_REGISTRY, OTHER]
              value:
                type: string
                minLength: 1
                maxLength: 80
              primary:
                type: boolean
                default: false
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 200
        relationshipStatus:
          type: string
          enum: [ACTIVE, SUSPENDED, TERMINATED]
        tenantCode:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$'
    Person:
      allOf:
        - $ref: '#/components/schemas/PersonSummary'
        - type: object
          additionalProperties: false
          required: [firstName, lastName, rowVersion]
          properties:
            firstName:
              type: string
            middleName:
              type: [string, 'null']
            lastName:
              type: string
            birthDate:
              type: [string, 'null']
              format: date
            sexAtBirth:
              type: [string, 'null']
              enum: [FEMALE, MALE, INTERSEX, UNKNOWN, null]
            identifiers:
              type: array
              description: Returned only with person.identifier.read permission; values are masked.
              items:
                $ref: '#/components/schemas/MaskedIdentifier'
            mergedIntoId:
              type: [string, 'null']
              format: uuid
              description: Set when status is MERGED; the surviving person.
            rowVersion:
              type: integer
              minimum: 1
    PersonSummary:
      type: object
      additionalProperties: false
      required: [id, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        maskedPrimaryIdentifier:
          type: [string, 'null']
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DECEASED, MERGED]
    PersonPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonSummary'
        nextCursor:
          type: [string, 'null']
    MyPerson:
      type: object
      additionalProperties: false
      description: |
        The person the signed-in member acts for, with the two things a member screen needs
        beside the name: what they are enrolled in and how the product may reach them. The
        identifier is masked and the contacts are masked, exactly as they are for a
        back-office reader -- being the subject of a record is not a reason to hand the
        plaintext back over the wire, where it would be one more copy nobody can recall.
      required: [person, enrollments, contacts]
      properties:
        person:
          $ref: '#/components/schemas/PersonSummary'
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/Enrollment'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/PersonContact'
    MaskedIdentifier:
      type: object
      additionalProperties: false
      required: [type, maskedValue, primary]
      properties:
        type:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
          description: Tenant tarafından tanımlanan identifier type kodu (örn. TCKN, PASSPORT, MEMBER_NO, CUSTOMER_NO).
        maskedValue:
          type: string
        primary:
          type: boolean
    CreatePersonRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date
        sexAtBirth:
          type: string
          enum: [FEMALE, MALE, INTERSEX, UNKNOWN]
        identifiers:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [type, value]
            properties:
              type:
                type: string
                pattern: '^[A-Z][A-Z0-9_]{1,63}$'
                description: Tenant tarafından tanımlanan identifier type kodu.
              value:
                type: string
                minLength: 1
                maxLength: 80
              primary:
                type: boolean
                default: false
    UpdatePersonRequest:
      type: object
      additionalProperties: false
      description: Merge-patch; absent fields stay, null clears where the field is nullable.
      properties:
        firstName:
          type: string
          minLength: 1
