openapi: 3.1.0
info:
  title: KAPSORA Platform API
  version: 1.0.0-alpha.1
  summary: Kurumsal hak, fayda ve hizmet orkestrasyonu için başlangıç API sözleşmesi
  description: |
    Bu sözleşme ilk sprint ve çekirdek MVP için contract-first geliştirme başlangıç noktasıdır.
    Kullanıcılar KAPSORA'nın kendi hesaplarıyla giriş yapar (ADR-022); tarayıcı yalnız opak
    oturum çerezi taşır. Makineden makineye entegrasyonlar OAuth 2.0 client credentials ve
    mTLS ile çalışır. Tüm tenant kapsamlı çağrılar X-Tenant-ID
    başlığı taşır. Durum değiştiren POST komutlarında Idempotency-Key zorunludur; sorgu
    niteliğindeki POST'larda (eligibility check, pricing quote) opsiyoneldir.
    İstemci X-Request-ID başlığında UUID gönderebilir; sunucu her yanıtta X-Request-ID döner.
    Çerez oturumuyla yapılan durum değiştiren çağrılar X-CSRF-Token başlığı taşır.
  contact:
    name: KAPSORA Product Engineering
servers:
  - url: https://api.staging.kapsora.example
    description: Staging
  - url: https://api.kapsora.example
    description: Production
security:
  - sessionCookie: []
  - oauth2: [kapsora.api]
tags:
  - name: Health
    description: Servis sağlık kontrolleri
  - name: Identity
    description: Oturum ve kullanıcı bağlamı
  - name: Tenants
    description: Tenant erişimi
  - name: Organizations
    description: Kurum ve sağlayıcı dizini
  - name: People
    description: Hak sahipleri ve ilişkiler
  - name: Eligibility
    description: Hak sahipliği ve plan uygunluğu
  - name: Service Requests
    description: Genel hizmet talebi ve durum geçişleri
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Required dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: One or more required dependencies are unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentUserContext
      security:
        - sessionCookie: []
      description: |
        The signed-in actor with one context per active membership: tenant summary, the
        permissions resolved from tenant-owned roles and access grants valid now, and any
        narrowing scopes (ORGANIZATION, PROGRAM, ...). The frontend uses it to build the
        tenant picker and to hide controls; the backend re-validates every call.
      responses:
        '200':
          description: Authenticated actor and tenant memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tenants:
    get:
      tags: [Tenants]
      operationId: listAccessibleTenants
      security:
        - sessionCookie: []
      description: |
        Tenants in which the actor holds an active membership, ordered by display name. An
        actor never learns about tenants it is not a member of.
      responses:
        '200':
          description: Tenants accessible to the current actor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/session:
    get:
      tags: [Identity]
      operationId: getSession
      security:
        - sessionCookie: []
      description: |
        Returns the current session and the CSRF token every state-changing call must echo
        in X-CSRF-Token. This is how the frontend obtains that token.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/session/login:
    post:
      tags: [Identity]
      operationId: login
      security: []
      description: |
        Authenticates a user name and password and starts a session. The response sets the
        session cookie and carries the CSRF token.

        Failures are deliberately coarse: an unknown user name and a wrong password both
        return 401 INVALID_CREDENTIALS with the same body and take the same time, so the
        endpoint cannot be used to discover who has an account. Repeated failures lock the
        account for a short period (403 ACCOUNT_LOCKED); the endpoint is also rate limited
        per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 320
                  description: Case-insensitive; leading and trailing spaces are ignored.
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        '200':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '400':
          description: Malformed request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/session/password:
    post:
      tags: [Identity]
      operationId: changeOwnPassword
      security:
        - sessionCookie: []
      description: |
        Replaces the caller's own password after verifying the current one. Every other
        session of the actor is ended; the calling session stays valid.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  maxLength: 1024
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 1024
      responses:
        '204':
          description: Password changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/session/switch-tenant:
    post:
      tags: [Identity]
      operationId: switchTenant
      description: |
        Selects the active tenant for the session. The server verifies that the actor holds
        an active membership; the X-Tenant-ID header on later calls must equal this tenant
        and is never trusted on its own. A tenant the actor is not a member of and a tenant
        that does not exist both answer 403 TENANT_ACCESS_DENIED.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId]
              properties:
                tenantId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Active tenant context after the switch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/session/step-up:
    post:
      tags: [Identity]
      operationId: stepUpSession
      description: |
        Re-verifies the caller's password before a sensitive operation (publish, privileged
        grant, sensitive download, export, adjustment, settlement approval, break-glass).
        The elevated state is valid for a short window returned in the response. Failures
        count towards the same account lockout as a login.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  maxLength: 1024
      responses:
        '200':
          description: Step-up accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [stepUpExpiresAt]
                properties:
                  stepUpExpiresAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/session/logout:
    post:
      tags: [Identity]
      operationId: logout
      description: |
        Ends the session and clears the cookie. Calling it without a session, or twice, is
        not an error.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session ended
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      description: |
        Lists the tenant's organization relationships newest first with keyset pagination.
        `q` matches the display name (case-insensitive, 2-120 characters); `role` filters the
        relationship role. Cursors are opaque and signed; a tampered one is rejected.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          schema:
            type: string
            enum: [PAYER, SPONSOR, PROVIDER, VENDOR, PARTNER]
        - name: q
          in: query
          description: Display name/code search; tenant scoped
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Organization page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '400':
          description: Invalid cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Organizations]
      operationId: createTenantOrganization
      description: |
        Creates the tenant's relationship with an organization. The organization itself lives
        in the global directory: the server looks it up by the supplied registry identifiers
        (country + tax number blind index) and reuses the existing legal entity when found,
        otherwise creates it. A 409 is returned when this tenant already has the same
        relationship role with that organization for an overlapping period.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization relationship created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/organizations/{organizationId}:
    get:
      tags: [Organizations]
      operationId: getOrganization
      description: |
        One relationship with the shared legal entity and its masked registry identifiers.
        `organizationId` is the relationship id; ids of other tenants answer 404.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization detail
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      description: |
        Merge-patch of the relationship (`relationshipStatus`, `tenantCode`, `null` clears it)
        and of the shared display name. Renaming is refused with 409
        ORGANIZATION_SHARED_READONLY once another tenant also holds a relationship with the
        organization. `If-Match` must carry the ETag of the last read; a stale value answers
        412 and a missing one 428.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated organization
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/people:
    get:
      tags: [People]
      operationId: listPeople
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Name search. Exact sensitive identifier search uses identifierHash through a dedicated permission-protected endpoint.
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Person page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
    post:
      tags: [People]
      operationId: createPerson
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Person created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/people/{personId}:
    get:
      tags: [People]
      operationId: getPerson
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200':
          description: Person detail filtered by field-level permission
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/eligibility/checks:
    post:
      tags: [Eligibility]
      operationId: checkEligibility
      description: |
        Query-style POST: evaluates eligibility deterministically and records an evaluation
        snapshot, but changes no business state. Idempotency-Key is therefore optional.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibilityCheckRequest'
      responses:
        '200':
          description: Deterministic eligibility result and explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityCheckResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests:
    get:
      tags: [Service Requests]
      operationId: listServiceRequests
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, ELIGIBILITY_FAILED, PENDING_DOCUMENT, PENDING_REVIEW, APPROVED, PARTIALLY_APPROVED, REJECTED, CANCELLED, EXPIRED, CLOSED]
        - name: personId
          in: query
          schema:
            type: string
            format: uuid
        - name: providerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Service request page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestPage'
    post:
      tags: [Service Requests]
      operationId: createServiceRequest
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Draft service request created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}:
    get:
      tags: [Service Requests]
      operationId: getServiceRequest
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Service request detail
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Service Requests]
      operationId: updateDraftServiceRequest
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Draft updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/service-requests/{requestId}/submit:
    post:
      tags: [Service Requests]
      operationId: submitServiceRequest
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                comment:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Submitted request after eligibility/rule evaluation
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}/cancel:
    post:
      tags: [Service Requests]
      operationId: cancelServiceRequest
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Cancelled request
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-kapsora_session
      description: |
        Opaque session id. The server stores only its SHA-256 hash and the browser never
        holds a token of any kind. Local HTTP development uses the name kapsora_session
        because the __Host- prefix requires HTTPS.
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.kapsora.example/realms/kapsora/protocol/openid-connect/token
          scopes:
            kapsora.api: Call KAPSORA APIs
  parameters:
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: Selected tenant UUID. It must be one of the actor's active memberships.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key retained for at least 24 hours.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional on query-style POSTs; honoured when present.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when the request is authenticated with the BFF session cookie.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Optimistic concurrency token returned as ETag.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from the previous response.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: Strong optimistic concurrency tag based on row_version.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required or session expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated actor lacks permission or scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible in the selected tenant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Business state, duplicate idempotency key, or uniqueness conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request is syntactically valid but violates validation or business preconditions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded for tenant + actor + route
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED, DOWN]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_.-]{2,79}$'
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    UserContext:
      type: object
      additionalProperties: false
      required: [actorId, displayName, tenants]
      properties:
        actorId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantContext'
    SessionInfo:
      type: object
      additionalProperties: false
      required: [actorId, csrfToken, expiresAt, activeTenantId, stepUpExpiresAt, mustChangePassword]
      properties:
        actorId:
          type: string
          format: uuid
        displayName:
          type: string
        activeTenantId:
          type: [string, 'null']
          format: uuid
        csrfToken:
          type: string
          description: Echo this in X-CSRF-Token on every state-changing call.
        expiresAt:
          type: string
          format: date-time
          description: Absolute end of the session, regardless of activity.
        stepUpExpiresAt:
          type: [string, 'null']
          format: date-time
        mustChangePassword:
          type: boolean
          description: True when an administrator issued a temporary password.
    TenantContext:
      type: object
      additionalProperties: false
      required: [tenant, permissions]
      properties:
        tenant:
          $ref: '#/components/schemas/TenantSummary'
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type]
            properties:
              type:
                type: string
              id:
                type: [string, 'null']
                format: uuid
    TenantSummary:
      type: object
      additionalProperties: false
      required: [id, code, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [PROVISIONING, ACTIVE, SUSPENDED, CLOSED]
        defaultLocale:
          type: string
        defaultTimeZone:
          type: string
    Organization:
      description: |
        Tenant relationship with a global organization. `id` identifies the relationship
        (tenant_organization); `organizationId` identifies the shared legal entity.
      allOf:
        - $ref: '#/components/schemas/OrganizationSummary'
        - type: object
          additionalProperties: false
          required: [legalName, countryCode, organizationStatus, identifiers, validFrom, rowVersion]
          properties:
            legalName:
              type: string
            countryCode:
              type: string
              pattern: '^[A-Z]{2}$'
            organizationStatus:
              type: string
              description: Status of the global legal entity, independent of this tenant.
              enum: [ACTIVE, SUSPENDED, CLOSED]
            identifiers:
              type: array
              items:
                $ref: '#/components/schemas/OrganizationIdentifier'
            tenantCode:
              type: [string, 'null']
            validFrom:
              type: string
              format: date
            validTo:
              type: [string, 'null']
              format: date
            rowVersion:
              type: integer
              minimum: 1
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, organizationId, displayName, organizationKind, relationshipRole, relationshipStatus]
      properties:
        id:
          type: string
          format: uuid
          description: Tenant relationship id (directory.tenant_organization).
        organizationId:
          type: string
          format: uuid
          description: Global legal entity id (directory.organization).
        displayName:
          type: string
        organizationKind:
          type: string
          enum: [BANK, INSURER, SPONSOR, PROVIDER, VENDOR, PUBLIC_BODY, OTHER]
        relationshipRole:
          type: string
          enum: [PAYER, SPONSOR, PROVIDER, VENDOR, PARTNER]
        relationshipStatus:
          type: string
          description: Status of this tenant's relationship with the organization.
          enum: [PENDING, ACTIVE, SUSPENDED, TERMINATED]
    OrganizationIdentifier:
      type: object
      additionalProperties: false
      required: [type, maskedValue, primary]
      properties:
        type:
          type: string
          enum: [VKN, TCKN, MERSIS, PROVIDER_REGISTRY, OTHER]
        maskedValue:
          type: string
        primary:
          type: boolean
    OrganizationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSummary'
        nextCursor:
          type: [string, 'null']
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [legalName, displayName, organizationKind, relationshipRole, identifiers]
      properties:
        legalName:
          type: string
          minLength: 2
          maxLength: 300
        displayName:
          type: string
          minLength: 2
          maxLength: 200
        organizationKind:
          type: string
          enum: [BANK, INSURER, SPONSOR, PROVIDER, VENDOR, PUBLIC_BODY, OTHER]
        relationshipRole:
          type: string
          enum: [PAYER, SPONSOR, PROVIDER, VENDOR, PARTNER]
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          default: TR
        tenantCode:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$'
        identifiers:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            Registry identifiers used to find or create the global legal entity. For TR a
            VKN (10 digits) or, for sole proprietors, a TCKN (11 digits) is mandatory; the
            server validates the checksum and deduplicates by blind index.
          items:
            type: object
            additionalProperties: false
            required: [type, value]
            properties:
              type:
                type: string
                enum: [VKN, TCKN, MERSIS, PROVIDER_REGISTRY, OTHER]
              value:
                type: string
                minLength: 1
                maxLength: 80
              primary:
                type: boolean
                default: false
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 200
        relationshipStatus:
          type: string
          enum: [ACTIVE, SUSPENDED, TERMINATED]
        tenantCode:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$'
    Person:
      allOf:
        - $ref: '#/components/schemas/PersonSummary'
        - type: object
          additionalProperties: false
          required: [firstName, lastName, rowVersion]
          properties:
            firstName:
              type: string
            middleName:
              type: [string, 'null']
            lastName:
              type: string
            birthDate:
              type: [string, 'null']
              format: date
            sexAtBirth:
              type: [string, 'null']
              enum: [FEMALE, MALE, INTERSEX, UNKNOWN, null]
            identifiers:
              type: array
              description: Returned only with person.identifier.read permission; values are masked.
              items:
                $ref: '#/components/schemas/MaskedIdentifier'
            rowVersion:
              type: integer
              minimum: 1
    PersonSummary:
      type: object
      additionalProperties: false
      required: [id, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        maskedPrimaryIdentifier:
          type: [string, 'null']
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DECEASED, MERGED]
    PersonPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonSummary'
        nextCursor:
          type: [string, 'null']
    MaskedIdentifier:
      type: object
      additionalProperties: false
      required: [type, maskedValue, primary]
      properties:
        type:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
          description: Tenant tarafından tanımlanan identifier type kodu (örn. TCKN, PASSPORT, MEMBER_NO, CUSTOMER_NO).
        maskedValue:
          type: string
        primary:
          type: boolean
    CreatePersonRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date
        sexAtBirth:
          type: string
          enum: [FEMALE, MALE, INTERSEX, UNKNOWN]
        identifiers:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [type, value]
            properties:
              type:
                type: string
                pattern: '^[A-Z][A-Z0-9_]{1,63}$'
                description: Tenant tarafından tanımlanan identifier type kodu.
              value:
                type: string
                minLength: 1
                maxLength: 80
              primary:
                type: boolean
                default: false
    EligibilityCheckRequest:
      type: object
      additionalProperties: false
      required: [personId, serviceDate, serviceItems]
      properties:
        personId:
          type: string
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        providerOrganizationId:
          type: [string, 'null']
          format: uuid
        serviceDate:
          type: string
          format: date
        serviceItems:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [serviceDefinitionId, quantity]
            properties:
              serviceDefinitionId:
                type: string
                format: uuid
              quantity:
                type: number
                exclusiveMinimum: 0
              requestedAmount:
                type: number
                minimum: 0
              currencyCode:
                type: string
                pattern: '^[A-Z]{3}$'
        context:
          type: object
          additionalProperties: true
    EligibilityCheckResult:
      type: object
      additionalProperties: false
      required: [eligible, outcome, evaluatedAt, explanations]
      properties:
        eligible:
          type: boolean
        outcome:
          type: string
          enum: [ELIGIBLE, PARTIALLY_ELIGIBLE, INELIGIBLE, REVIEW_REQUIRED, MISSING_DATA]
        evaluatedAt:
          type: string
          format: date-time
        planVersionId:
          type: [string, 'null']
          format: uuid
        ruleSetVersionIds:
          type: array
          items:
            type: string
            format: uuid
        explanations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message, severity]
            properties:
              code:
                type: string
              message:
                type: string
              severity:
                type: string
                enum: [INFO, WARNING, ERROR]
        balances:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [entitlementCode, available, unit]
            properties:
              entitlementCode:
                type: string
              available:
                type: number
              unit:
                type: string
    ServiceRequest:
      type: object
      additionalProperties: false
      required: [id, reference, requestType, personId, programId, enrollmentId, serviceDate, channel, status, items, rowVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        requestType:
          type: string
          enum: [DIRECT_SERVICE, PREAUTHORIZATION, RESERVATION, REIMBURSEMENT]
        personId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        providerOrganizationId:
          type: [string, 'null']
          format: uuid
        serviceDate:
          type: string
          format: date
        requestedStartAt:
          type: [string, 'null']
          format: date-time
        requestedEndAt:
          type: [string, 'null']
          format: date-time
        channel:
          type: string
          enum: [BACKOFFICE, PROVIDER_PORTAL, MEMBER_PORTAL, API, BATCH_IMPORT, CALL_CENTER]
        status:
          type: string
          enum: [DRAFT, SUBMITTED, ELIGIBILITY_FAILED, PENDING_DOCUMENT, PENDING_REVIEW, APPROVED, PARTIALLY_APPROVED, REJECTED, CANCELLED, EXPIRED, CLOSED]
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRequestItem'
        rowVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: [string, 'null']
          format: date-time
    ServiceRequestItem:
      type: object
      additionalProperties: false
      required: [id, lineNo, serviceDefinitionId, requestedQuantity, unitType, status]
      properties:
        id:
          type: string
          format: uuid
        lineNo:
          type: integer
          minimum: 1
        serviceDefinitionId:
          type: string
          format: uuid
        requestedQuantity:
          type: number
          exclusiveMinimum: 0
        unitType:
          type: string
        requestedAmount:
          type: [number, 'null']
        currencyCode:
          type: [string, 'null']
        status:
          type: string
          enum: [REQUESTED, APPROVED, PARTIALLY_APPROVED, REJECTED, CANCELLED]
        approvedQuantity:
          type: [number, 'null']
        approvedAmount:
          type: [number, 'null']
        decisionReasonCode:
          type: [string, 'null']
    ServiceRequestPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRequest'
        nextCursor:
          type: [string, 'null']
    CreateServiceRequest:
      type: object
      additionalProperties: false
      required: [requestType, personId, programId, enrollmentId, serviceDate, channel, items]
      properties:
        requestType:
          type: string
          enum: [DIRECT_SERVICE, PREAUTHORIZATION, RESERVATION, REIMBURSEMENT]
        personId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        providerOrganizationId:
          type: string
          format: uuid
        serviceDate:
          type: string
          format: date
        requestedStartAt:
          type: string
          format: date-time
        requestedEndAt:
          type: string
          format: date-time
        channel:
          type: string
          enum: [BACKOFFICE, PROVIDER_PORTAL, MEMBER_PORTAL, API, BATCH_IMPORT, CALL_CENTER]
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [serviceDefinitionId, requestedQuantity, unitType]
            properties:
              serviceDefinitionId:
                type: string
                format: uuid
              requestedQuantity:
                type: number
                exclusiveMinimum: 0
              unitType:
                type: string
              requestedAmount:
                type: number
                minimum: 0
              currencyCode:
                type: string
                pattern: '^[A-Z]{3}$'
    UpdateServiceRequest:
      type: object
      additionalProperties: false
      properties:
        providerOrganizationId:
          type: [string, 'null']
          format: uuid
        serviceDate:
          type: string
          format: date
        requestedStartAt:
          type: [string, 'null']
          format: date-time
        requestedEndAt:
          type: [string, 'null']
          format: date-time
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [serviceDefinitionId, requestedQuantity, unitType]
            properties:
              serviceDefinitionId:
                type: string
                format: uuid
              requestedQuantity:
                type: number
                exclusiveMinimum: 0
              unitType:
                type: string
              requestedAmount:
                type: number
                minimum: 0
              currencyCode:
                type: string
                pattern: '^[A-Z]{3}$'
    ReasonCommand:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 2
          maxLength: 80
        reasonText:
          type: string
          maxLength: 1000
