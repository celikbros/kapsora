    EligibilityCheckRequest:
      type: object
      additionalProperties: false
      required: [personId, serviceDate, serviceItems]
      properties:
        personId:
          type: string
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        enrollmentId:
          type: [string, 'null']
          format: uuid
          description: |
            Which of the person's enrollments to answer for. It exists for the second ask
            after an ENROLLMENT_MULTIPLE answer: the caller picks one of the
            `enrollmentCandidates` the first answer named. An id that is not active for
            this person on the service date resolves to ENROLLMENT_NONE rather than to
            somebody else's plan.
        providerOrganizationId:
          type: [string, 'null']
          format: uuid
        serviceDate:
          type: string
          format: date
        serviceItems:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [serviceDefinitionId, quantity]
            properties:
              serviceDefinitionId:
                type: string
                format: uuid
              quantity:
                type: number
                x-go-type: json.Number
                exclusiveMinimum: 0
              requestedAmount:
                type: number
                x-go-type: json.Number
                minimum: 0
              currencyCode:
                type: string
                pattern: '^[A-Z]{3}$'
        context:
          type: object
          additionalProperties: true
    EligibilityCheckResult:
      type: object
      additionalProperties: false
      required: [evaluationId, eligible, outcome, evaluatedAt, explanations]
      properties:
        evaluationId:
          type: string
          format: uuid
          description: Id of the stored evaluation snapshot (GET /eligibility/evaluations/{id}).
        enrollmentId:
          type: [string, 'null']
          format: uuid
        enrollmentCandidates:
          type: array
          description: |
            The enrollments this check was torn between. Present only with an
            ENROLLMENT_MULTIPLE explanation, and it is the whole of what a caller may
            learn about a person's enrollments here: it is the choice the check itself had
            to make, not a list. Ask again with one of these ids in `enrollmentId`.
          items:
            type: object
            additionalProperties: false
            required: [enrollmentId, planCode, planName, validFrom]
            properties:
              enrollmentId:
                type: string
                format: uuid
              planCode:
                type: string
              planName:
                type: string
              validFrom:
                type: string
                format: date
              validTo:
                type: [string, 'null']
                format: date
        items:
          type: array
          description: Per requested item, in request order.
          items:
            type: object
            additionalProperties: false
            required: [index, outcome, explanations]
            properties:
              index:
                type: integer
                minimum: 0
              entitlementCode:
                type: [string, 'null']
              outcome:
                type: string
                enum: [ELIGIBLE, INELIGIBLE, REVIEW_REQUIRED]
              requestedQuantity:
                type: number
                x-go-type: json.Number
              availableQuantity:
                type: [number, 'null']
                x-go-type: json.Number
              explanations:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [code, message, severity]
                  properties:
                    code:
                      type: string
                    message:
                      type: string
                    severity:
                      type: string
                      enum: [INFO, WARNING, ERROR]
        eligible:
          type: boolean
        outcome:
          type: string
          enum: [ELIGIBLE, PARTIALLY_ELIGIBLE, INELIGIBLE, REVIEW_REQUIRED, MISSING_DATA]
        evaluatedAt:
          type: string
          format: date-time
        planVersionId:
          type: [string, 'null']
          format: uuid
        ruleSetVersionIds:
          type: array
          items:
            type: string
            format: uuid
        explanations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message, severity]
            properties:
              code:
                type: string
              message:
                type: string
              severity:
                type: string
                enum: [INFO, WARNING, ERROR]
        balances:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [entitlementCode, available, unit]
            properties:
              entitlementCode:
                type: string
              available:
                type: number
                x-go-type: json.Number
              unit:
                type: string
    EligibilityEvaluation:
      type: object
      additionalProperties: false
      required: [id, personId, serviceDate, outcome, evaluatedAt, request, result]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        enrollmentId:
          type: [string, 'null']
          format: uuid
        planVersionId:
          type: [string, 'null']
          format: uuid
        serviceDate:
          type: string
          format: date
        outcome:
          type: string
          enum: [ELIGIBLE, PARTIALLY_ELIGIBLE, INELIGIBLE, REVIEW_REQUIRED, MISSING_DATA]
        evaluatedAt:
          type: string
          format: date-time
        evaluatedBy:
          type: [string, 'null']
          format: uuid
        request:
          $ref: '#/components/schemas/EligibilityCheckRequest'
        result:
          $ref: '#/components/schemas/EligibilityCheckResult'
    MemberImportBatch:
      type: object
      additionalProperties: false
      required: [id, sponsorOrganizationId, sourceSystem, sourceVersion, fileName, fileSha256, format, rowCount, status, counters, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        sponsorOrganizationId:
          type: string
          format: uuid
        planId:
          type: [string, 'null']
          format: uuid
        sourceSystem:
          type: string
        sourceVersion:
          type: string
        fileName:
          type: string
        fileSha256:
          type: string
          description: Hex SHA-256 of the uploaded file.
        format:
          type: string
          enum: [CSV_V1]
        rowCount:
          type: integer
        status:
          type: string
          enum: [RECEIVED, VALIDATING, REVIEW, READY, APPLYING, APPLIED, FAILED, CANCELLED]
        counters:
          type: object
          additionalProperties: false
          required: [valid, invalid, matched, conflict, created, updated, skipped]
          properties:
            valid:
              type: integer
            invalid:
              type: integer
            matched:
              type: integer
            conflict:
              type: integer
            created:
              type: integer
            updated:
              type: integer
            skipped:
              type: integer
        errorSummary:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        appliedAt:
          type: [string, 'null']
          format: date-time
        rowVersion:
          type: integer
          minimum: 1
    MemberImportRow:
      type: object
      additionalProperties: false
      required: [id, rowNo, sourceRecordId, status, displayName, identifiers, errors, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        rowNo:
          type: integer
        sourceRecordId:
          type: string
        status:
          type: string
          enum: [PENDING, VALID, INVALID, MATCHED, CONFLICT, APPLIED, SKIPPED]
        displayName:
          type: string
        birthDate:
          type: [string, 'null']
          format: date
        membershipType:
          type: [string, 'null']
        principalSourceRecordId:
          type: [string, 'null']
        planCode:
          type: [string, 'null']
        identifiers:
          type: array
          items:
            $ref: '#/components/schemas/MaskedIdentifier'
        matchedPersonId:
          type: [string, 'null']
          format: uuid
        candidatePersonIds:
          type: array
          items:
            type: string
            format: uuid
          description: Filled for CONFLICT rows.
        decision:
          type: [string, 'null']
          enum: [CREATE, UPDATE, SKIP, null]
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
        appliedPersonId:
          type: [string, 'null']
          format: uuid
        rowVersion:
          type: integer
          minimum: 1
    ServiceRequestType:
      type: string
      description: |
        What kind of request this is. The type decides whether a provider has to be named
        and which downstream aggregate the decision feeds.
      enum: [DIRECT_SERVICE, PREAUTHORIZATION, RESERVATION, REIMBURSEMENT]
    ServiceRequestChannel:
      type: string
      description: Where the request came from; a phone call is not the same as a portal.
      enum: [BACKOFFICE, PROVIDER_PORTAL, MEMBER_PORTAL, API, BATCH_IMPORT, CALL_CENTER]
    ServiceRequestStatus:
      type: string
      description: |
        Lifecycle state of a request. It is read-only on every endpoint: each move is its
        own command with its own precondition, permission and reason, and nothing writes
        this field directly.
      enum: [DRAFT, SUBMITTED, ELIGIBILITY_FAILED, PENDING_DOCUMENT, PENDING_REVIEW, APPROVED, PARTIALLY_APPROVED, REJECTED, CANCELLED, EXPIRED, CLOSED]
    ServiceRequestVersionStatus:
      type: string
      description: |
        State of one version of the request content. Exactly one DRAFT version exists at a
        time; a SUBMITTED version is frozen and a SUPERSEDED one was replaced by a later one.
      enum: [DRAFT, SUBMITTED, SUPERSEDED]
    ServiceRequestItemStatus:
      type: string
      description: The line-level outcome a reviewer recorded, REQUESTED until one is.
      enum: [REQUESTED, APPROVED, PARTIALLY_APPROVED, REJECTED, CANCELLED]
    ServiceRequest:
      type: object
      additionalProperties: false
      required: [id, reference, requestType, personId, personDisplayName, programId, enrollmentId, serviceDate, channel, status, currentVersionNo, items, rowVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: Human-readable number of the request; it survives every return.
        requestType:
          $ref: '#/components/schemas/ServiceRequestType'
        personId:
          type: string
          format: uuid
        personDisplayName:
          type: string
          maxLength: 200
          description: |
            The member's name, read with the row. It is here so a list of requests names
            people without one extra read per line; a caller that may see the request may
            see whose it is.
        programId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        providerOrganizationId:
          type: [string, 'null']
          format: uuid
        providerDisplayName:
          type: [string, 'null']
          maxLength: 200
          description: The provider organization's name; null when the request names no provider.
        serviceDate:
          type: string
          format: date
        requestedStartAt:
          type: [string, 'null']
          format: date-time
        requestedEndAt:
          type: [string, 'null']
          format: date-time
        channel:
          $ref: '#/components/schemas/ServiceRequestChannel'
        status:
          $ref: '#/components/schemas/ServiceRequestStatus'
        currentVersionNo:
          type: integer
          minimum: 1
          description: Number of the version the lines below belong to.
        supersedesRequestId:
          type: [string, 'null']
          format: uuid
          description: The rejected request this one was raised to replace, if any.
        eligibilityEvaluationId:
          type: [string, 'null']
          format: uuid
          description: The eligibility evaluation the last submit was decided against.
        ruleEvaluationId:
          type: [string, 'null']
          format: uuid
          description: The rule evaluation the last submit was decided against.
        requiredDocumentTypes:
          type: [array, 'null']
          description: |
            The document types a rule asked for, in the order the rule named them. An empty
            array means the rules were asked and required nothing; null means not yet asked.
          items:
            type: string
        returnReasonCode:
          type: [string, 'null']
          description: Why the request was last sent back for correction.
        rejectReasonCode:
          type: [string, 'null']
          description: Why the request was refused.
        reviewComment:
          type: [string, 'null']
        items:
          type: array
          description: The lines of the current version.
          items:
            $ref: '#/components/schemas/ServiceRequestItem'
        rowVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: [string, 'null']
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time
    ServiceRequestItem:
      type: object
      additionalProperties: false
      required: [id, lineNo, serviceDefinitionId, requestedQuantity, unitType, status]
      properties:
        id:
          type: string
          format: uuid
        lineNo:
          type: integer
          minimum: 1
        serviceDefinitionId:
          type: string
          format: uuid
        requestedQuantity:
          $ref: '#/components/schemas/DecimalAmount'
        unitType:
          $ref: '#/components/schemas/ServiceUnitType'
        requestedAmount:
          type: [string, 'null']
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        status:
          $ref: '#/components/schemas/ServiceRequestItemStatus'
        approvedQuantity:
          type: [string, 'null']
        approvedAmount:
          type: [string, 'null']
        decisionReasonCode:
          type: [string, 'null']
    ServiceRequestPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRequest'
        nextCursor:
          type: [string, 'null']
    ServiceRequestItemInput:
      type: object
      additionalProperties: false
      required: [serviceDefinitionId, requestedQuantity, unitType]
      description: |
        One requested line. Quantities and amounts are exact decimal strings, never JSON
        numbers: a quantity that passed through a float is a quantity nobody can reconcile
        against the ledger afterwards.
      properties:
        serviceDefinitionId:
          type: string
          format: uuid
        requestedQuantity:
          $ref: '#/components/schemas/DecimalAmount'
        unitType:
          $ref: '#/components/schemas/ServiceUnitType'
        requestedAmount:
          $ref: '#/components/schemas/DecimalAmount'
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
    ServiceRequestItems:
      type: object
      additionalProperties: false
      required: [items]
      description: The complete line set of the draft version; it replaces what is there.
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ServiceRequestItemInput'
    CreateServiceRequest:
      type: object
      additionalProperties: false
      required: [requestType, personId, enrollmentId, serviceDate, channel, items]
      properties:
        requestType:
          $ref: '#/components/schemas/ServiceRequestType'
        personId:
          type: string
          format: uuid
        programId:
          type: string
          description: |
            The program the enrollment belongs to. Optional: an enrollment belongs to exactly
            one program, so the server derives it when absent and refuses a value that does
            not match (ENROLLMENT_MISMATCH). A provider-scoped caller holds no permission to
            read programs or enrollments; it takes the enrollment id from its eligibility
            check's answer and sends no program at all.
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        providerOrganizationId:
          type: string
          format: uuid
        serviceDate:
          type: string
          format: date
        requestedStartAt:
          type: string
          format: date-time
        requestedEndAt:
          type: string
          format: date-time
        channel:
          $ref: '#/components/schemas/ServiceRequestChannel'
        supersedesRequestId:
          type: string
          format: uuid
          description: The rejected request this one replaces; a rejection is never reopened.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ServiceRequestItemInput'
    UpdateServiceRequest:
      type: object
      additionalProperties: false
      description: |
        Merge-patch of the draft header. There is deliberately no status here and no items:
        a move through the lifecycle is a command, and the lines are replaced as a set.
      properties:
        providerOrganizationId:
          type: [string, 'null']
          format: uuid
        serviceDate:
          type: string
          format: date
        requestedStartAt:
          type: [string, 'null']
          format: date-time
        requestedEndAt:
          type: [string, 'null']
          format: date-time
    ServiceRequestDecisionItem:
      type: object
      additionalProperties: false
      required: [lineNo, status]
      description: What a reviewer decided about one line of the submitted version.
      properties:
        lineNo:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [APPROVED, PARTIALLY_APPROVED, REJECTED]
        approvedQuantity:
          $ref: '#/components/schemas/DecimalAmount'
        approvedAmount:
          $ref: '#/components/schemas/DecimalAmount'
        decisionReasonCode:
          type: string
          minLength: 2
          maxLength: 80
    ServiceRequestDecision:
      type: object
      additionalProperties: false
      required: [reasonCode]
      description: |
        A review decision with its reason. An approve may leave items out, in which case
        every line is approved for what it asked for; a partial approval has to name them.
      properties:
        reasonCode:
          type: string
          minLength: 2
          maxLength: 80
        reasonText:
          type: string
          maxLength: 1000
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ServiceRequestDecisionItem'
    ServiceRequestVersionSummary:
      type: object
      additionalProperties: false
      required: [id, versionNo, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ServiceRequestVersionStatus'
        submittedAt:
          type: [string, 'null']
          format: date-time
        submittedBy:
          type: [string, 'null']
          format: uuid
        returnedAt:
          type: [string, 'null']
          format: date-time
        returnedBy:
          type: [string, 'null']
          format: uuid
        returnReasonCode:
          type: [string, 'null']
        returnReasonText:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    ServiceRequestVersion:
      type: object
      additionalProperties: false
      required: [id, serviceRequestId, versionNo, status, items, createdAt]
      properties:
        id:
          type: string
          format: uuid
        serviceRequestId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ServiceRequestVersionStatus'
        submittedAt:
          type: [string, 'null']
          format: date-time
        submittedBy:
          type: [string, 'null']
          format: uuid
        returnedAt:
          type: [string, 'null']
          format: date-time
        returnedBy:
          type: [string, 'null']
          format: uuid
        returnReasonCode:
          type: [string, 'null']
        returnReasonText:
          type: [string, 'null']
        items:
          type: array
          description: |
            The lines as this version carried them. A submitted version answers from the
            snapshot frozen at submit, so it never drifts with the request.
          items:
            $ref: '#/components/schemas/ServiceRequestItem'
        createdAt:
          type: string
          format: date-time
    ServiceRequestVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRequestVersionSummary'
    ReasonCommand:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 2
          maxLength: 80
        reasonText:
          type: string
          maxLength: 1000
    AuthorizationStatus:
      type: string
      description: |
        State of a promise. It is read-only on every endpoint: an authorization moves when
        entitlement moves, and there is no field a caller can set to change it.
      enum: [ACTIVE, PARTIALLY_USED, USED, EXPIRED, CANCELLED]
    Authorization:
      type: object
      additionalProperties: false
      required: [id, requestId, reference, validFrom, validTo, status, reservedTotal, consumedTotal, items, vouchers, rowVersion, createdAt, approvedAt]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
          description: The service request whose approval this authorization carries out.
        reference:
          type: string
          description: Human-readable number of the authorization, readable over a telephone.
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AuthorizationStatus'
        reservedTotal:
          $ref: '#/components/schemas/DecimalAmount'
        consumedTotal:
          $ref: '#/components/schemas/DecimalAmount'
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        priceQuoteId:
          type: [string, 'null']
          format: uuid
          description: |
            The quote the approval was made against, so what was quoted and what was
            authorized can be compared later. A quote grants nothing on its own.
        approvedBy:
          type: [string, 'null']
          format: uuid
        approvedAt:
          type: string
          format: date-time
        cancelReasonCode:
          type: [string, 'null']
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationItem'
        vouchers:
          type: array
          description: The vouchers issued against this authorization, never their tokens.
          items:
            $ref: '#/components/schemas/Voucher'
        rowVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    AuthorizationItem:
      type: object
      additionalProperties: false
      required: [id, requestItemId, serviceDefinitionId, approvedQuantity, memberAmount, consumedQuantity]
      properties:
        id:
          type: string
          format: uuid
        requestItemId:
          type: string
          format: uuid
        serviceDefinitionId:
          type: string
          format: uuid
        approvedQuantity:
          $ref: '#/components/schemas/DecimalAmount'
        approvedAmount:
          type: [string, 'null']
        memberAmount:
          $ref: '#/components/schemas/DecimalAmount'
        entitlementReservationId:
          type: [string, 'null']
          format: uuid
          description: The exact hold this line took on the entitlement ledger.
        consumedQuantity:
          $ref: '#/components/schemas/DecimalAmount'
    AuthorizationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Authorization'
        nextCursor:
          type: [string, 'null']
    CreateAuthorization:
      type: object
      additionalProperties: false
      required: [requestId, validTo]
      description: |
        The quantities are not sent: they are the ones the reviewer approved on the
        request, and a caller who could choose them could promise more than was approved.
      properties:
        requestId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date-time
          description: When the promise starts; defaults to now.
        validTo:
          type: string
          format: date-time
          description: When the promise stops holding and the reservations are released.
        priceQuoteId:
          type: string
          format: uuid
        items:
          type: array
          maxItems: 100
          description: |
            The member's share per approved line, when the approval decided one. A line
            that is not named here carries a member share of zero.
          items:
            $ref: '#/components/schemas/AuthorizationItemInput'
    AuthorizationItemInput:
      type: object
      additionalProperties: false
      required: [lineNo, memberAmount]
      properties:
        lineNo:
          type: integer
          minimum: 1
          description: Line number of the request item this share belongs to.
        memberAmount:
          $ref: '#/components/schemas/DecimalAmount'
    ExtendAuthorization:
      type: object
      additionalProperties: false
      required: [validTo]
      properties:
        validTo:
          type: string
          format: date-time
          description: The new end of the promise; it must be later than the current one.
        reasonCode:
          type: string
          minLength: 2
          maxLength: 80
        reasonText:
          type: string
          maxLength: 1000
    FulfilmentStatus:
      type: string
      description: |
        State of a delivery record. RECORDED says a service happened, COMPLETED says the
        entitlement was consumed for it, CANCELLED withdraws a record that never was.
      enum: [RECORDED, COMPLETED, CANCELLED]
    Fulfilment:
      type: object
      additionalProperties: false
      required: [id, reference, authorizationId, performedAt, status, items, rowVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        authorizationId:
          type: string
          format: uuid
        providerProfileId:
          type: [string, 'null']
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
        practitionerId:
          type: [string, 'null']
          format: uuid
        performedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/FulfilmentStatus'
        completedAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        cancelReasonCode:
          type: [string, 'null']
        recordedBy:
          type: [string, 'null']
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/FulfilmentItem'
        rowVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    FulfilmentItem:
      type: object
      additionalProperties: false
      required: [id, authorizationItemId, serviceDefinitionId, actualQuantity]
      properties:
        id:
          type: string
          format: uuid
        authorizationItemId:
          type: string
          format: uuid
        serviceDefinitionId:
          type: string
          format: uuid
        actualQuantity:
          $ref: '#/components/schemas/DecimalAmount'
        actualAmount:
          type: [string, 'null']
    FulfilmentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Fulfilment'
        nextCursor:
          type: [string, 'null']
    CreateFulfilment:
      type: object
      additionalProperties: false
      required: [authorizationId, performedAt, items]
      properties:
        authorizationId:
          type: string
          format: uuid
        providerProfileId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        practitionerId:
          type: string
          format: uuid
        performedAt:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/FulfilmentItemInput'
    FulfilmentItemInput:
      type: object
      additionalProperties: false
      required: [authorizationItemId, actualQuantity]
      description: |
        What one authorized line actually delivered. Quantities are exact decimal strings,
        never JSON numbers: a quantity that passed through a float is a quantity nobody can
        reconcile against the ledger afterwards.
      properties:
        authorizationItemId:
          type: string
          format: uuid
        actualQuantity:
          $ref: '#/components/schemas/DecimalAmount'
        actualAmount:
          $ref: '#/components/schemas/DecimalAmount'
    VoucherStatus:
      type: string
      enum: [ISSUED, REDEEMED, EXPIRED, REVOKED]
    Voucher:
      type: object
      additionalProperties: false
      required: [id, authorizationId, maskedToken, validFrom, validTo, status, issuedAt]
      description: |
        A voucher as anybody but its holder ever sees it. There is no token field here on
        purpose: the plaintext exists once, in the issue response, and is never readable
        again from any endpoint.
      properties:
        id:
          type: string
          format: uuid
        authorizationId:
          type: string
          format: uuid
        maskedToken:
          type: string
          description: The tail an operator reads back to confirm which voucher this is.
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/VoucherStatus'
        redeemedAt:
          type: [string, 'null']
          format: date-time
        redeemedByActorId:
          type: [string, 'null']
          format: uuid
        issuedAt:
          type: string
          format: date-time
    IssuedVoucher:
      type: object
      additionalProperties: false
      required: [voucher, token]
      description: |
        The one response that carries the plaintext. Show it to the member, print it or let
        them save it now: the server keeps only its digest and cannot produce it again.
      properties:
        voucher:
          $ref: '#/components/schemas/Voucher'
        token:
          type: string
          description: The plaintext voucher token, returned exactly once.
    IssueVoucher:
      type: object
      additionalProperties: false
      properties:
        validFrom:
          type: string
          format: date-time
          description: Defaults to the authorization's own start.
        validTo:
          type: string
          format: date-time
          description: |
            Defaults to the authorization's end and may never outlive it: a voucher that
            outlasts the hold behind it is a promise with nothing under it.
    RedeemVoucher:
      type: object
      additionalProperties: false
      required: [token, performedAt, items]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
          description: The plaintext the member presented; it is hashed and never stored.
        providerProfileId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        practitionerId:
          type: string
          format: uuid
        performedAt:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/FulfilmentItemInput'
    ServiceDomain:
      type: string
      description: Closed list of service domains shared by categories and definitions.
      enum: [GENERIC, HEALTH, ACCOMMODATION, ASSISTANCE, EDUCATION, SPORT, TRANSPORT, CARE, OTHER]
    FulfillmentMode:
      type: string
      description: How a service definition is delivered once it is requested.
      enum: [APPOINTMENT, RESERVATION, WORK_ORDER, MEMBERSHIP, SESSION, VOUCHER, REIMBURSEMENT, DIRECT]
    ServiceUnitType:
      type: string
      description: Unit a service definition is counted in.
      enum: [MONEY, COUNT, NIGHT, SESSION, HOUR, KILOMETER, POINT]
    CodeSystemAuthority:
      type: string
      description: Publisher of a code system; TENANT marks a sponsor-internal system.
      enum: [SGK, SB, WHO, TENANT, OTHER]
    ServiceCategory:
      type: object
      additionalProperties: false
      required: [id, code, name, domain, active, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        code:
          type: string
        name:
          type: string
        domain:
          $ref: '#/components/schemas/ServiceDomain'
        active:
          type: boolean
        rowVersion:
          type: integer
          minimum: 1
    ServiceCategoryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCategory'
        nextCursor:
          type: [string, 'null']
    CreateServiceCategoryRequest:
      type: object
      additionalProperties: false
      required: [code, name, domain]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        name:
          type: string
          minLength: 2
          maxLength: 200
        domain:
          $ref: '#/components/schemas/ServiceDomain'
        parentId:
          type: [string, 'null']
          format: uuid
        active:
          type: boolean
          default: true
    UpdateServiceCategoryRequest:
      type: object
      additionalProperties: false
      description: Merge-patch body; code is absent because it is immutable.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        parentId:
          type: [string, 'null']
          format: uuid
        active:
          type: boolean
    ServiceDefinition:
      type: object
      additionalProperties: false
      required:
        [id, categoryId, categoryCode, domain, code, name, fulfillmentMode, defaultUnitType,
         requiresProvider, active, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        categoryCode:
          type: string
        domain:
          $ref: '#/components/schemas/ServiceDomain'
        code:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        fulfillmentMode:
          $ref: '#/components/schemas/FulfillmentMode'
        defaultUnitType:
          $ref: '#/components/schemas/ServiceUnitType'
        requiresProvider:
          type: boolean
        active:
          type: boolean
        rowVersion:
          type: integer
          minimum: 1
    ServiceDefinitionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceDefinition'
        nextCursor:
          type: [string, 'null']
    CreateServiceDefinitionRequest:
      type: object
      additionalProperties: false
      required: [categoryId, code, name, fulfillmentMode, defaultUnitType]
      properties:
        categoryId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        name:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        fulfillmentMode:
          $ref: '#/components/schemas/FulfillmentMode'
        defaultUnitType:
          $ref: '#/components/schemas/ServiceUnitType'
        requiresProvider:
          type: boolean
          default: true
        active:
          type: boolean
          default: true
    UpdateServiceDefinitionRequest:
      type: object
      additionalProperties: false
      description: Merge-patch body; code is absent because it is immutable.
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 2000
        fulfillmentMode:
          $ref: '#/components/schemas/FulfillmentMode'
        defaultUnitType:
          $ref: '#/components/schemas/ServiceUnitType'
        requiresProvider:
          type: boolean
        active:
          type: boolean
    CodeSystem:
      type: object
      additionalProperties: false
      required: [id, code, name, version, authority, licensed, status, validFrom, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        version:
          type: string
        authority:
          $ref: '#/components/schemas/CodeSystemAuthority'
        licensed:
