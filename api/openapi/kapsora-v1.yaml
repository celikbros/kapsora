      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRequest'
        nextCursor:
          type: [string, 'null']
    ServiceRequestItemInput:
      type: object
      additionalProperties: false
      required: [serviceDefinitionId, requestedQuantity, unitType]
      description: |
        One requested line. Quantities and amounts are exact decimal strings, never JSON
        numbers: a quantity that passed through a float is a quantity nobody can reconcile
        against the ledger afterwards.
      properties:
        serviceDefinitionId:
          type: string
          format: uuid
        requestedQuantity:
          $ref: '#/components/schemas/DecimalAmount'
        unitType:
          $ref: '#/components/schemas/ServiceUnitType'
        requestedAmount:
          $ref: '#/components/schemas/DecimalAmount'
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
    ServiceRequestItems:
      type: object
      additionalProperties: false
      required: [items]
      description: The complete line set of the draft version; it replaces what is there.
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ServiceRequestItemInput'
    CreateServiceRequest:
      type: object
      additionalProperties: false
      required: [requestType, personId, programId, enrollmentId, serviceDate, channel, items]
      properties:
        requestType:
          $ref: '#/components/schemas/ServiceRequestType'
        personId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        providerOrganizationId:
          type: string
          format: uuid
        serviceDate:
          type: string
          format: date
        requestedStartAt:
          type: string
          format: date-time
        requestedEndAt:
          type: string
          format: date-time
        channel:
          $ref: '#/components/schemas/ServiceRequestChannel'
        supersedesRequestId:
          type: string
          format: uuid
