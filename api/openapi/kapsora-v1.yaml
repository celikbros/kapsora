          format: uuid
        locationId:
          type: string
          format: uuid
        locationCode:
          type: string
        locationName:
          type: string
        role:
          $ref: '#/components/schemas/PractitionerRole'
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, 'null']
          format: date
    PractitionerLocationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
