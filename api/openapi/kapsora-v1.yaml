    post:
      tags: [Benefit]
      operationId: publishPlanVersion
      description: |
        UNDER_REVIEW → PUBLISHED by the checker (`plan.publish`, step-up). The checker must
        differ from the submitter (403 MAKER_CHECKER_SAME_ACTOR). Overlapping published
        validity within the plan answers 409 PLAN_VERSION_OVERLAP. The configuration hash is
        computed and frozen; the version is immutable afterwards.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PlanVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewComment'
      responses:
        '200':
          description: Version published
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
