                  nextCursor:
                    type: [string, 'null']
  /api/v1/entitlement-adjustments/{adjustmentId}/approve:
    post:
      tags: [Benefit]
      operationId: approveEntitlementAdjustment
      description: |
        Approves a pending adjustment and writes the ADJUST ledger movement in the same
        transaction. The approver must differ from the requester (403
        MAKER_CHECKER_SAME_ACTOR) and must have re-entered their password (step-up).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AdjustmentId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewComment'
      responses:
        '200':
          description: Adjustment approved and applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementAdjustment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/entitlement-adjustments/{adjustmentId}/reject:
    post:
      tags: [Benefit]
      operationId: rejectEntitlementAdjustment
      description: Rejects a pending adjustment with a reason; nothing moves.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AdjustmentId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Adjustment rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementAdjustment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/eligibility/checks:
    post:
      tags: [Eligibility]
      operationId: checkEligibility
      description: |
        Query-style POST: evaluates eligibility deterministically and records an evaluation
        snapshot, but changes no business state. Idempotency-Key is therefore optional.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibilityCheckRequest'
      responses:
        '200':
          description: Deterministic eligibility result and explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityCheckResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/eligibility/evaluations/{evaluationId}:
    get:
      tags: [Eligibility]
      operationId: getEligibilityEvaluation
      description: |
        The stored snapshot of an earlier check: the request as it was understood (ids,
        dates, quantities), the result with explanations and the versions used. Evaluations
        are immutable and never contain identifiers.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/EvaluationId'
      responses:
        '200':
          description: Stored evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityEvaluation'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/imports/members:
    post:
      tags: [Imports]
      operationId: createMemberImport
      description: |
        Uploads a member file (CSV_V1, UTF-8, at most 20 MB / 50 000 rows) for a sponsor
        organization and stages it. Identifiers are blind-indexed, masked and encrypted on
        the way in; the plaintext file content is not kept. The same
        `sourceSystem + sourceVersion + file hash` answers 409 IMPORT_DUPLICATE. Small files
        are validated synchronously (201, status VALIDATING or REVIEW/READY); large files are
        queued (202). Requires `import.execute` and step-up.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, sponsorOrganizationId, sourceSystem, sourceVersion]
              properties:
                file:
                  type: string
                  format: binary
                sponsorOrganizationId:
                  type: string
                  format: uuid
                sourceSystem:
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
                sourceVersion:
                  type: string
                  maxLength: 64
                planId:
                  type: string
                  format: uuid
                  description: Default plan for rows without `plan_code`.
      responses:
        '201':
          description: Batch staged and validated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '202':
          description: Batch staged; validation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: File too large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Imports]
      operationId: listMemberImports
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [RECEIVED, VALIDATING, REVIEW, READY, APPLYING, APPLIED, FAILED, CANCELLED]
      responses:
        '200':
          description: Import batches, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberImportBatch'
                  nextCursor:
                    type: [string, 'null']
  /api/v1/imports/members/{importId}:
    get:
      tags: [Imports]
      operationId: getMemberImport
      description: Batch status, counters and the reconciliation summary.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Import batch
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/imports/members/{importId}/rows:
    get:
      tags: [Imports]
      operationId: listMemberImportRows
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, VALID, INVALID, MATCHED, CONFLICT, APPLIED, SKIPPED]
      responses:
        '200':
          description: Rows of the batch in file order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberImportRow'
                  nextCursor:
                    type: [string, 'null']
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/imports/members/{importId}/rows/{rowId}/review:
    post:
      tags: [Imports]
      operationId: reviewMemberImportRow
      description: Records the operator's decision for a CONFLICT or INVALID row.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/ImportRowId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [CREATE, UPDATE, SKIP]
                matchedPersonId:
                  type: string
                  format: uuid
                  description: Required for UPDATE when the row was a CONFLICT.
      responses:
        '200':
          description: Row updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportRow'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/imports/members/{importId}/apply:
    post:
      tags: [Imports]
      operationId: applyMemberImport
      description: |
        Applies the batch in transactional chunks (worker job): persons, identifiers,
        memberships (principals first), relationships and enrollments. Rows marked SKIP or
        still INVALID are skipped and counted. Re-applying an APPLIED batch is a no-op.
        Requires `import.execute` and step-up.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Apply queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/imports/members/{importId}/cancel:
    post:
      tags: [Imports]
      operationId: cancelMemberImport
      description: Cancels a batch that has not started applying.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Batch cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/service-requests:
    get:
      tags: [Service Requests]
      operationId: listServiceRequests
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, ELIGIBILITY_FAILED, PENDING_DOCUMENT, PENDING_REVIEW, APPROVED, PARTIALLY_APPROVED, REJECTED, CANCELLED, EXPIRED, CLOSED]
        - name: personId
          in: query
          schema:
            type: string
            format: uuid
        - name: providerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Service request page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestPage'
    post:
      tags: [Service Requests]
      operationId: createServiceRequest
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Draft service request created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}:
    get:
      tags: [Service Requests]
      operationId: getServiceRequest
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Service request detail
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Service Requests]
      operationId: updateDraftServiceRequest
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Draft updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/service-requests/{requestId}/submit:
    post:
      tags: [Service Requests]
      operationId: submitServiceRequest
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                comment:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Submitted request after eligibility/rule evaluation
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}/cancel:
    post:
      tags: [Service Requests]
      operationId: cancelServiceRequest
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Cancelled request
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-kapsora_session
      description: |
        Opaque session id. The server stores only its SHA-256 hash and the browser never
        holds a token of any kind. Local HTTP development uses the name kapsora_session
        because the __Host- prefix requires HTTPS.
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.kapsora.example/realms/kapsora/protocol/openid-connect/token
          scopes:
            kapsora.api: Call KAPSORA APIs
  parameters:
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: Selected tenant UUID. It must be one of the actor's active memberships.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key retained for at least 24 hours.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional on query-style POSTs; honoured when present.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when the request is authenticated with the BFF session cookie.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Optimistic concurrency token returned as ETag.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from the previous response.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanVersionId:
      name: planVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdjustmentId:
      name: adjustmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportRowId:
      name: rowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: Strong optimistic concurrency tag based on row_version.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required or session expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated actor lacks permission or scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible in the selected tenant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Business state, duplicate idempotency key, or uniqueness conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request is syntactically valid but violates validation or business preconditions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded for tenant + actor + route
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED, DOWN]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: string
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_.-]{2,79}$'
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    UserContext:
      type: object
      additionalProperties: false
      required: [actorId, displayName, tenants]
      properties:
        actorId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantContext'
    SessionInfo:
      type: object
      additionalProperties: false
      required: [actorId, csrfToken, expiresAt, activeTenantId, stepUpExpiresAt, mustChangePassword]
      properties:
        actorId:
          type: string
          format: uuid
        displayName:
          type: string
        activeTenantId:
          type: [string, 'null']
          format: uuid
        csrfToken:
          type: string
          description: Echo this in X-CSRF-Token on every state-changing call.
        expiresAt:
          type: string
          format: date-time
          description: Absolute end of the session, regardless of activity.
        stepUpExpiresAt:
          type: [string, 'null']
          format: date-time
        mustChangePassword:
          type: boolean
          description: True when an administrator issued a temporary password.
    TenantContext:
      type: object
      additionalProperties: false
      required: [tenant, permissions]
      properties:
        tenant:
          $ref: '#/components/schemas/TenantSummary'
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type]
            properties:
              type:
                type: string
              id:
                type: [string, 'null']
                format: uuid
    TenantSummary:
      type: object
      additionalProperties: false
      required: [id, code, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [PROVISIONING, ACTIVE, SUSPENDED, CLOSED]
        defaultLocale:
          type: string
        defaultTimeZone:
          type: string
    Organization:
      description: |
        Tenant relationship with a global organization. `id` identifies the relationship
        (tenant_organization); `organizationId` identifies the shared legal entity.
      allOf:
        - $ref: '#/components/schemas/OrganizationSummary'
        - type: object
          additionalProperties: false
