    get:
      tags: [Benefit]
      operationId: listEntitlementMappings
      description: |
        Which catalogue service draws from which entitlement of this plan version, and how
        much of it one unit of the service draws. A service with no mapping here is what
        makes an eligibility check answer SERVICE_MAPPING_PENDING.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PlanVersionId'
      responses:
        '200':
          description: Mappings of the version, by service code
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntitlementMapping'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Benefit]
      operationId: putEntitlementMappings
      description: |
        Replaces the whole mapping set of a DRAFT version. The mapping is part of the plan
        version and follows its publishing: a published version's mappings are immutable
        (409 PLAN_VERSION_IMMUTABLE). An entitlement code that is not defined on this
        version, an unknown or inactive service, a service named twice, or a unit factor
        that is not a positive exact decimal are 422 field errors.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PlanVersionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/EntitlementMappingInput'
      responses:
        '200':
          description: The version's new mapping set
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntitlementMapping'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/plan-versions/{planVersionId}/submit:
    post:
      tags: [Benefit]
      operationId: submitPlanVersion
      description: DRAFT → UNDER_REVIEW by the maker; the version must have at least one definition and a validity start.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PlanVersionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewComment'
      responses:
        '200':
          description: Version under review
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/plan-versions/{planVersionId}/publish:
    post:
      tags: [Benefit]
      operationId: publishPlanVersion
      description: |
        UNDER_REVIEW → PUBLISHED by the checker (`plan.publish`, step-up). The checker must
        differ from the submitter (403 MAKER_CHECKER_SAME_ACTOR). Overlapping published
        validity within the plan answers 409 PLAN_VERSION_OVERLAP. The configuration hash is
        computed and frozen; the version is immutable afterwards.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PlanVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewComment'
      responses:
        '200':
          description: Version published
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/plan-versions/{planVersionId}/retire:
    post:
      tags: [Benefit]
      operationId: retirePlanVersion
      description: PUBLISHED → RETIRED with a reason (`plan.publish`); the version stays readable.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PlanVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Version retired
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
