        validTo:
          type: [string, 'null']
          format: date
    ReplacePractitionerLocationsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PractitionerLocationInput'
    PractitionerRegistrationSearchRequest:
      type: object
      additionalProperties: false
      required: [registrationAuthority, registrationNumber]
      properties:
        registrationAuthority:
          $ref: '#/components/schemas/RegistrationAuthority'
        registrationNumber:
          type: string
          minLength: 1
          maxLength: 80
          description: Travels in the body only; never in a path segment or a query key.
    ProviderSearchResult:
      type: object
      additionalProperties: false
      required:
        [providerId, organizationName, providerType, locationId, locationCode, locationName,
         matchedVia]
      properties:
        providerId:
          type: string
          format: uuid
        organizationName:
          type: string
        providerType:
          $ref: '#/components/schemas/ProviderType'
        networkTier:
          type: [string, 'null']
        locationId:
          type: string
          format: uuid
        locationCode:
          type: string
        locationName:
          type: string
        city:
          type: [string, 'null']
        district:
          type: [string, 'null']
        latitude:
          type: [number, 'null']
          format: double
        longitude:
          type: [number, 'null']
          format: double
        matchedVia:
          type: string
          description: |
            DEFINITION when the location names the service definition itself, CATEGORY
            when the coverage comes from a category above it in the tree.
          enum: [DEFINITION, CATEGORY]
    ProviderSearchPage:
      type: object
      additionalProperties: false
      required: [items, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderSearchResult'
        asOf:
          type: string
          format: date
          description: The date the capabilities were resolved against.
        nextCursor:
          type: [string, 'null']
    DecimalAmount:
      type: string
      description: |
        An exact numeric(20,6) money or quantity value as a decimal string. It is a string
        and not a JSON number on purpose: a tariff row is what somebody is invoiced, and a
        float would round it silently somewhere between the browser and the ledger.
      pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
      maxLength: 21
    DecimalPercent:
      type: string
      description: A percentage between 0 and 100 as an exact decimal string.
      pattern: '^(100(\.0{1,6})?|[0-9]{1,2}(\.[0-9]{1,6})?)$'
      maxLength: 10
    DecimalRate:
      type: string
      description: A rate with at most two decimals, as an exact decimal string.
      pattern: '^[0-9]{1,3}(\.[0-9]{1,2})?$'
      maxLength: 6
    ContractStatus:
      type: string
      description: |
        Lifecycle of a contract. Only an ACTIVE contract's published versions are
        considered by the price selection.
      enum: [DRAFT, ACTIVE, SUSPENDED, CLOSED]
    ContractVersionStatus:
      type: string
      description: |
        Lifecycle of a contract version. PUBLISHED is the only status a quote, an
        authorization or a claim ever reads, and nothing about it may change afterwards.
      enum: [DRAFT, UNDER_REVIEW, PUBLISHED, RETIRED]
    PricingMethod:
      type: string
      description: |
        How the amount of a price item is arrived at. FIXED and UNIT carry an amount,
        PERCENT_OF_LIST a percent, FORMULA the key of a calculation rule.
      enum: [FIXED, UNIT, PERCENT_OF_LIST, FORMULA]
    MemberShareMethod:
      type: string
      description: How much of the price the member carries; NONE means the payer carries all of it.
      enum: [NONE, FIXED, PERCENT]
    PackageInclusionRule:
      type: string
      description: |
        ALL means every line of the package is included; ANY_OF_N means minLines of them
        are, whichever the member uses.
      enum: [ALL, ANY_OF_N]
    QuotaPeriodType:
      type: string
      description: The period a provider quota is counted over; CONTRACT means the whole version.
      enum: [DAY, WEEK, MONTH, YEAR, CONTRACT]
    SettlementMethod:
      type: string
      description: How the provider is paid.
      enum: [BANK_TRANSFER, OFFSET, OTHER]
    TaxBehaviour:
      type: string
      description: Whether the agreed amounts already include VAT, exclude it, or are exempt.
      enum: [EXCLUSIVE, INCLUSIVE, EXEMPT]
    Contract:
      type: object
      additionalProperties: false
      required: [id, code, name, payerOrganizationId, providerProfileId, domainCode, status, rowVersion]
