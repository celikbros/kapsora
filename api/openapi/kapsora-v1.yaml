        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Benefit]
      operationId: createEnrollment
      description: |
        Enrolls a sponsor membership of the person into a plan for a period. The membership
        must be ACTIVE and the plan must have a PUBLISHED version covering `validFrom`
        (422 PLAN_NOT_PUBLISHED). Overlapping enrollments of the same membership and plan
        answer 409 ENROLLMENT_OVERLAP. An outbox event opens the entitlement accounts.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      responses:
        '201':
          description: Enrollment created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/enrollments:
    get:
      tags: [Benefit]
      operationId: listEnrollments
      description: Enrollments of the tenant filtered by plan and status, keyset paged.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
