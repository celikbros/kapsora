          minLength: 1
          maxLength: 100
        birthDate:
          type: [string, 'null']
          format: date
        sexAtBirth:
          type: [string, 'null']
          enum: [FEMALE, MALE, INTERSEX, UNKNOWN, null]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DECEASED]
        identifiers:
          type: array
          maxItems: 10
          description: Identifiers to add (type + value) or remove (type + remove).
          items:
            type: object
            additionalProperties: false
            required: [type]
            properties:
