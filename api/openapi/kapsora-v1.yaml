  /api/v1/prices:resolve:
    post:
      tags: [Contracts]
      operationId: resolvePrice
      description: |
        Which contracted price applies to this service, at this provider, on this date.
        Only published versions of active contracts whose period contains the service date
        are considered; inside them a price list must match the season and the weekday, and
        an item must match its own period, the location and the service. The winner is the
        most specific candidate: a price naming the definition beats one naming a package,
        which beats one naming a category, a nearer ancestor category beats a further one,
        and a location-specific price beats a tenant-wide one of the same tier. Remaining
        ties are broken by item priority and then by list priority. When two candidates are
        still equal the answer is REVIEW_REQUIRED with reason PRICE_AMBIGUOUS and the ids of
        every tied item: the system never picks a winner among equals, because a random one
        is a silent financial error that nothing anywhere reports. With no candidate at all
        the answer is NOT_FOUND with reason PRICE_NOT_FOUND. Every considered candidate is
        returned with its score, so a screen can explain the choice instead of asserting it.
        Changes no state.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolvePriceRequest'
      responses:
        '200':
          description: Price resolution with the full candidate explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvePriceResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/rule-sets:
    get:
      tags: [Rules]
      operationId: listRuleSets
      description: |
        Rule sets of the tenant, newest first, with keyset paging. A rule set is a named
        decision — which document a claim needs, when a pre-approval is required, what age
        a dependant may be — and what it currently decides lives in its published version.
        q searches the code and the name; the other filters narrow to one service domain,
        one purpose or one status.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Rule set code or name search.
          schema:
            type: string
            maxLength: 120
        - name: domainCode
          in: query
          description: Only rule sets in this service domain.
          schema:
            $ref: '#/components/schemas/ServiceDomain'
        - name: purpose
          in: query
          description: Only rule sets serving this purpose.
          schema:
            $ref: '#/components/schemas/RuleSetPurpose'
        - name: status
          in: query
          description: Only rule sets in this status.
          schema:
            $ref: '#/components/schemas/RuleSetStatus'
      responses:
        '200':
          description: Rule set page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Rules]
      operationId: createRuleSet
      description: |
        Opens a rule set. The set itself decides nothing: it holds versions, and only a
        published version is ever evaluated. The purpose says which decision the set
        answers, so a caller asking "which documents does this claim need" reads the
        DOCUMENT sets and never a PRICE one. The code is unique inside the tenant, so a
        second one answers 409 RULE_SET_CODE_TAKEN.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleSetRequest'
      responses:
        '201':
          description: Rule set created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSet'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/rule-sets/{ruleSetId}:
    get:
      tags: [Rules]
      operationId: getRuleSet
      description: |
        One rule set of the tenant with its optimistic concurrency tag. The versions are
        read separately, because a rule set that has been revised every quarter for three
        years carries more of them than a detail view wants.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RuleSetId'
      responses:
        '200':
          description: Rule set
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSet'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Rules]
      operationId: patchRuleSet
      description: |
        Merge-patch of the name and the status of a rule set. The code, the service domain
        and the purpose are absent: they are what the set is, and every published version
        was written against them, so a body carrying one answers 422 with field code
        IMMUTABLE. Setting the status to INACTIVE stops the set being offered for new
        decisions; it changes nothing about the evaluations it already produced.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RuleSetId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
