        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateServiceDefinitionRequest'
      responses:
        '200':
          description: Service definition updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDefinition'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/service-definitions/{definitionId}/code-mappings:
    get:
      tags: [Catalog]
      operationId: listServiceCodeMappings
      description: |
        Every external code this definition is reported under, ordered by code system and
        validity start. The set is short by design, so it is returned whole rather than
        paged.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceDefinitionId'
      responses:
        '200':
          description: Code mappings of the definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCodeMappingList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Catalog]
      operationId: putServiceCodeMappings
      description: |
        Replaces the whole mapping set of the definition. Two rows for the same code
        system and code whose validity periods overlap answer 409 CODE_MAPPING_OVERLAP,
        and so does a second primary mapping for the same code system over an overlapping
        period. If-Match carries the ETag of the service definition, which the replacement
        moves on.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceDefinitionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceServiceCodeMappingsRequest'
      responses:
        '200':
          description: Mapping set replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCodeMappingList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/code-systems:
    get:
      tags: [Catalog]
      operationId: listCodeSystems
      description: |
        External code systems known to the tenant, newest first, with keyset paging.
        Editions of the same system live side by side, so SUT 2024 and SUT 2025 are two
        rows.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Code or name search.
          schema:
            type: string
            maxLength: 120
        - name: authority
          in: query
          description: Only systems published by this authority.
          schema:
            $ref: '#/components/schemas/CodeSystemAuthority'
        - name: status
          in: query
          description: Only systems in this status.
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
      responses:
        '200':
          description: Code system page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSystemPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Catalog]
      operationId: createCodeSystem
      description: |
        Registers one edition of a code system. Code and version together are unique
        within the tenant (409 CODE_SYSTEM_TAKEN) and both are immutable, because mappings
        and imported values hang off the row. Set licensed when the content may not leave
        the tenant.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCodeSystemRequest'
      responses:
        '201':
          description: Code system created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSystem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/code-systems/{codeSystemId}:
    get:
      tags: [Catalog]
