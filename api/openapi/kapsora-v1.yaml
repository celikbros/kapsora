  /api/v1/imports/members/{importId}/rows:
    get:
      tags: [Imports]
      operationId: listMemberImportRows
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, VALID, INVALID, MATCHED, CONFLICT, APPLIED, SKIPPED]
      responses:
        '200':
          description: Rows of the batch in file order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberImportRow'
                  nextCursor:
                    type: [string, 'null']
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/imports/members/{importId}/rows/{rowId}/review:
    post:
      tags: [Imports]
      operationId: reviewMemberImportRow
      description: Records the operator's decision for a CONFLICT or INVALID row.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/ImportRowId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [CREATE, UPDATE, SKIP]
                matchedPersonId:
                  type: string
                  format: uuid
                  description: Required for UPDATE when the row was a CONFLICT.
      responses:
        '200':
          description: Row updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportRow'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/imports/members/{importId}/apply:
    post:
      tags: [Imports]
      operationId: applyMemberImport
      description: |
        Applies the batch in transactional chunks (worker job): persons, identifiers,
        memberships (principals first), relationships and enrollments. Rows marked SKIP or
        still INVALID are skipped and counted. Re-applying an APPLIED batch is a no-op.
        Requires `import.execute` and step-up.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Apply queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/imports/members/{importId}/cancel:
    post:
      tags: [Imports]
      operationId: cancelMemberImport
      description: Cancels a batch that has not started applying.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Batch cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/service-requests:
    get:
      tags: [Service Requests]
      operationId: listServiceRequests
      description: |
        Service requests of the tenant, newest first, with keyset paging. Every filter is
        optional and they combine with AND. A provider-scoped actor only ever sees the
        requests made for one of its own organizations: the boundary is applied in the
        repository rather than in the handler, so a request that belongs to another
        provider is not on the page and is not reachable by id either.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: Keep only the requests currently in this lifecycle state.
          schema:
            $ref: '#/components/schemas/ServiceRequestStatus'
        - name: personId
          in: query
          description: Keep only the requests raised for this person.
          schema:
            type: string
            format: uuid
        - name: programId
          in: query
          description: Keep only the requests raised under this benefit program.
          schema:
            type: string
            format: uuid
        - name: providerOrganizationId
          in: query
          description: Keep only the requests naming this provider organization.
          schema:
            type: string
            format: uuid
        - name: channel
          in: query
          description: Keep only the requests that arrived through this channel.
          schema:
            $ref: '#/components/schemas/ServiceRequestChannel'
        - name: serviceDateFrom
          in: query
          description: Keep only the requests whose service date is on or after this day.
          schema:
            type: string
            format: date
        - name: serviceDateTo
          in: query
          description: Keep only the requests whose service date is on or before this day.
          schema:
            type: string
            format: date
        - name: createdFrom
          in: query
          description: Keep only the requests created at or after this instant.
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          description: Keep only the requests created at or before this instant.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Service request page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Service Requests]
      operationId: createServiceRequest
      description: |
        Opens a request in DRAFT together with its first version and the lines it starts
        with. Nothing is decided here: the eligibility gate and the tenant's rules run at
        submit, and until then the draft is only a form somebody is filling in. The status
        cannot be chosen, because a request always starts in DRAFT, and supersedesRequestId
        is how a fresh attempt names the rejected request it replaces.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Draft service request created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}:
    get:
      tags: [Service Requests]
      operationId: getServiceRequest
      description: |
        One request with the lines of its current version and the evaluations that decided
        its last submit. A provider-scoped actor asking for another provider's request is
        answered 404 rather than 403: that such a request exists at all is itself
        information about somebody else's business.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Service request detail
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Service Requests]
      operationId: patchServiceRequestDraft
      description: |
        Merge-patches the header of the DRAFT version: the provider, the service date and
        the requested window. It never writes status. A body carrying status, or any other
        field this endpoint does not own, is answered 422 with the field code IMMUTABLE,
        because every move through the lifecycle is a command of its own with its own
        precondition, permission and reason. The lines are replaced through
        putServiceRequestItems rather than here.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Draft updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
