              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/rule-set-versions/{ruleSetVersionId}/rules:
    put:
      tags: [Rules]
      operationId: putRules
      description: |
        Replaces the whole rule set of a DRAFT version, the way a contract price list is
        replaced: the meaningful unit is the rule set, and a set write makes consistency
        one decision rather than n. Every condition is compiled against the version's
        input schema before anything is stored, so a condition naming an undeclared
        variable or returning something other than a boolean answers 422 with the failing
        rule's code and the compiler's own message — at authoring time rather than at
        three in the morning. Two rules may not share a priority, because evaluation order
        has to be total and reproducible. If-Match carries the ETag of the version.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RuleSetVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRulesRequest'
      responses:
        '200':
          description: Rule set replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/rule-set-versions/{ruleSetVersionId}/test-cases:
    put:
      tags: [Rules]
      operationId: putRuleTestCases
      description: |
        Replaces the whole test case set of a DRAFT version. A test case is one input with
        the outcome, the explanation codes and, optionally, the actions it must produce.
        The set exists because a version cannot be submitted for review without at least
        one case and without every case passing: an untested rule that decides what a
        member is owed is not a rule anybody should have to trust. If-Match carries the
        ETag of the version.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RuleSetVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRuleTestCasesRequest'
      responses:
        '200':
          description: Test case set replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleTestCaseList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/rule-set-versions/{ruleSetVersionId}/tests:run:
    post:
      tags: [Rules]
      operationId: runRuleTests
      description: |
        Runs the stored test cases of a version against its rules and reports, per case,
        what was expected and what actually happened. It writes nothing: no evaluation
        row, no test result row, no side effect of any kind, so an author may run it as
        often as they like. This is the same check the submit gate applies, offered
        separately so a failing case is found before the review is asked for.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RuleSetVersionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Test run result, per case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleTestRunResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/rule-set-versions/{ruleSetVersionId}:simulate:
    post:
      tags: [Rules]
      operationId: simulateRuleSetVersion
      description: |
        Runs one supplied input against a draft or a published version and returns the
        full trace: every rule considered, in priority order, whether it matched, the
        action it asked for and the explanation code it carries. It writes no evaluation
        row and has no side effect of any kind — the engine returns actions and performs
        none of them, which is what lets production data be simulated safely. Use
        `getRuleEvaluation` to read a decision that was actually recorded.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RuleSetVersionId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRuleSetVersionRequest'
      responses:
        '200':
          description: Simulated trace; nothing was written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleEvaluationTrace'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/rule-set-versions/{ruleSetVersionId}/submit:
    post:
      tags: [Rules]
      operationId: submitRuleSetVersion
      description: |
        Moves a DRAFT version to UNDER_REVIEW and records the maker. This is the gate the
        whole package exists for: a version with no test case answers 422 on field
        testCases with code TESTS_REQUIRED, and a version whose cases do not all pass
        answers 422 with code TESTS_FAILING naming the failing case codes. The validity
        start is required too, because a published version without one could never be
        selected by service date.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RuleSetVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewComment'
      responses:
        '200':
          description: Rule set version submitted for review
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/rule-set-versions/{ruleSetVersionId}/publish:
    post:
      tags: [Rules]
      operationId: publishRuleSetVersion
      description: |
        Freezes a version under review and makes it the one the engine evaluates. It needs
        `rule.publish`, a recent step-up and an actor other than the one who submitted it;
        the same person answers 403 MAKER_CHECKER_SAME_ACTOR and the refusal is audited.
        Publishing writes a content hash over the input schema and every rule, so "which
        rules decided this" can be proved years later. Two published versions of one rule
        set may not cover the same day, so an overlapping period answers 409
        RULE_SET_VERSION_OVERLAP.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RuleSetVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewComment'
      responses:
        '200':
          description: Rule set version published
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/rule-set-versions/{ruleSetVersionId}/retire:
    post:
      tags: [Rules]
      operationId: retireRuleSetVersion
      description: |
        Closes a published version with a reason. It stays readable, because every
        evaluation ever recorded names the version that produced it and a dispute two
        years later has to be able to read the rules that decided it. Retiring needs
        `rule.publish` and a recent step-up.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RuleSetVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Rule set version retired
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/rule-evaluations/{ruleEvaluationId}:
    get:
      tags: [Rules]
      operationId: getRuleEvaluation
      description: |
        One recorded decision: the rule set version that produced it, the outcome, the
        rules that fired in order with their explanation codes and actions, and the input
        snapshot the decision was taken on. The snapshot holds ids, dates and quantities
        only — never an identity number and never a name — because an audit trail that
        needs protecting is an audit trail nobody reads. The row is append-only and can
        never be edited.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RuleEvaluationId'
      responses:
        '200':
          description: Recorded rule evaluation with its full trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleEvaluation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/pricing/quotes:
    post:
      tags: [Pricing]
      operationId: createPriceQuote
      description: |
        What this service costs at this provider on this date, how much of it the plan
        carries and what the member pays out of pocket. Each line is priced in one fixed
        order — eligibility, the deterministic price selection, the contract amount, the
        tenant's published PRICE rules, the entitlement balance, then the split — and every
        step that moved a figure leaves an explanation code behind it, so a one kuruş
        difference is never mysterious. A line whose price is ambiguous or missing makes the
        whole quote REVIEW_REQUIRED and carries no member figure at all, because a guess
        here is worse than an answer of "we do not know". A quote reserves nothing, moves no
        balance and authorizes nothing; the disclaimer in the response says so, so nobody at
        a counter mistakes one for an approval. It is stored so that the number quoted and
        the number later claimed can be compared, and it expires (tenant setting
        pricing.quote_ttl_hours, 72 hours by default) because prices move. Idempotency-Key
        is optional and replays the stored quote unchanged.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePriceQuoteRequest'
      responses:
        '200':
          description: Stored price quote with every figure and the reasoning behind it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuote'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/pricing/quotes/{priceQuoteId}:
    get:
      tags: [Pricing]
      operationId: getPriceQuote
      description: |
        One stored quote: the five figures per line and in total, the explanation codes
        behind them, and the ids of the contract version, the price items, the plan version
        and the rule set versions it was taken against. The row is append-only, so what
        somebody was quoted cannot be rewritten afterwards. An expired quote is still
        returned, with expired true and its expiresAt, rather than hidden: a member who was
        given a number is owed the reason it no longer holds. A provider-scoped actor sees
        only the quotes made for its own provider.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PriceQuoteId'
      responses:
        '200':
          description: Stored price quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceQuote'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/authorizations:
    get:
      tags: [Authorizations]
      operationId: listAuthorizations
      description: |
        Authorizations of the tenant, newest first, with keyset paging. Every filter is
        optional and they combine with AND. An authorization has no provider column of its
        own, so a provider-scoped actor is bounded by the request the authorization was
        granted against: an authorization raised for another provider is not on the page
        and is not reachable by id either.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: Keep only the authorizations currently in this state.
          schema:
            $ref: '#/components/schemas/AuthorizationStatus'
        - name: requestId
          in: query
          description: Keep only the authorizations granted against this service request.
          schema:
            type: string
            format: uuid
        - name: personId
          in: query
          description: Keep only the authorizations whose request was raised for this person.
          schema:
            type: string
            format: uuid
        - name: providerOrganizationId
          in: query
          description: Keep only the authorizations whose request names this provider organization.
          schema:
            type: string
            format: uuid
        - name: validFrom
          in: query
          description: Keep only the authorizations still valid at or after this instant.
          schema:
            type: string
            format: date-time
        - name: validTo
          in: query
          description: Keep only the authorizations that had already started by this instant.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Authorization page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Authorizations]
      operationId: createAuthorization
      description: |
        Turns an approval into a promise that costs something. In one transaction the
        approved lines of the request are read, entitlement is reserved for each of them
        through the ledger, and the reservation id is written onto the line so release and
        consume later act on the exact hold this authorization took. A refusal on any line
        fails the whole authorization: a half-reserved approval is a promise nobody can
        keep. The request must be APPROVED or PARTIALLY_APPROVED.

        Idempotency-Key is required. Creating twice under one key returns the same
        authorization and takes one set of reservations, never two.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorization'
      responses:
        '201':
          description: Authorization created and entitlement reserved
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/authorizations/{authorizationId}:
    get:
      tags: [Authorizations]
      operationId: getAuthorization
      description: |
        One authorization with its lines and the vouchers issued against it. A caller
        outside the provider boundary is answered 404 rather than 403: that such an
        authorization exists at all is itself information about somebody else's business.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AuthorizationId'
      responses:
        '200':
          description: Authorization detail
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/authorizations/{authorizationId}/extend:
    post:
      tags: [Authorizations]
      operationId: extendAuthorization
      description: |
        Moves validTo forward. It only ever moves forward and only while the authorization
        is ACTIVE: shortening a promise somebody is relying on, or reviving one that has
        been used up, cancelled or expired, are both refused with 409.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AuthorizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendAuthorization'
      responses:
        '200':
          description: Authorization extended
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/authorizations/{authorizationId}/cancel:
    post:
      tags: [Authorizations]
      operationId: cancelAuthorization
      description: |
        Withdraws the promise and releases every reservation that is still outstanding, in
        one transaction. It needs a reason code, because an authorization that disappeared
        without one leaves a member with nothing to appeal against. What was already
        delivered stays consumed: cancelling a promise does not undo a service.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AuthorizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Authorization cancelled and its holds released
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/authorizations/{authorizationId}/vouchers:
    post:
      tags: [Authorizations]
      operationId: issueVoucher
      description: |
        Issues the token the member shows at the counter. The plaintext is generated with a
        cryptographic random source and returned once, in this response and nowhere else:
        the database keeps only its SHA-256 digest and a masked tail, exactly as the
        session cookie is handled. It never appears in a URL, a query key, a log line or an
        audit row, and it cannot be read back — a lost voucher is reissued, not recovered.

        This is the one command of the module that takes no Idempotency-Key. The
        Idempotency-Key contract stores the response body so a replay can be answered from
        it, and this response is the only place a voucher's plaintext ever exists; storing
        it would put the token in a column. Issuing twice therefore issues two vouchers,
        which costs nothing: a voucher moves no entitlement until it is redeemed.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AuthorizationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueVoucher'
      responses:
        '201':
          description: Voucher issued; the token is in this body and is never shown again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedVoucher'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/vouchers:redeem:
    post:
      tags: [Authorizations]
      operationId: redeemVoucher
      description: |
        Redeems a voucher and records the fulfilment it was presented for, in one
        transaction: a fulfilment that fails leaves the voucher unredeemed, and a second
        redemption is answered 409 VOUCHER_ALREADY_REDEEMED. The token is sent in the body
        rather than in the path or a query parameter, because a URL is written to access
        logs, browser history and referrers, and a voucher in any of them is a voucher
        somebody else can use.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemVoucher'
      responses:
        '201':
          description: Voucher redeemed and the fulfilment recorded
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfilment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/fulfilments:
    get:
      tags: [Authorizations]
      operationId: listFulfilments
      description: |
        Fulfilments of the tenant, newest first, with keyset paging. The provider boundary
        is the one of the authorization's request, so a provider only ever sees what was
        delivered against its own promises.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: Keep only the fulfilments currently in this state.
          schema:
            $ref: '#/components/schemas/FulfilmentStatus'
        - name: authorizationId
          in: query
          description: Keep only the fulfilments recorded against this authorization.
          schema:
            type: string
            format: uuid
        - name: providerProfileId
          in: query
          description: Keep only the fulfilments delivered by this provider.
          schema:
            type: string
            format: uuid
        - name: performedFrom
          in: query
          description: Keep only the fulfilments performed at or after this instant.
          schema:
            type: string
            format: date-time
        - name: performedTo
          in: query
          description: Keep only the fulfilments performed at or before this instant.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Fulfilment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfilmentPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Authorizations]
      operationId: createFulfilment
      description: |
        Records what is being delivered against an authorization. Nothing is consumed yet:
        recording says a service happened, completing says the entitlement was spent on it,
        and keeping them apart is what lets a mistaken record be cancelled without a ledger
        reversal.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFulfilment'
      responses:
        '201':
          description: Fulfilment recorded
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfilment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/fulfilments/{fulfilmentId}:
    get:
      tags: [Authorizations]
      operationId: getFulfilment
      description: One fulfilment with the lines it delivered.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/FulfilmentId'
      responses:
        '200':
          description: Fulfilment detail
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfilment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/fulfilments/{fulfilmentId}/complete:
    post:
      tags: [Authorizations]
      operationId: completeFulfilment
      description: |
        Consumes the entitlement the recorded lines actually used, item by item, from the
        hold each authorization line took. Consuming more than was approved is refused with
        422 OVER_FULFILMENT; consuming less leaves the remainder reserved until the
        authorization expires or is cancelled, because a member who was promised six
        sessions and had four still holds the other two.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/FulfilmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Fulfilment completed and the entitlement consumed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfilment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/fulfilments/{fulfilmentId}/cancel:
    post:
      tags: [Authorizations]
      operationId: cancelFulfilment
      description: |
        Withdraws a fulfilment that was recorded but never completed, with a reason. A
        completed fulfilment has already consumed from the ledger and is answered 409: the
        ledger is append-only and undoing a movement is a reversal, not a status change.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/FulfilmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Fulfilment cancelled
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfilment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/work-queues:
    get:
      tags: [Worklist]
      operationId: listWorkQueues
      description: |
        The work queues of the tenant, newest first, with keyset paging. An actor granted
        particular queues sees only those: a queue outside the grant is not on the page and
        is not reachable by id either.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: domainCode
          in: query
          description: Keep only the queues of one business domain.
          schema:
            $ref: '#/components/schemas/WorkQueueDomain'
        - name: active
          in: query
          description: Keep only the active, or only the retired, queues.
          schema:
            type: boolean
      responses:
        '200':
          description: Work queue page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkQueuePage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Worklist]
      operationId: createWorkQueue
      description: |
        Defines a place work waits and the clock it waits against. slaMinutes is copied onto
        every item raised into the queue from that moment on; changing it later moves no
        item that already exists, because the clock an item was given is the clock it is
        judged by.

        escalationQueueId names where overdue work goes. A queue that names none has its
        overdue items marked ESCALATED where they stand, which is what puts them on a report
        rather than leaving them late in a queue nobody watches.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkQueue'
      responses:
        '201':
          description: Work queue created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkQueue'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/work-queues/{queueId}:
    patch:
      tags: [Worklist]
      operationId: patchWorkQueue
      description: |
        Merge-patch of the name, the assignment policy, the SLA, the escalation target and
        activity. The code and the domain are immutable: they are what other rows already
        point at, and changing them in place would silently repoint them.

        Changing slaMinutes changes what items raised from now on are given and nothing
        else. The items already in the queue keep the clock they were given.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/WorkQueueId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PatchWorkQueue'
      responses:
        '200':
          description: Work queue updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkQueue'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/work-items:
    get:
      tags: [Worklist]
      operationId: listWorkItems
      description: |
        The morning list: what is waiting, what is mine, what is late. Every filter is
        optional and they combine with AND. assignedToMe is resolved against the calling
        actor rather than taking an actor id, so somebody else's list is not a question this
        endpoint can be made to answer.

        overdue is answered from the item's own due date, never from its queue's SLA today:
        an item is late by the clock it was given.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: queueId
          in: query
          description: Keep only the items waiting in this queue.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Keep only the items currently in this state.
          schema:
            $ref: '#/components/schemas/WorkItemStatus'
        - name: assignedToMe
          in: query
          description: Keep only the items the calling actor holds.
          schema:
            type: boolean
        - name: overdue
          in: query
          description: Keep only the items past their due date, or only those still within it.
          schema:
            type: boolean
        - name: aggregateType
          in: query
          description: Keep only the items raised over one kind of record.
          schema:
            type: string
            minLength: 2
            maxLength: 64
        - name: aggregateId
          in: query
          description: Keep only the items raised over one record.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Work item page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/work-items/{workItemId}:
    get:
      tags: [Worklist]
      operationId: getWorkItem
      description: |
        One work item, with the clock it was given and whoever holds it. A caller outside
        the queue grant is answered 404 rather than 403.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/WorkItemId'
      responses:
        '200':
          description: Work item detail
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/work-items/{workItemId}/claim:
    post:
      tags: [Worklist]
      operationId: claimWorkItem
      description: |
        Takes one piece of work. The claim is one conditional update on the item, the status
        and the version in If-Match, so two people racing on the same item cannot both win
        and the loser is never a partial write.

        The loser is answered 409 WORK_ITEM_ALREADY_CLAIMED, and the problem detail names
        the actor who won: telling somebody the item is taken without saying by whom is what
        makes two people keep clicking. A stale If-Match on an item nobody has taken is 412
        instead, because nobody won and there is nobody to name.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Work item claimed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/work-items/{workItemId}/release:
    post:
      tags: [Worklist]
      operationId: releaseWorkItem
      description: |
        Puts a piece of work back in its queue. Only the person holding it may put it down;
        taking work off somebody else is reassignment, which needs worklist.reassign. The
        due date is untouched: putting work down does not buy more time to do it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseWorkItem'
      responses:
        '200':
          description: Work item released
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/work-items/{workItemId}/reassign:
    post:
      tags: [Worklist]
      operationId: reassignWorkItem
      description: |
        Gives a piece of work to somebody else, whether or not anybody held it. The person
        it was taken from is recorded in the item's status event: why this is no longer mine
        is a question somebody will ask, and the item itself no longer knows the answer.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignWorkItem'
      responses:
        '200':
          description: Work item reassigned
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/work-items/{workItemId}/complete:
    post:
      tags: [Worklist]
      operationId: completeWorkItem
      description: |
        Finishes a piece of work with what it decided. Only the person holding it may finish
        it: an outcome recorded by somebody who never had the item is an outcome nobody can
        be asked about. outcomeCode is required, because saying an item was closed is not an
        answer to what was decided.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteWorkItem'
      responses:
        '200':
          description: Work item completed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/work-items/{workItemId}/comments:
    get:
      tags: [Worklist]
      operationId: listWorkItemComments
      description: |
        The comments of one work item, oldest first: a conversation read in the order it
        happened. The visibility filter narrows the list to one audience, so a
        provider-facing screen asks for PROVIDER comments and is not handed the internal
        ones by accident.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/WorkItemId'
        - name: visibility
          in: query
          description: Keep only the comments written for these audiences.
          schema:
            type: array
            maxItems: 3
            items:
              $ref: '#/components/schemas/CommentVisibility'
      responses:
        '200':
          description: Comments of the work item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemCommentList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Worklist]
      operationId: addWorkItemComment
      description: |
        Records what somebody said about a piece of work, and who it was said to. Comments
        are append-only: one that could be edited after the decision it influenced is not a
        record of why the decision was made.

        The visibility is stored, not interpreted. A comment a provider or a member can read
        may not carry clinical detail; that is a rule about content which the health module
        enforces, and this is where the audience it will be judged against is recorded.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWorkItemComment'
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemComment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/approval-policies:
    get:
      tags: [Worklist]
      operationId: listApprovalPolicies
      description: |
        Which roles may approve which action, and how many of them each amount band needs.
        The list is short and complete rather than paged: a policy set is read as a whole,
        and half of one answers nothing.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: actionCode
          in: query
          description: Keep only the policies of one action.
          schema:
            type: string
            minLength: 2
            maxLength: 80
        - name: scopeCode
          in: query
          description: Keep only the policies of one scope.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: Approval policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPolicyList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Worklist]
      operationId: putApprovalPolicies
      description: |
        Replaces the whole policy set of one action, in one transaction. It is a replace
        rather than a merge because the set is read as a whole: a merge would leave behind a
        band the caller believed it had removed, and the amount it covers would keep being
        approved by the rule nobody meant to keep.

        Two policies for the same action and scope may not cover the same day; the request
        is refused with 409 rather than leaving the question of how many approvals an amount
        needs with two answers. Both amounts are exact decimal strings, never JSON numbers.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutApprovalPolicies'
      responses:
        '200':
          description: Approval policy set written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPolicyList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      description: |
        The tenant's documents, newest first, with keyset paging. A provider-scoped actor
        sees the documents its own organizations own plus the tenant's own, and one
        belonging to another provider is not on the page and is not reachable by id either.

        The page carries scan status, so a client can show "taranıyor" rather than a broken
        download: a document is only ever downloadable once its status is CLEAN.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: scanStatus
          in: query
          description: Keep only the documents in one scan state.
          schema:
            $ref: '#/components/schemas/DocumentScanStatus'
        - name: classification
          in: query
          description: Keep only the documents of one confidentiality class.
          schema:
            $ref: '#/components/schemas/DocumentClassification'
        - name: aggregateType
          in: query
          description: Keep only the documents linked to records of this type.
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        - name: aggregateId
          in: query
          description: With aggregateType, keep only the documents linked to that one record.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Documents]
      operationId: createUpload
      description: |
        Reserves a document and answers a short-lived presigned PUT into the quarantine
        bucket. The API never carries a file body: the client uploads straight to the URL
        returned here, and only then calls completeUpload.

        The declared byteSize and contentType are signed into the URL, so they are the
        actual limit rather than a hint — the object store refuses a body of any other size.

        sha256 is optional. When it is given and those exact bytes are already stored clean
        and visible to the caller, nothing is uploaded at all: the response carries the
        document that already exists and no upload URL. That is what stops the same file
        being stored twice, and a member re-uploading a document being counted as a new one.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpload'
      responses:
        '201':
          description: |
            Document reserved. `upload` is null when the same bytes were already stored, in
            which case the document is the one that already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUpload'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: The object store could not issue an upload URL
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/documents/{documentId}:
    get:
      tags: [Documents]
      operationId: getDocument
      description: |
        One document with the records it is linked to. It never carries the file: a document
        is read here and fetched through downloadDocument.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/documents/{documentId}/complete:
    post:
      tags: [Documents]
      operationId: completeUpload
      description: |
        Records what the client uploaded and queues the malware scan. The document moves to
        SCANNING and stays unreadable until a scanner has looked at every byte of it.

        Neither the size nor the digest is trusted: the worker counts and hashes the bytes
        itself while streaming them to the scanner, and it is that digest the document is
        finally stored under. They are recorded because a claim that later disagrees with
        the file is itself worth knowing about.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUpload'
      responses:
        '200':
          description: Upload recorded and the scan queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: The object store could not be reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/documents/{documentId}/download:
    post:
      tags: [Documents]
      operationId: downloadDocument
      description: |
        Answers a short-lived presigned GET into the secure bucket, and only for a document
        whose scan came back CLEAN. Anything else is a 409: a file that has not been scanned,
        whose scan failed, or that the scanner named something in has no download URL at all.

        Every call writes an audit access event carrying the document's classification and
        the reason it was opened, so it is a POST rather than a GET: it mints a bearer URL
        and records an access, neither of which may be cached or replayed by an intermediary.

        A link may name a permission of its own — a clinical attachment names
        health.clinical.read — and a caller who may read documents in general but not that
        one is refused with 403.

        It carries no Idempotency-Key. Every call mints a new short-lived URL and records a
        new access, which is exactly what a retry should do; replaying the first response
        would hand the caller a URL that has since expired.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadDocument'
      responses:
        '200':
          description: Short-lived download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDownload'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The document is not scanned clean, or its bytes have been purged
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: The object store could not issue a download URL
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/documents/{documentId}/links:
    post:
      tags: [Documents]
      operationId: linkDocument
      description: |
        Attaches a document to a record: this is the invoice, that is the referral. The same
        document may be linked to several records, which is what stops the same file being
        uploaded once per place it is needed.

        requiredPermission narrows who may download through the link. Every link on a
        document is checked, so attaching a file to a clinical record makes it clinical
        everywhere rather than only when reached from that record.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentLink'
      responses:
        '201':
          description: Document linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLink'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/documents/{documentId}/links/{linkId}:
    delete:
      tags: [Documents]
      operationId: unlinkDocument
      description: |
        Removes one link. The document itself is untouched: a file that is no longer this
        request's invoice is still a file somebody uploaded, and it may still belong to
        other records.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/DocumentLinkId'
      responses:
        '204':
          description: Link removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/legal-holds:
    post:
      tags: [Documents]
      operationId: putLegalHold
      description: |
        Places a legal hold on a document, a person or a record. From that moment nothing
        deletes what it covers: the retention sweep skips every held document and reports how
        many it left alone.

        One of objectId, personId or the aggregateType/aggregateId pair is required. A hold
        that named nothing would look like protection and protect nothing.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLegalHold'
      responses:
        '201':
          description: Legal hold placed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHold'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/legal-holds/{legalHoldId}/release:
    post:
      tags: [Documents]
      operationId: releaseLegalHold
      description: |
        Lifts a hold, after which retention may act on what it covered again. Who lifted it
        and when are both recorded: a hold that could be released anonymously would be no
        protection at all.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/LegalHoldId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Legal hold released
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHold'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/notification-templates:
    get:
      tags: [Notifications]
      operationId: listNotificationTemplates
      description: |
        The tenant's message templates, newest first, with keyset paging. A template is a
        version: publishing one retires the version it replaces, and every version stays on
        this list so the message somebody was sent last month can still be read next to the
        template that produced it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: eventCode
          in: query
          description: Keep only the templates of one domain event.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,4}$'
        - name: channel
          in: query
          description: Keep only the templates of one channel.
          schema:
            $ref: '#/components/schemas/NotificationChannel'
        - name: locale
          in: query
          description: Keep only the templates of one language.
          schema:
            type: string
            pattern: '^[a-z]{2}(-[A-Z]{2})?$'
        - name: status
          in: query
          description: Keep only the drafts, the published ones or the retired ones.
          schema:
            $ref: '#/components/schemas/NotificationTemplateStatus'
      responses:
        '200':
          description: Template page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplatePage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Notifications]
      operationId: createNotificationTemplate
      description: |
        Writes a draft. Nothing renders from a draft: the send path reads the published
        template for an event, channel and language, and there is at most one, so a
        half-written message cannot reach anybody while it is being written.

        `declaredVariables` is the closed list the renderer works from and it may only name
        variables from the safe catalogue. That catalogue is the whole of what a
        notification may carry — a given name, a reference number, a status word, a date, an
        amount with its currency, a provider or program name, and a link into the product —
        and there is deliberately no slot in it for a diagnosis, an identity number or
        anything an operator typed into a comment.

        The list and the placeholders the body actually uses must be the same set. A
        declared variable the body never mentions is a value every caller has to supply for
        nothing; a placeholder nobody declared is a hole in the message.

        The version number is not a field: it is computed from the versions that already
        exist for this event, channel and language.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationTemplate'
      responses:
        '201':
          description: Draft template written
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/notification-templates/{templateId}:
    get:
      tags: [Notifications]
      operationId: getNotificationTemplate
      description: |
        One template version with its body and its declared variables.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/NotificationTemplateId'
      responses:
        '200':
          description: Template
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/notification-templates/{templateId}/publish:
    post:
      tags: [Notifications]
      operationId: publishNotificationTemplate
      description: |
        Makes this draft the template that renders its event from now on, and retires the
        version it replaces in the same transaction.

        Publishing retires rather than refuses. Refusing until somebody retired the old one
        would leave the event with no published template for however long the two commands
        are apart, and a message that arrived in that gap would be suppressed for want of
        one. Replacing in one transaction has no such gap: a message rendered a microsecond
        either side finds exactly one template, the older one before and the newer one
        after.

        A published template is immutable. The retired version keeps everything it said,
        and the messages it produced name it by id and version and carry their own rendered
        text, so retiring it changes nothing about what anybody was told.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/NotificationTemplateId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Template published and the version it replaced retired
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/notification-messages:
    get:
      tags: [Notifications]
      operationId: listNotificationMessages
      description: |
        What was actually sent, to whom, newest first, with keyset paging.

        Suppressed messages are on this list like any other, which is the point of it. A
        member who was not told — because they turned this off, because it was the middle of
        their night, because nobody has written a template for the event, or because the
        platform holds no address for them — has a row saying so and naming the reason. An
        operator asked "was the member told" can answer it either way.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: eventCode
          in: query
          description: Keep only the messages of one domain event.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,4}$'
        - name: channel
          in: query
          description: Keep only the messages of one channel.
          schema:
            $ref: '#/components/schemas/NotificationChannel'
        - name: status
          in: query
          description: Keep only the messages in one state.
          schema:
            $ref: '#/components/schemas/NotificationMessageStatus'
        - name: recipientType
          in: query
          description: With recipientId, keep only the messages sent to one recipient.
          schema:
            $ref: '#/components/schemas/NotificationRecipientType'
        - name: recipientId
          in: query
          description: With recipientType, keep only the messages sent to one recipient.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Message page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMessagePage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/notification-messages/{messageId}:
    get:
      tags: [Notifications]
      operationId: getNotificationMessage
      description: |
        One message with every attempt made on it. The attempts travel with it because a
        status alone does not answer the question: a message that says SENT after two
        failures and one that went first time are the same status and different stories.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/NotificationMessageId'
      responses:
        '200':
          description: Message with its delivery attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMessageDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/notification-messages/{messageId}/resend:
    post:
      tags: [Notifications]
      operationId: resendNotificationMessage
      description: |
        Sends what one message said, again.

        It writes a new message rather than re-queuing the old one. The original is evidence
        of what happened — it went out at this time, it failed twice, it was refused — and
        re-queuing it would overwrite that story with the new one. The copy carries the same
        rendered text and names the message it came from, so the log shows both halves.

        A message with no rendered body cannot be resent: it was suppressed before anything
        was written, so there is nothing to send. Neither is a recipient who has turned this
        notification off — an operator clicking a button must not override somebody's own
        answer to "do you want to hear about this". Quiet hours are deliberately not
        re-checked: an operator resending has already decided about the timing.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/NotificationMessageId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: A new message carrying the same text, queued for its channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMessage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/notification-preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      description: |
        What one recipient has said about being told things: which channels are on, and the
        hours they would rather not hear from anybody. An empty list means nobody has said
        anything, which is not the same as everything being off — a transactional
        notification about somebody's own benefit is sent unless they asked otherwise.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: recipientType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/NotificationRecipientType'
        - name: recipientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The recipient's notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferenceList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Notifications]
      operationId: putNotificationPreferences
      description: |
        Replaces the whole preference set of one recipient, in one transaction. It is a
        replace rather than a merge because the set is read as a whole: a merge would leave
        behind a channel the person believed they had turned off, and they would keep being
        written to on it.

        eventCode absent means "every event on this channel", which is how somebody turns a
        channel off once instead of once per event. A row that names the event wins over the
        row that names none, so "no e-mail except this one" is expressible.

        Quiet hours are a pair or are absent, and they are read in timezone rather than the
        server's: a member in Berlin and one in Istanbul do not share a night. A message
        that arrives inside the window is not delayed — it is suppressed with the reason,
        and the log shows the member was not told and why.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutNotificationPreferences'
      responses:
        '200':
          description: Preference set written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferenceList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/health-cases:
    get:
      tags: [Clinical]
      operationId: listHealthCases
      description: |
        The tenant's health cases, newest first, with keyset paging.

        Every row on the page is served in one of two projections, decided by what the
        caller holds and applied before the record is serialised — never by a screen
        dropping fields. A caller holding health.clinical.read sees the clinical projection:
        everything, including each encounter's branch code and clinical notes. A caller
        holding only health.case.read sees the financial projection: identity, type, dates,
        provider and status, and nothing from which a diagnosis could be inferred — no
        branch code, no clinical notes, no sensitivity, no diagnosis count. `projection`
        says which one was served, so a screen can say "you may not see clinical detail"
        rather than silently show half a record.

        A SENSITIVE case is served in the clinical projection only to a caller who also
        holds health.sensitive.read and states a purpose in X-Access-Purpose; without either
        it appears in the financial projection like any other case, because its sensitivity
        is itself sensitive. A list never answers 428 — a single read does.

        Each row served in the clinical projection writes an audit.access_event with
        data_classification HEALTH and access_type SEARCH. The financial projection writes
        none: it carries nothing clinical.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: personId
          in: query
          description: Keep only the cases of one member.
          schema:
            type: string
            format: uuid
        - name: programId
          in: query
          schema:
            type: string
            format: uuid
        - name: providerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/HealthCaseStatus'
        - name: caseType
          in: query
          schema:
            $ref: '#/components/schemas/HealthCaseType'
        - name: openedFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: openedTo
          in: query
          description: Exclusive upper bound.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Health case page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCasePage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Clinical]
      operationId: createHealthCase
      description: |
        Opens a case for a member, either from a service request of type DIRECT_SERVICE or
        PREAUTHORIZATION or standalone by a provider. The enrollment has to belong to the
        person and the program named, which is checked rather than trusted.

        A new case is always STANDARD: sensitivity is derived from the diagnoses recorded
        against its encounters and is never sent by a caller. A caller that could set it
        could clear it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHealthCase'
      responses:
        '201':
          description: Case opened
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCase'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/health-cases/{caseId}:
    get:
      tags: [Clinical]
      operationId: getHealthCase
      description: |
        One case with its encounters, in the projection the caller has earned.

        This is the read that demands a purpose. A SENSITIVE case read by a caller holding
        health.clinical.read and health.sensitive.read but sending no X-Access-Purpose is
        answered 428 ACCESS_PURPOSE_REQUIRED and the refusal is recorded as a DENIED access
        event: "who tried" is as much a part of the record as "who looked". A caller holding
        clinical read but not the sensitive grant is served the financial projection instead
        of being refused, because a refusal would itself say the case is sensitive.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
      responses:
        '200':
          description: Health case
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCase'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: |
            The case is sensitive and the caller stated no access purpose. Send
            X-Access-Purpose with a code from the clinical access purpose reference.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/health-cases/{caseId}/close:
    post:
      tags: [Clinical]
      operationId: closeHealthCase
      description: |
        Closes a case. Every encounter has to have ended and no inpatient stay may still be
        open: a case closed over an open encounter is a case nobody can bill and a member
        nobody can account for.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseHealthCase'
      responses:
        '200':
          description: Case closed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCase'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: The case changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/health-cases/{caseId}/encounters:
    post:
      tags: [Clinical]
      operationId: createEncounter
      description: |
        Records one contact inside a case: when it started, where, with whom, and the
        clinical notes if there are any.

        notesClinical is the one free-text clinical field in this module. It is classified
        HEALTH and is never returned to a caller without health.clinical.read, which is why
        writing one needs that grant as well: a caller who may not read clinical detail has
        no business writing it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEncounter'
      responses:
        '201':
          description: Encounter recorded
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encounter'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/encounters/{encounterId}:
    get:
      tags: [Clinical]
      operationId: getEncounter
      description: |
        One encounter, in the projection the caller has earned. The financial projection
        carries its dates, location and practitioner and neither its branch code nor its
        clinical notes.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/EncounterId'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
      responses:
        '200':
          description: Encounter
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encounter'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: The encounter belongs to a sensitive case and no purpose was stated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/encounters/{encounterId}/diagnoses:
    get:
      tags: [Clinical]
      operationId: listEncounterDiagnoses
      description: |
        The encounter's diagnoses, primary first.

        A caller holding health.case.read but not health.clinical.read is answered 403
        CLINICAL_READ_REQUIRED rather than an empty list. That is the whole point of the
        endpoint's shape: an empty list would tell the caller the encounter has no
        diagnosis, which is a clinical fact it may not have.

        A caller holding clinical read whose case is sensitive and who does not hold
        health.sensitive.read gets the same 403 for the same reason: a refusal that named
        sensitivity would say the case carries a psychiatric, genetic or reproductive health
        category, which is exactly the fact being protected.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/EncounterId'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
      responses:
        '200':
          description: Diagnoses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisList'
        '403':
          description: |
            The caller does not hold the clinical read this endpoint requires. It is never
            an empty list, because an empty list is itself an answer about the patient.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: The encounter belongs to a sensitive case and no purpose was stated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags: [Clinical]
      operationId: putEncounterDiagnoses
      description: |
        Replaces the encounter's diagnoses as a whole: the set is the unit, and a diagnosis
        id is not something anything else hangs off. A second PRIMARY is refused with 422 —
        every downstream rule asks "what was this for" and expects one answer.

        `sensitive` is not accepted from the caller. It is read from each code value's own
        category in the catalogue, and the case's sensitivity is recomputed from the
        diagnoses that were actually stored.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/EncounterId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutEncounterDiagnoses'
      responses:
        '200':
          description: The stored diagnosis set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisList'
        '403':
          description: The caller does not hold the clinical read writing a diagnosis requires
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/health-access-log:
    get:
      tags: [Clinical]
      operationId: listHealthAccessLog
      description: |
        Who looked at a person's clinical data, when, and why. This is the member's own
        right to know, answered from audit.access_event rather than from anything this
        module keeps for itself.

        It carries only HEALTH-classified reads, and the financial projection is deliberately
        absent from it: a read that saw no clinical detail is not a clinical access. A
        refused sensitive read is present, with outcome DENIED.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: personId
          in: query
          description: The member whose clinical data the log is about.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Access log page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthAccessLogPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/medical-reports:
    get:
      tags: [Clinical]
      operationId: listMedicalReports
      description: |
        The tenant's treatment reports, newest first, with keyset paging.

        Every row is served in one of the two projections of WP-I5-01, decided by what the
        caller holds and applied before the record is serialised. The clinical projection is
        everything: the report type and subtype, the clinical summary, the reviewer's comment,
        the line notes and the attachments. The financial projection is what a financial
        reviewer needs to reconcile a claim against a report — the reference, the version, the
        dates, the provider, the status and the covered services with their limits — and
        nothing that says what was wrong with the person.

        A report attached to a SENSITIVE case follows the same rule its case does: without
        health.sensitive.read it appears in the financial projection like any other, because
        its sensitivity is itself sensitive. A list never answers 428 — a single read does.

        `rootReportId` pages the versions of one chain: every version of a report shares its
        root, and this is how a screen shows "version 2 of 2" beside a decision.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: personId
          in: query
          description: Keep only the reports of one member.
          schema:
            type: string
            format: uuid
        - name: caseId
          in: query
          schema:
            type: string
            format: uuid
        - name: rootReportId
          in: query
          description: Every version of one report chain.
          schema:
            type: string
            format: uuid
        - name: providerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MedicalReportStatus'
        - name: reportType
          in: query
          description: |
            The report type code. It is a clinical value, so filtering by it is possible for
            a caller that already holds the clinical read and returns nothing new to one that
            does not: the rows it selects are still served in the financial projection.
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_.-]{0,63}$'
        - name: validOn
          in: query
          description: Keep only the reports whose validity covers this day, both bounds inclusive.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Medical report page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReportPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Clinical]
      operationId: createMedicalReport
      description: |
        Writes a draft report, either the first version of a new chain or a correction of a
        decided one.

        With `supersedesReportId` it is a correction: the new report is version n+1 of the
        same chain, it inherits the reference — so a member quoting "MR-2026…" is still
        quoting the same report — and the service lines of the version it corrects are copied
        into it. Every header field it does not send is inherited too. The version being
        corrected is not touched: it keeps its decision, its lines and its usage rows exactly
        as they were, and it stays readable.

        Only a decided version (APPROVED, REJECTED or one a later version already replaced)
        may be corrected, and only the newest version of its chain. A draft is corrected by
        editing it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMedicalReport'
      responses:
        '201':
          description: Draft report created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/medical-reports/{reportId}:
    get:
      tags: [Clinical]
      operationId: getMedicalReport
      description: |
        One report with its service lines and, in the clinical projection, its attachments.

        This is the read that demands a purpose. A report on a SENSITIVE case read by a caller
        holding health.clinical.read and health.sensitive.read but sending no X-Access-Purpose
        is answered 428 ACCESS_PURPOSE_REQUIRED, and the refusal is recorded as a DENIED
        access event with resource type MEDICAL_REPORT.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
      responses:
        '200':
          description: Medical report
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: |
            The report belongs to a sensitive case and the caller stated no access purpose.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags: [Clinical]
      operationId: patchMedicalReportDraft
      description: |
        Rewrites a draft's header. Every field is sent every time: a merge would make
        "clear the subtype" unexpressible.

        A report that has left DRAFT answers 409 MEDICAL_REPORT_IMMUTABLE. That is the whole
        point of the package: an approved report is what the reviewer saw and a claim is
        leaning on it, and a rejected one is what the provider was told about. A correction is
        `createMedicalReport` with `supersedesReportId`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMedicalReportDraft'
      responses:
        '200':
          description: Draft updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The report has left DRAFT and is frozen. MEDICAL_REPORT_IMMUTABLE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The report changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/medical-reports/{reportId}/services:
    put:
      tags: [Clinical]
      operationId: putMedicalReportServices
      description: |
        Replaces the report's service set as a whole: the set is the unit, and a line id is
        not something anything else hangs off. An empty array clears the set.

        A report that has left DRAFT answers 409 MEDICAL_REPORT_IMMUTABLE here for the same
        reason the header patch does — the lines are what the report says, and rewriting them
        would rewrite an approved report without touching its header.

        Replacing the lines moves the report's ETag: a caller still holding the old one is
        holding a report that no longer says what it said.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutMedicalReportServices'
      responses:
        '200':
          description: The stored service set
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The report has left DRAFT and is frozen. MEDICAL_REPORT_IMMUTABLE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The report changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/medical-reports/{reportId}/submit:
    post:
      tags: [Clinical]
      operationId: submitMedicalReport
      description: |
        Hands the draft to the medical reviewers and raises a work item in the MEDICAL_REVIEW
        queue, in the same transaction, with the report's reference as the title and no
        clinical word in it.

        Two things refuse it. A report with no service line is 422
        MEDICAL_REPORT_SERVICE_REQUIRED: a reviewer asked to approve nothing in particular.
        A report with no linked document of its own type that the scanner has cleared is 422
        MEDICAL_REPORT_DOCUMENT_REQUIRED: a link to an object still in quarantine is not a
        document a reviewer can open. Attach the file through the document link endpoint with
        aggregateType MEDICAL_REPORT.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Report submitted
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: The report changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/medical-reports/{reportId}/start-review:
    post:
      tags: [Clinical]
      operationId: startMedicalReview
      description: |
        A reviewer has picked the report up. The worklist raises the same transition when the
        report's work item is claimed, so a reviewer who works from the queue never has to
        give this command at all.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Review started
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: The report changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/medical-reports/{reportId}/approve:
    post:
      tags: [Clinical]
      operationId: approveMedicalReport
      description: |
        The decision claims and authorizations lean on.

        If the report is a correction, the version it corrects leaves APPROVED in the same
        transaction, so the chain has exactly one approved version at every moment a reader
        could observe. Nothing else about the older version moves: the reviewer, the moment,
        the comment, the summary, the lines and the usage rows stay exactly as they were
        decided.

        The decision publishes medical_report.decided to the member and the issuing provider.
        The message carries a reference, a status word, a day and a link — never the comment,
        the report type or anything else clinical.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideMedicalReport'
      responses:
        '200':
          description: Report approved
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: The report changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/medical-reports/{reportId}/reject:
    post:
      tags: [Clinical]
      operationId: rejectMedicalReport
      description: |
        The other half of the same decision, and it says why in a code: a rejection nobody can
        count is a rejection nobody can improve on. The comment is optional, is clinical text
        and is served only in the clinical projection.

        A rejected report is frozen like an approved one. A corrected version is
        `createMedicalReport` with `supersedesReportId`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectMedicalReport'
      responses:
        '200':
          description: Report rejected
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: The report changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/medical-reports/{reportId}/cancel:
    post:
      tags: [Clinical]
      operationId: cancelMedicalReport
      description: |
        Takes back a report nobody has started reading. Once a reviewer has picked it up it is
        theirs to decide, and a withdrawal at that point would be the provider deciding
        instead: an UNDER_REVIEW report answers 409.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Report cancelled
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: The report changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/medical-reports/{reportId}/usages:
    get:
      tags: [Clinical]
      operationId: listMedicalReportUsages
      description: |
        Which service request, authorization or claim leaned on this version of the report,
        and when. It is the trace v1.2 10.5 step 6 asks for: the answer to "prove the claim
        you settled was covered by a report a doctor signed".

        It names the version rather than the chain. A claim settled against version 1 was
        settled against version 1, whatever version 3 later says, and the usage rows of a
        superseded version are deliberately left where they are.

        A usage row is three ids and a moment and carries nothing clinical, so it is served
        whole to anybody who may read the report.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Usage page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalReportUsagePage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/inpatient-stays:
    get:
      tags: [Clinical]
      operationId: listInpatientStays
      description: |
        Admissions, newest first. Each row is served in the projection the caller has earned:
        a caller without `health.clinical.read`, or one reading a sensitive case without
        `health.sensitive.read`, gets the financial half — every date, every figure of the
        reconciliation and every segment, and no `admissionDiagnosisId` and no extension
        reason text.

        A list never answers 428. Refusing the whole page over one sensitive row would make it
        useless, and refusing that one row would say which row is sensitive.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
        - name: caseId
          in: query
          schema:
            type: string
            format: uuid
        - name: personId
          in: query
          schema:
            type: string
            format: uuid
        - name: providerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InpatientStayStatus'
        - name: admittedFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: admittedTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Inpatient stay page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InpatientStayPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Clinical]
      operationId: createInpatientStay
      description: |
        Asks for an admission. One transaction does all of it: the admission date is checked
        against the tenant's backdating and future-dating window
        (`health.inpatient.backdate_days` / `health.inpatient.future_days`, defaulting to 3
        and 30), a PREAUTHORIZATION service request is raised for `estimatedDays` of the
        tenant's inpatient admission service and put straight through the request gate, and
        the stay is written REQUESTED.

        The stay is not authorized here and cannot be. A medical reviewer decides the request
        on the request page, where they decide every request, and the stay follows: it becomes
        AUTHORIZED with an authorization attached, or REJECTED with none. The reviewer never
        learns that a stay exists.

        Refusals worth knowing about:

        * `422 ADMISSION_DATE_OUT_OF_WINDOW` — the admission is dated outside the window.
        * `409 INPATIENT_STAY_ALREADY_OPEN` — this case already has a REQUESTED, AUTHORIZED or
          ADMITTED stay at this provider. It is a partial unique index rather than a check the
          service makes first, so two callers arriving together are refused by the database
          and exactly one stay exists afterwards.
        * `422 INPATIENT_ADMISSION_SERVICE_UNKNOWN` — the tenant's catalogue has no active
          `INPATIENT_DAY` definition, so there is nothing to book the days against.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInpatientStay'
      responses:
        '201':
          description: Stay requested
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InpatientStay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The case already has an open stay at this provider. INPATIENT_STAY_ALREADY_OPEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/inpatient-stays/{stayId}:
    get:
      tags: [Clinical]
      operationId: getInpatientStay
      description: |
        One admission with its extensions and its segments.

        This is the read that demands a purpose. A stay on a SENSITIVE case read by a caller
        holding `health.clinical.read` and `health.sensitive.read` but sending no
        `X-Access-Purpose` is answered 428 ACCESS_PURPOSE_REQUIRED, and the refusal is
        recorded as a DENIED access event with resource type `inpatient_stay`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/StayId'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
      responses:
        '200':
          description: Inpatient stay
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InpatientStay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: |
            The stay belongs to a sensitive case and the caller stated no access purpose.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/inpatient-stays/{stayId}/extensions:
    post:
      tags: [Clinical]
      operationId: extendInpatientStay
      description: |
        Asks for more days on an admission somebody has already approved. It raises the
        extension's own PREAUTHORIZATION request, which the same reviewer decides on the same
        page; on approval the added days are reserved by the extension's own authorization and
        the admission's authorization has its validity moved forward.

        Two refusals, both of them the point of the operation:

        * `409 INPATIENT_STAY_TRANSITION_INVALID` — the stay is not AUTHORIZED or ADMITTED.
          Extending something nobody has decided is asking for more of nothing.
        * `409 STAY_EXTENSION_PENDING` — an earlier extension has not been decided. It is a
          partial unique index as well as a check, so two callers racing each other are
          refused by the database.

        `reasonText` is clinical. It is stored, served only in the clinical projection, and
        never carried by a notification, an audit detail or a work item title.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/StayId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendInpatientStay'
      responses:
        '200':
          description: Extension requested
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InpatientStay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The stay cannot be extended now, or an earlier extension is undecided.
            INPATIENT_STAY_TRANSITION_INVALID, STAY_EXTENSION_PENDING.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: If-Match did not match
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/inpatient-stays/{stayId}/segments:
    put:
      tags: [Clinical]
      operationId: putStaySegments
      description: |
        Replaces the stay's whole segment set: where the patient was, hour by hour. The set is
        the unit, because a segment id is not something anything else hangs off. An empty
        array clears it.

        Two segments of the same stay may not claim the same hours, and that is an exclusion
        constraint over a half-open time range rather than only a check in the service. The
        range being half-open is what makes a ward segment ending at 14:00 and an intensive
        care segment beginning at 14:00 a transfer rather than an overlap.

        COMPANION is outside the constraint. The relative sleeping in the room overlaps the
        patient's own segment by definition, and a rule that forbade it would make the true
        record unrecordable.

        Recording where somebody actually is *is* the admission: the first set on an
        AUTHORIZED stay moves it to ADMITTED. There is no separate admit command.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/StayId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutStaySegments'
      responses:
        '200':
          description: Segments replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InpatientStay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Two segments claim the same hours, or the stay is not in a state that has
            segments. STAY_SEGMENT_OVERLAP, INPATIENT_STAY_TRANSITION_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: If-Match did not match
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/inpatient-stays/{stayId}/discharge:
    post:
      tags: [Clinical]
      operationId: dischargeInpatientStay
      description: |
        Ends an admission and settles up, in one transaction.

        The discharge moment is recorded, every segment nobody ended is ended at that moment,
        the actual day count is computed as the elapsed time rounded up to whole days and
        never less than 1, and **the days that were reserved and never used are released** on
        the authorization. A stay that ran over what was approved releases nothing and is
        flagged `overAuthorization`, for the claim to raise as an exception.

        Running it twice releases nothing twice: the update names the two live statuses and
        the row version the caller read, so the second discharge matches no row, and the
        ledger key the release is posted under is derived from the line and the reason rather
        than from a clock.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/StayId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DischargeInpatientStay'
      responses:
        '200':
          description: Stay discharged
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InpatientStay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The stay is not AUTHORIZED or ADMITTED. INPATIENT_STAY_TRANSITION_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: If-Match did not match
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/inpatient-stays/{stayId}/cancel:
    post:
      tags: [Clinical]
      operationId: cancelInpatientStay
      description: |
        Withdraws an admission nobody has finished. Every undecided extension is cancelled
        with it and everything the authorization still holds is released: an admission that
        did not happen has held nothing, and quietly keeping the hold would charge a member
        for a bed they never slept in.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/StayId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInpatientStay'
      responses:
        '200':
          description: Stay cancelled
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InpatientStay'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The stay has already finished. INPATIENT_STAY_TRANSITION_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: If-Match did not match
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/inpatient-stays/{stayId}/reconciliation:
    get:
      tags: [Clinical]
      operationId: getInpatientStayReconciliation
      description: |
        What the discharge settled: the days that were authorized, the days that were actually
        used, the days that were released back to the member's entitlement, and whether the
        admission ran over what anybody approved. Every figure is an exact decimal string.

        It answers only for a discharged stay. A reconciliation is what the settlement was,
        and a stay still running has not settled anything: answering "authorized 5, used
        nothing, released nothing" for somebody currently in a bed would be read as a
        completed settlement by the next thing that consumed it. A live stay is
        `409 INPATIENT_STAY_NOT_DISCHARGED`.

        It carries nothing clinical, so it has no projection: it is the financial half of a
        stay by construction.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/StayId'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
      responses:
        '200':
          description: Reconciliation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayReconciliation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The stay has not been discharged. INPATIENT_STAY_NOT_DISCHARGED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-kapsora_session
      description: |
        Opaque session id. The server stores only its SHA-256 hash and the browser never
        holds a token of any kind. Local HTTP development uses the name kapsora_session
        because the __Host- prefix requires HTTPS.
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.kapsora.example/realms/kapsora/protocol/openid-connect/token
          scopes:
            kapsora.api: Call KAPSORA APIs
  parameters:
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: Selected tenant UUID. It must be one of the actor's active memberships.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key retained for at least 24 hours.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional on query-style POSTs; honoured when present.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when the request is authenticated with the BFF session cookie.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Optimistic concurrency token returned as ETag.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from the previous response.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanVersionId:
      name: planVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: accountId
      in: path
      required: true
