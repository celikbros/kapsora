        rowVersion:
          type: integer
          minimum: 1
    CodeSystemPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CodeSystem'
        nextCursor:
          type: [string, 'null']
    CreateCodeSystemRequest:
      type: object
      additionalProperties: false
      required: [code, name, version, authority, validFrom]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,39}$'
        name:
          type: string
          minLength: 2
          maxLength: 200
        version:
          type: string
          minLength: 1
          maxLength: 32
        authority:
          $ref: '#/components/schemas/CodeSystemAuthority'
        licensed:
          type: boolean
          default: false
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
    UpdateCodeSystemRequest:
      type: object
      additionalProperties: false
