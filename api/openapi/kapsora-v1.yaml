      additionalProperties: false
      required: [type, maskedValue, primary]
      properties:
        type:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
          description: Tenant tarafından tanımlanan identifier type kodu (örn. TCKN, PASSPORT, MEMBER_NO, CUSTOMER_NO).
        maskedValue:
          type: string
        primary:
          type: boolean
    CreatePersonRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date
        sexAtBirth:
          type: string
          enum: [FEMALE, MALE, INTERSEX, UNKNOWN]
        identifiers:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [type, value]
            properties:
              type:
                type: string
                pattern: '^[A-Z][A-Z0-9_]{1,63}$'
                description: Tenant tarafından tanımlanan identifier type kodu.
              value:
                type: string
                minLength: 1
                maxLength: 80
              primary:
                type: boolean
                default: false
    UpdatePersonRequest:
      type: object
      additionalProperties: false
      description: Merge-patch; absent fields stay, null clears where the field is nullable.
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: [string, 'null']
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: [string, 'null']
          format: date
        sexAtBirth:
          type: [string, 'null']
          enum: [FEMALE, MALE, INTERSEX, UNKNOWN, null]
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DECEASED]
        identifiers:
          type: array
          maxItems: 10
          description: Identifiers to add (type + value) or remove (type + remove).
          items:
            type: object
            additionalProperties: false
            required: [type]
            properties:
              type:
                type: string
                pattern: '^[A-Z][A-Z0-9_]{1,63}$'
              value:
                type: string
                minLength: 1
                maxLength: 80
              primary:
                type: boolean
                default: false
              remove:
                type: boolean
                default: false
    IdentifierSearchRequest:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        value:
          type: string
