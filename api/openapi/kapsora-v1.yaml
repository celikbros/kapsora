                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonContact'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
