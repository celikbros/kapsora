          type: integer
          minimum: 1
    PutPaymentTermRequest:
      type: object
      additionalProperties: false
      required: [dueDays, settlementMethod, taxBehaviour]
      properties:
        dueDays:
          type: integer
          minimum: 0
          maximum: 365
        settlementMethod:
          $ref: '#/components/schemas/SettlementMethod'
        taxBehaviour:
          $ref: '#/components/schemas/TaxBehaviour'
        vatRate:
          $ref: '#/components/schemas/DecimalRate'
        lateFeePercent:
          $ref: '#/components/schemas/DecimalRate'
    LodgingPenaltyKind:
      type: string
      enum: [NIGHTS, PERCENT]
      description: |
        What a late cancellation is charged in: a number of nights of the stay, or a
        percentage of the member's own share. Never both -- "3" meaning three nights and
        "3" meaning three percent are two different numbers, and a policy that could mean
        either is a fee nobody can explain to the person paying it.
    LodgingPercent:
      type: string
      description: |
        A percentage between 0 and 100 as an exact decimal string with at most four
        decimals, which is the scale of the numeric(7,4) column behind it. A string and not
        a JSON number because it decides what somebody is charged, and a float would round
        it silently.
      pattern: '^(100(\.0{1,4})?|[0-9]{1,2}(\.[0-9]{1,4})?)$'
      maxLength: 8
    LodgingTermsPolicy:
      type: object
      description: |
        The policy itself: everything a contract version says about a stay that is cut
        short or never begun. It is a schema of its own because two things carry it -- the
        editable terms of the version and the frozen snapshot on a booking -- and one
        definition is what keeps a booking's fee judged by the same fields the contract
        desk typed.
      required: [freeCancellationHoursBefore, penaltyKind, noShowPercent, minNights]
      properties:
        freeCancellationHoursBefore:
          type: integer
          minimum: 0
          maximum: 8760
          description: |
            How many hours before check-in a cancellation is still free. Zero is a policy
            too: the free window closes at check-in.
        penaltyKind:
          $ref: '#/components/schemas/LodgingPenaltyKind'
        penaltyNights:
          type: [integer, 'null']
          minimum: 0
          maximum: 365
          description: Present exactly when penaltyKind is NIGHTS.
        penaltyPercent:
          oneOf:
            - $ref: '#/components/schemas/LodgingPercent'
            - type: 'null'
          description: Present exactly when penaltyKind is PERCENT.
        noShowPercent:
          $ref: '#/components/schemas/LodgingPercent'
        holdMinutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 1440
          description: |
            How long a hold stands at this provider. Null means the tenant's own
            accommodation.hold_minutes applies, which is the answer for almost every
            provider; this field exists for the one that negotiated its own.
        minNights:
          type: integer
          minimum: 1
          maximum: 365
        maxNights:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
        childFreeUnderAge:
          type: [integer, 'null']
          minimum: 0
          maximum: 18
          description: |
            A child below this age stays free. Null is not zero: it is an agreement that
            says nothing about children, and a booking under it charges for all of them.
    LodgingTerms:
      description: The version's lodging terms as the contract desk edits them.
      allOf:
        - $ref: '#/components/schemas/LodgingTermsPolicy'
        - type: object
          additionalProperties: false
          required: [id, contractVersionId, rowVersion]
          properties:
            id:
              type: string
              format: uuid
            contractVersionId:
              type: string
              format: uuid
            rowVersion:
              type: integer
              minimum: 1
              description: |
                The ETag of the contract *version*, not of this row. The terms are part of
                the version, so writing them moves the version's row_version: a screen
                holding a stale version ETag has not seen the last change to any part of
                the sheet.
    LodgingPolicySnapshot:
      description: |
        The policy as a booking freezes it: the terms, the version they came from, the
        moment the copy was taken and the zone its hours are counted in. WP-I6-02 writes
        one at confirmation and WP-I6-03 judges every cancellation and no-show by it, so
        nothing in it may be looked up again later -- a later edit of the contract must not
        change what a member already agreed to.
      allOf:
        - $ref: '#/components/schemas/LodgingTermsPolicy'
        - type: object
          additionalProperties: false
          required: [contractVersionId, snapshotAt, timezone]
          properties:
            contractVersionId:
              type: string
              format: uuid
            snapshotAt:
              type: string
              format: date-time
            timezone:
              type: string
              maxLength: 60
              description: |
                The IANA zone the hour counts are read in, normally the property's. It is
                carried explicitly because a free-cancellation window that moved with the
                reader's clock would be a fee that depends on who is looking.
    PutLodgingTermsRequest:
      description: |
        The terms to write on a DRAFT version, whole. It is the policy and nothing else; a
        second allOf member with `additionalProperties: false` would generate a request
        type no client could construct.
      allOf:
        - $ref: '#/components/schemas/LodgingTermsPolicy'
    ResolvePriceRequest:
      type: object
      additionalProperties: false
      required: [serviceDate, providerProfileId, serviceDefinitionId]
      properties:
        serviceDate:
          type: string
          format: date
          description: The day the service is delivered; the whole selection is made against it.
        providerProfileId:
          type: string
          format: uuid
        serviceDefinitionId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          description: Where it will be delivered, when that is already known.
    PriceMatchTarget:
      type: string
      description: |
        What the price item names: the service definition itself, a package containing it,
        or a category above it in the catalog tree.
      enum: [DEFINITION, PACKAGE, CATEGORY]
    ResolvedPrice:
      type: object
      additionalProperties: false
      required:
        [priceItemId, priceListId, contractVersionId, contractId, contractCode, versionNo,
         currencyCode, unitType, pricingMethod, memberShareMethod, matchedVia]
      properties:
        priceItemId:
          type: string
          format: uuid
        priceListId:
          type: string
          format: uuid
        priceListCode:
          type: [string, 'null']
        contractVersionId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        contractCode:
          type: string
        versionNo:
          type: integer
          minimum: 1
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        locationId:
          type: [string, 'null']
          format: uuid
        unitType:
          $ref: '#/components/schemas/ServiceUnitType'
        pricingMethod:
          $ref: '#/components/schemas/PricingMethod'
        amount:
          type: [string, 'null']
        percent:
          type: [string, 'null']
        formulaKey:
          type: [string, 'null']
        minAmount:
          type: [string, 'null']
        maxAmount:
          type: [string, 'null']
        memberShareMethod:
          $ref: '#/components/schemas/MemberShareMethod'
        memberShareAmount:
          type: [string, 'null']
        memberSharePercent:
          type: [string, 'null']
        matchedVia:
          $ref: '#/components/schemas/PriceMatchTarget'
    ScoredPriceCandidate:
      type: object
      additionalProperties: false
      required: [priceItemId, priceListId, contractVersionId, score, matched, matchedVia]
      properties:
        priceItemId:
          type: string
          format: uuid
        priceListId:
          type: string
          format: uuid
        contractVersionId:
          type: string
          format: uuid
        score:
          type: integer
          description: Specificity score; the highest one wins and equal ones are a tie, never a coin flip.
        matched:
          type: boolean
          description: False for a candidate that was loaded and then ruled out.
        excluded:
          type: [string, 'null']
          description: Why it was ruled out, one of PERIOD, SEASON, WEEKDAY, LOCATION or SERVICE.
        matchedVia:
          $ref: '#/components/schemas/PriceMatchTarget'
        itemPriority:
          type: integer
        listPriority:
          type: integer
    ResolvePriceResult:
      type: object
      additionalProperties: false
      required: [outcome, serviceDate, considered, tied]
      properties:
        outcome:
          type: string
          description: |
            MATCHED when exactly one candidate scored highest, REVIEW_REQUIRED when several
            tied at the top, NOT_FOUND when nothing matched at all.
          enum: [MATCHED, REVIEW_REQUIRED, NOT_FOUND]
        reason:
          type: [string, 'null']
          description: PRICE_AMBIGUOUS or PRICE_NOT_FOUND; absent when a winner was found.
        serviceDate:
          type: string
          format: date
        winner:
          $ref: '#/components/schemas/ResolvedPrice'
        tied:
          type: array
          description: Every candidate that tied at the top when the outcome is REVIEW_REQUIRED.
          items:
            $ref: '#/components/schemas/ResolvedPrice'
        considered:
          type: array
          description: Every candidate with its score, winners and losers alike, highest first.
          items:
            $ref: '#/components/schemas/ScoredPriceCandidate'
    RuleSetPurpose:
      type: string
      description: |
        Which decision a rule set answers. A caller asking "what documents does this claim
        need" reads the DOCUMENT sets and never a PRICE one, so the purpose is what makes
        a set findable rather than a comment on it.
      enum: [ELIGIBILITY, DOCUMENT, PREAUTH, LIMIT, DUPLICATE, DIAGNOSIS_SERVICE, PRICE, ADJUDICATION]
    RuleSetStatus:
      type: string
      description: |
        Lifecycle of a rule set. INACTIVE stops it being offered for new decisions and
        changes nothing about the evaluations it already produced.
      enum: [ACTIVE, INACTIVE]
    RuleSetVersionStatus:
      type: string
      description: |
        Lifecycle of a rule set version. PUBLISHED is the only status the engine ever
        evaluates for a recorded decision, and nothing about it may change afterwards.
      enum: [DRAFT, UNDER_REVIEW, PUBLISHED, RETIRED]
    RuleInputType:
      type: string
      description: |
        The CEL type of one declared input variable (ADR-023). The environment offers
        these and nothing else: there is no type here that reaches a network, a file or a
        database, which is how v1.2 11.7's prohibitions are kept — by absence.
      enum: [string, int, double, bool, timestamp, duration, map, list]
    RuleInputSchema:
      type: object
      description: |
        The variables a condition of this version may name, and their CEL types. A
        condition reaching anything not declared here fails to compile at authoring time.
      additionalProperties:
        $ref: '#/components/schemas/RuleInputType'
    RuleActionType:
      type: string
      description: |
        What a matched rule asks the caller to do. The engine returns actions and performs
        none of them: eligibility, authorization and adjudication decide what to do with
        them, and that separation is what lets a simulation run without writing a row.
      enum:
        - APPROVE
        - REJECT
        - WARN
        - REQUIRE_DOCUMENT
        - REQUIRE_PREAUTH
        - REQUIRE_MEDICAL_REVIEW
        - REQUIRE_FINANCIAL_REVIEW
        - PARTIAL_APPROVE
        - RESERVE_ENTITLEMENT
        - ADJUST_PRICE
        - SET_LIMIT
    RuleOutcome:
      type: string
      description: |
        The one answer a whole pass folds to. Any REJECT wins; otherwise any REQUIRE_*
        means REVIEW_REQUIRED; otherwise any PARTIAL_APPROVE means PARTIALLY_APPROVED;
        APPROVED is what is left when nothing objected.
      enum: [APPROVED, REJECTED, REVIEW_REQUIRED, PARTIALLY_APPROVED]
    RuleSeverity:
      type: string
      description: How loud one line of the trace is; ERROR marks a rule that threw or timed out.
      enum: [INFO, WARNING, ERROR]
    RuleAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/RuleActionType'
        payload:
          type: object
          additionalProperties: true
          description: |
            The typed payload of the action, validated on write against the action type:
            REQUIRE_DOCUMENT needs a documentTypeCode, SET_LIMIT and RESERVE_ENTITLEMENT
            an amount, ADJUST_PRICE a method and a value. Every numeric value is an exact
            decimal string, never a JSON number.
    RuleSet:
      type: object
      additionalProperties: false
      required: [id, code, name, domainCode, purpose, status, versionCount, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        domainCode:
          $ref: '#/components/schemas/ServiceDomain'
        purpose:
          $ref: '#/components/schemas/RuleSetPurpose'
        status:
          $ref: '#/components/schemas/RuleSetStatus'
        versionCount:
          type: integer
          minimum: 0
          description: How many versions the set holds, drafts included.
        rowVersion:
          type: integer
          minimum: 1
    RuleSetPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuleSet'
        nextCursor:
          type: [string, 'null']
    CreateRuleSetRequest:
      type: object
      additionalProperties: false
      required: [code, name, domainCode, purpose]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,39}$'
        name:
          type: string
          minLength: 2
          maxLength: 200
        domainCode:
          $ref: '#/components/schemas/ServiceDomain'
        purpose:
          $ref: '#/components/schemas/RuleSetPurpose'
    UpdateRuleSetRequest:
      type: object
      additionalProperties: false
      description: |
        Merge-patch body. The code, the service domain and the purpose are absent because
        they are what the set is; a body carrying one answers 422 with IMMUTABLE.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        status:
          $ref: '#/components/schemas/RuleSetStatus'
    RuleSetVersionSummary:
      type: object
      additionalProperties: false
      required: [id, ruleSetId, versionNo, status, ruleCount, testCaseCount, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        ruleSetId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RuleSetVersionStatus'
        validFrom:
          type: [string, 'null']
          format: date
        validTo:
          type: [string, 'null']
          format: date
        notes:
          type: [string, 'null']
        publishedAt:
          type: [string, 'null']
          format: date-time
        ruleCount:
          type: integer
          minimum: 0
        testCaseCount:
          type: integer
          minimum: 0
          description: How many test cases the version holds; submit refuses while this is zero.
        rowVersion:
          type: integer
          minimum: 1
    RuleSetVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuleSetVersionSummary'
    RuleSetVersion:
      type: object
      additionalProperties: false
      required: [id, ruleSetId, versionNo, status, inputSchema, rules, testCases, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        ruleSetId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RuleSetVersionStatus'
        validFrom:
          type: [string, 'null']
          format: date
        validTo:
          type: [string, 'null']
          format: date
        inputSchema:
          $ref: '#/components/schemas/RuleInputSchema'
        notes:
          type: [string, 'null']
        contentHash:
          type: [string, 'null']
          description: Lower-case hex SHA-256 over the input schema and every rule, written at publish.
        submittedAt:
          type: [string, 'null']
          format: date-time
        submittedBy:
          type: [string, 'null']
          format: uuid
        publishedAt:
          type: [string, 'null']
          format: date-time
        publishedBy:
          type: [string, 'null']
          format: uuid
        reviewComment:
          type: [string, 'null']
        retireReasonCode:
          type: [string, 'null']
        rules:
          type: array
          description: The rules of the version in ascending priority order; 1 runs first.
          items:
            $ref: '#/components/schemas/Rule'
        testCases:
          type: array
          items:
            $ref: '#/components/schemas/RuleTestCase'
        rowVersion:
          type: integer
          minimum: 1
    CreateRuleSetVersionRequest:
      type: object
      additionalProperties: false
      properties:
        copyFromVersionId:
          type: string
          format: uuid
          description: Another version of the same set whose schema, rules and test cases are copied.
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, 'null']
          format: date
        inputSchema:
          $ref: '#/components/schemas/RuleInputSchema'
        notes:
          type: string
          maxLength: 2000
    UpdateRuleSetVersionRequest:
      type: object
      additionalProperties: false
      description: Merge-patch body of a DRAFT rule set version.
      properties:
        validFrom:
          type: [string, 'null']
          format: date
        validTo:
          type: [string, 'null']
          format: date
        inputSchema:
          $ref: '#/components/schemas/RuleInputSchema'
        notes:
          type: [string, 'null']
          maxLength: 2000
    Rule:
      type: object
      additionalProperties: false
      required: [id, ruleSetVersionId, code, name, priority, condition, actions, explanationCode, stopOnMatch, active]
      properties:
        id:
          type: string
          format: uuid
        ruleSetVersionId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        priority:
          type: integer
          minimum: 1
          description: Ascending evaluation order; two rules of one version may not share a priority.
        condition:
          type: string
          description: A CEL expression returning a boolean, compiled against the version's input schema.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/RuleAction'
        explanationCode:
          type: string
          description: The code every line of the trace this rule produces carries.
        explanationParams:
          type: object
          additionalProperties: true
          description: Substitution parameters of the explanation; ids and codes only, never a name.
        stopOnMatch:
          type: boolean
          description: Ends the pass as soon as this rule matches; recorded in the trace.
        active:
          type: boolean
          description: An inactive rule is kept for the record and never compiled or evaluated.
    RuleInput:
      type: object
      additionalProperties: false
      required: [code, name, priority, condition, explanationCode]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        name:
          type: string
          minLength: 2
          maxLength: 200
        priority:
          type: integer
          minimum: 1
          maximum: 100000
        condition:
          type: string
          minLength: 1
          maxLength: 8192
        actions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RuleAction'
        explanationCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        explanationParams:
          type: object
          additionalProperties: true
        stopOnMatch:
          type: boolean
          default: false
        active:
          type: boolean
          default: true
    RuleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
    ReplaceRulesRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/RuleInput'
    RuleTestCase:
      type: object
      additionalProperties: false
      required: [id, ruleSetVersionId, code, input, expectedOutcome, expectedExplanations]
      properties:
        id:
          type: string
          format: uuid
        ruleSetVersionId:
          type: string
          format: uuid
        code:
          type: string
        description:
          type: [string, 'null']
        input:
          type: object
          additionalProperties: true
          description: One whole input document, keyed by the variables the input schema declares.
        expectedOutcome:
          $ref: '#/components/schemas/RuleOutcome'
        expectedExplanations:
          type: array
          description: The explanation codes the case must produce, in order.
          items:
            type: string
        expectedActions:
          type: [array, 'null']
          description: |
            The actions the case must produce, in order. Null means the case does not
            assert on actions at all; an entry without a payload asserts only its type.
          items:
            $ref: '#/components/schemas/RuleAction'
    RuleTestCaseInput:
      type: object
      additionalProperties: false
      required: [code, input, expectedOutcome]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        description:
          type: [string, 'null']
          maxLength: 500
        input:
          type: object
          additionalProperties: true
        expectedOutcome:
          $ref: '#/components/schemas/RuleOutcome'
        expectedExplanations:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        expectedActions:
          type: [array, 'null']
          maxItems: 100
          items:
            $ref: '#/components/schemas/RuleAction'
    RuleTestCaseList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuleTestCase'
    ReplaceRuleTestCasesRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/RuleTestCaseInput'
    RuleTestCaseResult:
      type: object
      additionalProperties: false
      required: [code, passed, expectedOutcome, actualOutcome, expectedExplanations, actualExplanations, actualActions, mismatches]
      properties:
        code:
          type: string
        passed:
          type: boolean
        expectedOutcome:
          $ref: '#/components/schemas/RuleOutcome'
        actualOutcome:
          $ref: '#/components/schemas/RuleOutcome'
        expectedExplanations:
          type: array
          items:
            type: string
        actualExplanations:
          type: array
          items:
            type: string
        expectedActions:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/RuleAction'
        actualActions:
          type: array
          items:
            $ref: '#/components/schemas/RuleAction'
        mismatches:
          type: array
          description: Which of outcome, explanations or actions differed; empty when the case passed.
          items:
            type: string
            enum: [OUTCOME, EXPLANATIONS, ACTIONS]
    RuleTestRunResult:
      type: object
      additionalProperties: false
      required: [ruleSetVersionId, passed, total, failed, cases]
      properties:
        ruleSetVersionId:
          type: string
          format: uuid
        passed:
          type: boolean
          description: True only when there is at least one case and every one of them passed.
        total:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        cases:
          type: array
          items:
            $ref: '#/components/schemas/RuleTestCaseResult'
    SimulateRuleSetVersionRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: object
          additionalProperties: true
          description: One whole input document, keyed by the variables the input schema declares.
    RuleEvaluationResultLine:
      type: object
      additionalProperties: false
      required: [sequence, ruleCode, matched, explanationCode, severity]
      properties:
        sequence:
          type: integer
          minimum: 1
          description: Position in the pass; the order the rules were considered in.
        ruleId:
          type: [string, 'null']
          format: uuid
        ruleCode:
          type: string
        matched:
          type: boolean
        actionType:
          type: [string, 'null']
          description: The action this line asks for, absent when the rule did not match or carries none.
        actionPayload:
          type: [object, 'null']
          additionalProperties: true
        explanationCode:
          type: string
        severity:
          $ref: '#/components/schemas/RuleSeverity'
    RuleEvaluationTrace:
      type: object
      additionalProperties: false
      required: [ruleSetVersionId, outcome, results]
      properties:
        ruleSetVersionId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RuleSetVersionStatus'
        outcome:
          $ref: '#/components/schemas/RuleOutcome'
        durationMs:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/RuleEvaluationResultLine'
    RuleEvaluation:
      type: object
      additionalProperties: false
      required: [id, ruleSetVersionId, ruleSetId, subjectType, outcome, inputHash, inputSnapshot, evaluatedAt, results]
      properties:
        id:
          type: string
          format: uuid
        ruleSetVersionId:
          type: string
          format: uuid
        ruleSetId:
          type: string
          format: uuid
        ruleSetCode:
          type: string
        versionNo:
          type: integer
          minimum: 1
        subjectType:
          type: string
          description: What was decided about, for example CLAIM or SERVICE_REQUEST.
        subjectId:
          type: [string, 'null']
          format: uuid
        outcome:
          $ref: '#/components/schemas/RuleOutcome'
        inputHash:
          type: string
          description: Lower-case hex SHA-256 of the canonical input; the same input twice gives the same hash.
        inputSnapshot:
          type: object
          additionalProperties: true
          description: |
            The input as it is kept for audit: ids, dates, codes and quantities only.
            Anything that is neither of those is dropped before the row is written, so no
            identity number and no name ever reaches this column.
        durationMs:
          type: [integer, 'null']
          minimum: 0
        evaluatedAt:
          type: string
          format: date-time
        evaluatedBy:
          type: [string, 'null']
          format: uuid
        results:
          type: array
          items:
            $ref: '#/components/schemas/RuleEvaluationResultLine'
    PriceQuoteOutcome:
      type: string
      description: |
        The answer for one line or for the whole quote. QUOTED means the plan carries what
        the rules and the balance allow; PARTIAL means it carries part of it; NOT_ELIGIBLE
        still prices the service, because a member the plan does not cover may still choose
        to pay privately; REVIEW_REQUIRED means nobody may act on the line yet, and a quote
        in that state carries no payer and no member figure at all.
      enum: [QUOTED, PARTIAL, REVIEW_REQUIRED, NOT_ELIGIBLE]
    PriceQuoteExplanation:
      type: object
      additionalProperties: false
      required: [code, severity]
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable reason for a figure that is not simply the contract
            amount: NOT_ELIGIBLE, PRICE_NOT_FOUND, PRICE_AMBIGUOUS, MEMBER_SHARE_APPLIED,
            LIMIT_APPLIED, PRICE_ADJUSTED, PRICE_CLAMPED_TO_MINIMUM,
            PRICE_CLAMPED_TO_MAXIMUM, BALANCE_INSUFFICIENT, ROUNDED_TO_CURRENCY,
            PRICE_FORMULA_UNKNOWN or REVIEW_REQUESTED_BY_RULE.
        severity:
          type: string
          enum: [INFO, WARNING, ERROR]
        source:
          type: [string, 'null']
          description: The rule code that caused this line, when a rule caused it.
    PriceQuoteRequestItem:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        serviceDefinitionId:
          type: string
          format: uuid
          description: The service being priced. Exactly one of this and packageDefinitionId.
        packageDefinitionId:
          type: string
          format: uuid
          description: The package being priced. Exactly one of this and serviceDefinitionId.
        quantity:
          type: string
          description: |
            Exact decimal string, greater than zero; a UNIT price multiplies by it. Never a
            JSON number, because a quantity that passes through a float is a quantity that
            can come back different.
        requestedAmount:
          type: [string, 'null']
          description: |
            What the provider asked for, as an exact decimal string. A PERCENT_OF_LIST price
            is a percentage of it.
    CreatePriceQuoteRequest:
      type: object
      additionalProperties: false
      required: [personId, providerProfileId, serviceDate, items]
      properties:
        personId:
          type: string
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
          description: Restricts the enrollment the eligibility step may use.
        providerProfileId:
          type: string
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
          description: Where the service is delivered; a location-specific price needs it.
        serviceDate:
          type: string
          format: date
          description: The day the service is delivered. The whole quote is made against it.
        eligibilityEvaluationId:
          type: [string, 'null']
          format: uuid
          description: |
            An eligibility evaluation the caller already made for this person, recorded on
            the quote so the two can be read together. The quote never creates one itself:
            opening an entitlement account posts a ledger entry, and a quote must leave the
            ledger untouched.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PriceQuoteRequestItem'
        context:
          type: object
          additionalProperties: true
          description: |
            Recognised hints only, exactly as the eligibility check reads them: domain
            (HEALTH classifies the access audit row HEALTH instead of PERSONAL),
            entitlementCode for every line and entitlementCodes positionally per line.
            Anything else is ignored, never stored and never hashed.
    PriceQuoteItem:
      type: object
      additionalProperties: false
      required:
        [lineNo, quantity, requestedAmount, contractAmount, coveredAmount, payerAmount,
         memberAmount, outcome, explanations]
      properties:
        lineNo:
          type: integer
          minimum: 1
          description: The requested line position, counting from one.
        serviceDefinitionId:
          type: [string, 'null']
          format: uuid
        packageDefinitionId:
          type: [string, 'null']
          format: uuid
        priceItemId:
          type: [string, 'null']
          format: uuid
          description: The contract price item that won the selection; null when none did.
        quantity:
          type: string
        requestedAmount:
          type: string
        contractAmount:
          type: string
          description: What the contract says the line costs, before the plan carries any of it.
        coveredAmount:
          type: string
          description: How much of the contract amount the plan is willing to carry.
        payerAmount:
          type: string
          description: What the payer ends up paying, capped by the entitlement balance.
        memberAmount:
          type: string
          description: |
            What the member pays out of pocket; payerAmount plus memberAmount is exactly the
            contract amount, which is why the rounding happens once and the member takes the
            difference.
        outcome:
          $ref: '#/components/schemas/PriceQuoteOutcome'
        explanations:
          type: array
          items:
            $ref: '#/components/schemas/PriceQuoteExplanation'
    PriceQuote:
      type: object
      additionalProperties: false
      required:
        [id, personId, providerProfileId, serviceDate, currencyCode, outcome,
         requestedAmount, contractAmount, coveredAmount, payerAmount, memberAmount,
         items, ruleSetVersionIds, expiresAt, expired, quotedAt, disclaimer]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        providerProfileId:
          type: string
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
        serviceDate:
          type: string
          format: date
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        outcome:
          $ref: '#/components/schemas/PriceQuoteOutcome'
        requestedAmount:
          type: string
        contractAmount:
          type: string
        coveredAmount:
          type: string
        payerAmount:
          type: string
        memberAmount:
          type: string
        items:
          type: array
          description: One entry per requested line, in line order.
          items:
            $ref: '#/components/schemas/PriceQuoteItem'
        contractVersionId:
          type: [string, 'null']
          format: uuid
          description: The published contract version the winning prices came from.
        planVersionId:
          type: [string, 'null']
          format: uuid
        ruleSetVersionIds:
          type: array
          description: Every published PRICE rule set version that was evaluated for this quote.
          items:
            type: string
            format: uuid
        eligibilityEvaluationId:
          type: [string, 'null']
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: When the quote stops holding, from the tenant setting pricing.quote_ttl_hours.
        expired:
          type: boolean
          description: |
            True when expiresAt has passed. An expired quote still reads back and says so
            rather than disappearing, because a member who was given a number is owed the
            reason it no longer holds.
        quotedAt:
          type: string
          format: date-time
        quotedBy:
          type: [string, 'null']
          format: uuid
        disclaimer:
          type: string
          description: |
            Plain-language statement that a quote is not an authorization and grants nothing:
            no reservation, no approval and no ledger movement. Carried through to the UI so
            nobody at a counter mistakes a quote for a decision.
    WorkQueueDomain:
      type: string
      description: Business domain a queue belongs to; the same closed list the catalog uses.
      enum: [GENERIC, HEALTH, ACCOMMODATION, ASSISTANCE, EDUCATION, SPORT, TRANSPORT, CARE, OTHER]
    AssignmentPolicy:
      type: string
      description: |
        How work is meant to reach a person in this queue. MANUAL is the only one the
        commands implement today: ROUND_ROBIN and LEAST_LOADED are recorded so a queue can
        already say what it wants, and an automatic assigner reads it when one exists.
      enum: [MANUAL, ROUND_ROBIN, LEAST_LOADED]
    WorkQueue:
      type: object
      additionalProperties: false
      required: [id, code, name, domainCode, assignmentPolicy, active, requiredPermission, rowVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Stable code work is routed to. Immutable once the queue exists.
          minLength: 2
          maxLength: 64
        name:
          type: string
          maxLength: 200
        domainCode:
          $ref: '#/components/schemas/WorkQueueDomain'
        assignmentPolicy:
          $ref: '#/components/schemas/AssignmentPolicy'
        requiredPermission:
          type: string
          description: |
            The permission this queue's work takes. The worklist shows an item only to a
            caller who holds it, and a claim is refused without it, so a queue is visible to
            the people who can do its work rather than to everybody who can read a worklist.
            Defaults to `worklist.read`, which is every worklist reader.
        slaMinutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 525600
          description: |
            How long an item raised into this queue has. It is copied onto the item at that
            moment and never read again: changing it here leaves every existing item on the
            clock it was already given.
        escalationQueueId:
          type: [string, 'null']
          format: uuid
          description: Where overdue items go. Null means they are marked ESCALATED in place.
        active:
          type: boolean
        rowVersion:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    WorkQueuePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkQueue'
        nextCursor:
          type: [string, 'null']
    CreateWorkQueue:
      type: object
      additionalProperties: false
      required: [code, name, domainCode]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        domainCode:
          $ref: '#/components/schemas/WorkQueueDomain'
        assignmentPolicy:
          $ref: '#/components/schemas/AssignmentPolicy'
        slaMinutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 525600
        escalationQueueId:
          type: [string, 'null']
          format: uuid
        requiredPermission:
          type: string
          description: The permission this queue's work takes; defaults to `worklist.read`.
        active:
          type: boolean
          default: true
    PatchWorkQueue:
      type: object
      additionalProperties: false
      description: |
        Merge patch: a field that is absent is left alone, and an explicit null clears the
        two fields that may be cleared. The code and the domain are absent from this schema
        because they are immutable; sending either answers 422 with field code UNKNOWN_FIELD.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        assignmentPolicy:
          $ref: '#/components/schemas/AssignmentPolicy'
        slaMinutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 525600
          description: Null stops new items being given a clock; existing items keep theirs.
        escalationQueueId:
          type: [string, 'null']
          format: uuid
        requiredPermission:
          type: string
          description: The permission this queue's work takes.
        active:
          type: boolean
    WorkItemStatus:
      type: string
      description: |
        State of one piece of work. It is read-only on every endpoint: an item moves by
        command — claim, release, reassign, complete — or by the escalation job, and there
        is no field a caller can set to change it.
      enum: [OPEN, CLAIMED, COMPLETED, CANCELLED, ESCALATED]
    WorkItem:
      type: object
      additionalProperties: false
      required: [id, queueId, aggregateType, aggregateId, title, priority, status, rowVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        queueId:
          type: string
          format: uuid
          description: The queue the item is waiting in, which escalation may change.
        aggregateType:
          type: string
          description: What kind of record the work is about, for example SERVICE_REQUEST.
          minLength: 2
          maxLength: 64
        aggregateId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        priority:
          type: integer
          minimum: 1
          maximum: 1000
          description: Higher is more urgent; 100 is the middle everything starts at.
        assigneeActorId:
          type: [string, 'null']
          format: uuid
        assigneeDisplayName:
          type: [string, 'null']
          maxLength: 200
          description: |
            Who holds the item, read with the row. It is here so a worklist names a
            colleague instead of showing their id, without one extra request per line.
        assignedAt:
          type: [string, 'null']
          format: date-time
        dueAt:
          type: [string, 'null']
          format: date-time
          description: |
            When this item is late, computed once from the queue's SLA as it stood when the
            item was raised. Nothing moves it afterwards, escalation included: a late item
            stays late.
        slaMinutesSnapshot:
          type: [integer, 'null']
          description: The queue's SLA as it stood when this item was raised.
        status:
          $ref: '#/components/schemas/WorkItemStatus'
        outcomeCode:
          type: [string, 'null']
          description: What a completed item decided.
        completedAt:
          type: [string, 'null']
          format: date-time
        completedBy:
          type: [string, 'null']
          format: uuid
        escalatedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the escalation job last acted on this item. It is what makes running the
            job twice produce one escalation rather than two.
        escalatedFromQueueId:
          type: [string, 'null']
          format: uuid
        rowVersion:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    WorkItemPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkItem'
        nextCursor:
          type: [string, 'null']
    ReleaseWorkItem:
      type: object
      additionalProperties: false
      description: |
        A reason is optional here: putting work down may be nothing more than the end of a
        shift. A code that is given has to be one a report can group by.
      properties:
        reasonCode:
          type: string
          minLength: 2
          maxLength: 80
        reasonText:
          type: string
          maxLength: 1000
    ReassignWorkItem:
      type: object
      additionalProperties: false
      required: [assigneeActorId]
      properties:
        assigneeActorId:
          type: string
          format: uuid
          description: Who is to hold the item from now on.
        reasonCode:
          type: string
          minLength: 2
          maxLength: 80
        reasonText:
          type: string
          maxLength: 1000
    CompleteWorkItem:
      type: object
      additionalProperties: false
      required: [outcomeCode]
      properties:
        outcomeCode:
          type: string
          minLength: 2
          maxLength: 80
          description: |
            What was decided. It is required, because an item closed with no outcome is a row
            nobody can report on.
        comment:
          type: string
          maxLength: 4000
          description: |
            An optional internal note, stored as an INTERNAL comment on the item in the same
            transaction. It is never audited: it is free text a person typed.
    CommentVisibility:
      type: string
      description: |
        Who a comment was written for. It is recorded rather than interpreted here: a
        comment a provider or a member can read may not carry clinical detail, and that is a
        rule about content which the health module enforces against this field.
      enum: [INTERNAL, PROVIDER, MEMBER]
    WorkItemComment:
      type: object
      additionalProperties: false
      required: [id, aggregateType, aggregateId, visibility, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        aggregateType:
          type: string
        aggregateId:
          type: string
          format: uuid
        workItemId:
          type: [string, 'null']
          format: uuid
        visibility:
          $ref: '#/components/schemas/CommentVisibility'
        body:
          type: string
          maxLength: 4000
        authorActorId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
    WorkItemCommentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkItemComment'
    AddWorkItemComment:
      type: object
      additionalProperties: false
      required: [visibility, body]
      properties:
        visibility:
          $ref: '#/components/schemas/CommentVisibility'
        body:
          type: string
          minLength: 1
          maxLength: 4000
    ApprovalPolicy:
      type: object
      additionalProperties: false
      required: [id, actionCode, scopeCode, versionNo, requiredRoleCodes, requiredApproverCount, validFrom, rowVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actionCode:
          type: string
          description: The command this policy governs, for example service_request.approve.
        scopeCode:
          type: string
          description: |
            Which band of the action this policy is about. Two policies for the same action
            and scope may not cover the same day, so a scope is how one action carries more
            than one rule at a time.
        versionNo:
          type: integer
          minimum: 1
          description: How many times the set for this action has been written.
        minAmount:
          type: [string, 'null']
          pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'
          description: |
            Lower edge of the band, inclusive, as an exact decimal string. Null is an open
            end. It is never a JSON number: a band that had passed through a float would
            refuse an approval it should have allowed.
        maxAmount:
          type: [string, 'null']
          pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'
          description: Upper edge of the band, inclusive, as an exact decimal string. Null is an open end.
        requiredRoleCodes:
          type: array
          description: Roles that may approve. Empty means no particular role is required.
          maxItems: 20
          items:
            type: string
            minLength: 2
            maxLength: 64
        requiredApproverCount:
          type: integer
          minimum: 1
          description: How many separate approvals this band needs.
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, 'null']
          format: date
          description: Exclusive end of the period. Null means it has no end yet.
        rowVersion:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    ApprovalPolicyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalPolicy'
    ApprovalPolicyInput:
      type: object
      additionalProperties: false
      required: [scopeCode, validFrom]
      properties:
        scopeCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
        minAmount:
          type: [string, 'null']
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
        maxAmount:
          type: [string, 'null']
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
        requiredRoleCodes:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        requiredApproverCount:
          type: integer
          minimum: 1
          default: 1
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, 'null']
          format: date
    PutApprovalPolicies:
      type: object
      additionalProperties: false
      required: [actionCode, policies]
      properties:
        actionCode:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){0,3}$'
        policies:
          type: array
          description: |
            The whole set for this action. An empty array is a legitimate request: it means
            this action needs no policy at all, and it removes whatever was there.
          maxItems: 50
          items:
            $ref: '#/components/schemas/ApprovalPolicyInput'
    DocumentClassification:
      type: string
      description: |
        How sensitive the document is. It is copied onto every access event a download
        writes, and HEALTH additionally produces an audit event of its own: who opened
        clinical material is a question asked on its own (v1.2 11.10).
      enum: [INTERNAL, CONFIDENTIAL, PERSONAL, HEALTH]
    DocumentScanStatus:
      type: string
      description: |
        The life of a file in one field. PENDING is a reserved upload with no bytes yet,
        SCANNING is bytes in quarantine waiting for a verdict, CLEAN is the only status
        whose bytes are in the secure bucket, INFECTED is a file the scanner named something
        in and whose bytes have been deleted, and FAILED is one no verdict could be reached
        about — which is not "clean" and is never promoted.
      enum: [PENDING, SCANNING, CLEAN, INFECTED, FAILED]
    Document:
      type: object
      additionalProperties: false
      required: [id, bucket, classification, originalFilename, contentType, scanStatus, downloadable, links, uploadedAt, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        bucket:
          type: string
          description: |
            Which of the two worlds the bytes are in. It is never `secure` unless the scan
            came back clean, which the schema enforces with a CHECK rather than trusting the
            code that writes it.
          enum: [quarantine, secure]
        classification:
          $ref: '#/components/schemas/DocumentClassification'
        originalFilename:
          type: string
          maxLength: 255
          description: |
            The name the file was uploaded under, kept so a person can recognise their own
            document. Any directory part a browser sent is stripped, and it is never used to
            build a storage key.
        contentType:
          type: string
          maxLength: 255
        byteSize:
          type: [integer, 'null']
          format: int64
          description: |
            Null until the upload is completed. After a scan it is the size the worker
            counted while reading the bytes, not the one the client claimed.
        sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: |
            Null until the upload is completed. After a scan it is the digest the worker
            computed over the bytes it scanned.
        scanStatus:
          $ref: '#/components/schemas/DocumentScanStatus'
        downloadable:
          type: boolean
          description: |
            Whether downloadDocument would answer a URL right now. It is the one answer the
            product computes in one place: clean, in the secure bucket, and not purged.
        ownerOrganizationId:
          type: [string, 'null']
          format: uuid
          description: |
            The provider the document belongs to, or null when it belongs to the tenant
            itself. A provider-scoped actor only ever sees its own organizations' documents.
        duplicateOfDocumentId:
          type: [string, 'null']
          format: uuid
          description: |
            Set when these exact bytes were already stored under another document, which
            this one now points at. It carries no second copy of the file.
        uploadedBy:
          type: [string, 'null']
          format: uuid
        uploadedAt:
          type: string
          format: date-time
        purgedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When retention removed the bytes. The row outlives them, so "this document
            existed and was removed on this day" stays answerable.
        links:
          type: array
          description: The records this document belongs to.
          items:
            $ref: '#/components/schemas/DocumentLink'
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    DocumentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        nextCursor:
          type: [string, 'null']
    DocumentLink:
      type: object
      additionalProperties: false
      required: [id, documentId, aggregateType, aggregateId, documentTypeCode, createdAt]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        aggregateType:
          type: string
          description: The kind of record this document belongs to, for example SERVICE_REQUEST.
        aggregateId:
          type: string
          format: uuid
        documentTypeCode:
          type: string
          description: What the document is on that record, for example INVOICE or REFERRAL.
        purpose:
          type: [string, 'null']
          maxLength: 200
        requiredPermission:
          type: [string, 'null']
          description: |
            The permission a caller must hold to download through this link. Null means
            document.read is enough.
        createdBy:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
    CreateUpload:
      type: object
      additionalProperties: false
      required: [originalFilename, contentType, byteSize]
      properties:
        originalFilename:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          minLength: 3
          maxLength: 255
        byteSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
          description: |
            The exact size of the file. It is signed into the upload URL, so the object
            store refuses a body of any other size: this is where the limit actually holds,
            because the API has no body to measure.
        classification:
          $ref: '#/components/schemas/DocumentClassification'
        ownerOrganizationId:
          type: [string, 'null']
          format: uuid
          description: |
            Which provider the document belongs to. A provider-scoped caller may only name
            an organization it holds, and one holding exactly one does not have to say which.
        sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: |
            Optional digest of the file about to be sent. When those exact bytes are already
            stored clean and visible to the caller, no upload happens at all.
    PresignedUpload:
      type: object
      additionalProperties: false
      required: [url, method, expiresAt, headers]
      properties:
        url:
          type: string
          format: uri
          description: |
            Where to PUT the file. It is a bearer credential with a short life; it is never
            logged and never shared.
        method:
          type: string
          enum: [PUT]
        expiresAt:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Headers the upload must carry exactly as given. They are part of the signature,
            so a different content type or length is refused by the store.
    DocumentUpload:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/Document'
        upload:
          oneOf:
            - $ref: '#/components/schemas/PresignedUpload'
            - type: 'null'
          description: |
            Null when the same bytes were already stored: there is nothing to upload, and
            `document` is the one that already exists.
    CompleteUpload:
      type: object
      additionalProperties: false
      required: [sha256, byteSize]
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The digest of what was uploaded, as the client computed it.
        byteSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
    DownloadDocument:
      type: object
      additionalProperties: false
      description: |
        Why the document is being opened. Both fields travel into the access event: "who
        read this" without "why" is not an answer a data protection review can use.
      properties:
        purposeCode:
          type: string
          minLength: 2
          maxLength: 80
        reasonText:
          type: string
          maxLength: 1000
    DocumentDownload:
      type: object
      additionalProperties: false
      required: [url, method, expiresAt, classification]
      properties:
        url:
          type: string
          format: uri
          description: |
            Where to GET the file from the secure bucket. It is a bearer credential with a
            short life; it is never logged and never shared.
        method:
          type: string
          enum: [GET]
        expiresAt:
          type: string
          format: date-time
        classification:
          $ref: '#/components/schemas/DocumentClassification'
    CreateDocumentLink:
      type: object
      additionalProperties: false
      required: [aggregateType, aggregateId, documentTypeCode]
      properties:
        aggregateType:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        aggregateId:
          type: string
          format: uuid
        documentTypeCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        purpose:
          type: string
          maxLength: 200
        requiredPermission:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,3}$'
          description: |
            Narrows who may download through this link. Every link on a document is checked,
            so a clinical attachment stays clinical wherever it is reached from.
    CreateLegalHold:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        documentId:
          type: [string, 'null']
          format: uuid
        personId:
          type: [string, 'null']
          format: uuid
        aggregateType:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        aggregateId:
          type: [string, 'null']
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    LegalHold:
      type: object
      additionalProperties: false
      required: [id, reason, placedAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: [string, 'null']
          format: uuid
        personId:
          type: [string, 'null']
          format: uuid
        aggregateType:
          type: [string, 'null']
        aggregateId:
          type: [string, 'null']
          format: uuid
        reason:
          type: string
          maxLength: 1000
        placedBy:
          type: [string, 'null']
          format: uuid
        placedAt:
          type: string
          format: date-time
        releasedAt:
          type: [string, 'null']
          format: date-time
        releasedBy:
          type: [string, 'null']
          format: uuid
        rowVersion:
          type: integer
          format: int64
    NotificationChannel:
      type: string
      enum: [EMAIL, SMS, PUSH, INAPP]
      description: |
        How a message reaches somebody. EMAIL goes through SMTP; SMS is recorded until a
        provider is chosen; PUSH is recorded and not delivered in this milestone; INAPP is
        delivered by being recorded, because the message log is what a screen reads.
    NotificationTemplateStatus:
      type: string
      enum: [DRAFT, PUBLISHED, RETIRED]
      description: |
        A draft renders nothing. A published template is immutable and there is at most one
        per event, channel and language. A retired one is what a published template becomes
        when a newer version replaces it; it never comes back.
    NotificationMessageStatus:
      type: string
      enum: [QUEUED, SENDING, SENT, FAILED, SUPPRESSED]
      description: |
        SUPPRESSED is the status that matters: it is a message that was deliberately not
        sent, with a reason, so a member who was not told can be shown to have not been
        told.
    NotificationRecipientType:
      type: string
      enum: [PERSON, ACTOR, ORGANIZATION]
    NotificationSuppressionReason:
      type: string
      enum: [PREFERENCE_DISABLED, QUIET_HOURS, NO_TEMPLATE, NO_ADDRESS, CHANNEL_NOT_DELIVERABLE]
      description: |
        Why nobody was told. PREFERENCE_DISABLED is somebody who asked not to hear about
        this; QUIET_HOURS is the middle of their night in their own time zone; NO_TEMPLATE
        is an event nobody has written a message for yet; NO_ADDRESS is a recipient the
        platform holds no address for on that channel; CHANNEL_NOT_DELIVERABLE is a channel
        whose adapter recorded the attempt and handed the message to nobody, because no
        provider is wired in behind it yet. That last one is decided at send time rather
        than before it, so it is the only reason that appears on a message which already
        has a delivery attempt against it.
    NotificationDeliveryOutcome:
      type: string
      enum: [ACCEPTED, REJECTED, BOUNCED, ERROR]
      description: |
        What one attempt came back with. REJECTED and BOUNCED are the provider's final word
        and stop the retries; ERROR is a provider that could not be reached, which is the
        one outcome worth trying again.
    NotificationSafeVariable:
      type: string
      enum:
        - given_name
        - reference_no
        - status_code
        - event_date
        - expires_at
        - amount
        - currency
        - provider_name
        - program_name
        - property_name
        - deep_link
      description: |
        The whole of what a notification may carry. A variable outside this list is refused
        at render time rather than dropped, and each of these has a shape of its own that
        its value must have: a given name has no digits at all, a status is a code, a date
        is a date, an amount is a decimal, and a deep link is a path with no query string,
        so there is nowhere in any of them to put a diagnosis, an identity number or
        something an operator typed into a comment.

        deep_link is a path rather than a URL, and the product prefixes its own base. That
        is what "no secret in a link" means here: there is nowhere in the value for a token
        to ride along, so a link can only point at a screen the recipient has to sign in to
        see. A voucher's plaintext is never one of these values.
    NotificationTemplate:
      type: object
      additionalProperties: false
      required: [id, eventCode, channel, locale, versionNo, status, body, declaredVariables, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        eventCode:
          type: string
          description: The domain event this message is written for.
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        locale:
          type: string
        versionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/NotificationTemplateStatus'
        subject:
          type: [string, 'null']
          maxLength: 200
          description: Present for EMAIL and absent for every other channel.
        body:
          type: string
          maxLength: 5000
        declaredVariables:
          type: array
          maxItems: 11
          items:
            $ref: '#/components/schemas/NotificationSafeVariable'
        publishedAt:
          type: [string, 'null']
          format: date-time
        publishedBy:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    NotificationTemplatePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationTemplate'
        nextCursor:
          type: [string, 'null']
    CreateNotificationTemplate:
      type: object
      additionalProperties: false
      required: [eventCode, channel, locale, body]
      properties:
        eventCode:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,4}$'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        locale:
          type: string
          pattern: '^[a-z]{2}(-[A-Z]{2})?$'
        subject:
          type: string
          minLength: 1
          maxLength: 200
          description: Required for EMAIL and refused for every other channel.
        body:
          type: string
          minLength: 1
          maxLength: 5000
          description: |
            The text, with double-brace placeholders for the declared variables. A brace
            pair the renderer would not substitute is refused rather than sent verbatim.
        declaredVariables:
          type: array
          maxItems: 11
          items:
            $ref: '#/components/schemas/NotificationSafeVariable'
          description: |
            Exactly the variables the body and subject use. Neither a declared variable the
            text never mentions nor a placeholder nobody declared is accepted.
    NotificationMessage:
      type: object
      additionalProperties: false
      required: [id, eventCode, recipientType, recipientId, channel, locale, safeVariables, status, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        eventCode:
          type: string
        recipientType:
          $ref: '#/components/schemas/NotificationRecipientType'
        recipientId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        locale:
          type: string
        templateId:
          type: [string, 'null']
          format: uuid
          description: |
            The template that produced this text, and its version. Both are null on a
            message that was suppressed before anything was rendered.
        templateVersionNo:
          type: [integer, 'null']
        subjectRendered:
          type: [string, 'null']
          maxLength: 200
        bodyRendered:
          type: [string, 'null']
          maxLength: 10000
        safeVariables:
          type: object
          additionalProperties:
            type: string
          description: |
            The values this message was rendered from. They are on the log because an
            operator needs to see what the member would have been sent even when the
            message was suppressed, and they are safe by construction.
        status:
          $ref: '#/components/schemas/NotificationMessageStatus'
        suppressedReason:
          oneOf:
            - $ref: '#/components/schemas/NotificationSuppressionReason'
            - type: 'null'
          description: Set exactly when the status is SUPPRESSED.
        resentFromMessageId:
          type: [string, 'null']
          format: uuid
          description: The message this one is a resend of.
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: [string, 'null']
          format: date-time
        rowVersion:
          type: integer
          format: int64
    NotificationMessagePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationMessage'
        nextCursor:
          type: [string, 'null']
    NotificationDelivery:
      type: object
      additionalProperties: false
      required: [id, messageId, attemptNo, providerCode, outcome, attemptedAt]
      properties:
        id:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        attemptNo:
          type: integer
          minimum: 1
        providerCode:
          type: string
          description: |
            Who took the message. SMTP is a mail server; SMS_STUB, PUSH_RECORDER and
            INAPP_RECORDER mean the attempt was recorded and the message never left the
            platform.
        providerMessageId:
          type: [string, 'null']
        outcome:
          $ref: '#/components/schemas/NotificationDeliveryOutcome'
        detail:
          type: [string, 'null']
          maxLength: 500
          description: |
            The provider's answer, bounded and with addresses removed: a bounce quotes the
            recipient, and that quote would otherwise be stored here forever.
        attemptedAt:
          type: string
          format: date-time
    NotificationMessageDetail:
      type: object
      additionalProperties: false
      required: [message, deliveries]
      properties:
        message:
          $ref: '#/components/schemas/NotificationMessage'
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/NotificationDelivery'
    NotificationPreference:
      type: object
      additionalProperties: false
      required: [id, recipientType, recipientId, channel, enabled, timezone, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        recipientType:
          $ref: '#/components/schemas/NotificationRecipientType'
        recipientId:
          type: string
          format: uuid
        eventCode:
          type: [string, 'null']
          description: Null means every event on this channel.
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        enabled:
          type: boolean
        quietHoursStart:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        quietHoursEnd:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        timezone:
          type: string
          description: IANA zone name the quiet hours are read in.
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    NotificationPreferenceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'
    PutNotificationPreferences:
      type: object
      additionalProperties: false
      required: [recipientType, recipientId, preferences]
      properties:
        recipientType:
          $ref: '#/components/schemas/NotificationRecipientType'
        recipientId:
          type: string
          format: uuid
        preferences:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/NotificationPreferenceInput'
    NotificationPreferenceInput:
      type: object
      additionalProperties: false
      required: [channel, enabled]
      properties:
        eventCode:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,4}$'
          description: Absent means every event on this channel.
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        enabled:
          type: boolean
        quietHoursStart:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Given with quietHoursEnd or not at all.
        quietHoursEnd:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        timezone:
          type: string
          minLength: 1
          maxLength: 60
          description: IANA zone name; defaults to Europe/Istanbul.
    HealthCaseType:
      type: string
      enum: [OUTPATIENT, INPATIENT, CHRONIC, MATERNITY, OTHER]
    HealthCaseStatus:
      type: string
      enum: [OPEN, CLOSED]
    HealthCaseSensitivity:
      type: string
      enum: [STANDARD, SENSITIVE]
      description: |
        Whether any diagnosis on the case falls in a category v1.2 11.10 protects further
        (psychiatry, genetics, reproductive health). It is itself clinical and appears only
        in the clinical projection.
    HealthProjection:
      type: string
      enum: [CLINICAL, FINANCIAL]
      description: |
        Which half of the record was served. It reports what the caller holds, which the
        caller already knows, so it reveals nothing about the patient — and it is what lets
        a screen say "you may not see clinical detail" instead of showing a record with
        holes in it.
    EncounterType:
      type: string
      enum: [OUTPATIENT, INPATIENT, EMERGENCY, TELEHEALTH]
    DiagnosisType:
      type: string
      enum: [PRIMARY, SECONDARY, SUSPECTED]
    HealthCase:
      type: object
      additionalProperties: false
      required:
        [id, personId, programId, enrollmentId, caseType, openedAt, status, projection,
         encounters, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        caseType:
          $ref: '#/components/schemas/HealthCaseType'
        providerOrganizationId:
          type: [string, 'null']
          format: uuid
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time
        status:
          $ref: '#/components/schemas/HealthCaseStatus'
        serviceRequestId:
          type: [string, 'null']
          format: uuid
        projection:
          $ref: '#/components/schemas/HealthProjection'
        sensitivity:
          $ref: '#/components/schemas/HealthCaseSensitivity'
          description: Present only in the clinical projection.
        encounters:
          type: array
          items:
            $ref: '#/components/schemas/Encounter'
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    HealthCasePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HealthCase'
        nextCursor:
          type: [string, 'null']
    Encounter:
      type: object
      additionalProperties: false
      required: [id, caseId, encounterType, startedAt, projection, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        encounterType:
          $ref: '#/components/schemas/EncounterType'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
        locationId:
          type: [string, 'null']
          format: uuid
        practitionerId:
          type: [string, 'null']
          format: uuid
        projection:
          $ref: '#/components/schemas/HealthProjection'
        branchCode:
          type: [string, 'null']
          maxLength: 64
          description: |
            The medical branch, from a code system. Present only in the clinical
            projection: a branch of "onkoloji" is a diagnosis anybody can read off a roster.
        notesClinical:
          type: [string, 'null']
          maxLength: 4000
          description: Present only in the clinical projection.
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    Diagnosis:
      type: object
      additionalProperties: false
      required:
        [id, encounterId, codeSystemId, codeSystemCode, codeValueId, code, display,
         diagnosisType, sensitive, recordedAt]
      properties:
        id:
          type: string
          format: uuid
        encounterId:
          type: string
          format: uuid
        codeSystemId:
          type: string
          format: uuid
        codeSystemCode:
          type: string
          description: The code system the diagnosis was coded in, for example ICD10.
        codeValueId:
          type: string
          format: uuid
        code:
          type: string
        display:
          type: string
        diagnosisType:
          $ref: '#/components/schemas/DiagnosisType'
        sensitive:
          type: boolean
          description: |
            Read from the code value's own category when the diagnosis was written, never
            sent by a caller. It appears only here, where the caller already holds the
            clinical read this endpoint requires.
        recordedAt:
          type: string
          format: date-time
        recordedBy:
          type: [string, 'null']
          format: uuid
    DiagnosisList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Diagnosis'
    CreateHealthCase:
      type: object
      additionalProperties: false
      required: [personId, enrollmentId, caseType]
      properties:
        personId:
          type: string
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
          description: |
            Optional: an enrollment belongs to exactly one program, so the server derives it
            and refuses a caller that names a different one. A provider-scoped actor may
            read neither programs nor enrollments and could not repeat an id it never saw.
        enrollmentId:
          type: string
          format: uuid
        caseType:
          $ref: '#/components/schemas/HealthCaseType'
        providerOrganizationId:
          type: [string, 'null']
          format: uuid
          description: |
            The provider the case belongs to. A provider-scoped caller may only name an
            organization it holds, and one holding exactly one does not have to say which.
        openedAt:
          type: [string, 'null']
          format: date-time
          description: Defaults to now; may not be in the future.
        serviceRequestId:
          type: [string, 'null']
          format: uuid
          description: |
            The DIRECT_SERVICE or PREAUTHORIZATION request the case was opened for. Null for
            a case a provider opened standalone.
    CloseHealthCase:
      type: object
      additionalProperties: false
      properties:
        reasonText:
          type: [string, 'null']
          maxLength: 200
          description: |
            Free text kept on the audit row, not on the case. Two hundred characters is the
            audit detail limit: a longer value would be dropped by the sanitiser without
            anybody being told, so it is refused here instead.
    CreateEncounter:
      type: object
      additionalProperties: false
      required: [encounterType, startedAt]
      properties:
        encounterType:
          $ref: '#/components/schemas/EncounterType'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
        locationId:
          type: [string, 'null']
          format: uuid
        practitionerId:
          type: [string, 'null']
          format: uuid
        branchCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_.-]{0,63}$'
        notesClinical:
          type: [string, 'null']
          maxLength: 4000
    DiagnosisInput:
      type: object
      additionalProperties: false
      required: [codeValueId, diagnosisType]
      properties:
        codeValueId:
          type: string
          format: uuid
          description: |
            The catalogue code value. Its code system and its sensitivity are read from the
            catalogue, so neither is a field a caller can disagree with.
        diagnosisType:
          $ref: '#/components/schemas/DiagnosisType'
    PutEncounterDiagnoses:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DiagnosisInput'
          description: The whole set. An empty array clears the encounter's diagnoses.
    HealthAccessEvent:
      type: object
      additionalProperties: false
      required: [id, occurredAt, actorId, resourceType, accessType, outcome]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
        membershipId:
          type: [string, 'null']
          format: uuid
        personId:
          type: [string, 'null']
          format: uuid
        resourceType:
          type: string
        resourceId:
          type: [string, 'null']
          format: uuid
        accessType:
          type: string
          enum: [VIEW, SEARCH, DOWNLOAD, EXPORT, PRINT, BREAK_GLASS]
        purposeCode:
          type: [string, 'null']
        reasonText:
          type: [string, 'null']
          maxLength: 200
        outcome:
          type: string
          enum: [SUCCESS, DENIED]
    HealthAccessLogPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HealthAccessEvent'
        nextCursor:
          type: [string, 'null']
    MedicalReportStatus:
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, CANCELLED, EXPIRED, SUPERSEDED]
      description: |
        SUPERSEDED is what a version becomes when a later version of its chain is approved. It
        is not a decision anybody gives: the chain may hold at most one approved version, so
        approving a correction has to move the earlier one out of APPROVED, and nothing else
        about that row changes.
    MedicalReportUsedByType:
      type: string
      enum: [SERVICE_REQUEST, AUTHORIZATION, CLAIM]
    MedicalReport:
      type: object
      additionalProperties: false
      required:
        [id, personId, reference, versionNo, rootReportId, issuedAt, validFrom, validTo,
         status, projection, services, documents, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        caseId:
          type: [string, 'null']
          format: uuid
        reference:
          type: string
          description: |
            Names the chain rather than the version: every version of one report shares it,
            and (reference, versionNo) is what identifies a version.
        versionNo:
          type: integer
          minimum: 1
        rootReportId:
          type: string
          format: uuid
          description: The first version of the chain. Version 1 is its own root.
        supersedesReportId:
          type: [string, 'null']
          format: uuid
        reportType:
          type: string
          description: |
            Present only in the clinical projection. A report type is a diagnosis anybody can
            read off a list.
        reportSubtype:
          type: [string, 'null']
          description: Present only in the clinical projection.
        issuingPractitionerId:
          type: [string, 'null']
          format: uuid
        issuingProviderOrganizationId:
          type: [string, 'null']
          format: uuid
        issuedAt:
          type: string
          format: date
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: Inclusive. The expiry job moves an approved report past it to EXPIRED.
        status:
          $ref: '#/components/schemas/MedicalReportStatus'
        projection:
          $ref: '#/components/schemas/HealthProjection'
        clinicalSummary:
          type: [string, 'null']
          maxLength: 4000
          description: Present only in the clinical projection.
        reviewComment:
          type: [string, 'null']
          maxLength: 4000
          description: |
            The reviewer's note. Clinical text, present only in the clinical projection, and
            never carried by a notification, an audit detail or a work item title.
        rejectReasonCode:
          type: [string, 'null']
        reviewedBy:
          type: [string, 'null']
          format: uuid
        reviewedAt:
          type: [string, 'null']
          format: date-time
        submittedAt:
          type: [string, 'null']
          format: date-time
        submittedBy:
          type: [string, 'null']
          format: uuid
        services:
          type: array
          items:
            $ref: '#/components/schemas/MedicalReportService'
        documents:
          type: array
          description: |
            The report's attachments. Empty in the financial projection — a document list
            naming "PSIKIYATRI_RAPORU" is a diagnosis on a filename, and a count of them is a
            fact about the patient too.
          items:
            $ref: '#/components/schemas/MedicalReportDocument'
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    MedicalReportPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MedicalReport'
        nextCursor:
          type: [string, 'null']
    MedicalReportService:
      type: object
      additionalProperties: false
      required: [id, serviceDefinitionId, serviceCode, serviceName]
      properties:
        id:
          type: string
          format: uuid
        serviceDefinitionId:
          type: string
          format: uuid
        serviceCode:
          type: string
        serviceName:
          type: string
        coveredQuantity:
          type: [string, 'null']
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
          description: Exact decimal as a string; never a JSON number.
        coveredAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        notes:
          type: [string, 'null']
          maxLength: 1000
          description: |
            Present only in the clinical projection. The line a doctor writes about this
            service for this person is clinical, whatever the service is.
    MedicalReportDocument:
      type: object
      additionalProperties: false
      required: [id, objectId, documentTypeCode, originalFilename, contentType, scanStatus, classification, createdAt]
      properties:
        id:
          type: string
          format: uuid
        objectId:
          type: string
          format: uuid
        documentTypeCode:
          type: string
        purpose:
          type: [string, 'null']
        requiredPermission:
          type: [string, 'null']
          description: |
            The link's own answer to who may download through it. A report attachment names
            health.clinical.read, and the download refuses a caller who may read documents in
            general but not that one.
        originalFilename:
          type: string
        contentType:
          type: string
        scanStatus:
          type: string
          enum: [PENDING, SCANNING, CLEAN, INFECTED, FAILED]
        classification:
          type: string
          enum: [INTERNAL, CONFIDENTIAL, PERSONAL, HEALTH]
        createdAt:
          type: string
          format: date-time
    MedicalReportUsage:
      type: object
      additionalProperties: false
      required: [id, reportId, usedByType, usedById, usedAt]
      properties:
        id:
          type: string
          format: uuid
        reportId:
          type: string
          format: uuid
        usedByType:
          $ref: '#/components/schemas/MedicalReportUsedByType'
        usedById:
          type: string
          format: uuid
        usedAt:
          type: string
          format: date-time
    MedicalReportUsagePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MedicalReportUsage'
        nextCursor:
          type: [string, 'null']
    CreateMedicalReport:
      type: object
      additionalProperties: false
      required: [personId]
      properties:
        personId:
          type: string
          format: uuid
        caseId:
          type: [string, 'null']
          format: uuid
          description: |
            The episode of care the report belongs to. Null for a report written outside one
            the platform holds — a report a member brings from a hospital the tenant has no
            case with is still a report. The case has to be the same person's.
        supersedesReportId:
          type: [string, 'null']
          format: uuid
          description: |
            The decided version this one corrects. With it, everything below is optional: the
            new version inherits the header and the service lines of the version it corrects.
        reportType:
          type: string
          pattern: '^[A-Z][A-Z0-9_.-]{0,63}$'
          description: |
            A code system value, governed by the code system WP-I5-05 seeds. Required unless
            the report is a correction, which inherits it.
        reportSubtype:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_.-]{0,63}$'
        issuingPractitionerId:
          type: [string, 'null']
          format: uuid
        issuingProviderOrganizationId:
          type: [string, 'null']
          format: uuid
        issuedAt:
          type: [string, 'null']
          format: date
          description: The day the doctor wrote it. May not be in the future.
        validFrom:
          type: [string, 'null']
          format: date
        validTo:
          type: [string, 'null']
          format: date
        clinicalSummary:
          type: [string, 'null']
          maxLength: 4000
          description: |
            HEALTH-classified free text. It is served only in the clinical projection and
            never reaches a notification, an audit detail, a work item title or a log line.
    PatchMedicalReportDraft:
      type: object
      additionalProperties: false
      required: [reportType, issuedAt, validFrom, validTo]
      properties:
        caseId:
          type: [string, 'null']
          format: uuid
        reportType:
          type: string
          pattern: '^[A-Z][A-Z0-9_.-]{0,63}$'
        reportSubtype:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_.-]{0,63}$'
        issuingPractitionerId:
          type: [string, 'null']
          format: uuid
        issuingProviderOrganizationId:
          type: [string, 'null']
          format: uuid
        issuedAt:
          type: string
          format: date
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        clinicalSummary:
          type: [string, 'null']
          maxLength: 4000
    MedicalReportServiceInput:
      type: object
      additionalProperties: false
      required: [serviceDefinitionId]
      properties:
        serviceDefinitionId:
          type: string
          format: uuid
        coveredQuantity:
          type: [string, 'null']
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
          description: |
            Exact decimal as a string, never a JSON number: a limit that depended on binary
            rounding would be a limit two systems disagree about.
        coveredAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
          description: |
            Required when an amount is given: an amount without a currency is a number.
        notes:
          type: [string, 'null']
          maxLength: 1000
    PutMedicalReportServices:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MedicalReportServiceInput'
          description: The whole set. An empty array clears the report's service lines.
    DecideMedicalReport:
      type: object
      additionalProperties: false
      properties:
        reviewComment:
          type: [string, 'null']
          maxLength: 4000
          description: |
            The reviewer's note. Clinical text: it is stored on the report, served only in the
            clinical projection, and never carried by the decision notification.
    RejectMedicalReport:
      type: object
      additionalProperties: false
      required: [rejectReasonCode]
      properties:
        rejectReasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
          description: |
            Why, as a code. A rejection nobody can count is a rejection nobody can improve on.
        reviewComment:
          type: [string, 'null']
          maxLength: 4000
    InpatientStayStatus:
      type: string
      enum: [REQUESTED, AUTHORIZED, ADMITTED, DISCHARGED, CANCELLED, REJECTED]
      description: |
        REQUESTED, AUTHORIZED and ADMITTED are the three the one-open-stay rule calls open: a
        case may have at most one stay in any of them at any one provider. AUTHORIZED and
        REJECTED are not given by an endpoint of this module — they are what the stay becomes
        when the reviewer decides its preauthorization request.
    StayExtensionStatus:
      type: string
      enum: [REQUESTED, APPROVED, REJECTED, CANCELLED]
    StaySegmentType:
      type: string
      enum: [WARD, ICU, SURGERY, OBSERVATION, COMPANION]
      description: |
        COMPANION is the relative staying in the room. It is the one type outside the overlap
        constraint, because a companion is in the room while the patient is.
    InpatientStay:
      type: object
      additionalProperties: false
      required:
        [id, caseId, personId, providerOrganizationId, admissionAt, estimatedDays,
         expectedDischargeAt, status, projection, serviceRequestId, overAuthorization,
         extensions, segments, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        providerOrganizationId:
          type: string
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
        attendingPractitionerId:
          type: [string, 'null']
          format: uuid
        admissionAt:
          type: string
          format: date-time
        estimatedDays:
          type: integer
          minimum: 1
        expectedDischargeAt:
          type: string
          format: date-time
          description: |
            Derived from the admission and the estimate at write, and moved forward by every
            approved extension. It is what the authorization's validity is set from.
        dischargeAt:
          type: [string, 'null']
          format: date-time
        status:
          $ref: '#/components/schemas/InpatientStayStatus'
        projection:
          $ref: '#/components/schemas/HealthProjection'
        serviceRequestId:
          type: string
          format: uuid
          description: The PREAUTHORIZATION request a reviewer decides the admission on.
        authorizationId:
          type: [string, 'null']
          format: uuid
        admissionDiagnosisId:
          type: [string, 'null']
          format: uuid
          description: |
            Present only in the clinical projection. That an admission has a recorded
            diagnosis at all is a fact about the patient.
        authorizedDays:
          type: [string, 'null']
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
          description: |
            What the reviewer actually approved, which is not always what was asked for, plus
            every approved extension. Exact decimal as a string, never a JSON number. Absent
            until the request is decided.
        actualDays:
          type: [string, 'null']
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
          description: Written at discharge; absent before it.
        releasedDays:
          type: [string, 'null']
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
          description: |
            What was given back to the member's entitlement at discharge. Absent before it.
        overAuthorization:
          type: boolean
          description: |
            The admission used more days than were approved. Nothing was released, and the
            claim raises it as an exception.
        cancelReasonCode:
          type: [string, 'null']
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/StayExtension'
        segments:
          type: array
          description: |
            Where the patient was, hour by hour. Served in both projections: it is what a
            claim is priced from, and a claims reviewer who could not see an intensive care
            night could not check the bill for one.
          items:
            $ref: '#/components/schemas/StaySegment'
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    InpatientStayPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InpatientStay'
        nextCursor:
          type: [string, 'null']
    StayExtension:
      type: object
      additionalProperties: false
      required:
        [id, stayId, sequenceNo, additionalDays, reasonCode, serviceRequestId, status,
         createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        stayId:
          type: string
          format: uuid
        sequenceNo:
          type: integer
          minimum: 1
        additionalDays:
          type: integer
          minimum: 1
        reasonCode:
          type: string
        reasonText:
          type: [string, 'null']
          maxLength: 1000
          description: |
            Why the doctor wants more days, in the doctor's words. Clinical text, present only
            in the clinical projection.
        serviceRequestId:
          type: string
          format: uuid
        authorizationId:
          type: [string, 'null']
          format: uuid
          description: The extension's own hold, which is where the added days are reserved.
        status:
          $ref: '#/components/schemas/StayExtensionStatus'
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    StaySegment:
      type: object
      additionalProperties: false
      required: [id, stayId, segmentType, startsAt, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        stayId:
          type: string
          format: uuid
        segmentType:
          $ref: '#/components/schemas/StaySegmentType'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time
          description: |
            Null while the segment is still running. Discharge ends every open segment at the
            discharge moment.
        roomCode:
          type: [string, 'null']
          maxLength: 32
        bedCode:
          type: [string, 'null']
          maxLength: 32
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    StaySegmentInput:
      type: object
      additionalProperties: false
      required: [segmentType, startsAt]
      properties:
        segmentType:
          $ref: '#/components/schemas/StaySegmentType'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: [string, 'null']
          format: date-time
        roomCode:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9][A-Za-z0-9 ._/-]{0,31}$'
        bedCode:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9][A-Za-z0-9 ._/-]{0,31}$'
    CreateInpatientStay:
      type: object
      additionalProperties: false
      required: [caseId, providerOrganizationId, admissionAt, estimatedDays]
      properties:
        caseId:
          type: string
          format: uuid
        providerOrganizationId:
          type: string
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
        attendingPractitionerId:
          type: [string, 'null']
          format: uuid
        admissionAt:
          type: string
          format: date-time
          description: |
            Checked against the tenant's backdating and future-dating window. Outside it the
            answer is 422 ADMISSION_DATE_OUT_OF_WINDOW.
        estimatedDays:
          type: integer
          minimum: 1
          maximum: 365
          description: |
            How long the admission is expected to take. It becomes the requested quantity of
            the preauthorization and the length of the authorization's validity.
        admissionDiagnosisId:
          type: [string, 'null']
          format: uuid
          description: |
            A diagnosis of one of this case's own encounters. A diagnosis from another case is
            refused: an id alone would never say it belonged to somebody else.
    ExtendInpatientStay:
      type: object
      additionalProperties: false
      required: [additionalDays, reasonCode]
      properties:
        additionalDays:
          type: integer
          minimum: 1
          maximum: 365
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
          description: Why, as a code. A reason nobody can count is a reason nobody can act on.
        reasonText:
          type: [string, 'null']
          maxLength: 1000
          description: |
            Clinical text: it is stored on the extension, served only in the clinical
            projection, and never carried by a notification or an audit detail.
    PutStaySegments:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/StaySegmentInput'
          description: The whole set. An empty array clears the stay's segments.
    DischargeInpatientStay:
      type: object
      additionalProperties: false
      properties:
        dischargeAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the patient went home. Defaults to now; it may not be before the admission or
            in the future.
    CancelInpatientStay:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        reasonText:
          type: [string, 'null']
          maxLength: 1000
    StayReconciliation:
      type: object
      additionalProperties: false
      required:
        [stayId, admissionAt, dischargeAt, authorizedDays, actualDays, releasedDays,
         overAuthorization]
      properties:
        stayId:
          type: string
          format: uuid
        authorizationId:
          type: [string, 'null']
          format: uuid
        admissionAt:
          type: string
          format: date-time
        dischargeAt:
          type: string
          format: date-time
        authorizedDays:
          type: string
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
          description: |
            Exact decimal as a string, never a JSON number: a day count that depended on
            binary rounding would be a day count two systems disagree about.
        actualDays:
          type: string
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
        releasedDays:
          type: string
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
          description: |
            What was given back. Zero when the admission used everything it was approved for,
            and zero when it ran over.
        overAuthorization:
          type: boolean
    ClaimStatus:
      type: string
      enum:
        [DRAFT, SUBMITTED, AUTO_ADJUDICATED, PENDING_MEDICAL, PENDING_FINANCIAL, RETURNED,
         PARTIALLY_APPROVED, APPROVED, REJECTED, INVOICED, BATCHED, SETTLED, CLOSED_UNPAID,
         CANCELLED]
      description: |
        The claim lifecycle of v1.2 12.5. INVOICED, BATCHED and SETTLED are declared because
        the lifecycle is one list; the commands that reach them belong to M7 and nothing in
        this contract puts a claim into one of them.

        CLOSED_UNPAID is where a claim lands when the payer rejects the icmal invoice that was
        collecting it (WP-I7-03). The decision stands, the money will not be paid, and the
        claim is finished. It is not CANCELLED -- nobody withdrew it -- and it is not REJECTED,
        which is the payer refusing the *claim* rather than refusing to pay a document that
        billed it.
    ClaimVersionStatus:
      type: string
      enum: [DRAFT, SUBMITTED, SUPERSEDED]
    ClaimDecisionKind:
      type: string
      enum: [APPROVED, PARTIALLY_APPROVED, REJECTED, CUT]
      description: |
        What was decided about one line. CUT is a reduction the payer applied to an otherwise
        valid line; PARTIALLY_APPROVED is a smaller quantity than was claimed. They are two
        words because a provider reads them differently and disputes them differently.
    ClaimDecisionStage:
      type: string
      enum: [AUTO, MEDICAL, FINANCIAL]
      description: |
        Who decided. AUTO means the rules did and nobody looked, which is why an AUTO decision
        never carries a `decidedBy`.
    ClaimException:
      type: object
      additionalProperties: false
      required: [code, stage]
      description: |
        One thing the submit pipeline found that a person has to look at. It is not a decision
        — the line is still undecided — it is the answer to "why is this claim in front of me",
        line by line, which is the first thing either reviewer's screen has to say.

        `detail` carries the fact the reviewer needs and nothing else: the reference of the
        other claim a duplicate suspicion found, the quantity a hold still had, the code of the
        rule that asked for a review. Never a diagnosis, never a line description.

        The three report codes — `REPORT_NOT_APPROVED`, `REPORT_OUT_OF_WINDOW`,
        `SERVICE_NOT_IN_REPORT` — are served only in the clinical projection, for the same
        reason `medicalReportId` is: an exception naming a treatment report says the line leans
        on one.
      properties:
        lineNo:
          type: [integer, 'null']
          minimum: 1
          description: Null for an exception about the claim as a whole.
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        stage:
          $ref: '#/components/schemas/ClaimDecisionStage'
        detail:
          type: [string, 'null']
          maxLength: 200
    ClaimLine:
      type: object
      additionalProperties: false
      required:
        [id, lineNo, serviceDefinitionId, unitType, quantity, lineAmount, currencyCode,
         createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        lineNo:
          type: integer
          minimum: 1
        serviceDefinitionId:
          type: string
          format: uuid
        serviceCode:
          type: [string, 'null']
          description: The catalogue code of the service, resolved on the way out.
        unitType:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        quantity:
          type: string
          description: Exact decimal as a string, never a JSON number.
        unitAmount:
          type: [string, 'null']
        lineAmount:
          type: string
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        diagnosisId:
          type: [string, 'null']
          format: uuid
          description: |
            Present only in the clinical projection. An id beside a name is an invitation to
            go and look it up.
        medicalReportId:
          type: [string, 'null']
          format: uuid
          description: |
            Present only in the clinical projection: that a line leans on a treatment report
            at all is a fact about the patient.
        practitionerId:
          type: [string, 'null']
          format: uuid
        description:
          type: [string, 'null']
          maxLength: 1000
          description: |
            The provider's own words about the line. Present only in the clinical projection —
            "sol diz artroskopi sonrası kontrol" is a diagnosis in a sentence, and a provider
            typing a line description is not thinking about who will read it.
        decision:
          oneOf:
            - $ref: '#/components/schemas/ClaimLineDecision'
            - type: 'null'
          description: |
            The latest decision for this line, or null while nobody has decided it. The history
            is append-only in the database; this is its head.
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    ClaimLineDecision:
      type: object
      additionalProperties: false
      required:
        [id, lineId, decidedInVersionNo, decision, approvedQuantity, approvedAmount,
         payerAmount, memberAmount, reasonCode, decidedAt, stage]
      properties:
        id:
          type: string
          format: uuid
        lineId:
          type: string
          format: uuid
        decidedInVersionNo:
          type: integer
          minimum: 1
        decision:
          $ref: '#/components/schemas/ClaimDecisionKind'
        approvedQuantity:
          type: string
        approvedAmount:
          type: string
        contractAmount:
          type: [string, 'null']
          description: |
            What the contract said the line costs, before anything was cut from it. Null when
            the pricing ladder found no contracted price, which is itself a reason for review.
        payerAmount:
          type: string
        memberAmount:
          type: string
          description: |
            payerAmount plus memberAmount is exactly approvedAmount. It is a database CHECK as
            well as a validation.
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        reasonText:
          type: [string, 'null']
          maxLength: 1000
          description: |
            The reviewer's own words. A MEDICAL decision's reason text is clinical and is
            present only in the clinical projection.
        decidedBy:
          type: [string, 'null']
          format: uuid
          description: Null when the rules decided it.
        decidedAt:
          type: string
          format: date-time
        stage:
          $ref: '#/components/schemas/ClaimDecisionStage'
    Claim:
      type: object
      additionalProperties: false
      required:
        [id, reference, personId, programId, enrollmentId, providerOrganizationId, domainCode,
         currentVersionNo, status, serviceDateFrom, serviceDateTo, channel, projection, lines,
         exceptions, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: '^[A-Z][A-Z0-9-]{3,63}$'
        personId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        providerOrganizationId:
          type: string
          format: uuid
        domainCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        sourceType:
          oneOf:
            - $ref: '#/components/schemas/ClaimSourceType'
            - type: 'null'
          description: |
            What the claim came from. Null together with `sourceId` on a claim raised by hand
            against nothing, which is an ordinary claim.
        sourceId:
          type: [string, 'null']
          format: uuid
          description: The case, booking or reimbursement request the claim was raised from.
        caseId:
          type: [string, 'null']
          format: uuid
        fulfilmentId:
          type: [string, 'null']
          format: uuid
        authorizationId:
          type: [string, 'null']
          format: uuid
        currentVersionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ClaimStatus'
        serviceDateFrom:
          type: string
          format: date
        serviceDateTo:
          type: string
          format: date
        channel:
          $ref: '#/components/schemas/ServiceRequestChannel'
        projection:
          $ref: '#/components/schemas/HealthProjection'
        rejectReasonCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        returnReasonCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        reviewCommentMedical:
          type: [string, 'null']
          maxLength: 2000
          description: |
            The medical reviewer's comment. Present only in the clinical projection: it is a
            doctor's sentence about a patient.
        reviewCommentFinancial:
          type: [string, 'null']
          maxLength: 2000
        closedAt:
          type: [string, 'null']
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ClaimLine'
          description: The lines of the current version, with the decision each carries.
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/ClaimException'
          description: |
            What the submit pipeline found that a person has to look at, read back from the
            frozen snapshot of the current version. Empty on a draft and on a claim nothing
            objected to.
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    ClaimPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
        nextCursor:
          type: [string, 'null']
    ClaimVersionSummary:
      type: object
      additionalProperties: false
      required: [id, versionNo, status, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ClaimVersionStatus'
        submittedAt:
          type: [string, 'null']
          format: date-time
        submittedBy:
          type: [string, 'null']
          format: uuid
        returnedAt:
          type: [string, 'null']
          format: date-time
        returnedBy:
          type: [string, 'null']
          format: uuid
        returnReasonCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        returnReasonText:
          type: [string, 'null']
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    ClaimVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClaimVersionSummary'
    ClaimVersion:
      type: object
      additionalProperties: false
      required: [version, projection, lines, exceptions]
      properties:
        version:
          $ref: '#/components/schemas/ClaimVersionSummary'
        projection:
          $ref: '#/components/schemas/HealthProjection'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ClaimLine'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/ClaimException'
    ClaimCaseSource:
      type: object
      additionalProperties: false
      required: [caseId, openedAt, serviceDate, requestReference, personDisplayName, rowVersion]
      properties:
        caseId:
          type: string
          format: uuid
        openedAt:
          type: string
          format: date-time
        serviceDate:
          type: string
          format: date
        requestReference:
          type: string
        personDisplayName:
          type: string
        rowVersion:
          type: integer
          format: int64
    ClaimCaseSourcePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClaimCaseSource'
        nextCursor:
          type: string
    ClaimCaseSourceLine:
      type: object
      additionalProperties: false
      required: [serviceDefinitionId, serviceCode, serviceName, unitType, quantity]
      properties:
        serviceDefinitionId:
          type: string
          format: uuid
        serviceCode:
          type: string
        serviceName:
          type: string
        unitType:
          type: string
        quantity:
          type: string
    ClaimCaseSourceDetail:
      type: object
      additionalProperties: false
      required: [source, lines]
      properties:
        source:
          $ref: '#/components/schemas/ClaimCaseSource'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ClaimCaseSourceLine'
    CreateClaimFromCase:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ClaimCaseCharge'
    ClaimCaseCharge:
      type: object
      additionalProperties: false
      required: [serviceDefinitionId, quantity, lineAmount]
      properties:
        serviceDefinitionId:
          type: string
          format: uuid
        quantity:
          type: string
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
        lineAmount:
          type: string
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'

    NewClaimLine:
      type: object
      additionalProperties: false
      required: [lineNo, serviceDefinitionId, unitType, quantity, lineAmount]
      properties:
        lineNo:
          type: integer
          minimum: 1
          maximum: 500
        serviceDefinitionId:
          type: string
          format: uuid
        unitType:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        quantity:
          type: string
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
        unitAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
        lineAmount:
          type: string
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        diagnosisId:
          type: [string, 'null']
          format: uuid
        medicalReportId:
          type: [string, 'null']
          format: uuid
        practitionerId:
          type: [string, 'null']
          format: uuid
        description:
          type: [string, 'null']
          maxLength: 1000
    CreateClaim:
      type: object
      additionalProperties: false
      required:
        [personId, programId, enrollmentId, providerOrganizationId, serviceDateFrom,
         serviceDateTo, lines]
      properties:
        personId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        providerOrganizationId:
          type: string
          format: uuid
        caseId:
          type: [string, 'null']
          format: uuid
        bookingId:
          type: [string, 'null']
          format: uuid
          description: |
            The stay this claim bills, for a lodging claim raised by hand. It sets the claim's
            source to `BOOKING` and its domain to `ACCOMMODATION`, and one booking may have
            only one live claim — a second is refused. A completed stay ordinarily needs none
            of this: the claim is raised by the outbox handler of `booking.checked_out`.

            It may not be sent together with `caseId`: a claim comes from one thing.
        fulfilmentId:
          type: [string, 'null']
          format: uuid
        authorizationId:
          type: [string, 'null']
          format: uuid
        serviceDateFrom:
          type: string
          format: date
        serviceDateTo:
          type: string
          format: date
        channel:
          oneOf:
            - $ref: '#/components/schemas/ServiceRequestChannel'
            - type: 'null'
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/NewClaimLine'
    PatchClaimDraft:
      type: object
      additionalProperties: false
      required: [serviceDateFrom, serviceDateTo]
      description: |
        Every field is sent every time: a merge would make "clear the authorization"
        unexpressible.
      properties:
        serviceDateFrom:
          type: string
          format: date
        serviceDateTo:
          type: string
          format: date
        channel:
          oneOf:
            - $ref: '#/components/schemas/ServiceRequestChannel'
            - type: 'null'
        caseId:
          type: [string, 'null']
          format: uuid
        fulfilmentId:
          type: [string, 'null']
          format: uuid
        authorizationId:
          type: [string, 'null']
          format: uuid
    PutClaimLines:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/NewClaimLine'
    ClaimLineDecisionInput:
      type: object
      additionalProperties: false
      required: [lineNo, decision, approvedQuantity, approvedAmount, payerAmount, memberAmount, reasonCode]
      properties:
        lineNo:
          type: integer
          minimum: 1
        decision:
          $ref: '#/components/schemas/ClaimDecisionKind'
        approvedQuantity:
          type: string
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
        approvedAmount:
          type: string
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
        payerAmount:
          type: string
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
        memberAmount:
          type: string
          pattern: '^[0-9]{1,14}(\.[0-9]{1,6})?$'
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        reasonText:
          type: [string, 'null']
          maxLength: 1000
          description: |
            Free text the reviewer typed. On a MEDICAL decision it is clinical and is served
            only in the clinical projection.
    DecideClaimLines:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ClaimLineDecisionInput'
        reviewComment:
          type: [string, 'null']
          maxLength: 2000
          description: |
            The reviewer's comment on the claim as a whole. It is stored on the medical or the
            financial comment column according to the stage, which is why the two are separate
            columns rather than one with a flag.
    ClaimReason:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        reasonText:
          type: [string, 'null']
          maxLength: 1000
    ClaimDecisionReason:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        reasonText:
          type: [string, 'null']
          maxLength: 1000
        reviewComment:
          type: [string, 'null']
          maxLength: 2000
    ClaimReturnReason:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        reasonText:
          type: [string, 'null']
          maxLength: 1000
          description: |
            What the provider has to correct, in the reviewer's words. It is stored on the
            version that was sent back, because the reason belongs to that version rather than
            to the claim as a whole.
    ClaimInvoiceBlocker:
      type: string
      enum: [PROVIDER_TAX_IDENTITY_MISSING, CURRENCY_NOT_SINGLE, LINE_NOT_DECIDED]
      description: |
        Named rather than counted, so a screen can say what to fix rather than "not ready".
    ClaimInvoiceReadiness:
      type: object
      additionalProperties: false
      required:
        [claimId, status, currencyCode, lineTotal, adjustmentTotal, approvedTotal, payerTotal,
         memberTotal, lineCount, adjustmentCount, decidedLineCount, ready, blockers]
      properties:
        claimId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ClaimStatus'
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        lineTotal:
          type: string
          description: |
            The sum of every line's approved amount, before any adjustment. Exact decimal as a
            string, never a JSON number and never a total a frontend added up.
        adjustmentTotal:
          type: string
          description: |
            The signed sum of the claim's adjustments. A cut and a recovery add to it, a
            correction may go either way, and a reversal subtracts exactly what the row it
            reverses added — so a cut followed by its reversal leaves this at zero.
        approvedTotal:
          type: string
          description: |
            `lineTotal` minus `adjustmentTotal`. It is the figure an invoice is checked
            against, computed on the server once.
        payerTotal:
          type: string
        memberTotal:
          type: string
          description: payerTotal plus memberTotal is exactly approvedTotal.
        lineCount:
          type: integer
          minimum: 0
        adjustmentCount:
          type: integer
          minimum: 0
        decidedLineCount:
          type: integer
          minimum: 0
        ready:
          type: boolean
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/ClaimInvoiceBlocker'
    ClaimSourceType:
      type: string
      enum: [HEALTH_CASE, BOOKING, REIMBURSEMENT]
      description: |
        What a claim was raised from. It is one vocabulary for every vertical, so a settlement
        never has to know which module wrote a claim.
    ClaimAdjustmentType:
      type: string
      enum: [CUT, RECOVERY, CORRECTION, REVERSAL]
      description: |
        `CUT` is money the payer took off an otherwise valid claim, `RECOVERY` is money already
        paid coming back, `CORRECTION` is an arithmetic or pricing mistake either way.
        `REVERSAL` is not a fourth kind of money — it is the negative of one of the three, and
        it is the only way an adjustment is ever undone.
    ClaimAdjustmentSource:
      type: string
      enum: [CANCELLATION, NO_SHOW, REVIEW, MANUAL, RECOVERY]
      description: |
        Where the adjustment came from. `CANCELLATION` and `NO_SHOW` are written by the outbox
        handler of a booking event against the fee row that assessed the fee, and are the only
        two a caller may not name.
    ClaimAdjustment:
      type: object
      additionalProperties: false
      required:
        [id, claimId, versionNo, adjustmentType, amount, payerAmount, memberAmount,
         currencyCode, reasonCode, sourceType, createdAt]
      description: |
        One ledger line: money that moved on a claim for a reason that is not a line decision.
        Append-only — nothing here is ever edited, and an adjustment taken back is a `REVERSAL`
        naming it while both rows stay on the record.
      properties:
        id:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        claimLineId:
          type: [string, 'null']
          format: uuid
          description: |
            The line a line-level adjustment names. Null is the claim-level case and is
            ordinary: a recovery of an overpayment is about the claim, not one of its lines.
        adjustmentType:
          $ref: '#/components/schemas/ClaimAdjustmentType'
        amount:
          type: string
          description: Exact decimal. Negative on a REVERSAL and on a CORRECTION that gives back.
        payerAmount:
          type: string
        memberAmount:
          type: string
          description: payerAmount plus memberAmount is exactly amount. It is a database CHECK.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        reasonText:
          type: [string, 'null']
          maxLength: 1000
        sourceType:
          $ref: '#/components/schemas/ClaimAdjustmentSource'
        sourceId:
          type: [string, 'null']
          format: uuid
          description: The cancellation or no-show row a system-written fee adjustment came from.
        reversesAdjustmentId:
          type: [string, 'null']
          format: uuid
          description: What this row takes back. Set on exactly a REVERSAL.
        createdBy:
          type: [string, 'null']
          format: uuid
          description: |
            Null for exactly the two system sources: a fee adjustment is written by an outbox
            handler and no person is behind it.
        createdAt:
          type: string
          format: date-time
    ClaimAdjustmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClaimAdjustment'
    CreateClaimAdjustment:
      type: object
      additionalProperties: false
      required: [reasonCode]
      description: |
        Either an adjustment or a reversal of one.

        A reversal sends `reversesAdjustmentId` and `reasonCode` and nothing else: the amount
        and the split are read off the row being reversed, which is what makes "a reversal
        restores the approved total exactly" a property of the server rather than of whoever
        typed the figures. Sending an amount with a reversal is a validation error.

        Everything else sends `adjustmentType`, `amount`, `payerAmount` and `memberAmount`,
        and the three amounts must satisfy `payerAmount + memberAmount = amount` exactly.
      properties:
        adjustmentType:
          oneOf:
            - $ref: '#/components/schemas/ClaimAdjustmentType'
            - type: 'null'
          description: Required unless this is a reversal. REVERSAL may not be named directly.
        amount:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,14}(\.[0-9]{1,6})?$'
        payerAmount:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,14}(\.[0-9]{1,6})?$'
        memberAmount:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,14}(\.[0-9]{1,6})?$'
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
          description: |
            Optional, and checked against the claim's own currency when it is sent. One claim
            is denominated once.
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
          description: From the closed list; an unknown code is 422.
        reasonText:
          type: [string, 'null']
          maxLength: 1000
        lineNo:
          type: [integer, 'null']
          minimum: 1
          description: The line of the claim's current version this adjustment belongs to.
        reversesAdjustmentId:
          type: [string, 'null']
          format: uuid
          description: Makes this a REVERSAL of that adjustment and nothing else.
    ClaimAdjustmentResult:
      type: object
      additionalProperties: false
      required: [adjustment, readiness]
      description: |
        The row that was written and the claim's totals as they stand after it, recomputed on
        the server by the same code `getClaimInvoiceReadiness` runs. Two sums would be two
        answers.
      properties:
        adjustment:
          $ref: '#/components/schemas/ClaimAdjustment'
        readiness:
          $ref: '#/components/schemas/ClaimInvoiceReadiness'
    ProviderEarningsStatusTotal:
      type: object
      additionalProperties: false
      required: [status, claimCount, approvedTotal]
      properties:
        status:
          $ref: '#/components/schemas/ClaimStatus'
        claimCount:
          type: integer
          minimum: 0
        approvedTotal:
          type: string
    ProviderEarningsCurrency:
      type: object
      additionalProperties: false
      required:
        [currencyCode, claimCount, approvedTotal, payerTotal, memberTotal, adjustmentTotal,
         invoiceableTotal, invoiceableClaimIds, byStatus]
      properties:
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        claimCount:
          type: integer
          minimum: 0
        approvedTotal:
          type: string
          description: Lines minus adjustments, across every decided claim in this currency.
        payerTotal:
          type: string
        memberTotal:
          type: string
        adjustmentTotal:
          type: string
        invoiceableTotal:
          type: string
          description: |
            The part of `approvedTotal` that is not yet on an invoice. A claim that has reached
            INVOICED, BATCHED or SETTLED is money somebody is already collecting.
        invoiceableClaimIds:
          type: array
          items:
            type: string
            format: uuid
        byStatus:
          type: array
          items:
            $ref: '#/components/schemas/ProviderEarningsStatusTotal'
    ProviderEarnings:
      type: object
      additionalProperties: false
      required: [providerOrganizationId, providerName, currencies]
      properties:
        providerOrganizationId:
          type: string
          format: uuid
        providerName:
          type: string
        from:
          type: [string, 'null']
          format: date
        to:
          type: [string, 'null']
          format: date
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/ProviderEarningsCurrency'
    PropertyType:
      type: string
      enum: [HOTEL, RESORT, GUESTHOUSE, SOCIAL_FACILITY, OTHER]
      description: |
        SOCIAL_FACILITY is the tenant's own guest house rather than a commercial hotel; it is
        the type that ordinarily carries a `costCenter` and no provider location.
    PropertyStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    PropertyAmenity:
      type: string
      enum:
        [WIFI, PARKING, BREAKFAST, HALF_BOARD, FULL_BOARD, ALL_INCLUSIVE, POOL, SPA, GYM,
         AIR_CONDITIONING, RESTAURANT, BEACH, STEP_FREE_ACCESS, PET_FRIENDLY, FAMILY_ROOM,
         SHUTTLE, LAUNDRY, MEETING_ROOM, KITCHENETTE, THERMAL]
      description: |
        The closed list of things a building has. Every key is a fact about the building and
        none of them is, or may become, a fact about a guest: there is no dietary and no
        medical key, because an amenities array is written by a provider clerk and read by
        everybody, and a slot a health need could be typed into is a slot it eventually would
        be.
    Property:
      type: object
      additionalProperties: false
      required:
        [id, providerOrganizationId, code, name, propertyType, timezone, amenities, status,
         createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        providerOrganizationId:
          type: string
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
          description: |
            The provider location this building already is in the network, when it is one. An
            internal social facility has none.
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'
        name:
          type: string
          maxLength: 200
        propertyType:
          $ref: '#/components/schemas/PropertyType'
        timezone:
          type: string
          maxLength: 64
          description: |
            The property's own IANA zone. A night begins and ends where the building is, so a
            stay in Berlin booked by a Turkish payer is counted in Berlin nights.
        city:
          type: [string, 'null']
          maxLength: 100
        regionCode:
          type: [string, 'null']
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,15}$'
        amenities:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PropertyAmenity'
        costCenter:
          type: [string, 'null']
          pattern: '^[A-Z0-9][A-Z0-9_.-]{0,31}$'
          description: |
            The internal cost centre a facility the tenant runs itself charges instead of
            invoicing (v1.2 9.13). Null for every commercial hotel.
        status:
          $ref: '#/components/schemas/PropertyStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    PropertyPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        nextCursor:
          type: [string, 'null']
    CreateProperty:
      type: object
      additionalProperties: false
      required: [providerOrganizationId, code, name, propertyType, timezone]
      properties:
        providerOrganizationId:
          type: string
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        propertyType:
          $ref: '#/components/schemas/PropertyType'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        city:
          type: [string, 'null']
          maxLength: 100
        regionCode:
          type: [string, 'null']
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,15}$'
        amenities:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PropertyAmenity'
        costCenter:
          type: [string, 'null']
          pattern: '^[A-Z0-9][A-Z0-9_.-]{0,31}$'
        status:
          oneOf:
            - $ref: '#/components/schemas/PropertyStatus'
            - type: 'null'
          description: Defaults to ACTIVE.
    PatchProperty:
      type: object
      additionalProperties: false
      required: [name, propertyType, timezone, status]
      description: |
        Every field is sent every time: a merge would make "this hotel no longer has a
        location" inexpressible.
      properties:
        locationId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        propertyType:
          $ref: '#/components/schemas/PropertyType'
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        city:
          type: [string, 'null']
          maxLength: 100
        regionCode:
          type: [string, 'null']
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,15}$'
        amenities:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PropertyAmenity'
        costCenter:
          type: [string, 'null']
          pattern: '^[A-Z0-9][A-Z0-9_.-]{0,31}$'
        status:
          $ref: '#/components/schemas/PropertyStatus'
    RoomType:
      type: object
      additionalProperties: false
      required:
        [id, propertyId, code, name, maxAdults, maxChildren, maxOccupancy, attributes,
         serviceDefinitionId, status, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'
        name:
          type: string
          maxLength: 200
        maxAdults:
          type: integer
          minimum: 1
          maximum: 20
        maxChildren:
          type: integer
          minimum: 0
          maximum: 20
        maxOccupancy:
          type: integer
          minimum: 1
          maximum: 40
          description: At least maxAdults; the database keeps that as a CHECK.
        attributes:
          type: object
          additionalProperties: true
          description: |
            The provider's own free-form facts about the room — bed layout, floor, view. It
            carries nothing about a guest.
        serviceDefinitionId:
          type: string
          format: uuid
          description: |
            The NIGHT-unit catalogue service this room is priced and entitled as. One room
            type, one service, and it is never edited.
        status:
          $ref: '#/components/schemas/PropertyStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    RoomTypeList:
      type: object
      additionalProperties: false
      required: [items]
      description: |
        Not a page. A property has a handful of room types, and paging a list of four would
        cost a cursor to say nothing.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomType'
    CreateRoomType:
      type: object
      additionalProperties: false
      required: [code, name, maxAdults, maxOccupancy, serviceDefinitionId]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        maxAdults:
          type: integer
          minimum: 1
          maximum: 20
        maxChildren:
          type: integer
          minimum: 0
          maximum: 20
        maxOccupancy:
          type: integer
          minimum: 1
          maximum: 40
        attributes:
          type: object
          additionalProperties: true
        serviceDefinitionId:
          type: string
          format: uuid
        status:
          oneOf:
            - $ref: '#/components/schemas/PropertyStatus'
            - type: 'null'
          description: Defaults to ACTIVE.
    PatchRoomType:
      type: object
      additionalProperties: false
      required: [name, maxAdults, maxOccupancy, status]
      description: Every field is sent every time; serviceDefinitionId is never among them.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        maxAdults:
          type: integer
          minimum: 1
          maximum: 20
        maxChildren:
          type: integer
          minimum: 0
          maximum: 20
        maxOccupancy:
          type: integer
          minimum: 1
          maximum: 40
        attributes:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/PropertyStatus'
    InventoryDay:
      type: object
      additionalProperties: false
      required: [stayDate, allotted, capacity, held, confirmed, available]
      properties:
        stayDate:
          type: string
          format: date
        allotted:
          type: boolean
          description: |
            False for a night this provider has opened nothing on. It is not the same
            statement as "zero free", and the availability search treats a night with no
            allotment as unavailable rather than as free.
        capacity:
          type: integer
          minimum: 0
        held:
          type: integer
          minimum: 0
        confirmed:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
          description: |
            capacity minus held minus confirmed, computed on the server so no screen
            subtracts.
        updatedAt:
          type: [string, 'null']
          format: date-time
        rowVersion:
          type: integer
          format: int64
    RoomTypeInventoryRange:
      type: object
      additionalProperties: false
      required: [roomTypeId, from, to, days]
      properties:
        roomTypeId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: array
          items:
            $ref: '#/components/schemas/InventoryDay'
          description: One entry per date of the range, in order, gaps included.
    PutRoomTypeInventory:
      type: object
      additionalProperties: false
      required: [from, to, capacity]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Inclusive last night of the allotment.
        capacity:
          type: integer
          minimum: 0
          maximum: 10000
          description: |
            How many rooms of this type the provider gives this payer on each night of the
            range. It is an allotment, not a count of the rooms the hotel owns.
    AvailabilitySearchRequest:
      type: object
      additionalProperties: false
      required: [checkIn, checkOut, adults]
      properties:
        personId:
          type: [string, 'null']
          format: uuid
          description: |
            Whose stay. A member account bound to a person may omit it or echo its own; a body
            naming anybody else is refused with PERSON_SCOPE. A desk that is bound to no
            person must name one.
        programId:
          type: [string, 'null']
          format: uuid
          description: |
            Narrows a member enrolled in two programmes to one of them. It is honoured, never
            trusted: a programme the person is not enrolled in on the first night selects
            nothing.
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
          description: |
            The morning the guest leaves, and never a night. It must be after checkIn, and the
            stay may not exceed the tenant's accommodation.max_nights.
        adults:
          type: integer
          minimum: 1
          maximum: 20
        children:
          type: integer
          minimum: 0
          maximum: 20
        propertyId:
          type: [string, 'null']
          format: uuid
          description: Exactly one of propertyId and regionCode.
        regionCode:
          type: [string, 'null']
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,15}$'
    AvailabilityEntitlement:
      type: object
      additionalProperties: false
      required: [entitlementCode, unit, remaining]
      properties:
        entitlementCode:
          type: string
        unit:
          type: string
          description: NIGHT for the ordinary mapping; MONEY for a plan that carries a budget.
        remaining:
          type: string
          description: Exact decimal as a string, never a JSON number.
    AvailabilityNightAmount:
      type: object
      additionalProperties: false
      required: [stayDate, amount, payerAmount, memberAmount]
      properties:
        stayDate:
          type: string
          format: date
        amount:
          type: string
          description: What the contract says the night costs. Exact decimal as a string.
        payerAmount:
          type: string
        memberAmount:
          type: string
          description: payerAmount plus memberAmount is exactly amount, on every night.
    AvailabilityQuote:
      type: object
      additionalProperties: false
      required: [currencyCode, nightlyAmounts, totalAmount, payerAmount, memberAmount]
      properties:
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        nightlyAmounts:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityNightAmount'
        totalAmount:
          type: string
          description: |
            The nights summed once, on the server, from figures each rounded once to the
            currency. Exact decimal as a string, never a total a frontend added up.
        payerAmount:
          type: string
        memberAmount:
          type: string
          description: payerAmount plus memberAmount is exactly totalAmount.
    QuoteUnavailableReason:
      type: string
      enum: [PRICE_NOT_FOUND, PRICE_AMBIGUOUS, PRICE_FORMULA_UNKNOWN, PRICE_CURRENCY_MISMATCH]
      description: |
        Why a room type carries no quote. PRICE_AMBIGUOUS is the one that matters most: two
        equally specific contracted prices tied, and the system does not choose between them,
        because a random winner is a silent financial error nobody would ever see.
    AvailabilityRoomTypeResult:
      type: object
      additionalProperties: false
      required: [property, roomType, available, quote, quoteUnavailableReason]
      properties:
        property:
          $ref: '#/components/schemas/Property'
        roomType:
          $ref: '#/components/schemas/RoomType'
        available:
          type: integer
          minimum: 0
          description: |
            The server's minimum daily availability over the whole range, and zero for a room
            type without an allotment on even one night of it.
        quote:
          oneOf:
            - $ref: '#/components/schemas/AvailabilityQuote'
            - type: 'null'
        quoteUnavailableReason:
          oneOf:
            - $ref: '#/components/schemas/QuoteUnavailableReason'
            - type: 'null'
          description: Set exactly when quote is null.
    AvailabilitySearchResult:
      type: object
      additionalProperties: false
      required: [personId, checkIn, checkOut, nights, eligible, results]
      properties:
        personId:
          type: string
          format: uuid
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        nights:
          type: integer
          minimum: 1
          description: |
            The server's own count of the nights in [checkIn, checkOut), on the calendar and
            never on elapsed hours — a stay over a summer-time change is still the number of
            nights somebody slept.
        evaluationId:
          type: [string, 'null']
          format: uuid
          description: |
            The immutable eligibility evaluation this search was recorded as, so "what did the
            system show them" is answerable later. Null only when the search matched no room
            type and there was therefore no service to evaluate.
        eligible:
          type: boolean
          description: |
            Whether the plan covers every night of this stay. Two nights left and a
            three-night stay is false: the third night is the member's to pay, and the figures
            say so too.
        entitlement:
          oneOf:
            - $ref: '#/components/schemas/AvailabilityEntitlement'
            - type: 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityRoomTypeResult'
    BookingStatus:
      type: string
      description: |
        Where a booking stands (v1.2 12.3). `HOLD` is a room set aside with a countdown
        running and nothing agreed. `PENDING_APPROVAL` is a confirmation a reviewer has not
        decided; the room is still held and only the deadline has moved. `EXPIRED` is a hold
        nobody confirmed in time, and it is deliberately not `CANCELLED`: nobody decided it,
        and a cancellation fee may only ever follow somebody changing their mind.
      enum:
        - HOLD
        - PENDING_APPROVAL
        - CONFIRMED
        - CHECKED_IN
        - COMPLETED
        - CANCELLED
        - NO_SHOW
        - EXPIRED
    BookingGuestType:
      type: string
      description: |
        Whether the guest is somebody the tenant already knows. `MEMBER` and `DEPENDANT`
        carry a `personId`; `GUEST` never does and carries only a name.
      enum: [MEMBER, DEPENDANT, GUEST]
    BookingGuest:
      type: object
      description: |
        One person sleeping in the room.

        There is no identifier field here and there will not be one. A national id, a
        passport number or a telephone number belongs behind the field cipher in the person
        record; a slot on a booking that a provider clerk types into would be plaintext
        personal data in a table nobody thinks of as holding any. `isMinor` is a boolean
        rather than a date of birth for the same reason: the room needs to know a child is
        in it, and nothing here needs to know when they were born.
      additionalProperties: false
      required: [displayName, guestType, isMinor]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: [string, 'null']
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: A name, and only ever a name.
        guestType:
          $ref: '#/components/schemas/BookingGuestType'
        isMinor:
          type: boolean
    BookingNight:
      type: object
      description: |
        One night of the stay with the amounts the member was shown, copied at the hold and
        never recomputed. `payerAmount` plus `memberAmount` is exactly `unitAmount`, which is
        a constraint on the row and not a convention.
      additionalProperties: false
      required: [stayDate, unitAmount, payerAmount, memberAmount, currencyCode]
      properties:
        stayDate:
          type: string
          format: date
        unitAmount:
          type: string
          description: What the contract says the night costs. Exact decimal as a string.
        payerAmount:
          type: string
        memberAmount:
          type: string
          description: payerAmount plus memberAmount is exactly unitAmount, on every night.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
    BookingQuoteNight:
      type: object
      additionalProperties: false
      required: [stayDate, amount, payerAmount, memberAmount]
      properties:
        stayDate:
          type: string
          format: date
        amount:
          type: string
        payerAmount:
          type: string
        memberAmount:
          type: string
    BookingQuoteSnapshot:
      type: object
      description: |
        The quote as the member saw it, frozen at the moment the room was held.

        Nothing in it is a reference to something that can change: the amounts are copies,
        the entitlement is what the plan had at that moment, and `evaluationId` is the record
        of what was shown. `quotedAt` is what the tenant's `accommodation.quote_ttl_minutes`
        is measured against, which is how a confirmation an hour later can be refused as
        stale rather than silently charged at a price nobody looked at.
      additionalProperties: false
      required:
        [version, quotedAt, propertyId, roomTypeId, serviceDefinitionId, currencyCode,
         totalAmount, payerAmount, memberAmount, nights, coveredNights, eligible]
      properties:
        version:
          type: integer
          description: The snapshot shape, so a reader that meets a newer one says so.
        quotedAt:
          type: string
          format: date-time
        evaluationId:
          type: [string, 'null']
          format: uuid
        propertyId:
          type: string
          format: uuid
        roomTypeId:
          type: string
          format: uuid
        serviceDefinitionId:
          type: string
          format: uuid
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        totalAmount:
          type: string
        payerAmount:
          type: string
        memberAmount:
          type: string
        nights:
          type: array
          items:
            $ref: '#/components/schemas/BookingQuoteNight'
        coveredNights:
          type: integer
          minimum: 0
          description: |
            How many of the stay's nights the plan carries. It is never more than `nights`
            and is frozen here rather than derived later, because three separate things read
            it and all three have to read the same number: the entitlement the hold reserves,
            the quantity the reservation request asks for, and the quantity the authorization
            adopts. A three-night stay on a plan with two nights left is `nights: 3,
            coveredNights: 2`, and the member pays for the third.
        entitlement:
          oneOf:
            - $ref: '#/components/schemas/AvailabilityEntitlement'
            - type: 'null'
        eligible:
          type: boolean
          description: |
            Whether the plan covers *every* night of this stay. It is `coveredNights ==
            nights` said as a flag, so a screen does not have to compare two numbers to know
            whether the member owes anything beyond their own share.
    Booking:
      type: object
      description: |
        A hold, and what it became.

        `secondsToExpiry` is the countdown, computed on the server: a browser deriving it
        from two timestamps would be wrong by whatever its own clock is out by, and the
        countdown is the whole of what a hold means to a member.

        There is no voucher token anywhere in this document, and there is nowhere one could
        appear. The proof of entitlement is fetched, once, from the booking's own voucher
        command; what is kept is a digest.
      additionalProperties: false
      required:
        [id, reference, personId, propertyId, roomTypeId, checkIn, checkOut, nights,
         adults, children, status, channel, quoteSnapshot, nightlyAmounts, guests,
         secondsToExpiry, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          description: 'BK-YYYYMMDD-XXXXXXXX, unique in the tenant.'
        personId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        roomTypeId:
          type: string
          format: uuid
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        nights:
          type: integer
          minimum: 1
          description: |
            The nights of [checkIn, checkOut). It is a stored column checked against the
            dates, so it and the booking's night rows can never disagree.
        adults:
          type: integer
        children:
          type: integer
        status:
          $ref: '#/components/schemas/BookingStatus'
        holdExpiresAt:
          type: [string, 'null']
          format: date-time
        secondsToExpiry:
          type: integer
          minimum: 0
          description: |
            Seconds left on the countdown, zero for a booking that is not holding a room.
        entitlementReservationId:
          type: [string, 'null']
          format: uuid
          description: |
            The hold this booking took on the plan. The authorization created at confirmation
            adopts this same reservation rather than taking a second one, which is why one
            stay draws the member's plan down once.
        serviceRequestId:
          type: [string, 'null']
          format: uuid
        authorizationId:
          type: [string, 'null']
          format: uuid
        voucherId:
          type: [string, 'null']
          format: uuid
        quoteSnapshot:
          $ref: '#/components/schemas/BookingQuoteSnapshot'
        policySnapshot:
          oneOf:
            - $ref: '#/components/schemas/LodgingPolicySnapshot'
            - type: 'null'
          description: |
            The cancellation policy, frozen at confirmation. Null on a booking nobody has
            confirmed yet; never re-read afterwards, so a later edit of the contract cannot
            change what a member already agreed to.
        channel:
          $ref: '#/components/schemas/ServiceRequestChannel'
        nightlyAmounts:
          type: array
          items:
            $ref: '#/components/schemas/BookingNight'
        guests:
          type: array
          items:
            $ref: '#/components/schemas/BookingGuest'
        confirmedAt:
          type: [string, 'null']
          format: date-time
        checkedInAt:
          type: [string, 'null']
          format: date-time
        checkedOutAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        cancelReasonCode:
          type: [string, 'null']
        actualNights:
          type: [integer, 'null']
        overBooking:
          type: boolean
          description: |
            The stay ran past what the authorization promised. It is a flag rather than a
            refusal: the guest has already slept the extra nights, so the check-out records
            them and the claim (M7) raises them as an exception a person looks at. Nothing
            beyond what was authorized is ever consumed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
        rowVersion:
          type: integer
    BookingList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        nextCursor:
          type: [string, 'null']
    CreateHoldRequest:
      type: object
      description: |
        The room, the dates and the party. `personId` is honoured only for a caller that is
        not bound to a person; a member sending somebody else's is refused with PERSON_SCOPE.
      additionalProperties: false
      required: [roomTypeId, checkIn, checkOut, adults]
      properties:
        personId:
          type: string
          format: uuid
        roomTypeId:
          type: string
          format: uuid
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        adults:
          type: integer
          minimum: 1
          maximum: 20
        children:
          type: integer
          minimum: 0
          maximum: 20
        programId:
          type: string
          format: uuid
          description: |
            Narrows a member with two programs to one of them. It is honoured, never trusted:
            a program the person is not enrolled in on the first night selects nothing.
        channel:
          $ref: '#/components/schemas/ServiceRequestChannel'
        guests:
          type: array
          maxItems: 40
          description: |
            Who is sleeping in the room. Optional; when given, the count must equal
            `adults + children`.
          items:
            $ref: '#/components/schemas/CreateBookingGuest'
    CreateBookingGuest:
      type: object
      additionalProperties: false
      required: [displayName, guestType]
      properties:
        personId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        guestType:
          $ref: '#/components/schemas/BookingGuestType'
        isMinor:
          type: boolean
    BookingVoucher:
      type: object
      description: |
        The voucher, and the one and only time its token is shown. `token` is not stored
        anywhere: the database keeps `maskedToken` and a SHA-256 digest, and a lost code is
        reissued rather than recovered.
      additionalProperties: false
      required: [id, token, maskedToken, validFrom, validTo]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: Shown once, in this response, and never again.
        maskedToken:
          type: string
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
    CancellationQuote:
      type: object
      description: |
        What a cancellation costs and gives back, computed from the booking's own frozen
        policy and its own night amounts. Every figure is an exact decimal string: these
        numbers reach a settlement, and a fee two systems disagree about by a kuruş is a fee
        nobody can invoice.
      additionalProperties: false
      required:
        [free, penaltyNights, releasedNights, feeAmount, payerFee, memberFee, currencyCode]
      properties:
        free:
          type: boolean
          description: |
            Whether the cancellation falls inside the free window the booking was confirmed
            under. A free cancellation costs nothing and takes no night, and the row that
            records it has a CHECK saying so.
        penaltyNights:
          type: integer
          minimum: 0
          description: |
            The nights the policy charges, capped at the length of the stay. Zero for a
            PERCENT policy, which charges a share of the member's own amount instead.
        releasedNights:
          type: integer
          minimum: 0
          description: |
            The nights that go back to the plan: the covered nights of the frozen quote less
            whatever the penalty spends. The penalty is capped at the covered nights, because
            a policy charging three nights against a plan that carried two cannot take a
            third from a balance it never held.
        feeAmount:
          type: string
          description: Exact decimal as a string; nothing here passes through a float.
        payerFee:
          type: string
          description: Exact decimal as a string; nothing here passes through a float.
        memberFee:
          type: string
          description: Exact decimal as a string; nothing here passes through a float.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        freeUntil:
          type: [string, 'null']
          format: date-time
          description: |
            The moment the free window closed or closes, so a member looking at a fee can see
            what they missed rather than being handed a number. It is counted back from the
            start of the arrival day on the property's own clock.
    CancellationPreview:
      type: object
      description: The booking, and what cancelling it now would cost.
      additionalProperties: false
      required: [booking, quote]
      properties:
        booking:
          $ref: '#/components/schemas/Booking'
        quote:
          $ref: '#/components/schemas/CancellationQuote'
    Cancellation:
      type: object
      description: |
        The record of a cancellation: what it cost, what came back, and **the policy it was
        judged by**, copied onto the row. The copy is the point - the row proves which terms
        were applied even after the contract has been rewritten twice, and nothing has to be
        re-resolved to read a two-year-old cancellation. The table is append-only.
      additionalProperties: false
      required:
        [id, bookingId, cancelledAt, reasonCode, free, penaltyNights, releasedNights,
         feeAmount, payerFee, memberFee, currencyCode]
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        cancelledAt:
          type: string
          format: date-time
        cancelledBy:
          type: [string, 'null']
          format: uuid
        reasonCode:
          type: string
        policySnapshot:
          oneOf:
            - $ref: '#/components/schemas/LodgingPolicySnapshot'
            - type: 'null'
          description: |
            The policy this cancellation was judged by. Null only for a booking cancelled
            while it was still waiting on a reviewer, which had agreed nothing and therefore
            owed nothing.
        free:
          type: boolean
        penaltyNights:
          type: integer
          minimum: 0
        releasedNights:
          type: integer
          minimum: 0
        feeAmount:
          type: string
          description: Exact decimal as a string; nothing here passes through a float.
        payerFee:
          type: string
          description: Exact decimal as a string; nothing here passes through a float.
        memberFee:
          type: string
          description: Exact decimal as a string; nothing here passes through a float.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
    CancellationResult:
      type: object
      description: The cancelled booking, what it cost, and the row that records both.
      additionalProperties: false
      required: [booking, quote, cancellation]
      properties:
        booking:
          $ref: '#/components/schemas/Booking'
        quote:
          $ref: '#/components/schemas/CancellationQuote'
        cancellation:
          $ref: '#/components/schemas/Cancellation'
    CancelBookingRequest:
      type: object
      description: |
        Why the stay is being called off. The reason is a code rather than a sentence because
        a report counts them and a screen translates them; it defaults to MEMBER_CANCELLED.
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
    CheckInBookingRequest:
      type: object
      description: |
        The voucher code the guest presented. It is in the body and nowhere else: a token in
        a path or a query string is a token in every proxy log between the desk and here.
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            The plaintext, typed or scanned. It is hashed on arrival and matched against a
            digest; it is stored nowhere and appears in no other request or response.
        at:
          type: string
          format: date-time
          description: |
            The moment of arrival, for a desk recording one it did not enter at the time.
            Defaults to now, and must still fall inside the check-in window.
    CheckOutBookingRequest:
      type: object
      additionalProperties: false
      properties:
        at:
          type: string
          format: date-time
          description: |
            The moment the guest left; defaults to now. It becomes a calendar day on the
            property's own clock, because that is what a night is counted in.
    NoShowStatus:
      type: string
      description: |
        Where a provider's claim stands. REPORTED costs nobody anything; CONFIRMED is the
        payer agreeing; REJECTED leaves the booking exactly as it was; DISPUTED is in
        somebody's queue.
      enum: [REPORTED, CONFIRMED, DISPUTED, REJECTED]
    NoShowReport:
      type: object
      description: |
        A provider's claim that nobody arrived, and the payer's answer to it.
        `payerAmount + memberAmount == assessedFeeAmount` is a CHECK on the row.
      additionalProperties: false
      required:
        [id, bookingId, reportedAt, assessedFeeAmount, payerAmount, memberAmount,
         currencyCode, status, consumedNights]
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        reportedByActorId:
          type: [string, 'null']
          format: uuid
          description: |
            Who claimed it. It is stored because the reviewer may not be this person, and
            that rule is a CHECK on the row as well as a refusal in the service.
        reportedAt:
          type: string
          format: date-time
        evidenceDocumentId:
          type: [string, 'null']
          format: uuid
        assessedFeeAmount:
          type: string
          description: Exact decimal as a string; nothing here passes through a float.
        payerAmount:
          type: string
          description: Exact decimal as a string; nothing here passes through a float.
        memberAmount:
          type: string
          description: Exact decimal as a string; nothing here passes through a float.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        status:
          $ref: '#/components/schemas/NoShowStatus'
        reviewedBy:
          type: [string, 'null']
          format: uuid
        reviewedAt:
          type: [string, 'null']
          format: date-time
        reviewComment:
          type: [string, 'null']
        consumedNights:
          type: integer
          minimum: 0
          description: |
            What a confirmation actually took off the plan, in whole nights. It is recorded
            because the policy is a percentage and the entitlement is nights: the row says
            what was consumed rather than leaving a reader to redo the rounding.
    NoShowResult:
      type: object
      description: The report, and the booking as it now stands.
      additionalProperties: false
      required: [report, booking]
      properties:
        report:
          $ref: '#/components/schemas/NoShowReport'
        booking:
          $ref: '#/components/schemas/Booking'
    ReportNoShowRequest:
      type: object
      additionalProperties: false
      properties:
        evidenceDocumentId:
          type: string
          format: uuid
          description: |
            The document object the provider is pointing at. It must be linked to this
            booking and cleared by the scanner. Omitted, any clean document linked to the
            booking satisfies the gate; a booking with none is refused either way.
        at:
          type: string
          format: date-time
          description: |
            The moment the absence was established; defaults to now. It must be after the
            check-in window has closed - a guest who is late is not a guest who did not come.
    ReviewNoShowRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          description: |
            The decision. CONFIRMED closes the booking and moves the plan; REJECTED leaves
            the stay bookable; DISPUTED raises a work item and changes nothing.
          enum: [CONFIRMED, DISPUTED, REJECTED]
        comment:
          type: string
          minLength: 1
          maxLength: 2000
    WaitlistStatus:
      type: string
      description: |
        Where an entry stands. WAITING is in the queue; OFFERED holds a room with a countdown
        running; ACCEPTED became a booking; EXPIRED and CANCELLED are history and do not stop
        the member joining again.
      enum: [WAITING, OFFERED, ACCEPTED, EXPIRED, CANCELLED]
    WaitlistEntry:
      type: object
      description: |
        One member waiting for a room that is full, and the offer they were made if the sweep
        has reached them.
      additionalProperties: false
      required:
        [id, personId, propertyId, checkIn, checkOut, adults, children, priority, status,
         createdAt]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        roomTypeId:
          type: [string, 'null']
          format: uuid
          description: |
            Null means any room of the property, which is what a member who wants the hotel
            rather than the suite is asking for.
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        adults:
          type: integer
        children:
          type: integer
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          description: |
            The first key of the queue order. A member joining for themselves is always zero;
            a plan may raise it for its own people.
        status:
          $ref: '#/components/schemas/WaitlistStatus'
        offeredBookingId:
          type: [string, 'null']
          format: uuid
        offerExpiresAt:
          type: [string, 'null']
          format: date-time
          description: |
            The hold's own deadline, not a second one. An offer that outlived its hold would
            be an offer whose room somebody else had already been sold.
        offer:
          oneOf:
            - $ref: '#/components/schemas/Booking'
            - type: 'null'
          description: The held booking the sweep created on this member's behalf.
        createdAt:
          type: string
          format: date-time
          description: |
            The second key of the queue order. An entry that was offered a room and did not
            take it goes to the back of the queue by this timestamp moving to now.
        updatedAt:
          type: [string, 'null']
          format: date-time
        rowVersion:
          type: integer
    WaitlistEntryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WaitlistEntry'
    JoinWaitlistRequest:
      type: object
      description: |
        The property, the dates and the party. `personId` is honoured only for a caller that
        is not bound to a person; a member sending somebody else's is refused with
        PERSON_SCOPE.
      additionalProperties: false
      required: [propertyId, checkIn, checkOut, adults]
      properties:
        personId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        roomTypeId:
          type: string
          format: uuid
          description: Omit for any room of the property.
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        adults:
          type: integer
          minimum: 1
          maximum: 20
        children:
          type: integer
          minimum: 0
          maximum: 20
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          description: |
            The desk's own ordering. A member joining for themselves is placed at zero
            whatever they send, because a queue a member can push themselves up is not a
            queue.
        programId:
          type: string
          format: uuid
    InvoiceStatus:
      type: string
      enum:
        [DRAFT, SUBMITTED, IN_BATCH, RETURNED, APPROVED, PARTIALLY_APPROVED, REJECTED,
         SETTLED, CANCELLED]
      description: |
        The invoice lifecycle of v1.2 10.9. WP-I7-02 owns DRAFT, SUBMITTED and CANCELLED; the
        reviewer's RETURNED, APPROVED, PARTIALLY_APPROVED and REJECTED are WP-I7-03's,
        IN_BATCH is the icmal's and SETTLED is the settlement's. They are declared here
        because the lifecycle is one list and a list with a hole in it is a list nobody can
        read.
    InvoiceSource:
      type: string
      enum: [MANUAL, EDOCUMENT]
      description: |
        Where the document came from. Only MANUAL is reachable now: KAPSORA produces no fiscal
        document, and the e-document arriving from GİB through the integrator is M8's.
    InvoiceAllocation:
      type: object
      additionalProperties: false
      required:
        [claimId, claimReference, claimVersionNo, allocatedAmount, currencyCode, approvedTotal,
         claimStatus, active]
      description: |
        How much of one approved claim this invoice is collecting, and what that claim was
        worth when the allocation was made.
      properties:
        claimId:
          type: string
          format: uuid
        claimReference:
          type: string
          description: The reference the provider quotes on the telephone.
        claimVersionNo:
          type: integer
          minimum: 1
          description: |
            The version the allocation was made against. A claim corrected afterwards is a
            different set of figures, and an invoice that silently followed the correction
            would be an invoice whose total stopped matching the sum of its parts.
        allocatedAmount:
          type: string
          description: Exact decimal. Never more than `approvedTotal`; less is ordinary.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        approvedTotal:
          type: string
          description: |
            What the payer approved for this claim — lines minus adjustments — recomputed on
            the server by the same arithmetic `getClaimInvoiceReadiness` runs.
        claimStatus:
          $ref: '#/components/schemas/ClaimStatus'
        active:
          type: boolean
          description: |
            False once the invoice was cancelled or returned. The row stays on the record and
            the claim is free to be put on the correction.
        claimDescription:
          type: [string, 'null']
          description: |
            The provider's own words on the claim's lines. Present only in the clinical
            projection: v1.2 §2.11 marks a line description of a health invoice as possibly
            clinical, and possibly clinical is clinical. The sponsor's HR user never receives
            it.
    Invoice:
      type: object
      additionalProperties: false
      required:
        [id, providerOrganizationId, source, invoiceNumber, invoiceDate, fiscalYear,
         currencyCode, lineExtensionAmount, taxAmount, payableAmount, domainCode, status,
         allocations, allocationTotal, allocationDifference, projection, createdAt, rowVersion]
      description: |
        An invoice the provider raised elsewhere, as KAPSORA records it, with the claims it
        covers.

        The provider's VKN is not here in any form a reader could resolve: it is stored as a
        blind index and never leaves the database.
      properties:
        id:
          type: string
          format: uuid
        providerOrganizationId:
          type: string
          format: uuid
        providerName:
          type: string
        payerOrganizationId:
          type: [string, 'null']
          format: uuid
          description: |
            The sponsor the contract names. Null means the tenant itself is the payer, which
            is the ordinary case.
        source:
          $ref: '#/components/schemas/InvoiceSource'
        edocumentId:
          type: [string, 'null']
          format: uuid
          description: The GİB e-document of M8. Always null in this milestone.
        invoiceNumber:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$'
        invoiceDate:
          type: string
          format: date
        fiscalYear:
          type: integer
          description: The year of `invoiceDate`, stored, and half of the uniqueness rule.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        lineExtensionAmount:
          type: string
          description: Exact decimal, as the provider entered it.
        taxAmount:
          type: string
        payableAmount:
          type: string
          description: |
            `lineExtensionAmount + taxAmount`, exactly. It is a database CHECK rather than an
            assertion in a service.
        vatRate:
          type: [string, 'null']
          description: As entered, never computed from the amounts.
        domainCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        supersedesInvoiceId:
          type: [string, 'null']
          format: uuid
          description: What this invoice was raised to correct.
        supersededByInvoiceId:
          type: [string, 'null']
          format: uuid
          description: |
            The correction that replaced this invoice. Set when that correction was submitted,
            not when it was drafted.
        submittedAt:
          type: [string, 'null']
          format: date-time
        documentId:
          type: [string, 'null']
          format: uuid
          description: The scanned image, a clean document object linked with aggregate type INVOICE.
        batchId:
          type: [string, 'null']
          format: uuid
          description: |
            The WP-I7-03 icmal this invoice sits in, set when that icmal is submitted. Null on
            an invoice no icmal is collecting.
        notes:
          type: [string, 'null']
          maxLength: 2000
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceAllocation'
        allocationTotal:
          type: string
          description: |
            The sum of the active allocations, in exact decimals. It is what the submit gate
            compares against `payableAmount`.
        allocationDifference:
          type: string
          description: |
            `payableAmount` minus `allocationTotal`, signed. Zero on an invoice that adds up;
            a draft screen shows it so the gap is visible before the submit is refused.
        projection:
          $ref: '#/components/schemas/HealthProjection'
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    InvoiceSummary:
      type: object
      additionalProperties: false
      required:
        [id, providerOrganizationId, invoiceNumber, invoiceDate, fiscalYear, currencyCode,
         payableAmount, status, allocationTotal, allocationCount, createdAt, rowVersion]
      description: |
        One row of a list: the header, what it allocates in total, how many claims that is
        spread over, and the batch it sits in. The allocations themselves are on the detail,
        because a page of fifty invoices is not a place to read four hundred claim links.
      properties:
        id:
          type: string
          format: uuid
        providerOrganizationId:
          type: string
          format: uuid
        providerName:
          type: string
        payerOrganizationId:
          type: [string, 'null']
          format: uuid
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
          format: date
        fiscalYear:
          type: integer
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        lineExtensionAmount:
          type: string
        taxAmount:
          type: string
        payableAmount:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        source:
          $ref: '#/components/schemas/InvoiceSource'
        supersedesInvoiceId:
          type: [string, 'null']
          format: uuid
        supersededByInvoiceId:
          type: [string, 'null']
          format: uuid
        submittedAt:
          type: [string, 'null']
          format: date-time
        documentId:
          type: [string, 'null']
          format: uuid
        batchId:
          type: [string, 'null']
          format: uuid
        allocationTotal:
          type: string
        allocationCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    InvoicePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceSummary'
        nextCursor:
          type: [string, 'null']
    InvoiceChain:
      type: object
      additionalProperties: false
      required: [items]
      description: |
        A supersede chain, oldest first. An invoice that has never been corrected answers a
        chain of one, which is the truthful answer rather than an empty list.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceSummary'
    CreateInvoice:
      type: object
      additionalProperties: false
      required:
        [providerOrganizationId, invoiceNumber, invoiceDate, lineExtensionAmount, taxAmount,
         payableAmount]
      description: |
        The header as the provider entered it. Nothing here is computed: the tax and the rate
        are what the provider's own document says, and a figure this platform derived would be
        this platform's opinion about somebody else's fiscal document.
      properties:
        providerOrganizationId:
          type: string
          format: uuid
        payerOrganizationId:
          type: [string, 'null']
          format: uuid
        invoiceNumber:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$'
        invoiceDate:
          type: string
          format: date
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
          description: Defaults to TRY.
        lineExtensionAmount:
          $ref: '#/components/schemas/DecimalAmount'
        taxAmount:
          $ref: '#/components/schemas/DecimalAmount'
        payableAmount:
          $ref: '#/components/schemas/DecimalAmount'
        vatRate:
          oneOf:
            - $ref: '#/components/schemas/DecimalPercent'
            - type: 'null'
        domainCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: Defaults to GENERIC.
        documentId:
          type: [string, 'null']
          format: uuid
          description: |
            The scanned image. It has to be a document object of this tenant the scanner has
            cleared; a file still in quarantine is not evidence a reviewer can open.
        notes:
          type: [string, 'null']
          maxLength: 2000
        supersedesInvoiceId:
          type: [string, 'null']
          format: uuid
          description: |
            Opens this draft as the correction of that invoice, copying its header fields that
            were not sent and all of its allocations.
    PatchInvoiceDraft:
      type: object
      additionalProperties: false
      description: |
        A merge patch over the header of a DRAFT. The three amounts travel together: sending
        one without the other two is refused, because the sum has to hold on the row that
        results.
      properties:
        payerOrganizationId:
          type: [string, 'null']
          format: uuid
        invoiceNumber:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$'
        invoiceDate:
          type: [string, 'null']
          format: date
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        lineExtensionAmount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        taxAmount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        payableAmount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        vatRate:
          oneOf:
            - $ref: '#/components/schemas/DecimalPercent'
            - type: 'null'
        domainCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        documentId:
          type: [string, 'null']
          format: uuid
        notes:
          type: [string, 'null']
          maxLength: 2000
    InvoiceAllocationInput:
      type: object
      additionalProperties: false
      required: [claimId, allocatedAmount]
      properties:
        claimId:
          type: string
          format: uuid
        allocatedAmount:
          $ref: '#/components/schemas/DecimalAmount'
    PutInvoiceAllocations:
      type: object
      additionalProperties: false
      required: [allocations]
      description: |
        The whole set, replacing whatever the draft carried. An empty list clears the
        allocations, which is how a provider starts over; it is not a state the invoice can be
        submitted from.
      properties:
        allocations:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/InvoiceAllocationInput'
    BatchStatus:
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, DECIDED, SETTLING, CLOSED, CANCELLED]
      description: |
        The icmal lifecycle of v1.2 10.9. WP-I7-03 owns everything up to DECIDED; SETTLING and
        CLOSED are the settlement's and nothing in this contract puts a batch into one of them.
    BatchDecision:
      type: string
      enum: [APPROVE, CUT, RETURN, REJECT]
      description: |
        What the payer said about one invoice. Four words rather than two because a provider
        acts on each of them differently: an approval is money coming, a cut is money to
        dispute, a return is a document to correct and resend, and a rejection is the end of
        that document.
    BatchInvoice:
      type: object
      additionalProperties: false
      required:
        [id, invoiceId, invoiceNumber, invoiceDate, invoiceStatus, currencyCode,
         submittedAmount]
      description: |
        One invoice in one icmal, with the payer's answer to it. The decision fields are absent
        on an invoice nobody has answered yet.
      properties:
        id:
          type: string
          format: uuid
          description: The membership row, which is what a decision is recorded against.
        invoiceId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
          format: date
        invoiceStatus:
          $ref: '#/components/schemas/InvoiceStatus'
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        submittedAmount:
          type: string
          description: |
            What the invoice was billing at the moment the icmal was submitted, an exact
            decimal. It is a copy rather than a live read: the batch is a record of what was
            submitted.
        decision:
          $ref: '#/components/schemas/BatchDecision'
        approvedAmount:
          type: [string, 'null']
          description: |
            Exact decimal. Equal to `submittedAmount` on an APPROVE, strictly between zero and
            it on a CUT, and zero on a RETURN or a REJECT. It is a database CHECK, not a
            convention.
        reasonCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        reasonText:
          type: [string, 'null']
          maxLength: 1000
        decidedBy:
          type: [string, 'null']
          format: uuid
        decidedByDisplayName:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
          format: date-time
        active:
          type: boolean
          description: |
            False once the icmal was cancelled. The row stays on the record and the invoice is
            free to go into another batch.
        createdAt:
          type: string
          format: date-time
    Batch:
      type: object
      additionalProperties: false
      required:
        [id, reference, providerOrganizationId, domainCode, currencyCode, periodFrom, periodTo,
         status, invoiceCount, submittedTotal, approvedTotal, cutTotal, returnedTotal,
         rejectedTotal, invoices, createdAt, rowVersion]
      description: |
        An icmal: one provider's submitted invoices for one payer, one currency, one domain and
        one period, with the payer's decision on each of them.

        The five totals are the server's own, in exact decimals. Until the batch is decided the
        four decision totals are zero; once it is decided they add up to `submittedTotal`
        exactly, which is a database CHECK.
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: '^IC-[0-9]{6}-[A-Z2-7]{8}$'
          description: |
            `IC-YYYYMM-XXXXXXXX`. The tail is forty random bits: a sequential reference tells a
            competitor how many icmals a tenant settled last month.
        providerOrganizationId:
          type: string
          format: uuid
        providerName:
          type: string
        payerOrganizationId:
          type: [string, 'null']
          format: uuid
          description: |
            The sponsor the contract names. Null means the tenant itself is the payer, which is
            the ordinary case.
        domainCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/BatchStatus'
        submittedAt:
          type: [string, 'null']
          format: date-time
        submittedBy:
          type: [string, 'null']
          format: uuid
        decidedAt:
          type: [string, 'null']
          format: date-time
        decidedBy:
          type: [string, 'null']
          format: uuid
        invoiceCount:
          type: integer
          minimum: 0
        submittedTotal:
          type: string
        approvedTotal:
          type: string
        cutTotal:
          type: string
        returnedTotal:
          type: string
        rejectedTotal:
          type: string
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/BatchInvoice'
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    BatchSummaryRow:
      type: object
      additionalProperties: false
      required: [decision, count, submittedTotal, approvedTotal]
      properties:
        decision:
          $ref: '#/components/schemas/BatchDecision'
        count:
          type: integer
          minimum: 0
        submittedTotal:
          type: string
        approvedTotal:
          type: string
    BatchSummary:
      type: object
      additionalProperties: false
      required: [batch, pendingCount, pendingTotal, decisions]
      description: |
        The totals and the per-decision counts, for both sides. All four decisions are always
        listed, with zeroes where nothing carries them, so a screen can draw a stable set of
        columns.
      properties:
        batch:
          $ref: '#/components/schemas/Batch'
        pendingCount:
          type: integer
          minimum: 0
          description: How many invoices nobody has answered yet.
        pendingTotal:
          type: string
          description: What those invoices are worth, an exact decimal.
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/BatchSummaryRow'
    BatchPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Batch'
        nextCursor:
          type: [string, 'null']
    CreateBatch:
      type: object
      additionalProperties: false
      required: [providerOrganizationId, periodFrom, periodTo]
      description: |
        The five things an icmal is one of. The reference is the server's and is never sent.
      properties:
        providerOrganizationId:
          type: string
          format: uuid
        payerOrganizationId:
          type: [string, 'null']
          format: uuid
        domainCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: Defaults to GENERIC.
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
          description: Defaults to TRY.
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
    PutBatchInvoices:
      type: object
      additionalProperties: false
      required: [invoiceIds]
      description: |
        The whole set, replacing whatever the draft carried. Duplicates are collapsed rather
        than refused: naming the same invoice twice is a client's mistake and not a different
        icmal.
      properties:
        invoiceIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    ReviewBatchInvoice:
      type: object
      additionalProperties: false
      required: [decision]
      description: |
        One decision on one invoice. `approvedAmount` belongs to a CUT and only to a CUT: the
        other three derive it, and a caller who could send it would be a caller who could
        approve an amount nobody billed.
      properties:
        decision:
          $ref: '#/components/schemas/BatchDecision'
        approvedAmount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
          description: |
            Required on a CUT, strictly between zero and the submitted amount. Ignored on the
            other three.
        reasonCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
          description: |
            Required for a CUT, a RETURN and a REJECT. A cut's has to be one of the claim
            ledger's cut reasons, because the cut writes an adjustment and an adjustment's
            reason is a closed list.
        reasonText:
          type: [string, 'null']
          maxLength: 1000
    SettlementStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, APPROVED, POSTED, PAID, PARTIALLY_PAID, RECONCILED, CANCELLED]
      description: |
        Where the settlement is. POSTED is M9's accounting posting and RECONCILED is
        WP-I7-05's; both are in the list because a filter that could not name them would be a
        filter that hid rows.
    SettlementRecovery:
      type: object
      additionalProperties: false
      required: [id, claimId, adjustmentId, amount, createdAt]
      description: |
        One RECOVERY adjustment this settlement took back, and for how much. It is listed rather
        than only summed so that a provider disputing `withheldAmount` can see which claim each
        kuruş came from.
      properties:
        id:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        adjustmentId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        createdAt:
          type: string
          format: date-time
    PaymentRecordStatus:
      type: string
      enum: [RECORDED, RECONCILED, DISPUTED]
      description: |
        A record entered wrongly becomes DISPUTED and stays with its reference. Nothing here is
        ever deleted: "the bank says it sent this and we say it did not" is exactly the
        conversation the row exists to support.
    PaymentRecordSource:
      type: string
      enum: [MANUAL, ERP]
      description: |
        MANUAL is a person typing what the bank statement says. ERP is M9's payment
        confirmation flowing back from the accounting system.
    PaymentRecord:
      type: object
      additionalProperties: false
      required:
        [id, settlementId, providerOrganizationId, externalReference, amount, currencyCode,
         paidAt, source, status, createdAt, rowVersion]
      description: |
        A finance fact with an external reference: somebody outside this system moved money,
        and this is what they said about it. KAPSORA transferred nothing (v1.2 §4.3).
      properties:
        id:
          type: string
          format: uuid
        settlementId:
          type: string
          format: uuid
        providerOrganizationId:
          type: string
          format: uuid
        externalReference:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$'
          description: |
            The bank's or the ERP's own reference. It is unique per provider inside the tenant:
            the same transfer entered twice is how a settlement comes to look paid when half of
            it was not.
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        paidAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/PaymentRecordSource'
        status:
          $ref: '#/components/schemas/PaymentRecordStatus'
        recordedBy:
          type: [string, 'null']
          format: uuid
        notes:
          type: [string, 'null']
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    PaymentRecordList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRecord'
    Settlement:
      type: object
      additionalProperties: false
      required:
        [id, reference, batchId, versionNo, providerOrganizationId, currencyCode,
         approvedAmount, withheldAmount, payableAmount, paidAmount, dueDate, settlementMethod,
         status, recoveries, payments, createdAt, rowVersion]
      description: |
        What the payer owes one provider for one decided icmal.

        The three money figures are the server's own, in exact decimals. `approvedAmount` is the
        batch's total frozen at the moment the settlement opened; `withheldAmount` is the open
        recoveries this settlement netted; `payableAmount` is the difference and is never above
        the approved amount, which is a database CHECK.
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: '^ST-[0-9]{6}-[A-Z2-7]{8}$'
          description: |
            `ST-YYYYMM-XXXXXXXX`. The tail is forty random bits: a sequential reference tells a
            competitor how much a tenant settled last month.
        batchId:
          type: string
          format: uuid
        batchReference:
          type: string
        versionNo:
          type: integer
          minimum: 1
          description: |
            Which attempt at settling this batch. A settlement is never edited: a wrong one is
            cancelled with a reason and the next version is opened on the same batch.
        providerOrganizationId:
          type: string
          format: uuid
        providerName:
          type: string
        payerOrganizationId:
          type: [string, 'null']
          format: uuid
          description: |
            The sponsor the contract names. Null means the tenant itself is the payer, which is
            the ordinary case.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        approvedAmount:
          $ref: '#/components/schemas/DecimalAmount'
        withheldAmount:
          $ref: '#/components/schemas/DecimalAmount'
        payableAmount:
          $ref: '#/components/schemas/DecimalAmount'
        paidAmount:
          $ref: '#/components/schemas/DecimalAmount'
        dueDate:
          type: string
          format: date
          description: |
            The contract's payment term applied to the day the batch was decided. A contract
            with no term is refused rather than defaulted: a due date this platform invented
            would be one nobody agreed to and everybody would be measured against.
        settlementMethod:
          type: string
          enum: [BANK_TRANSFER, OFFSET, OTHER]
        status:
          $ref: '#/components/schemas/SettlementStatus'
        approvedBy:
          type: [string, 'null']
          format: uuid
        approvedAt:
          type: [string, 'null']
          format: date-time
        checkedBy:
          type: [string, 'null']
          format: uuid
          description: |
            The second pair of eyes above the tenant's threshold: the person who decided the
            batch, whose decision this approval is the countersignature on. Null below the
            threshold, where there is one person and recording them twice would say a check
            happened that did not.
        postingId:
          type: [string, 'null']
          format: uuid
          description: M9's accounting posting. Always null in this milestone.
        cancelReasonCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        recoveries:
          type: array
          items:
            $ref: '#/components/schemas/SettlementRecovery'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRecord'
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    SettlementPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Settlement'
        nextCursor:
          type: [string, 'null']
    CancelSettlement:
      type: object
      additionalProperties: false
      required: [reasonCode]
      description: |
        Why this settlement is being withdrawn. The code is what a report counts; the text is
        free prose for the person who reads the row afterwards.
      properties:
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        reasonText:
          type: [string, 'null']
          maxLength: 1000
    CreatePaymentRecord:
      type: object
      additionalProperties: false
      required: [externalReference, amount, paidAt]
      description: |
        One transfer somebody else made. The currency is the settlement's and may be omitted; a
        value that disagrees with it is refused, because a total across currencies is not a
        total.
      properties:
        externalReference:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$'
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        paidAt:
          type: string
          format: date-time
        source:
          oneOf:
            - $ref: '#/components/schemas/PaymentRecordSource'
            - type: 'null'
          description: Defaults to MANUAL.
        notes:
          type: [string, 'null']
          maxLength: 2000
    ReimbursementStatus:
      type: string
      enum:
        [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, PARTIALLY_APPROVED, REJECTED,
         PAYMENT_ORDERED, PAID, CANCELLED]
    ReimbursementDecision:
      type: string
      enum: [APPROVE, REJECT]
      description: |
        Two words rather than three: approving in part is APPROVE with a figure below the
        requested one, because "how much" is a number and not a third kind of answer.
    Reimbursement:
      type: object
      additionalProperties: false
      required:
        [id, reference, personId, enrollmentId, serviceRequestId, receiptDocumentId,
         serviceDefinitionId, serviceDate, providerOrganizationId, requestedAmount,
         currencyCode, bankAccountMasked, status, createdAt, rowVersion]
      description: |
        A member paid for something themselves and wants the money back.

        **There is no account number in this schema and there will never be one.**
        `bankAccountMasked` is four characters. The number the member typed exists as one
        ciphertext in one column, is read back by nothing, and appears in no response, audit
        row, notification, log line or outbox payload.
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          pattern: '^RB-[0-9]{6}-[A-Z2-7]{8}$'
        personId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        serviceRequestId:
          type: string
          format: uuid
          description: WP-I4-01's REIMBURSEMENT request, which carries the service and the date.
        claimId:
          type: [string, 'null']
          format: uuid
          description: |
            WP-I7-01's REIMBURSEMENT claim, created at the approval and never before: a claim
            raised at submission would be a claim the payer never agreed to.
        receiptDocumentId:
          type: string
          format: uuid
        serviceDefinitionId:
          type: string
          format: uuid
        serviceDate:
          type: string
          format: date
        providerOrganizationId:
          type: string
          format: uuid
        requestedAmount:
          $ref: '#/components/schemas/DecimalAmount'
        approvedAmount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
          description: Null until somebody decides. Zero on a rejection, which is the honest figure.
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        bankAccountMasked:
          type: string
          pattern: '^[0-9A-Z]{4}$'
          description: |
            The last four characters of the account, and every word this platform will ever say
            about it.
        status:
          $ref: '#/components/schemas/ReimbursementStatus'
        duplicateOfId:
          type: [string, 'null']
          format: uuid
        duplicateOfReference:
          type: [string, 'null']
          pattern: '^RB-[0-9]{6}-[A-Z2-7]{8}$'
        decisionReasonCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
        decidedBy:
          type: [string, 'null']
          format: uuid
        decidedAt:
          type: [string, 'null']
          format: date-time
        submittedAt:
          type: [string, 'null']
          format: date-time
        paymentReference:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$'
        paidAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    ReimbursementPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reimbursement'
        nextCursor:
          type: [string, 'null']
    CreateReimbursement:
      type: object
      additionalProperties: false
      required: [serviceRequestId, receiptDocumentId, requestedAmount, bankAccount]
      description: |
        What the member is asking to be paid back, and where to send it.

        `bankAccount` is the only field in this API that carries an account number. It is
        normalised, encrypted and reduced to four characters in one transaction, and nothing
        that comes back afterwards holds more than those four.
      properties:
        personId:
          type: [string, 'null']
          format: uuid
          description: |
            Optional and, when present, has to be the caller's own person: a client echoing back
            what it read from `getMyPerson` is doing nothing wrong, and a body naming anybody
            else is 403. The answer is the server's either way.
        serviceRequestId:
          type: string
          format: uuid
        receiptDocumentId:
          type: string
          format: uuid
        requestedAmount:
          $ref: '#/components/schemas/DecimalAmount'
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
          description: Defaults to TRY.
        bankAccount:
          type: string
          pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9 ]{10,40}$'
          maxLength: 44
          description: |
            The IBAN the money should go to. Spaces are stripped and the value is upper-cased
            before anything else happens to it.
    DecideReimbursement:
      type: object
      additionalProperties: false
      required: [decision]
      description: |
        Approve in full, approve in part with a reason, or reject with a reason. An approval
        with no `approvedAmount` approves the whole requested figure, which is what "approve"
        means when nobody typed a number.
      properties:
        decision:
          $ref: '#/components/schemas/ReimbursementDecision'
        approvedAmount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
          description: |
            Above zero and at most the requested amount. Below the requested amount it is a
            partial approval and needs a reason code; to approve nothing, reject.
        reasonCode:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9_.:-]{1,79}$'
          description: Required for a rejection and for a partial approval.
        reasonText:
          type: [string, 'null']
          maxLength: 1000
    RecordReimbursementPayment:
      type: object
      additionalProperties: false
      required: [paymentReference]
      description: |
        The reference the bank gave back. KAPSORA moved nothing; this is the note that it was
        moved.
      properties:
        paymentReference:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$'
        paidAt:
          type: [string, 'null']
          format: date-time
          description: Defaults to now.
    ReconciliationScope:
      type: string
      enum: [TENANT, PROVIDER]
      description: |
        TENANT is the payer's own daily total; PROVIDER is one provider's. Both exist because they
        answer different questions: the first is "did yesterday balance", the second is "which
        provider is the reason it did not".
    ReconciliationRunStatus:
      type: string
      enum: [BALANCED, DIFFERENCES, FAILED]
    ReconciliationDifferenceKind:
      type: string
      enum: [UNDERPAID, PAID_SUM_MISMATCH, ERP_MISMATCH]
      description: |
        `UNDERPAID` is the ordinary one: the due date has passed and the settlement is short.
        `PAID_SUM_MISMATCH` is KAPSORA disagreeing with itself — the settlement's stored paid
        amount is not the sum of its live payment records — and should never appear.
        `ERP_MISMATCH` is M9's and is never written today.
    ReconciliationDifference:
      type: object
      additionalProperties: false
      required: [reference, dueDate, status, expected, actual, difference, kind]
      description: |
        One settlement the run disagreed with. It carries the reference a person finds on their own
        screen and **no identifier**: the run's own column is read by somebody looking for the row,
        and a uuid is not how they will find it.
      properties:
        reference:
          type: string
        dueDate:
          type: string
          format: date
        status:
          type: string
        expected:
          type: string
          description: What was payable, in exact decimals.
        actual:
          type: string
          description: What was paid, in exact decimals.
        difference:
          type: string
        kind:
          $ref: '#/components/schemas/ReconciliationDifferenceKind'
    ReconciliationRun:
      type: object
      additionalProperties: false
      required:
        [id, scope, periodFrom, periodTo, runNo, currencyCode, invoicedTotal, approvedTotal,
         cutTotal, returnedTotal, rejectedTotal, settledTotal, paidTotal, openTotal, difference,
         differenceCount, differences, status, ranAt, createdAt]
      description: |
        An immutable record of what was compared and what differed. The row is append-only in the
        database: a second look at the same day is run number two and both stay.
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/ReconciliationScope'
        providerOrganizationId:
          type: [string, 'null']
          format: uuid
          description: Set on a PROVIDER run and null on a TENANT one, which is a database CHECK.
        providerName:
          type: [string, 'null']
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        runNo:
          type: integer
          minimum: 1
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        invoicedTotal:
          type: string
        approvedTotal:
          type: string
        cutTotal:
          type: string
        returnedTotal:
          type: string
        rejectedTotal:
          type: string
        settledTotal:
          type: string
        paidTotal:
          type: string
        openTotal:
          type: string
          description: |
            `settledTotal - paidTotal`, subtracted by the database and checked by a constraint.
        erpTotal:
          type: [string, 'null']
          description: What the accounting system said it posted. Null until M9.
        difference:
          type: string
          description: |
            `settledTotal` minus `erpTotal` when there is one and minus `paidTotal` when there is
            not. It is a database CHECK rather than an arithmetic the job is trusted with.
        differenceCount:
          type: integer
          minimum: 0
        differences:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationDifference'
        status:
          $ref: '#/components/schemas/ReconciliationRunStatus'
        failureCode:
          type: [string, 'null']
        ranAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ReconciliationRunPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationRun'
        nextCursor:
          type: [string, 'null']
    StatementTotals:
      type: object
      additionalProperties: false
      required:
        [invoicedTotal, approvedTotal, cutTotal, returnedTotal, rejectedTotal, settledTotal,
         paidTotal, openBalance, invoiceCount, settlementCount]
      description: |
        Every figure summed by the server in one query, in exact decimals. None of these may be
        recomputed from `invoices` or `settlements`: those lists are capped and these are not.
      properties:
        invoicedTotal:
          type: string
        approvedTotal:
          type: string
        cutTotal:
          type: string
        returnedTotal:
          type: string
        rejectedTotal:
          type: string
        settledTotal:
          type: string
        paidTotal:
          type: string
        openBalance:
          type: string
          description: |
            What is still owed: settled minus paid over the settlements due in the period.
        invoiceCount:
          type: integer
          minimum: 0
        settlementCount:
          type: integer
          minimum: 0
    StatementInvoice:
      type: object
      additionalProperties: false
      required:
        [id, invoiceNumber, invoiceDate, status, currencyCode, payableAmount, taxAmount,
         approvedAmount, settlementPaidAmount]
      properties:
        id:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        payableAmount:
          type: string
        taxAmount:
          type: string
        batchId:
          type: [string, 'null']
          format: uuid
        batchReference:
          type: [string, 'null']
        batchStatus:
          type: [string, 'null']
        batchDecision:
          type: [string, 'null']
        approvedAmount:
          type: string
        settlementId:
          type: [string, 'null']
          format: uuid
        settlementReference:
          type: [string, 'null']
        dueDate:
          type: [string, 'null']
          format: date
        settlementPaidAmount:
          type: string
    StatementSettlement:
      type: object
      additionalProperties: false
      required:
        [id, reference, batchId, batchReference, dueDate, status, currencyCode, approvedAmount,
         withheldAmount, payableAmount, paidAmount, openAmount, paymentCount]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        batchId:
          type: string
          format: uuid
        batchReference:
          type: string
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/SettlementStatus'
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        approvedAmount:
          type: string
        withheldAmount:
          type: string
        payableAmount:
          type: string
        paidAmount:
          type: string
        openAmount:
          type: string
        paymentCount:
          type: integer
          minimum: 0
        lastPaidAt:
          type: [string, 'null']
          format: date-time
    ProviderStatement:
      type: object
      additionalProperties: false
      required:
        [providerOrganizationId, providerName, periodFrom, periodTo, currencyCode, totals,
         invoices, settlements]
      properties:
        providerOrganizationId:
          type: string
          format: uuid
        providerName:
          type: string
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        totals:
          $ref: '#/components/schemas/StatementTotals'
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/StatementInvoice'
        settlements:
          type: array
          items:
            $ref: '#/components/schemas/StatementSettlement'
    DashboardFilter:
      type: object
      additionalProperties: false
      required: [resource]
      description: |
        The filter that reproduces the figure beside it. A count a person cannot click through to a
        list of is a number they have to take on trust — and the first time it disagrees with the
        list they will stop trusting the whole screen.
      properties:
        resource:
          type: string
          enum: [claims, batches, settlements, reimbursements, workItems]
        statuses:
          type: array
          items:
            type: string
        dueFrom:
          type: [string, 'null']
          format: date
        dueTo:
          type: [string, 'null']
          format: date
        dueBefore:
          type: [string, 'null']
          format: date
        overdueAt:
          type: [string, 'null']
          format: date-time
        agingBucket:
          type: [string, 'null']
          enum: [D0_1, D2_7, D8_30, D31_PLUS, null]
    DashboardClaimStatusFigure:
      type: object
      additionalProperties: false
      required: [status, claimCount, approvedTotal, filter]
      properties:
        status:
          type: string
        claimCount:
          type: integer
          minimum: 0
        approvedTotal:
          type: string
        filter:
          $ref: '#/components/schemas/DashboardFilter'
    DashboardAgingFigure:
      type: object
      additionalProperties: false
      required: [bucket, claimCount, approvedTotal, filter]
      properties:
        bucket:
          type: string
          enum: [D0_1, D2_7, D8_30, D31_PLUS]
        claimCount:
          type: integer
          minimum: 0
        approvedTotal:
          type: string
        filter:
          $ref: '#/components/schemas/DashboardFilter'
    DashboardBatchFigure:
      type: object
      additionalProperties: false
      required: [batchCount, submittedTotal, filter]
      properties:
        batchCount:
          type: integer
          minimum: 0
        submittedTotal:
          type: string
        oldestSubmittedAt:
          type: [string, 'null']
          format: date-time
        oldestSlaDueAt:
          type: [string, 'null']
          format: date-time
          description: |
            The earliest SLA deadline of an open item in the icmal review queue. It is the work
            queue's own clock, so "past SLA" is the same number here and in the worklist.
        filter:
          $ref: '#/components/schemas/DashboardFilter'
    DashboardSettlementFigure:
      type: object
      additionalProperties: false
      required:
        [dueSoonCount, dueSoonTotal, overdueCount, overdueTotal, dueSoonFilter, overdueFilter]
      properties:
        dueSoonCount:
          type: integer
          minimum: 0
        dueSoonTotal:
          type: string
        overdueCount:
          type: integer
          minimum: 0
        overdueTotal:
          type: string
        dueSoonFilter:
          $ref: '#/components/schemas/DashboardFilter'
        overdueFilter:
          $ref: '#/components/schemas/DashboardFilter'
    DashboardReimbursementFigure:
      type: object
      additionalProperties: false
      required: [reimbursementCount, requestedTotal, filter]
      properties:
        reimbursementCount:
          type: integer
          minimum: 0
        requestedTotal:
          type: string
        oldestSubmittedAt:
          type: [string, 'null']
          format: date-time
        filter:
          $ref: '#/components/schemas/DashboardFilter'
    DashboardWorkItemFigure:
      type: object
      additionalProperties: false
      required: [itemCount, filter]
      properties:
        itemCount:
          type: integer
          minimum: 0
        oldestDueAt:
          type: [string, 'null']
          format: date-time
        filter:
          $ref: '#/components/schemas/DashboardFilter'
    OperationsDashboard:
      type: object
      additionalProperties: false
      required:
        [asOf, claimsByStatus, claimAging, batchesAwaitingReview, settlements, reimbursements,
         workItemsPastSla]
      properties:
        asOf:
          type: string
          format: date-time
          description: |
            The moment every figure was computed against. The aging buckets and the "due this week"
            window are both measured from it, so a page read at midnight and one read at noon can
            be told apart.
        claimsByStatus:
          type: array
          items:
            $ref: '#/components/schemas/DashboardClaimStatusFigure'
        claimAging:
          type: array
          items:
            $ref: '#/components/schemas/DashboardAgingFigure'
        batchesAwaitingReview:
          $ref: '#/components/schemas/DashboardBatchFigure'
        settlements:
          $ref: '#/components/schemas/DashboardSettlementFigure'
        reimbursements:
          $ref: '#/components/schemas/DashboardReimbursementFigure'
        workItemsPastSla:
          $ref: '#/components/schemas/DashboardWorkItemFigure'
    ExportKind:
      type: string
      enum: [PROVIDER_STATEMENT, BATCH, SETTLEMENTS, CLAIMS, RECONCILIATION]
      description: |
        `CLAIMS` is the one whose rows carry prose — claim line descriptions — and the one that
        needs `report.export.sensitive`.
    ExportFormat:
      type: string
      enum: [CSV, XLSX]
      description: |
        **Only CSV is produced.** XLSX is a value of the column so that the schema does not have to
        change when a spreadsheet writer lands; asking for it today is refused with a field error
        rather than answered with a CSV under another name. A CSV carries a UTF-8 byte order mark,
        because the people who open these files open them in Excel.
    ExportStatus:
      type: string
      enum: [QUEUED, RUNNING, READY, FAILED, EXPIRED]
    Export:
      type: object
      additionalProperties: false
      required:
        [id, kind, format, status, parameters, rowCount, requestedBy, requestedAt, expiresAt,
         watermark, downloadCount, createdAt, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ExportKind'
        format:
          $ref: '#/components/schemas/ExportFormat'
        status:
          $ref: '#/components/schemas/ExportStatus'
        parameters:
          type: object
          additionalProperties: true
          description: |
            The filters as they were given, **with no identifier in them**. The database refuses a
            uuid or a key called `...Id` here; the scope an export covers is in the typed fields
            below.
        providerOrganizationId:
          type: [string, 'null']
          format: uuid
        periodFrom:
          type: [string, 'null']
          format: date
        periodTo:
          type: [string, 'null']
          format: date
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        documentId:
          type: [string, 'null']
          format: uuid
          description: The file, once the worker has written it. It is a document like any other.
        rowCount:
          type: integer
          minimum: 0
        requestedBy:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: |
            The tenant's `report.export_ttl_hours` applied when the export was asked for. It is a
            stored moment rather than a duration read at download time, so the answer to "may I
            still open this" does not change because somebody edited a setting this afternoon.
        watermark:
          type: string
          description: |
            The requester, the tenant, the moment and this export's id, in one line — the string
            stamped on the header **and on every row** of the file.
        downloadCount:
          type: integer
          minimum: 0
        failureCode:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          format: int64
    ExportPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Export'
        nextCursor:
          type: [string, 'null']
    CreateExport:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/ExportKind'
        format:
          $ref: '#/components/schemas/ExportFormat'
        providerOrganizationId:
          type: [string, 'null']
          format: uuid
          description: Required for PROVIDER_STATEMENT.
        periodFrom:
          type: [string, 'null']
          format: date
        periodTo:
          type: [string, 'null']
          format: date
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        parameters:
          type: object
          additionalProperties: true
          description: |
            The remaining filters. **No identifier may appear here** — not as a value and not as a
            key name. A provider, a period and a currency have fields of their own above.
    ExportDownloadRequest:
      type: object
      additionalProperties: false
      description: |
        Why the file is being opened. Both fields travel into the access event: "who took this out"
        without "why" is not an answer a data protection review can use.
      properties:
        purposeCode:
          type: [string, 'null']
          maxLength: 100
        reasonText:
          type: [string, 'null']
          maxLength: 1000
    ExportDownload:
      type: object
      additionalProperties: false
      required: [url, method, expiresAt, watermark, downloadCount]
      properties:
        url:
          type: string
          format: uri
          description: |
            Where to GET the file. It is a bearer credential with a short life; it is never logged
            and never shared.
        method:
          type: string
          enum: [GET]
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working, which is sooner than when the export expires.
        watermark:
          type: string
          description: The string stamped on the header and on every row of the file being fetched.
        downloadCount:
          type: integer
          minimum: 0
          description: How many times this export has now been downloaded, counting this one.
