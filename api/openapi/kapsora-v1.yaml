openapi: 3.1.0
info:
  title: KAPSORA Platform API
  version: 1.0.0-alpha.1
  summary: Kurumsal hak, fayda ve hizmet orkestrasyonu için başlangıç API sözleşmesi
  description: |
    Bu sözleşme ilk sprint ve çekirdek MVP için contract-first geliştirme başlangıç noktasıdır.
    Kullanıcılar KAPSORA'nın kendi hesaplarıyla giriş yapar (ADR-022); tarayıcı yalnız opak
    oturum çerezi taşır. Makineden makineye entegrasyonlar OAuth 2.0 client credentials ve
    mTLS ile çalışır. Tüm tenant kapsamlı çağrılar X-Tenant-ID
    başlığı taşır. Durum değiştiren POST komutlarında Idempotency-Key zorunludur; sorgu
    niteliğindeki POST'larda (eligibility check, pricing quote) opsiyoneldir.
    İstemci X-Request-ID başlığında UUID gönderebilir; sunucu her yanıtta X-Request-ID döner.
    Çerez oturumuyla yapılan durum değiştiren çağrılar X-CSRF-Token başlığı taşır.
  contact:
    name: KAPSORA Product Engineering
servers:
  - url: https://api.staging.kapsora.example
    description: Staging
  - url: https://api.kapsora.example
    description: Production
security:
  - sessionCookie: []
  - oauth2: [kapsora.api]
tags:
  - name: Health
    description: Servis sağlık kontrolleri
  - name: Identity
    description: Oturum ve kullanıcı bağlamı
  - name: Tenants
    description: Tenant erişimi
  - name: Organizations
    description: Kurum ve sağlayıcı dizini
  - name: People
    description: Hak sahipleri ve ilişkiler
  - name: Benefit
    description: Program, plan, plan sürümü, kayıt ve haklar
  - name: Imports
    description: Toplu üye içe aktarma
  - name: Eligibility
    description: Hak sahipliği ve plan uygunluğu
  - name: Service Requests
    description: Genel hizmet talebi ve durum geçişleri
  - name: Catalog
    description: Hizmet kataloğu, dış kod sistemleri ve kod eşlemeleri
  - name: Providers
    description: Sağlayıcı profilleri, lokasyonlar, yetkinlikler ve uygulayıcılar
  - name: Contracts
    description: Sözleşmeler, sürümler, fiyat listeleri, paketler, kotalar ve ödeme koşulları
  - name: Rules
    description: Kural setleri, sürümler, CEL kuralları, test senaryoları ve değerlendirmeler
  - name: Pricing
    description: Fiyat teklifleri, kalem kırılımı ve teklif açıklamaları
  - name: Authorizations
    description: Ön onaylar, hizmet kayıtları ve kuponlar
  - name: Worklist
    description: İş kuyrukları, iş kalemleri, yorumlar ve onay politikaları
  - name: Documents
    description: Belge yükleme, karantina taraması, güvenli indirme ve hukuki saklama
  - name: Notifications
    description: Bildirim şablonları, gönderilen mesajlar, gönderim denemeleri ve tercihler
  - name: Clinical
    description: Sağlık vakası, encounter, tanı ve klinik erişim kaydı
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Required dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: One or more required dependencies are unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentUserContext
      security:
        - sessionCookie: []
      description: |
        The signed-in actor with one context per active membership: tenant summary, the
        permissions resolved from tenant-owned roles and access grants valid now, and any
        narrowing scopes (ORGANIZATION, PROGRAM, ...). The frontend uses it to build the
        tenant picker and to hide controls; the backend re-validates every call.
      responses:
        '200':
          description: Authenticated actor and tenant memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tenants:
    get:
      tags: [Tenants]
      operationId: listAccessibleTenants
      security:
        - sessionCookie: []
      description: |
        Tenants in which the actor holds an active membership, ordered by display name. An
        actor never learns about tenants it is not a member of.
      responses:
        '200':
          description: Tenants accessible to the current actor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/session:
    get:
      tags: [Identity]
      operationId: getSession
      security:
        - sessionCookie: []
      description: |
        Returns the current session and the CSRF token every state-changing call must echo
        in X-CSRF-Token. This is how the frontend obtains that token.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/session/login:
    post:
      tags: [Identity]
      operationId: login
      security: []
      description: |
        Authenticates a user name and password and starts a session. The response sets the
        session cookie and carries the CSRF token.

        Failures are deliberately coarse: an unknown user name and a wrong password both
        return 401 INVALID_CREDENTIALS with the same body and take the same time, so the
        endpoint cannot be used to discover who has an account. Repeated failures lock the
        account for a short period (403 ACCOUNT_LOCKED); the endpoint is also rate limited
        per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 320
                  description: Case-insensitive; leading and trailing spaces are ignored.
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
      responses:
        '200':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '400':
          description: Malformed request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/session/password:
    post:
      tags: [Identity]
      operationId: changeOwnPassword
      security:
        - sessionCookie: []
      description: |
        Replaces the caller's own password after verifying the current one. Every other
        session of the actor is ended; the calling session stays valid.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  maxLength: 1024
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 1024
      responses:
        '204':
          description: Password changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/session/switch-tenant:
    post:
      tags: [Identity]
      operationId: switchTenant
      description: |
        Selects the active tenant for the session. The server verifies that the actor holds
        an active membership; the X-Tenant-ID header on later calls must equal this tenant
        and is never trusted on its own. A tenant the actor is not a member of and a tenant
        that does not exist both answer 403 TENANT_ACCESS_DENIED.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId]
              properties:
                tenantId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Active tenant context after the switch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/session/step-up:
    post:
      tags: [Identity]
      operationId: stepUpSession
      description: |
        Re-verifies the caller's password before a sensitive operation (publish, privileged
        grant, sensitive download, export, adjustment, settlement approval, break-glass).
        The elevated state is valid for a short window returned in the response. Failures
        count towards the same account lockout as a login.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  maxLength: 1024
      responses:
        '200':
          description: Step-up accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [stepUpExpiresAt]
                properties:
                  stepUpExpiresAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/session/logout:
    post:
      tags: [Identity]
      operationId: logout
      description: |
        Ends the session and clears the cookie. Calling it without a session, or twice, is
        not an error.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session ended
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      description: |
        Lists the tenant's organization relationships newest first with keyset pagination.
        `q` matches the display name (case-insensitive, 2-120 characters); `role` filters the
        relationship role. Cursors are opaque and signed; a tampered one is rejected.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          schema:
            type: string
            enum: [PAYER, SPONSOR, PROVIDER, VENDOR, PARTNER]
        - name: q
          in: query
          description: Display name/code search; tenant scoped
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Organization page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '400':
          description: Invalid cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Organizations]
      operationId: createTenantOrganization
      description: |
        Creates the tenant's relationship with an organization. The organization itself lives
        in the global directory: the server looks it up by the supplied registry identifiers
        (country + tax number blind index) and reuses the existing legal entity when found,
        otherwise creates it. A 409 is returned when this tenant already has the same
        relationship role with that organization for an overlapping period.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization relationship created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/organizations/{organizationId}:
    get:
      tags: [Organizations]
      operationId: getOrganization
      description: |
        One relationship with the shared legal entity and its masked registry identifiers.
        `organizationId` is the relationship id; ids of other tenants answer 404.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization detail
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      description: |
        Merge-patch of the relationship (`relationshipStatus`, `tenantCode`, `null` clears it)
        and of the shared display name. Renaming is refused with 409
        ORGANIZATION_SHARED_READONLY once another tenant also holds a relationship with the
        organization. `If-Match` must carry the ETag of the last read; a stale value answers
        412 and a missing one 428.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated organization
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/people:
    get:
      tags: [People]
      operationId: listPeople
      description: |
        Keyset page of the tenant's persons, newest first. `q` matches the folded
        normalized name token by token; identifiers are never accepted here, an exact
        lookup goes through the permission-protected search endpoint.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Name search. Exact sensitive identifier search uses identifierHash through a dedicated permission-protected endpoint.
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          description: Keeps only persons in this registry status.
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, DECEASED, MERGED]
        - name: sponsorOrganizationId
          in: query
          description: Keeps only persons with an active membership under this sponsor or payer organization.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Person page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPage'
    post:
      tags: [People]
      operationId: createPerson
      description: |
        Registers a person. Identifier types come from the tenant catalog; a TCKN is
        checksum-validated, every value is envelope-encrypted and indexed with a
        tenant-salted HMAC, and only the masked form is ever returned. A value already
        held by another person answers 409 PERSON_IDENTIFIER_TAKEN.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Person created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/people/{personId}:
    get:
      tags: [People]
      operationId: getPerson
      description: |
        One person with masked identifiers and the ETag to send back as `If-Match`. A
        merged person answers 200 with status MERGED and the surviving person in
        `mergedIntoId`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200':
          description: Person detail filtered by field-level permission
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [People]
      operationId: updatePerson
      description: |
        Merge-patch of names, birth date, sex at birth and status (ACTIVE, INACTIVE, DECEASED;
        MERGED is only set by the merge command). Identifiers are added with `{type, value}`
        and removed with `{type, remove: true}` under the same validation as create.
        `If-Match` must carry the ETag of the version being edited; a stale value answers
        412 ETAG_MISMATCH and the client reloads.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdatePersonRequest'
      responses:
        '200':
          description: Person updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch, reload the record
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/people/search-by-identifier:
    post:
      tags: [People]
      operationId: searchPeopleByIdentifier
      description: |
        Finds the one person that carries an identifier value, through the tenant-salted
        blind index; the value itself is never stored, logged or echoed. Requires the
        `member.identifier.search` permission and a recent step-up. Every call is written to
        the access audit with the identifier type only. Not idempotent and not cached.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierSearchRequest'
      responses:
        '200':
          description: The person carrying the identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/people/{personId}/relationships:
    get:
      tags: [People]
      operationId: listPersonRelationships
      description: Relationships in both directions with the other person as a summary.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200':
          description: Relationships of the person
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonRelationship'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [People]
      operationId: createPersonRelationship
      description: |
        Links two persons of the tenant with a relationship type from the tenant catalog for
        a validity period. Overlapping periods for the same pair and type answer 409
        RELATIONSHIP_OVERLAP; a person cannot be related to itself.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRelationshipRequest'
      responses:
        '201':
          description: Relationship created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonRelationship'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/people/{personId}/relationships/{relationshipId}/end:
    post:
      tags: [People]
      operationId: endPersonRelationship
      description: Ends a relationship on a date with a reason; the row is kept for history.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/RelationshipId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndPeriodCommand'
      responses:
        '200':
          description: Relationship ended
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonRelationship'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/people/{personId}/memberships:
    get:
      tags: [People]
      operationId: listSponsorMemberships
      description: Sponsor memberships of the person, newest first.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200':
          description: Memberships of the person
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SponsorMembership'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [People]
      operationId: createSponsorMembership
      description: |
        Adds a membership under a sponsor or payer organization of the tenant. Membership
        types marked `requiresPrincipal` need `principalMembershipId`; an external member
        number is unique per sponsor (409 MEMBER_NO_TAKEN); overlapping periods under the
        same sponsor answer 409 MEMBERSHIP_OVERLAP.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
