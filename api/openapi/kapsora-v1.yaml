                $ref: '#/components/schemas/Claim'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The current version has been submitted and is frozen. CLAIM_VERSION_FROZEN.
          content:
