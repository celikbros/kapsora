    PersonContact:
      type: object
      additionalProperties: false
      required: [id, personId, channel, maskedValue, primary, rowVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, SMS]
        maskedValue:
          type: string
          maxLength: 120
          description: |
            All anybody is shown. The address itself is envelope-encrypted like an
            identity number and is returned by no endpoint at all.
        verifiedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When somebody proved the address is theirs. Null is still an address the
            platform will write to; verification buys the right to trust it, not the right
            to use it.
        primary:
          type: boolean
        rowVersion:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    PersonContactInput:
      type: object
      additionalProperties: false
      required: [channel, value]
      properties:
        channel:
          type: string
          enum: [EMAIL, SMS]
        value:
          type: string
          minLength: 3
          maxLength: 254
          description: |
            The address itself. It is written once, encrypted, and never comes back: a
            later read answers with the mask.
        primary:
          type: boolean
          default: false
        verified:
          type: boolean
          default: false
          description: Whether this address has already been proved, for an import that carries the fact.
