                $ref: '#/components/schemas/Problem'
  /api/v1/contract-versions/{contractVersionId}/payment-term:
    get:
      tags: [Contracts]
      operationId: getPaymentTerm
      description: |
        How and when the provider is paid under this version: the due days, the settlement
        method, the tax behaviour and the rates. A version that has none answers 404, so a
        screen can tell "not agreed yet" apart from "agreed as zero".
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractVersionId'
      responses:
