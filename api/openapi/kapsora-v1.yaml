          description: Claim created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          description: Access projection header invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/claims/{claimId}:
    get:
      tags: [Claims]
      operationId: getClaim
      description: |
        One claim with the lines of its current version and the decision each of them carries.

        This is the read that demands a purpose. A claim on a SENSITIVE case read by a caller
        holding `health.clinical.read` and `health.sensitive.read` but sending no
        `X-Access-Purpose` is answered 428 ACCESS_PURPOSE_REQUIRED, and the refusal is
        recorded as a DENIED access event with resource type `claim`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
        - $ref: '#/components/parameters/AccessProjectionHeader'
