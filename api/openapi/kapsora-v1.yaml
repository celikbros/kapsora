        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Cancelled request
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-categories:
    get:
      tags: [Catalog]
      operationId: listServiceCategories
      description: |
        Service categories of the tenant, newest first, with keyset paging. The picker
        builds the tree from parentId; the filters narrow it to one branch, one service
        domain or one activity state.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Code or name search.
          schema:
            type: string
            maxLength: 120
        - name: parentId
          in: query
          description: Only the direct children of this category.
          schema:
            type: string
            format: uuid
        - name: domain
          in: query
          description: Only categories of this service domain.
          schema:
            $ref: '#/components/schemas/ServiceDomain'
        - name: active
          in: query
          description: Only active (true) or only retired (false) categories.
          schema:
            type: boolean
      responses:
        '200':
          description: Service category page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCategoryPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Catalog]
      operationId: createServiceCategory
      description: |
        Creates a category. The code is unique within the tenant (409 CATEGORY_CODE_TAKEN)
        and immutable afterwards, because service definitions, contracts and claims are
        read against it. A parentId that would close a loop answers 409 CATEGORY_CYCLE and
        a branch deeper than six levels answers 422 with field code DEPTH_EXCEEDED.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceCategoryRequest'
      responses:
        '201':
          description: Category created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCategory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/service-categories/{categoryId}:
    get:
      tags: [Catalog]
      operationId: getServiceCategory
      description: One service category of the tenant with its optimistic concurrency tag.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCategoryId'
      responses:
        '200':
          description: Service category
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCategory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Catalog]
      operationId: patchServiceCategory
      description: |
        Merge-patch of name, parent and activity. The code is immutable: a body carrying
        code answers 422 with field code IMMUTABLE. Re-parenting refuses a cycle with 409
        CATEGORY_CYCLE and a resulting depth over six with 422 DEPTH_EXCEEDED.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCategoryId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateServiceCategoryRequest'
      responses:
        '200':
          description: Category updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCategory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/service-definitions:
    get:
      tags: [Catalog]
      operationId: listServiceDefinitions
      description: |
        Service definitions of the tenant, newest first, with keyset paging. q searches
        code and name; the other filters narrow to one category, one service domain or
        one activity state.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Code or name search.
          schema:
            type: string
            maxLength: 120
        - name: categoryId
          in: query
          description: Only definitions of this category.
          schema:
            type: string
            format: uuid
        - name: domain
          in: query
          description: Only definitions whose category carries this service domain.
          schema:
            $ref: '#/components/schemas/ServiceDomain'
        - name: active
          in: query
          description: Only active (true) or only retired (false) definitions.
          schema:
            type: boolean
      responses:
        '200':
          description: Service definition page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDefinitionPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Catalog]
      operationId: createServiceDefinition
      description: |
        Creates a service definition inside a category. The code is unique within the
        tenant (409 SERVICE_DEFINITION_CODE_TAKEN) and immutable afterwards: a wrong code
        is retired and replaced, never renamed, because contracts and claims point at it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceDefinitionRequest'
      responses:
        '201':
          description: Service definition created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDefinition'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/service-definitions/{definitionId}:
    get:
      tags: [Catalog]
      operationId: getServiceDefinition
      description: One service definition of the tenant with its optimistic concurrency tag.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceDefinitionId'
      responses:
        '200':
          description: Service definition
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDefinition'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Catalog]
      operationId: patchServiceDefinition
      description: |
        Merge-patch of category, name, description, fulfilment mode, unit type, provider
        requirement and activity. The code is immutable: a body carrying code answers 422
        with field code IMMUTABLE. Deactivating never cascades; it only stops the
        definition being offered in new work.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
