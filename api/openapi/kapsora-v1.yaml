          type: string
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
        serviceDefinitionId:
          type: [string, 'null']
          format: uuid
        periodType:
          $ref: '#/components/schemas/QuotaPeriodType'
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        capacity:
          type: string
          description: Exact numeric(20,6) capacity as a decimal string.
        consumed:
          type: string
          description: How much of the capacity authorization has taken so far, as a decimal string.
        allowOverdraft:
          type: boolean
    ProviderQuotaInput:
      type: object
      additionalProperties: false
      required: [periodType, periodFrom, periodTo, capacity]
      properties:
        locationId:
          type: string
          format: uuid
        serviceDefinitionId:
          type: string
          format: uuid
        periodType:
          $ref: '#/components/schemas/QuotaPeriodType'
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        capacity:
          $ref: '#/components/schemas/DecimalAmount'
        allowOverdraft:
          type: boolean
          default: false
    ProviderQuotaList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderQuota'
    ReplaceProviderQuotasRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ProviderQuotaInput'
    PaymentTerm:
      type: object
      additionalProperties: false
      required: [id, contractVersionId, dueDays, settlementMethod, taxBehaviour, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        contractVersionId:
          type: string
          format: uuid
        dueDays:
          type: integer
          minimum: 0
          maximum: 365
        settlementMethod:
          $ref: '#/components/schemas/SettlementMethod'
        taxBehaviour:
          $ref: '#/components/schemas/TaxBehaviour'
        vatRate:
          type: [string, 'null']
          description: VAT percentage as an exact decimal string.
        lateFeePercent:
          type: [string, 'null']
          description: Monthly late fee percentage as an exact decimal string.
        rowVersion:
          type: integer
          minimum: 1
    PutPaymentTermRequest:
      type: object
      additionalProperties: false
      required: [dueDays, settlementMethod, taxBehaviour]
      properties:
        dueDays:
          type: integer
          minimum: 0
          maximum: 365
        settlementMethod:
          $ref: '#/components/schemas/SettlementMethod'
        taxBehaviour:
          $ref: '#/components/schemas/TaxBehaviour'
        vatRate:
          $ref: '#/components/schemas/DecimalRate'
        lateFeePercent:
          $ref: '#/components/schemas/DecimalRate'
    ResolvePriceRequest:
      type: object
      additionalProperties: false
      required: [serviceDate, providerProfileId, serviceDefinitionId]
      properties:
        serviceDate:
          type: string
          format: date
          description: The day the service is delivered; the whole selection is made against it.
        providerProfileId:
          type: string
          format: uuid
        serviceDefinitionId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
          description: Where it will be delivered, when that is already known.
    PriceMatchTarget:
      type: string
      description: |
        What the price item names: the service definition itself, a package containing it,
        or a category above it in the catalog tree.
      enum: [DEFINITION, PACKAGE, CATEGORY]
    ResolvedPrice:
      type: object
      additionalProperties: false
      required:
        [priceItemId, priceListId, contractVersionId, contractId, contractCode, versionNo,
         currencyCode, unitType, pricingMethod, memberShareMethod, matchedVia]
      properties:
        priceItemId:
          type: string
          format: uuid
        priceListId:
          type: string
          format: uuid
        priceListCode:
          type: [string, 'null']
        contractVersionId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        contractCode:
          type: string
        versionNo:
          type: integer
          minimum: 1
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        locationId:
          type: [string, 'null']
          format: uuid
        unitType:
          $ref: '#/components/schemas/ServiceUnitType'
        pricingMethod:
          $ref: '#/components/schemas/PricingMethod'
        amount:
          type: [string, 'null']
        percent:
          type: [string, 'null']
        formulaKey:
          type: [string, 'null']
        minAmount:
          type: [string, 'null']
        maxAmount:
          type: [string, 'null']
        memberShareMethod:
          $ref: '#/components/schemas/MemberShareMethod'
        memberShareAmount:
          type: [string, 'null']
        memberSharePercent:
          type: [string, 'null']
        matchedVia:
          $ref: '#/components/schemas/PriceMatchTarget'
    ScoredPriceCandidate:
      type: object
      additionalProperties: false
      required: [priceItemId, priceListId, contractVersionId, score, matched, matchedVia]
      properties:
        priceItemId:
          type: string
          format: uuid
        priceListId:
          type: string
          format: uuid
        contractVersionId:
          type: string
          format: uuid
        score:
          type: integer
          description: Specificity score; the highest one wins and equal ones are a tie, never a coin flip.
        matched:
          type: boolean
          description: False for a candidate that was loaded and then ruled out.
        excluded:
          type: [string, 'null']
          description: Why it was ruled out, one of PERIOD, SEASON, WEEKDAY, LOCATION or SERVICE.
        matchedVia:
          $ref: '#/components/schemas/PriceMatchTarget'
        itemPriority:
          type: integer
        listPriority:
          type: integer
    ResolvePriceResult:
      type: object
      additionalProperties: false
      required: [outcome, serviceDate, considered, tied]
      properties:
        outcome:
          type: string
          description: |
            MATCHED when exactly one candidate scored highest, REVIEW_REQUIRED when several
            tied at the top, NOT_FOUND when nothing matched at all.
          enum: [MATCHED, REVIEW_REQUIRED, NOT_FOUND]
        reason:
          type: [string, 'null']
          description: PRICE_AMBIGUOUS or PRICE_NOT_FOUND; absent when a winner was found.
        serviceDate:
          type: string
          format: date
        winner:
          $ref: '#/components/schemas/ResolvedPrice'
        tied:
          type: array
          description: Every candidate that tied at the top when the outcome is REVIEW_REQUIRED.
          items:
            $ref: '#/components/schemas/ResolvedPrice'
        considered:
          type: array
          description: Every candidate with its score, winners and losers alike, highest first.
          items:
            $ref: '#/components/schemas/ScoredPriceCandidate'
    RuleSetPurpose:
      type: string
      description: |
        Which decision a rule set answers. A caller asking "what documents does this claim
        need" reads the DOCUMENT sets and never a PRICE one, so the purpose is what makes
        a set findable rather than a comment on it.
      enum: [ELIGIBILITY, DOCUMENT, PREAUTH, LIMIT, DUPLICATE, DIAGNOSIS_SERVICE, PRICE, ADJUDICATION]
    RuleSetStatus:
      type: string
      description: |
        Lifecycle of a rule set. INACTIVE stops it being offered for new decisions and
        changes nothing about the evaluations it already produced.
      enum: [ACTIVE, INACTIVE]
    RuleSetVersionStatus:
      type: string
      description: |
        Lifecycle of a rule set version. PUBLISHED is the only status the engine ever
        evaluates for a recorded decision, and nothing about it may change afterwards.
      enum: [DRAFT, UNDER_REVIEW, PUBLISHED, RETIRED]
    RuleInputType:
      type: string
      description: |
        The CEL type of one declared input variable (ADR-023). The environment offers
        these and nothing else: there is no type here that reaches a network, a file or a
        database, which is how v1.2 11.7's prohibitions are kept — by absence.
      enum: [string, int, double, bool, timestamp, duration, map, list]
    RuleInputSchema:
      type: object
      description: |
        The variables a condition of this version may name, and their CEL types. A
        condition reaching anything not declared here fails to compile at authoring time.
      additionalProperties:
        $ref: '#/components/schemas/RuleInputType'
    RuleActionType:
      type: string
      description: |
        What a matched rule asks the caller to do. The engine returns actions and performs
        none of them: eligibility, authorization and adjudication decide what to do with
        them, and that separation is what lets a simulation run without writing a row.
      enum:
        - APPROVE
        - REJECT
        - WARN
        - REQUIRE_DOCUMENT
        - REQUIRE_PREAUTH
        - REQUIRE_MEDICAL_REVIEW
        - REQUIRE_FINANCIAL_REVIEW
        - PARTIAL_APPROVE
        - RESERVE_ENTITLEMENT
        - ADJUST_PRICE
        - SET_LIMIT
    RuleOutcome:
      type: string
      description: |
        The one answer a whole pass folds to. Any REJECT wins; otherwise any REQUIRE_*
        means REVIEW_REQUIRED; otherwise any PARTIAL_APPROVE means PARTIALLY_APPROVED;
        APPROVED is what is left when nothing objected.
      enum: [APPROVED, REJECTED, REVIEW_REQUIRED, PARTIALLY_APPROVED]
    RuleSeverity:
      type: string
      description: How loud one line of the trace is; ERROR marks a rule that threw or timed out.
      enum: [INFO, WARNING, ERROR]
    RuleAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/RuleActionType'
        payload:
          type: object
          additionalProperties: true
          description: |
            The typed payload of the action, validated on write against the action type:
            REQUIRE_DOCUMENT needs a documentTypeCode, SET_LIMIT and RESERVE_ENTITLEMENT
            an amount, ADJUST_PRICE a method and a value. Every numeric value is an exact
            decimal string, never a JSON number.
    RuleSet:
      type: object
      additionalProperties: false
      required: [id, code, name, domainCode, purpose, status, versionCount, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        domainCode:
          $ref: '#/components/schemas/ServiceDomain'
        purpose:
          $ref: '#/components/schemas/RuleSetPurpose'
        status:
          $ref: '#/components/schemas/RuleSetStatus'
        versionCount:
          type: integer
          minimum: 0
          description: How many versions the set holds, drafts included.
        rowVersion:
          type: integer
          minimum: 1
    RuleSetPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuleSet'
        nextCursor:
          type: [string, 'null']
    CreateRuleSetRequest:
      type: object
      additionalProperties: false
      required: [code, name, domainCode, purpose]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,39}$'
        name:
          type: string
          minLength: 2
          maxLength: 200
        domainCode:
          $ref: '#/components/schemas/ServiceDomain'
        purpose:
          $ref: '#/components/schemas/RuleSetPurpose'
    UpdateRuleSetRequest:
      type: object
      additionalProperties: false
      description: |
        Merge-patch body. The code, the service domain and the purpose are absent because
        they are what the set is; a body carrying one answers 422 with IMMUTABLE.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        status:
          $ref: '#/components/schemas/RuleSetStatus'
    RuleSetVersionSummary:
      type: object
      additionalProperties: false
      required: [id, ruleSetId, versionNo, status, ruleCount, testCaseCount, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        ruleSetId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RuleSetVersionStatus'
        validFrom:
          type: [string, 'null']
          format: date
        validTo:
          type: [string, 'null']
          format: date
        notes:
          type: [string, 'null']
        publishedAt:
          type: [string, 'null']
          format: date-time
        ruleCount:
          type: integer
          minimum: 0
        testCaseCount:
          type: integer
          minimum: 0
          description: How many test cases the version holds; submit refuses while this is zero.
        rowVersion:
          type: integer
          minimum: 1
    RuleSetVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuleSetVersionSummary'
    RuleSetVersion:
      type: object
      additionalProperties: false
      required: [id, ruleSetId, versionNo, status, inputSchema, rules, testCases, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        ruleSetId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RuleSetVersionStatus'
        validFrom:
          type: [string, 'null']
          format: date
        validTo:
          type: [string, 'null']
          format: date
        inputSchema:
          $ref: '#/components/schemas/RuleInputSchema'
        notes:
          type: [string, 'null']
        contentHash:
          type: [string, 'null']
          description: Lower-case hex SHA-256 over the input schema and every rule, written at publish.
        submittedAt:
          type: [string, 'null']
          format: date-time
        submittedBy:
          type: [string, 'null']
          format: uuid
        publishedAt:
          type: [string, 'null']
          format: date-time
        publishedBy:
          type: [string, 'null']
          format: uuid
        reviewComment:
          type: [string, 'null']
        retireReasonCode:
          type: [string, 'null']
        rules:
          type: array
          description: The rules of the version in ascending priority order; 1 runs first.
          items:
            $ref: '#/components/schemas/Rule'
        testCases:
          type: array
          items:
            $ref: '#/components/schemas/RuleTestCase'
        rowVersion:
          type: integer
          minimum: 1
    CreateRuleSetVersionRequest:
      type: object
      additionalProperties: false
      properties:
        copyFromVersionId:
          type: string
          format: uuid
          description: Another version of the same set whose schema, rules and test cases are copied.
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, 'null']
          format: date
        inputSchema:
          $ref: '#/components/schemas/RuleInputSchema'
        notes:
          type: string
          maxLength: 2000
    UpdateRuleSetVersionRequest:
      type: object
      additionalProperties: false
      description: Merge-patch body of a DRAFT rule set version.
      properties:
        validFrom:
          type: [string, 'null']
          format: date
        validTo:
          type: [string, 'null']
          format: date
        inputSchema:
          $ref: '#/components/schemas/RuleInputSchema'
        notes:
          type: [string, 'null']
          maxLength: 2000
    Rule:
      type: object
      additionalProperties: false
      required: [id, ruleSetVersionId, code, name, priority, condition, actions, explanationCode, stopOnMatch, active]
      properties:
        id:
          type: string
          format: uuid
        ruleSetVersionId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        priority:
          type: integer
          minimum: 1
          description: Ascending evaluation order; two rules of one version may not share a priority.
        condition:
          type: string
          description: A CEL expression returning a boolean, compiled against the version's input schema.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/RuleAction'
        explanationCode:
          type: string
          description: The code every line of the trace this rule produces carries.
        explanationParams:
          type: object
          additionalProperties: true
          description: Substitution parameters of the explanation; ids and codes only, never a name.
        stopOnMatch:
          type: boolean
          description: Ends the pass as soon as this rule matches; recorded in the trace.
        active:
          type: boolean
          description: An inactive rule is kept for the record and never compiled or evaluated.
    RuleInput:
      type: object
      additionalProperties: false
      required: [code, name, priority, condition, explanationCode]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        name:
          type: string
          minLength: 2
          maxLength: 200
        priority:
          type: integer
          minimum: 1
          maximum: 100000
        condition:
          type: string
          minLength: 1
          maxLength: 8192
        actions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RuleAction'
        explanationCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        explanationParams:
          type: object
          additionalProperties: true
        stopOnMatch:
          type: boolean
          default: false
        active:
          type: boolean
          default: true
    RuleList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
    ReplaceRulesRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/RuleInput'
    RuleTestCase:
      type: object
      additionalProperties: false
      required: [id, ruleSetVersionId, code, input, expectedOutcome, expectedExplanations]
      properties:
        id:
          type: string
          format: uuid
        ruleSetVersionId:
          type: string
          format: uuid
        code:
          type: string
        description:
          type: [string, 'null']
        input:
          type: object
          additionalProperties: true
          description: One whole input document, keyed by the variables the input schema declares.
        expectedOutcome:
          $ref: '#/components/schemas/RuleOutcome'
        expectedExplanations:
          type: array
          description: The explanation codes the case must produce, in order.
          items:
            type: string
        expectedActions:
          type: [array, 'null']
          description: |
            The actions the case must produce, in order. Null means the case does not
            assert on actions at all; an entry without a payload asserts only its type.
          items:
            $ref: '#/components/schemas/RuleAction'
    RuleTestCaseInput:
      type: object
      additionalProperties: false
      required: [code, input, expectedOutcome]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        description:
          type: [string, 'null']
          maxLength: 500
        input:
          type: object
          additionalProperties: true
        expectedOutcome:
          $ref: '#/components/schemas/RuleOutcome'
        expectedExplanations:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        expectedActions:
          type: [array, 'null']
          maxItems: 100
          items:
            $ref: '#/components/schemas/RuleAction'
    RuleTestCaseList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuleTestCase'
    ReplaceRuleTestCasesRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/RuleTestCaseInput'
    RuleTestCaseResult:
      type: object
      additionalProperties: false
      required: [code, passed, expectedOutcome, actualOutcome, expectedExplanations, actualExplanations, actualActions, mismatches]
      properties:
        code:
          type: string
        passed:
          type: boolean
        expectedOutcome:
          $ref: '#/components/schemas/RuleOutcome'
        actualOutcome:
          $ref: '#/components/schemas/RuleOutcome'
        expectedExplanations:
          type: array
          items:
            type: string
        actualExplanations:
          type: array
          items:
            type: string
        expectedActions:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/RuleAction'
        actualActions:
          type: array
          items:
            $ref: '#/components/schemas/RuleAction'
        mismatches:
          type: array
          description: Which of outcome, explanations or actions differed; empty when the case passed.
          items:
            type: string
            enum: [OUTCOME, EXPLANATIONS, ACTIONS]
    RuleTestRunResult:
      type: object
      additionalProperties: false
      required: [ruleSetVersionId, passed, total, failed, cases]
      properties:
        ruleSetVersionId:
          type: string
          format: uuid
        passed:
          type: boolean
          description: True only when there is at least one case and every one of them passed.
        total:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        cases:
          type: array
          items:
            $ref: '#/components/schemas/RuleTestCaseResult'
    SimulateRuleSetVersionRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: object
          additionalProperties: true
          description: One whole input document, keyed by the variables the input schema declares.
    RuleEvaluationResultLine:
      type: object
      additionalProperties: false
      required: [sequence, ruleCode, matched, explanationCode, severity]
      properties:
        sequence:
          type: integer
          minimum: 1
          description: Position in the pass; the order the rules were considered in.
        ruleId:
          type: [string, 'null']
          format: uuid
        ruleCode:
          type: string
        matched:
          type: boolean
        actionType:
          type: [string, 'null']
          description: The action this line asks for, absent when the rule did not match or carries none.
        actionPayload:
          type: [object, 'null']
          additionalProperties: true
        explanationCode:
          type: string
        severity:
          $ref: '#/components/schemas/RuleSeverity'
    RuleEvaluationTrace:
      type: object
      additionalProperties: false
      required: [ruleSetVersionId, outcome, results]
      properties:
        ruleSetVersionId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RuleSetVersionStatus'
        outcome:
          $ref: '#/components/schemas/RuleOutcome'
        durationMs:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/RuleEvaluationResultLine'
    RuleEvaluation:
      type: object
      additionalProperties: false
      required: [id, ruleSetVersionId, ruleSetId, subjectType, outcome, inputHash, inputSnapshot, evaluatedAt, results]
      properties:
        id:
          type: string
          format: uuid
        ruleSetVersionId:
          type: string
          format: uuid
        ruleSetId:
          type: string
          format: uuid
        ruleSetCode:
          type: string
        versionNo:
          type: integer
          minimum: 1
        subjectType:
          type: string
          description: What was decided about, for example CLAIM or SERVICE_REQUEST.
        subjectId:
          type: [string, 'null']
          format: uuid
        outcome:
          $ref: '#/components/schemas/RuleOutcome'
        inputHash:
          type: string
          description: Lower-case hex SHA-256 of the canonical input; the same input twice gives the same hash.
        inputSnapshot:
          type: object
          additionalProperties: true
          description: |
            The input as it is kept for audit: ids, dates, codes and quantities only.
            Anything that is neither of those is dropped before the row is written, so no
            identity number and no name ever reaches this column.
        durationMs:
          type: [integer, 'null']
          minimum: 0
        evaluatedAt:
          type: string
          format: date-time
        evaluatedBy:
          type: [string, 'null']
          format: uuid
        results:
          type: array
          items:
            $ref: '#/components/schemas/RuleEvaluationResultLine'
    PriceQuoteOutcome:
      type: string
      description: |
        The answer for one line or for the whole quote. QUOTED means the plan carries what
        the rules and the balance allow; PARTIAL means it carries part of it; NOT_ELIGIBLE
        still prices the service, because a member the plan does not cover may still choose
        to pay privately; REVIEW_REQUIRED means nobody may act on the line yet, and a quote
        in that state carries no payer and no member figure at all.
      enum: [QUOTED, PARTIAL, REVIEW_REQUIRED, NOT_ELIGIBLE]
    PriceQuoteExplanation:
      type: object
      additionalProperties: false
      required: [code, severity]
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable reason for a figure that is not simply the contract
            amount: NOT_ELIGIBLE, PRICE_NOT_FOUND, PRICE_AMBIGUOUS, MEMBER_SHARE_APPLIED,
            LIMIT_APPLIED, PRICE_ADJUSTED, PRICE_CLAMPED_TO_MINIMUM,
            PRICE_CLAMPED_TO_MAXIMUM, BALANCE_INSUFFICIENT, ROUNDED_TO_CURRENCY,
            PRICE_FORMULA_UNKNOWN or REVIEW_REQUESTED_BY_RULE.
        severity:
          type: string
          enum: [INFO, WARNING, ERROR]
        source:
          type: [string, 'null']
          description: The rule code that caused this line, when a rule caused it.
    PriceQuoteRequestItem:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        serviceDefinitionId:
          type: string
          format: uuid
          description: The service being priced. Exactly one of this and packageDefinitionId.
        packageDefinitionId:
          type: string
          format: uuid
          description: The package being priced. Exactly one of this and serviceDefinitionId.
        quantity:
          type: string
          description: |
            Exact decimal string, greater than zero; a UNIT price multiplies by it. Never a
            JSON number, because a quantity that passes through a float is a quantity that
            can come back different.
        requestedAmount:
          type: [string, 'null']
          description: |
            What the provider asked for, as an exact decimal string. A PERCENT_OF_LIST price
            is a percentage of it.
    CreatePriceQuoteRequest:
      type: object
      additionalProperties: false
      required: [personId, providerProfileId, serviceDate, items]
      properties:
        personId:
          type: string
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
          description: Restricts the enrollment the eligibility step may use.
        providerProfileId:
          type: string
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
          description: Where the service is delivered; a location-specific price needs it.
        serviceDate:
          type: string
          format: date
          description: The day the service is delivered. The whole quote is made against it.
        eligibilityEvaluationId:
          type: [string, 'null']
          format: uuid
          description: |
            An eligibility evaluation the caller already made for this person, recorded on
            the quote so the two can be read together. The quote never creates one itself:
            opening an entitlement account posts a ledger entry, and a quote must leave the
            ledger untouched.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PriceQuoteRequestItem'
        context:
          type: object
          additionalProperties: true
          description: |
            Recognised hints only, exactly as the eligibility check reads them: domain
            (HEALTH classifies the access audit row HEALTH instead of PERSONAL),
            entitlementCode for every line and entitlementCodes positionally per line.
            Anything else is ignored, never stored and never hashed.
    PriceQuoteItem:
      type: object
      additionalProperties: false
      required:
        [lineNo, quantity, requestedAmount, contractAmount, coveredAmount, payerAmount,
         memberAmount, outcome, explanations]
      properties:
        lineNo:
          type: integer
          minimum: 1
          description: The requested line position, counting from one.
        serviceDefinitionId:
          type: [string, 'null']
          format: uuid
        packageDefinitionId:
          type: [string, 'null']
          format: uuid
        priceItemId:
          type: [string, 'null']
          format: uuid
          description: The contract price item that won the selection; null when none did.
        quantity:
          type: string
        requestedAmount:
          type: string
        contractAmount:
          type: string
          description: What the contract says the line costs, before the plan carries any of it.
        coveredAmount:
          type: string
          description: How much of the contract amount the plan is willing to carry.
        payerAmount:
          type: string
          description: What the payer ends up paying, capped by the entitlement balance.
        memberAmount:
          type: string
          description: |
            What the member pays out of pocket; payerAmount plus memberAmount is exactly the
            contract amount, which is why the rounding happens once and the member takes the
            difference.
        outcome:
          $ref: '#/components/schemas/PriceQuoteOutcome'
        explanations:
          type: array
          items:
            $ref: '#/components/schemas/PriceQuoteExplanation'
    PriceQuote:
      type: object
      additionalProperties: false
      required:
        [id, personId, providerProfileId, serviceDate, currencyCode, outcome,
         requestedAmount, contractAmount, coveredAmount, payerAmount, memberAmount,
         items, ruleSetVersionIds, expiresAt, expired, quotedAt, disclaimer]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        programId:
          type: [string, 'null']
          format: uuid
        providerProfileId:
          type: string
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
        serviceDate:
          type: string
          format: date
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        outcome:
          $ref: '#/components/schemas/PriceQuoteOutcome'
        requestedAmount:
          type: string
        contractAmount:
          type: string
        coveredAmount:
          type: string
        payerAmount:
          type: string
        memberAmount:
          type: string
        items:
          type: array
          description: One entry per requested line, in line order.
          items:
            $ref: '#/components/schemas/PriceQuoteItem'
        contractVersionId:
          type: [string, 'null']
          format: uuid
          description: The published contract version the winning prices came from.
        planVersionId:
          type: [string, 'null']
          format: uuid
        ruleSetVersionIds:
          type: array
          description: Every published PRICE rule set version that was evaluated for this quote.
          items:
            type: string
            format: uuid
        eligibilityEvaluationId:
          type: [string, 'null']
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: When the quote stops holding, from the tenant setting pricing.quote_ttl_hours.
        expired:
          type: boolean
          description: |
            True when expiresAt has passed. An expired quote still reads back and says so
            rather than disappearing, because a member who was given a number is owed the
            reason it no longer holds.
        quotedAt:
          type: string
          format: date-time
        quotedBy:
          type: [string, 'null']
          format: uuid
        disclaimer:
          type: string
          description: |
            Plain-language statement that a quote is not an authorization and grants nothing:
            no reservation, no approval and no ledger movement. Carried through to the UI so
            nobody at a counter mistakes a quote for a decision.
