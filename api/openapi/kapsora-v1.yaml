                $ref: '#/components/schemas/PractitionerLocationList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/practitioners/search-by-registration:
    post:
      tags: [Providers]
      operationId: searchPractitionerByRegistration
      description: |
        Finds the one practitioner carrying a registration number, through the
        tenant-salted blind index. The number travels in the body and never in a path or a
        query key, so it cannot reach a log, a proxy or a browser history; the answer
        carries the masked form only. Requires `provider.practitioner.manage` and a recent
        step-up, and every call is written to the access audit with the issuing authority
        alone. Not idempotent and not cached.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PractitionerRegistrationSearchRequest'
      responses:
        '200':
          description: The practitioner carrying the registration number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Practitioner'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/contracts:
    get:
      tags: [Contracts]
      operationId: listContracts
      description: |
        Contracts of the tenant, newest first, with keyset paging. A contract is the
        agreement between one payer organization and one provider; what was actually
        agreed lives in its versions. q searches the code and the name, the other filters
        narrow to one provider, one payer, one service domain or one status.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Contract code or name search.
          schema:
            type: string
            maxLength: 120
        - name: providerProfileId
          in: query
          description: Only contracts with this provider.
          schema:
            type: string
            format: uuid
        - name: payerOrganizationId
          in: query
          description: Only contracts whose payer is this organization relationship.
          schema:
            type: string
            format: uuid
        - name: domainCode
          in: query
          description: Only contracts in this service domain.
          schema:
            $ref: '#/components/schemas/ServiceDomain'
        - name: status
          in: query
          description: Only contracts in this status.
          schema:
            $ref: '#/components/schemas/ContractStatus'
      responses:
        '200':
          description: Contract page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Contracts]
      operationId: createContract
      description: |
        Opens a contract between a payer organization relationship and a provider profile
        of this tenant. The contract carries no prices of its own: it starts in DRAFT and
        holds versions, and only a published version is ever read by a quote, an
        authorization or a claim. The code is unique inside the tenant, so a second one
        answers 409 CONTRACT_CODE_TAKEN.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Contract created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/contracts/{contractId}:
    get:
      tags: [Contracts]
      operationId: getContract
      description: |
        One contract of the tenant with its parties and its optimistic concurrency tag.
        The versions are read separately, because a long-running contract accumulates more
        of them than a detail view wants to carry.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Contract
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Contracts]
      operationId: patchContract
      description: |
        Merge-patch of the name, the sponsor organization and the contract status. The
        code, the payer, the provider and the service domain are absent: they are what the
        contract is, and every published version was agreed under them, so a body carrying
        one answers 422 with field code IMMUTABLE. Suspending or closing a contract does
        not change its versions; it only stops the price selection considering them.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateContractRequest'
      responses:
        '200':
          description: Contract updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contracts/{contractId}/versions:
    get:
      tags: [Contracts]
      operationId: listContractVersions
      description: |
        The version summaries of one contract, highest version number first. The price
        sheet of a version is read through the version itself; this list is what a screen
        shows to pick between "what we agreed then" and "what we agreed now".
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Contract versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersionList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Contracts]
      operationId: createContractVersion
      description: |
        Opens the next DRAFT version of a contract. copyFromVersionId copies the price
        lists, price items, package definitions, quotas and payment term of another
        version of the same contract, which is how a yearly price revision starts from
        last year's sheet instead of from an empty page. The new version stays editable
        until it is published.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractVersionRequest'
      responses:
        '201':
          description: Contract version created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/contract-versions/{contractVersionId}:
    get:
      tags: [Contracts]
      operationId: getContractVersion
      description: |
        One contract version with its price lists, its review metadata and its
        configuration hash. The price items of each list are paged separately, because a
        health tariff runs to thousands of rows. A published version needs only
        `contract.read`; a draft needs `contract.manage`, so a price nobody has agreed to
        yet is not visible to everyone who may read the agreed one.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractVersionId'
      responses:
        '200':
          description: Contract version
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Contracts]
      operationId: patchContractVersion
      description: |
        Merge-patch of the validity period, the currency and the notes of a DRAFT version.
        A version that is not DRAFT answers 409 CONTRACT_VERSION_IMMUTABLE: everything
        downstream was priced from the published sheet, so it cannot move underneath a
        claim that already quoted it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateContractVersionRequest'
      responses:
        '200':
          description: Contract version updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contract-versions/{contractVersionId}/submit:
    post:
      tags: [Contracts]
      operationId: submitContractVersion
      description: |
        Moves a DRAFT version to UNDER_REVIEW and records the maker. A version with no
        price list holding at least one price item is refused with 422 on field
        priceLists: an empty sheet cannot be reviewed, and publishing it would make every
        later price lookup answer PRICE_NOT_FOUND. The validity start is required too,
        because a published version without one could never be selected by service date.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewComment'
      responses:
        '200':
          description: Contract version submitted for review
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contract-versions/{contractVersionId}/publish:
    post:
      tags: [Contracts]
      operationId: publishContractVersion
      description: |
        Freezes a version under review. It needs `contract.publish`, a recent step-up and
        an actor other than the one who submitted it; the same person answers 403
        MAKER_CHECKER_SAME_ACTOR and the refusal is audited. Publishing writes a
        configuration hash over the version's whole price content, so "what was agreed"
        can be proved later. Two published versions of one contract may not cover the same
        date: an overlap answers 409 CONTRACT_VERSION_OVERLAP.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewComment'
      responses:
        '200':
          description: Contract version published
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contract-versions/{contractVersionId}/retire:
    post:
      tags: [Contracts]
      operationId: retireContractVersion
      description: |
        Closes a published version with a reason. It needs `contract.publish` and a recent
        step-up. The version stays readable for every quote and claim priced from it and
        stops being a candidate for new price lookups; the reason code is required so the
        history says why the tariff was withdrawn.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Contract version retired
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contract-versions/{contractVersionId}/price-lists:
    put:
      tags: [Contracts]
      operationId: putPriceLists
      description: |
        Replaces the whole price list set of a DRAFT version, for the same reason provider
        capabilities are replaced as a set: the meaningful unit is the price sheet, and a
        set write makes consistency one decision. A list already present under the same
        code keeps its identity and its price items; one absent from the body is deleted
        with its items. Season and weekday mask exist because accommodation prices by date
        and by day of the week, and a health contract simply leaves both null. Any write to
        a version that is not DRAFT answers 409 CONTRACT_VERSION_IMMUTABLE. If-Match
        carries the ETag of the contract version, which the replacement moves on.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePriceListsRequest'
      responses:
        '200':
          description: Price list set replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/price-lists/{priceListId}/items:
    get:
      tags: [Contracts]
      operationId: listPriceItems
      description: |
        The price items of one list, oldest first, with keyset paging. Every money value
        crosses the wire as an exact decimal string and never as a JSON number: a tariff
        row is what somebody is invoiced, and a float would silently round it. The ETag is
        the one of the owning price list, which is what a replacement expects in If-Match.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PriceListId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Price item page
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceItemPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Contracts]
      operationId: putPriceItems
      description: |
        Replaces the whole price item set of one list. Each row prices exactly one of a
        service definition, a service category or a package definition, and may be
        restricted to one location; the specificity ladder of the price selection depends
        on that being true, so a row naming none or more than one is refused. Amounts are
        exact decimal strings. The owning version must be DRAFT, otherwise the answer is
        409 CONTRACT_VERSION_IMMUTABLE. If-Match carries the ETag of the price list.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PriceListId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePriceItemsRequest'
      responses:
        '200':
          description: Price item set replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceItemPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contract-versions/{contractVersionId}/package-definitions:
    get:
      tags: [Contracts]
      operationId: listPackageDefinitions
      description: |
        The packages of one contract version with their lines. A package is a named bundle
        of service definitions with an included quantity each; a price item pointing at a
        package prices the bundle as a whole rather than its parts. The set is short by
        design, so it is returned whole rather than paged.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractVersionId'
      responses:
        '200':
          description: Package definitions of the version
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDefinitionList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Contracts]
      operationId: putPackageDefinitions
      description: |
        Replaces the whole package set of a DRAFT version, lines included. A package
        already present under the same code keeps its identity, so the price items
        pointing at it survive the write; one absent from the body is deleted together
        with the price items that priced it. ANY_OF_N needs minLines and ALL forbids it.
        Any write to a version that is not DRAFT answers 409 CONTRACT_VERSION_IMMUTABLE.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractVersionId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePackageDefinitionsRequest'
      responses:
        '200':
          description: Package set replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDefinitionList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contract-versions/{contractVersionId}/provider-quotas:
    get:
      tags: [Contracts]
      operationId: listProviderQuotas
      description: |
        The capacity the provider granted under this version: how much of a service, at
        which location, over which period. Consuming a quota belongs to authorization, so
        this module only stores and reads them; consumed is shown as it stands.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractVersionId'
      responses:
        '200':
          description: Provider quotas of the version
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderQuotaList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Contracts]
      operationId: putProviderQuotas
      description: |
        Replaces the whole quota set of a DRAFT version. A quota already present under the
        same scope and period keeps its identity and its consumed counter; two rows with
        the same location, service and period collide, because a scope that means
        "everything" has to be unique too. Capacities are exact decimal strings. Any write
        to a version that is not DRAFT answers 409 CONTRACT_VERSION_IMMUTABLE.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ContractVersionId'
        - $ref: '#/components/parameters/IfMatch'
