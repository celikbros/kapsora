        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Practitioner name search.
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          description: Only practitioners in this status.
