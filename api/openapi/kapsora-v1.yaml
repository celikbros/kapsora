        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderLocationRequest'
      responses:
        '201':
          description: Location created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderLocation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/provider-locations/{locationId}:
    get:
      tags: [Providers]
      operationId: getProviderLocation
      description: |
        One provider location with its optimistic concurrency tag. A location belonging to
        a provider outside the caller's organization scope answers 404, not 403.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderLocationId'
      responses:
        '200':
          description: Provider location
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderLocation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Providers]
      operationId: patchProviderLocation
      description: |
        Merge-patch of the address, the contact details and the location status. The code
        is immutable: a body carrying code answers 422 with field code IMMUTABLE.
        Suspending or closing a location removes it from the eligibility search without
        touching its capability history.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderLocationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateProviderLocationRequest'
      responses:
        '200':
          description: Location updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderLocation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/provider-locations/{locationId}/capabilities:
    get:
      tags: [Providers]
      operationId: listProviderCapabilities
      description: |
        What this location can deliver and when. A row names either one service definition
        or a whole service category; a category row covers the definitions added under it
        later, which is why the search resolves the tree at read time instead of expanding
        rows here. The set is short by design, so it is returned whole rather than paged.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderLocationId'
      responses:
        '200':
