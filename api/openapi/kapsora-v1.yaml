      responses:
        '201':
          description: Service definition created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDefinition'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/service-definitions/{definitionId}:
    get:
      tags: [Catalog]
      operationId: getServiceDefinition
      description: One service definition of the tenant with its optimistic concurrency tag.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceDefinitionId'
      responses:
        '200':
          description: Service definition
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDefinition'
        '403':
