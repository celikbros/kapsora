  /api/v1/claims:
    get:
      tags: [Claims]
      operationId: listClaims
      description: |
        Claims, newest first. Each row is served in the projection the caller has earned: a
        caller without `health.clinical.read`, or one reading a claim on a sensitive case
        without `health.sensitive.read`, gets the financial half — every figure, every
        decision, every reason code, and no line description, no `diagnosisId`, no
        `medicalReportId` and no `reviewCommentMedical`.

        A list never answers 428. Refusing the whole page over one sensitive row would make it
        useless, and refusing that one row would say which row is sensitive.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
        - $ref: '#/components/parameters/AccessProjectionHeader'
        - name: personId
          in: query
          schema:
            type: string
            format: uuid
        - name: caseId
          in: query
          schema:
            type: string
            format: uuid
        - name: providerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ClaimStatus'
        - name: serviceDateFrom
          in: query
