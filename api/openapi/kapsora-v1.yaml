      responses:
        '200':
          description: Partially approved request
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}/cancel:
    post:
      tags: [Service Requests]
      operationId: cancelServiceRequest
      description: |
        Withdraws a request that has not been decided yet. A draft, a submitted request and
        one waiting for a document or a review can all be cancelled; a request that has been
        approved, rejected or already cancelled cannot, because undoing a decision is a
        different act with different consequences and belongs to the cancellation aggregate.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Cancelled request
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}/versions:
    get:
      tags: [Service Requests]
      operationId: listServiceRequestVersions
      description: |
        Every version of one request, newest first, with the reason each returned version was
        sent back. The list is what makes a correction auditable: version 1 is what was
        submitted the first time and stays readable exactly as it was submitted, however many
        versions came after it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Versions of the request, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestVersionList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/service-requests/{requestId}/versions/{versionNo}:
    get:
      tags: [Service Requests]
      operationId: getServiceRequestVersion
      description: |
        One version of a request with the lines it carried. A submitted version answers from
        the snapshot frozen at submit rather than from the live rows, so what a reviewer
        decided against is what a reader sees, whatever happened to the request afterwards.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ServiceRequestVersionNo'
      responses:
        '200':
          description: One version of the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/service-categories:
    get:
      tags: [Catalog]
      operationId: listServiceCategories
      description: |
        Service categories of the tenant, newest first, with keyset paging. The picker
        builds the tree from parentId; the filters narrow it to one branch, one service
        domain or one activity state.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Code or name search.
          schema:
            type: string
            maxLength: 120
        - name: parentId
          in: query
          description: Only the direct children of this category.
          schema:
            type: string
            format: uuid
        - name: domain
          in: query
          description: Only categories of this service domain.
          schema:
            $ref: '#/components/schemas/ServiceDomain'
        - name: active
          in: query
          description: Only active (true) or only retired (false) categories.
          schema:
            type: boolean
      responses:
        '200':
          description: Service category page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCategoryPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Catalog]
      operationId: createServiceCategory
      description: |
        Creates a category. The code is unique within the tenant (409 CATEGORY_CODE_TAKEN)
        and immutable afterwards, because service definitions, contracts and claims are
        read against it. A parentId that would close a loop answers 409 CATEGORY_CYCLE and
        a branch deeper than six levels answers 422 with field code DEPTH_EXCEEDED.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceCategoryRequest'
      responses:
        '201':
          description: Category created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCategory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/service-categories/{categoryId}:
    get:
      tags: [Catalog]
      operationId: getServiceCategory
      description: One service category of the tenant with its optimistic concurrency tag.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCategoryId'
      responses:
        '200':
          description: Service category
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCategory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Catalog]
      operationId: patchServiceCategory
      description: |
        Merge-patch of name, parent and activity. The code is immutable: a body carrying
        code answers 422 with field code IMMUTABLE. Re-parenting refuses a cycle with 409
        CATEGORY_CYCLE and a resulting depth over six with 422 DEPTH_EXCEEDED.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceCategoryId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateServiceCategoryRequest'
      responses:
        '200':
          description: Category updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCategory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/service-definitions:
    get:
      tags: [Catalog]
      operationId: listServiceDefinitions
      description: |
        Service definitions of the tenant, newest first, with keyset paging. q searches
        code and name; the other filters narrow to one category, one service domain or
        one activity state.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
