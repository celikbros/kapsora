          minLength: 2
          maxLength: 200
        domainCode:
          $ref: '#/components/schemas/ServiceDomain'
        purpose:
          $ref: '#/components/schemas/RuleSetPurpose'
    UpdateRuleSetRequest:
      type: object
      additionalProperties: false
      description: |
        Merge-patch body. The code, the service domain and the purpose are absent because
