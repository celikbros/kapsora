              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The claim changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/claims/{claimId}/submit:
    post:
      tags: [Claims]
      operationId: submitClaim
      description: |
        Freezes the draft version and runs the whole pipeline in one transaction: price, then
        rules, then the cross-checks that are not rules, then the route.

        1. **Price.** Every line goes through the pricing ladder for this provider, this
           service date and this enrollment — contract price, plan share, member share. A line
           the ladder cannot price is not guessed at: it is `REVIEW_REQUIRED` with the pricing
           explanation attached, and it sends the claim to financial review.
        2. **Rules.** The tenant's published ADJUDICATION rule set is evaluated once per line.
           `REQUIRE_MEDICAL_REVIEW` and `REQUIRE_FINANCIAL_REVIEW` route; `REJECT` and
           `PARTIAL_APPROVE` decide the line then and there, with `stage = AUTO`.
        3. **Cross-checks.** A line against the claim's authorization consumes it, and an
           over-consumption is an exception line rather than a silent consume; a line naming a
           medical report asks the report coverage port, and a report that does not cover it
           goes to medical review; a stay that ran over what anybody approved goes to medical
           review; a line matching another live claim for the same person, service and day goes
           to financial review as `DUPLICATE_SUSPECTED`, naming the other claim's reference.
        4. **Route.** Medical review precedes financial when both are needed. With neither
           needed and the approval policy allowing the amount, the claim is AUTO_ADJUDICATED
           and then APPROVED, PARTIALLY_APPROVED or REJECTED by what the AUTO decisions say.

        Every step that decided something writes a `ClaimLineDecision` with `stage = AUTO`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
        - $ref: '#/components/parameters/AccessProjectionHeader'
      responses:
        '200':
          description: Claim submitted and routed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          description: Access projection header invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The claim is not in a state that can be submitted. CLAIM_TRANSITION_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The claim changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            The draft carries no line, or a line names something this tenant does not have.
            CLAIM_LINE_REQUIRED, VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/claims/{claimId}/line-decisions:
    post:
      tags: [Claims]
      operationId: decideClaimLines
      description: |
        A reviewer may not decide a file that belongs to their own person (selfPersonId on
        the tenant context): 403 OWN_FILE_DECISION, audited as a denial.

        Records a decision on each named line of the current version, at the stage the claim is
        waiting in.

        The stage is not the caller's choice. A claim in PENDING_MEDICAL is decided by a holder
        of `claim.medical.review` and the decisions are written `MEDICAL`; a claim in
        PENDING_FINANCIAL is decided by a holder of `claim.financial.review` and they are
        written `FINANCIAL`. A financial reviewer reaching a claim that is still in medical
        review is answered 409 CLAIM_STAGE_MISMATCH — medical review precedes financial when
        both are needed, and that ordering is the point of the two stages.

        Decisions are append-only. A line decided twice has two rows and the latest is the
        decision, so a reviewer who cut a line and a reviewer who later restored it are both on
        the record.

        `payerAmount + memberAmount` must equal `approvedAmount` on every line, exactly. It is
        a database CHECK as well as a validation, because a settlement that could not be
        reconciled by a kuruş is a settlement nobody can sign off.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
        - $ref: '#/components/parameters/AccessProjectionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideClaimLines'
      responses:
        '200':
          description: Lines decided
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          description: Access projection header invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The claim is not waiting for this stage. CLAIM_STAGE_MISMATCH,
            CLAIM_TRANSITION_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The claim changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/claims/{claimId}/approve:
    post:
      tags: [Claims]
      operationId: approveClaim
      description: |
        A reviewer may not decide a file that belongs to their own person (selfPersonId on
        the tenant context): 403 OWN_FILE_DECISION, audited as a denial.

        Finishes the claim. Every line of the current version must carry a decision; the status
        it lands in is what those decisions say — APPROVED when every line was approved,
        PARTIALLY_APPROVED when some were cut or rejected and something is still payable,
        REJECTED when nothing is.

        The approval policy for `claim.approve` decides who may do this: the band the approved
        total falls in names the roles, and a caller whose review stage is not one of them is
        answered 403 CLAIM_APPROVAL_NOT_PERMITTED. A policy that names no role lets either
        reviewer finish.

        Whatever it lands on is published as `claim.decided` inside this transaction, with the
        reference, the status word, the day, the approved total and the currency — and nothing
        else. There is no slot in the template for a diagnosis, a line description or a
        reviewer's comment.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimDecisionReason'
      responses:
        '200':
          description: Claim decided
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '403':
          description: |
            The approval policy does not admit this caller's stage.
            CLAIM_APPROVAL_NOT_PERMITTED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The claim cannot be approved from this status, or a line is still undecided.
            CLAIM_TRANSITION_INVALID, CLAIM_LINE_UNDECIDED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The claim changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/claims/{claimId}/reject:
    post:
      tags: [Claims]
      operationId: rejectClaim
      description: |
        A reviewer may not decide a file that belongs to their own person (selfPersonId on
        the tenant context): 403 OWN_FILE_DECISION, audited as a denial.

        Refuses the claim outright, with a reason. Every line of the current version is
        recorded REJECTED at the caller's stage, whatever it carried before, and anything the
        claim was holding on its authorization is released — a refused claim must not keep a
        member's entitlement reserved.

        It publishes `claim.decided` exactly as `approveClaim` does.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimDecisionReason'
      responses:
        '200':
          description: Claim rejected
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The claim cannot be rejected from this status. CLAIM_TRANSITION_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The claim changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/claims/{claimId}/return:
    post:
      tags: [Claims]
      operationId: returnClaim
      description: |
        A reviewer may not decide a file that belongs to their own person (selfPersonId on
        the tenant context): 403 OWN_FILE_DECISION, audited as a denial.

        Sends the claim back to the provider to be corrected, with a reason.

        It never edits the decided version. The submitted version becomes SUPERSEDED with the
        return reason on it and keeps every line decision it was given, and version n+1 is
        opened as a DRAFT with the lines copied. That is the whole correction model: the old
        answer stays readable and the new statement is a new version.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimReturnReason'
      responses:
        '200':
          description: Claim returned; a new draft version is open
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The claim cannot be returned from this status. CLAIM_TRANSITION_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The claim changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/claims/{claimId}/cancel:
    post:
      tags: [Claims]
      operationId: cancelClaim
      description: |
        Withdraws a claim the provider should not have raised. It needs `claim.cancel`, and it
        is refused on anything already decided: a cancelled claim is a fact, and cancelling a
        settled one would be an accounting entry rather than a withdrawal.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimReason'
      responses:
        '200':
          description: Claim cancelled
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The claim cannot be cancelled from this status. CLAIM_TRANSITION_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The claim changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/claims/{claimId}/versions:
    get:
      tags: [Claims]
      operationId: listClaimVersions
      description: |
        Every version of the claim, newest first, with what each one was submitted and returned
        for. It is how a screen draws "sürüm 2 / 2" and how anybody finds the decision that was
        made about a version somebody has since corrected.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimVersionList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/claims/{claimId}/versions/{versionNo}:
    get:
      tags: [Claims]
      operationId: getClaimVersion
      description: |
        One version with the lines it carried and the decision each line was given, in the
        projection the caller has earned. A superseded version answers exactly what it answered
        the day it was decided.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/VersionNo'
        - $ref: '#/components/parameters/AccessPurposeHeader'
        - $ref: '#/components/parameters/AccessReasonHeader'
        - $ref: '#/components/parameters/AccessProjectionHeader'
      responses:
        '200':
          description: Claim version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimVersion'
        '400':
          description: Access projection header invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: |
            The claim belongs to a sensitive case and the caller stated no access purpose.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/claims/{claimId}/invoice-readiness:
    get:
      tags: [Claims]
      operationId: getClaimInvoiceReadiness
      description: |
        What M7's invoice will need, answered now: the approved total, the payer total and the
        member total — exact decimals, summed on the server once — and whether anything still
        blocks an invoice.

        The blockers are named rather than counted: `PROVIDER_TAX_IDENTITY_MISSING` when the
        provider organization carries no tax identity to invoice against,
        `CURRENCY_NOT_SINGLE` when the lines are not all in one currency, and
        `LINE_NOT_DECIDED` when a line of the current version still has no decision.

        Only an APPROVED or PARTIALLY_APPROVED claim has an answer; anything else is 409
        CLAIM_NOT_DECIDED, because "is this invoiceable" is not a question about a draft.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Invoice readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimInvoiceReadiness'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The claim has not been decided. CLAIM_NOT_DECIDED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/claims/{claimId}/adjustments:
    get:
      tags: [Claims]
      operationId: listClaimAdjustments
      description: |
        The claim's adjustment ledger, oldest first, which is the order the reversal chain
        reads in: a reversal always comes after the row it takes back, so a screen rendering
        this list top to bottom shows the cut and then the row that undid it.

        Every row carries its split, its reason, where it came from and who wrote it.
        `createdBy` is null for exactly the two system sources — a cancellation or no-show fee
        is written by the outbox handler of a booking event, and no person is behind it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim adjustments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAdjustmentList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Claims]
      operationId: createClaimAdjustment
      description: |
        A reviewer may not decide a file that belongs to their own person (selfPersonId on
        the tenant context): 403 OWN_FILE_DECISION, audited as a denial.

        Records money that moved on a decided claim: a `CUT`, a `RECOVERY` or a `CORRECTION`
        with its payer/member split, a reason code from the closed list, and optionally the
        line it belongs to.

        **Nothing is ever edited or deleted.** An adjustment is undone by a `REVERSAL`, which
        is raised by sending `reversesAdjustmentId` and a reason and nothing else: the amount
        and the split are read off the row being reversed, so the approved total goes back to
        exactly where it was rather than to whatever somebody typed. One reversal per
        adjustment, and a reversal may not itself be reversed.

        `payerAmount + memberAmount` must equal `amount` exactly. It is a database CHECK as
        well; this is the copy that tells the caller which field.

        The claim's approved total is recomputed on the server — lines minus adjustments — and
        is returned with the row, so the figure a caller reads back is the figure the invoice
        will be checked against.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ClaimId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimAdjustment'
      responses:
        '201':
          description: Adjustment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAdjustmentResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The claim, or the adjustment a reversal names, is not there.
            CLAIM_NOT_FOUND, CLAIM_ADJUSTMENT_NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The claim has not been decided, the adjustment has already been reversed, or the
            caller is trying to reverse a reversal. CLAIM_NOT_DECIDED,
            CLAIM_ADJUSTMENT_REVERSED, CLAIM_ADJUSTMENT_NOT_REVERSIBLE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/providers/{providerId}/earnings:
    get:
      tags: [Claims]
      operationId: getProviderEarnings
      description: |
        What a provider earned in a period, per currency: the claims decided in it grouped by
        status, the approved total (lines minus adjustments), the adjustment total, and the
        part of the approved total that is not yet on an invoice — with the ids of the claims
        that part is made of.

        **`invoiceableTotal` is the figure the provider's invoice is checked against.** It is
        summed here, once, in exact decimals, from the same line decisions and the same
        adjustment ledger `getClaimInvoiceReadiness` reads. A claim that has already reached
        INVOICED, BATCHED or SETTLED is money somebody is already collecting and is counted in
        `approvedTotal` and not in `invoiceableTotal`.

        Per currency, always. A total across currencies is not a total, and a claim is
        denominated once — a mixed line set is refused when the claim is created.

        `from` and `to` bound the day the claim was decided rather than the day the service was
        delivered, and both are inclusive.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderId'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: currency
          in: query
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
      responses:
        '200':
          description: Provider earnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderEarnings'
        '403':
          description: |
            A provider-scoped caller asking about somebody else's provider.
            CLAIM_PROVIDER_SCOPE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/accommodation/properties:
    get:
      tags: [Accommodation]
      operationId: listProperties
      description: |
        The properties of the tenant, newest first. A caller whose grants are scoped to
        provider organizations sees its own buildings and no others — not a filtered view of
        everybody's, but a list in which another provider's hotel does not exist.

        This is the back-office and provider list, so it shows INACTIVE properties too. The
        member's view is `searchAvailability`, which shows only what is ACTIVE, contracted
        for their program, and actually free.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: providerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PropertyStatus'
        - name: propertyType
          in: query
          schema:
            $ref: '#/components/schemas/PropertyType'
        - name: regionCode
          in: query
          schema:
            type: string
            pattern: '^[A-Z0-9][A-Z0-9_-]{0,15}$'
        - name: city
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Property page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Accommodation]
      operationId: createProperty
      description: |
        Opens a building. The provider organization is the relationship the tenant contracts
        with, and it is what an ORGANIZATION-scoped caller is compared against: a provider
        clerk naming somebody else's organization is refused with PROPERTY_SCOPE rather than
        told the organization does not exist, because it plainly does.

        `locationId` is optional and points at an existing provider location of the same
        provider, so a hotel already in the network reuses its address and coordinates. An
        internal social facility has no provider location and bills a `costCenter` instead
        (v1.2 9.13); both are null for the ordinary case and neither is required.

        `timezone` is the property's own IANA zone. It is not decoration: a night begins and
        ends where the building is, and every stay booked here is counted against that
        calendar.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProperty'
      responses:
        '201':
          description: Property created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '403':
          description: |
            A provider-scoped caller named another organization. PROPERTY_SCOPE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            This provider already has a property with that code. PROPERTY_CODE_TAKEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accommodation/properties/{propertyId}:
    get:
      tags: [Accommodation]
      operationId: getProperty
      description: |
        One property. Another provider's property is 404 rather than 403: that a hotel exists
        at all is not this caller's business.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Property
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Accommodation]
      operationId: patchProperty
      description: |
        Rewrites the editable half of a property. Every field is sent every time: a merge
        would make "this hotel no longer has a location" and "it no longer bills a cost
        centre" inexpressible, and a field that cannot be cleared is a field somebody edits
        by hand in the database.

        `code` and `providerOrganizationId` are not editable. A code is what the provider's
        own systems call the building, and moving a building to another provider would move
        every booking ever taken in it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PropertyId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProperty'
      responses:
        '200':
          description: Property updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: The property changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/accommodation/properties/{propertyId}/room-types:
    get:
      tags: [Accommodation]
      operationId: listRoomTypes
      description: |
        The room types of one property, by code. The property is read first, so a building
        this caller may not see answers 404 rather than an empty list — an empty list would
        say the building exists and has no rooms.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PropertyId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PropertyStatus'
      responses:
        '200':
          description: Room types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomTypeList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Accommodation]
      operationId: createRoomType
      description: |
        Adds a sellable kind of room.

        `serviceDefinitionId` is the joint with the rest of the platform and the reason this
        vertical needs almost no machinery of its own: the room type *is* a catalogue
        service, so it is priced by the contract prices of the pricing ladder, entitled
        through the service-to-entitlement mapping, and claimed like anything else. One room
        type, one service — a room type priced as two services would be a room with two
        answers to "what does a night cost".

        The service has to exist in this tenant, be active, and carry the NIGHT unit. A
        service measured in anything else would produce a quote in the wrong unit and draw an
        entitlement down in the wrong currency of counting, so it is refused on the field
        rather than accepted and discovered later.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/PropertyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomType'
      responses:
        '201':
          description: Room type created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomType'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            This property already has a room type with that code. ROOM_TYPE_CODE_TAKEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accommodation/room-types/{roomTypeId}:
    patch:
      tags: [Accommodation]
      operationId: patchRoomType
      description: |
        Rewrites the editable half of a room type. Every field is sent every time, as on the
        property.

        `serviceDefinitionId` is not among them and never will be: a room type re-pointed at
        another service would silently change what every booking already taken against it was
        priced and entitled as.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RoomTypeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRoomType'
      responses:
        '200':
          description: Room type updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomType'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: The room type changed since the caller read it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/accommodation/room-types/{roomTypeId}/inventory:
    get:
      tags: [Accommodation]
      operationId: getRoomTypeInventory
      description: |
        The daily allotment of one room type over a range of nights, one entry per date
        whether or not there is a row behind it.

        `available` is capacity minus held minus confirmed, computed on the server, so no
        screen subtracts and two screens cannot disagree. `allotted` is false for a night
        this provider has opened nothing on: that is not the same statement as "zero free",
        and the availability search treats it as unavailable rather than as free.

        It takes the same read grant the search does, so the provider's desk and the payer's
        back office both see it, and a provider-scoped caller sees only its own room types.
        A member's route to what is free is `searchAvailability`, which answers what they
        can have rather than how the allotment behind it is composed.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RoomTypeId'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Inclusive last night of the range.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Inventory range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomTypeInventoryRange'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Accommodation]
      operationId: putRoomTypeInventory
      description: |
        Opens a season's allotment in one call: `capacity` on every night of the range, in
        one transaction. `held` and `confirmed` are never touched here — they belong to the
        holds and bookings of the booking package, and an allotment that could edit them
        would be an allotment that could make a confirmed booking disappear.

        A night whose held plus confirmed exceeds the new capacity is refused with 409
        `INVENTORY_BELOW_COMMITMENT`, naming the first offending date in the `stayDate`
        extension member — a provider opening ninety nights needs to know which night to look
        at, not that something somewhere failed. The whole range is refused with it: an
        allotment meant to apply to a season is not half applied.

        The refusal is not this endpoint's alone. `held + confirmed <= capacity` is a CHECK
        on the row, so a hold that landed between the lock and the write fails the statement
        and takes the range with it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RoomTypeId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRoomTypeInventory'
      responses:
        '200':
          description: Inventory range after the allotment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomTypeInventoryRange'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The capacity is below what is already held or confirmed on at least one night.
            INVENTORY_BELOW_COMMITMENT, with the first offending date in the `stayDate`
            extension member.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accommodation/availability/search:
    post:
      tags: [Accommodation]
      operationId: searchAvailability
      description: |
        What is free between two dates, and what it would cost this member.

        **Whose stay.** A member account is bound to one person, and the person is taken from
        that binding and never from the body: a body naming somebody else is refused with
        PERSON_SCOPE, which is what stops a member searching — and later holding — a room for
        their neighbour. A desk that is not bound to a person must name one in `personId`.

        **What is shown.** ACTIVE properties of ACTIVE providers holding an ACTIVE contract,
        published over the stay, with one of the payer organizations behind the programs this
        person is enrolled in on the first night. A person with no active enrollment sees
        nothing rather than everything.

        **What `available` means.** The server's minimum daily availability over the whole
        range. A room type with an allotment on every night but one is not "mostly
        available": the guest would have nowhere to sleep on the missing night, so the answer
        for the stay is none.

        **What the quote is.** The pricing ladder's answer for the room type's service, on
        each stay date, under this person's enrollment and this provider's contract, summed
        once on the server. Every figure is an exact decimal string; `payerAmount` plus
        `memberAmount` is exactly `totalAmount`, on every room type and every night. Where a
        night cannot be priced the room type carries `quote: null` and a reason code rather
        than a guess.

        **The eligibility half.** `entitlement` is what the plan has left, in the NIGHT unit
        of the service-to-entitlement mapping, and `eligible` says whether that covers every
        night of this stay. Nights beyond the remaining entitlement are priced with the plan
        carrying nothing, so a member with two nights left and a three-night stay is shown
        the third night as their own.

        Every search is recorded as an immutable eligibility evaluation, named in
        `evaluationId`, so "what did the system show them" is answerable months later.
        Nothing is reserved: an availability answer is an answer, and the hold is a separate
        command.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilitySearchRequest'
      responses:
        '200':
          description: Availability and the contribution quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilitySearchResult'
        '403':
          description: |
            The caller named a person other than the one its account is bound to, or holds no
            person binding at all. PERSON_SCOPE, PERSON_BINDING_MISSING, PERMISSION_DENIED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            The dates or the party are outside what a stay may be: `checkOut` on or before
            `checkIn`, a stay longer than the tenant's `accommodation.max_nights`, or neither
            of `propertyId` and `regionCode`. VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/accommodation/holds:
    post:
      tags: [Accommodation]
      operationId: createHold
      description: |
        Sets a room aside for this member, for the length of the tenant's
        `accommodation.hold_minutes` (default 15), and freezes the price they were shown.

        **What a hold is.** One transaction locks the `inventory_day` rows of
        `[checkIn, checkOut)` in `stay_date` order, refuses if any night has no room left,
        increments `held` on every night, reserves the nights the plan actually carries on
        the entitlement account with the same deadline as the hold, and writes the booking as
        `HOLD` with the quote frozen into it. The date ordering is what makes hundreds of
        simultaneous holds on the same room a queue rather than a deadlock, and
        `held + confirmed <= capacity` is a database constraint underneath it, so the room
        can never be sold twice even if the check above were removed.

        **Partial cover is a booking, not a refusal.** The search already tells a member with
        two nights left and a three-night stay that the plan carries two of them and the
        third is theirs; the hold reserves exactly those two. The booking is still three
        nights long — the guest sleeps three nights — and `quoteSnapshot.coveredNights` says
        how many of them the plan pays for. A stay the plan carries *no* night of is the one
        refusal: ENTITLEMENT_INSUFFICIENT.

        **Whose stay.** A member account is bound to one person and the person is taken from
        that binding, never from the body: a body naming somebody else is refused with
        PERSON_SCOPE. A desk that is bound to no person must name one in `personId`.

        **The price.** It is the same quote the availability search answers with, computed
        once here and stored on the booking. It is never recomputed: confirming charges what
        the member saw, and a contract that changes in between changes the next booking.

        **Nothing is agreed yet.** A hold is a promise of a room for a quarter of an hour.
        It gives the room and the nights back on its own if nobody confirms, with no
        cancellation fee and no record of anybody changing their mind.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHoldRequest'
      responses:
        '201':
          description: The room is held, with the seconds left on the countdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          description: |
            The caller named a person other than the one its account is bound to, or holds no
            person binding at all. PERSON_SCOPE, PERSON_BINDING_MISSING, PERMISSION_DENIED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            ROOM_UNAVAILABLE names the first night of the stay with no room left, so a member
            looking at a fortnight is told which night to move rather than that something
            failed. BOOKING_ALREADY_LIVE is the one-live-booking rule: this person already
            holds or has confirmed this room type arriving on this day. QUOTE_UNAVAILABLE is a
            room type no contracted price covers over these dates, with the reason code the
            search would have shown. ENTITLEMENT_ACCOUNT_NOT_FOUND is a plan with no
            entitlement account behind this room's service, and ENTITLEMENT_INSUFFICIENT is a
            plan that carries no night of this stay at all — a plan that carries only some of
            them is not refused, it is booked for the nights it carries.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            The dates, the party or the guest list are outside what a stay may be.
            VALIDATION_FAILED, OCCUPANCY_EXCEEDED, ENROLLMENT_NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accommodation/bookings:
    get:
      tags: [Accommodation]
      operationId: listBookings
      description: |
        Bookings this caller may see, newest first, with keyset paging.

        The boundary is computed from the caller's own grants and is never widened by a
        filter: a member sees their own bookings whatever `personId` they send, a provider
        sees the bookings at its own properties, and a payer sees all of them. The filters
        narrow that set by person, property, status and arrival range.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: personId
          in: query
          description: Narrows to one member. A member's own binding still applies on top of it.
          schema:
            type: string
            format: uuid
        - name: propertyId
          in: query
          description: Narrows to one property.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Narrows to one booking status.
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: checkInFrom
          in: query
          description: Earliest arrival date, inclusive.
          schema:
            type: string
            format: date
        - name: checkInTo
          in: query
          description: Latest arrival date, inclusive.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: A page of bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/accommodation/bookings/{bookingId}:
    get:
      tags: [Accommodation]
      operationId: getBooking
      description: |
        One booking with its nights, its guests, the quote it was held on and - once it is
        confirmed - the cancellation policy frozen onto it.

        A booking outside the caller's boundary is 404 rather than 403: that a member is
        going to Antalya is not another provider's business.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/accommodation/bookings/{bookingId}/confirm:
    post:
      tags: [Accommodation]
      operationId: confirmBooking
      description: |
        Turns a hold into a reservation request and hands it to the gate.

        **This command asks; it does not decide.** The eligibility gate, the document
        requirement and the rule trace are the service request module's, and the answer
        arrives asynchronously: the booking is still `HOLD` or `PENDING_APPROVAL` when this
        returns, and it becomes `CONFIRMED` when the request is approved. A booking waiting
        on a reviewer keeps its room - the countdown is pushed out to the review's own
        deadline rather than expiring while somebody decides.

        **Three refusals happen here** because all three are things the member can act on.
        A quote older than the tenant's `accommodation.quote_ttl_minutes` (default 60) is
        QUOTE_STALE and the member is sent back to search: the frozen prices are what they
        will be charged, and a price nobody has looked at for an hour is not one anybody
        should be committed to. A member share above `accommodation.stepup_member_amount`
        takes a re-entered password (STEP_UP_REQUIRED). A contract version with no lodging
        terms is LODGING_TERMS_MISSING - a stay agreed with no cancellation policy is a stay
        nobody could cancel fairly, and a default invented here would be a fee invented here.

        Pricing is never recomputed: the booking's nights carry the amounts the member saw.
        The reservation request asks for `quoteSnapshot.coveredNights` nights and for the
        payer's own share of them, which is the part of the stay the plan is being asked to
        carry; the authorization that an approval produces adopts the hold's reservation for
        exactly that quantity, so nothing is reserved twice and nothing is promised that was
        never held.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The reservation request was raised; the booking's status says what happened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          description: |
            PERMISSION_DENIED, PERSON_SCOPE, or STEP_UP_REQUIRED when the member's own share
            is above the tenant's step-up threshold and the session has not been re-verified.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            QUOTE_STALE, LODGING_TERMS_MISSING, or BOOKING_TRANSITION_INVALID for a hold that
            has already expired, been released, or been confirmed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accommodation/bookings/{bookingId}/release:
    post:
      tags: [Accommodation]
      operationId: releaseHold
      description: |
        The member giving the room back before the countdown runs out.

        It has exactly the effect the expiry sweep has - the nights come back to the
        allotment and the plan's entitlement is released - and differs from it in one way
        that matters: it is on the record as a command somebody gave, with its own reason
        code, rather than as a deadline nobody met. Nothing was agreed, so nothing is charged.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The room and the nights are back; the booking is CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: BOOKING_TRANSITION_INVALID - only a held booking can be given back.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/accommodation/bookings/{bookingId}/voucher:
    post:
      tags: [Accommodation]
      operationId: reissueBookingVoucher
      description: |
        Hands the member the code they show at the hotel desk, and returns it exactly once.

        **There is no command anywhere that reads a voucher back**, because there is nothing
        to read: the database keeps a SHA-256 digest and a masked tail, and the plaintext
        exists only in the response of the command that generated it. A member who lost their
        code is therefore given a new one - the previous digest is retired in the same
        transaction, so exactly one code works at any moment.

        Like the authorization module's own issue, this command takes **no Idempotency-Key**.
        The Idempotency-Key contract stores response bodies so a replay can be answered from
        one, and this response is the single place a usable token exists; storing it would
        put the token in a column.

        Available on a booking that has been confirmed and whose member the caller is, or to
        a desk holding `accommodation.booking.manage`. Every issue is an audit row, and no
        audit row, log line or notification ever contains the token.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BookingId'
      responses:
        '201':
          description: The voucher; the token is in this body and is never shown again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingVoucher'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            BOOKING_TRANSITION_INVALID for a booking that is not confirmed, or
            VOUCHER_NOT_AVAILABLE for one with no authorization behind it yet.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accommodation/bookings/{bookingId}/cancellation-preview:
    post:
      tags: [Accommodation]
      operationId: previewCancellation
      description: |
        What a cancellation now would cost, and what would come back. Changes nothing.

        **The answer is the policy the booking was confirmed under, and never today's
        contract.** `policySnapshot` was frozen onto the booking at confirmation, and this
        computation reads that document and the booking's own night amounts. A hotel that
        rewrote its cancellation terms this morning changes what the next booking costs to
        cancel and does not change what this one costs.

        The free window is counted back from the start of the arrival day **on the property's
        own clock**, which is why the snapshot carries a timezone: a member cancelling a
        Berlin hotel late in the evening is inside a 48-hour window there and outside it in
        Istanbul, and only one of those is the answer they agreed to.

        `cancelBooking` returns exactly these figures, because both call the same computation
        on the same document. A preview that estimated and a command that decided would be
        two answers to one question, and the member would find out which was real from an
        invoice.

        It is a POST because it answers about one member's booking inside the caller's own
        boundary; nothing is written and no ledger moves.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: What a cancellation now would cost
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationPreview'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            BOOKING_TRANSITION_INVALID for a hold (which is given back with releaseHold, not
            cancelled) or a booking that has already ended;
            BOOKING_CANCELLATION_TOO_LATE for a guest who has already checked in;
            POLICY_SNAPSHOT_MISSING for a confirmed booking carrying no frozen policy, which
            is a refusal rather than a default - judging it by today's contract is the one
            thing the snapshot exists to prevent.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/accommodation/bookings/{bookingId}/cancel:
    post:
      tags: [Accommodation]
      operationId: cancelBooking
      description: |
        Calls off a stay somebody agreed to, and settles what that costs.

        **One transaction, in an order that is not interchangeable.** The rooms of every night
        go back to the allotment under the same `stay_date` lock order a hold takes them in
        (`confirmed - 1` for an agreed stay, `held - 1` for one still waiting on a reviewer).
        On the entitlement the penalty is **consumed** first and the remainder **released**
        second: both draw on the same reservation, and releasing first would hand everything
        back and leave nothing to consume, so the ledger would stop agreeing with the fee.
        Consuming is the honest movement - the plan paid for a room the member did not use.

        **The money fee is recorded and charged nowhere.** KAPSORA holds no card; the
        cancellation row is what M7's settlement turns into an invoice line, and
        `payerFee + memberFee == feeAmount` exactly.

        **The voucher is retired** in the same transaction, so a cancelled stay and the code
        that would have opened its room stop being true at the same instant.

        **Running it twice is one cancellation.** The status write names CONFIRMED and
        PENDING_APPROVAL, a unique index allows one cancellation row per booking, and both
        ledger movements are keyed by the booking rather than by a clock.

        A booking still waiting on a reviewer has agreed nothing, so it is free: its
        reservation request is withdrawn and the hold released, with no fee and no penalty. A
        hold is given back with releaseHold instead.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
      responses:
        '200':
          description: The stay is cancelled, with what it cost and what came back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            BOOKING_TRANSITION_INVALID, BOOKING_CANCELLATION_TOO_LATE or
            POLICY_SNAPSHOT_MISSING, exactly as the preview answers them.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accommodation/bookings/{bookingId}/check-in:
    post:
      tags: [Accommodation]
      operationId: checkInBooking
      description: |
        Records the guest's arrival against the voucher they presented at the desk.

        **The token is in the body and nowhere else.** It is never a path segment and never a
        query parameter, because both are logged by every proxy between the desk and here. It
        is hashed on arrival, matched against a SHA-256 digest, and reaches no column, log
        line, audit row or notification.

        **A token that is not this booking's is 404**, exactly as an unknown one is. A refusal
        that could tell a real code for another stay apart from a code that does not exist
        would be an oracle for testing a stolen list.

        The arrival must fall inside `[checkIn - accommodation.checkin_early_hours,
        checkIn + accommodation.checkin_late_hours]`, counted from the start of the arrival
        day **on the property's own clock**. A refusal names both ends of the window, because
        a clerk told "too early" and not "from when" has been told nothing.

        Nothing is consumed here. Nobody has slept anywhere yet; the nights are consumed at
        check-out, for the nights actually used.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInBookingRequest'
      responses:
        '200':
          description: The guest is checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            BOOKING_NOT_FOUND, or VOUCHER_NOT_FOUND for a code that is not this booking's -
            the two are deliberately the same kind of answer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            BOOKING_CHECK_IN_WINDOW names when the window opens and closes and the zone it is
            counted in. BOOKING_TRANSITION_INVALID is a booking that is not CONFIRMED.
            VOUCHER_ALREADY_REDEEMED, VOUCHER_REVOKED and VOUCHER_EXPIRED are the voucher's
            own refusals, each separate because "this does not work" tells the person at the
            desk nothing they can act on.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/accommodation/bookings/{bookingId}/check-out:
    post:
      tags: [Accommodation]
      operationId: checkOutBooking
      description: |
        Ends the stay and settles what it used.

        `actualNights` is counted **on the property's calendar** - the number of civil days
        between the booked arrival and the day the guest left, never fewer than one and never
        a duration divided by twenty-four hours. A stay that spans a clock change is still the
        same number of nights.

        The fulfilment for those nights is written and consumed in this transaction, and
        everything the authorization still held is released across every hold the booking
        stands on, exactly as an inpatient discharge releases at the end of a stay. The rooms
        of the nights nobody slept in go back to the allotment, where the availability search
        can sell them again; the nights that were used stay confirmed, because the room really
        was occupied on them.

        **An over-stay consumes nothing extra.** A guest who stayed longer than the plan
        promised has already had the extra nights, so the check-out cannot refuse: it consumes
        what was authorized, sets `overBooking`, and leaves the difference to the claim (M7) as
        an exception a person looks at.

        Running it twice releases nothing twice: the status write names CHECKED_IN, and the
        ledger movements are keyed by the booking and the reason rather than by the moment.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOutBookingRequest'
      responses:
        '200':
          description: The stay is complete, with the nights actually used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: BOOKING_TRANSITION_INVALID - only a checked-in stay can be closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accommodation/bookings/{bookingId}/no-show:
    get:
      tags: [Accommodation]
      operationId: getNoShow
      description: |
        The no-show report on this booking, if there is one. A booking nobody reported answers
        404, which is the same answer a booking outside the caller's boundary gives.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoShowResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Accommodation]
      operationId: reportNoShow
      description: |
        The provider's claim that nobody arrived.

        **It changes nothing except the report.** The booking stays CONFIRMED, the room stays
        confirmed in the allotment, and not one night moves on the plan. A provider that could
        close a booking by asserting an absence could close a booking a guest is standing in
        the lobby of, and the member would learn about it from a fee.

        Two refusals happen here. A report before the check-in window has closed is
        NO_SHOW_TOO_EARLY: a guest who is late is not a guest who did not come. And a report
        with no **clean** document linked to the booking is NO_SHOW_EVIDENCE_REQUIRED - a
        claim that costs a member money and rests on nothing is a claim nobody can review, and
        a link to a file still in quarantine is not a document a reviewer can open.

        The assessed fee comes from the frozen policy's no-show rate applied to the member's
        own share, and `payerAmount + memberAmount == assessedFeeAmount` exactly. It is a claim
        rather than a charge: nothing is taken from anybody until reviewNoShow confirms it. The
        member is told what has been claimed, so the first they hear of it is not an invoice.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportNoShowRequest'
      responses:
        '201':
          description: The claim is recorded; the booking is untouched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoShowResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            NO_SHOW_EVIDENCE_REQUIRED, NO_SHOW_TOO_EARLY, NO_SHOW_ALREADY_REPORTED (a refused
            report is REJECTED rather than deleted, so a second one cannot replace it),
            BOOKING_TRANSITION_INVALID, or POLICY_SNAPSHOT_MISSING.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accommodation/bookings/{bookingId}/no-show/review:
    post:
      tags: [Accommodation]
      operationId: reviewNoShow
      description: |
        A reviewer may not decide a file that belongs to their own person (selfPersonId on
        the tenant context): 403 OWN_FILE_DECISION, audited as a denial.

        The payer's answer to a provider's claim, and the only place a no-show costs anybody
        anything.

        **The reviewer may not be the reporter.** It is refused with NO_SHOW_SAME_ACTOR, and a
        CHECK on the row refuses it again whatever reaches the table. The two sides are told
        apart by scope: a provider clerk holds `accommodation.booking.manage` on an
        ORGANIZATION grant and a payer reviewer holds it tenant-wide, and only the second is a
        second pair of eyes.

        The three answers do three different things. CONFIRMED closes the booking as NO_SHOW,
        frees the room for the rest of the allotment, consumes what the policy's rate says off
        the plan (rounded **up** to whole nights, because a rate of fifty per cent that
        rounded down would cost the payer nothing on a one-night stay) and releases the rest.
        REJECTED changes nothing but the report - the stay is still CONFIRMED, still
        cancellable and still checkable-in, because a provider who was wrong must not have
        cost the member their booking. DISPUTED raises a work item in the payer's review queue
        and leaves everything where it is, because somebody has to look.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewNoShowRequest'
      responses:
        '200':
          description: The decision, and the booking as it now stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoShowResult'
        '403':
          description: |
            PERMISSION_DENIED, or NO_SHOW_SAME_ACTOR when the caller is the person who
            reported it. The caller is allowed to review - just not this one.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            NO_SHOW_DECIDED for a report somebody has already answered, or
            BOOKING_TRANSITION_INVALID when the booking stopped being CONFIRMED while the
            report sat in a queue.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accommodation/waitlist:
    get:
      tags: [Accommodation]
      operationId: listWaitlist
      description: |
        The waiting list this caller may see, **in the order the offer sweep walks it**:
        highest priority first, then whoever asked first. The list a member is shown their
        place in is the list the offer actually comes out of.

        The boundary is computed from the caller's own grants and is never widened by a
        filter: a member sees their own entries whatever `personId` they send, and a provider
        sees the entries at its own properties.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Limit'
        - name: personId
          in: query
          description: Narrows to one member. A member's own binding still applies on top of it.
          schema:
            type: string
            format: uuid
        - name: propertyId
          in: query
          description: Narrows to one property.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Narrows to one entry status.
          schema:
            $ref: '#/components/schemas/WaitlistStatus'
      responses:
        '200':
          description: The queue, in queue order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntryList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Accommodation]
      operationId: joinWaitlist
      description: |
        Puts a member in the queue for a property and a set of dates.

        It checks nothing about availability, and that is the point: a member joins a queue
        *because* the dates are full, and a join that refused when the room was free would
        refuse exactly nobody - they would have booked it. What it does check is the plan,
        because an entry with no enrollment behind it is a place in a queue that could never
        become a booking.

        `roomTypeId` is optional: null means any room of the property, which is what a member
        who wants the hotel rather than the suite is actually asking for, and the sweep tries
        each of the property's room types for them.

        `priority` is the desk's to set - a programme that gives its own people the first
        refusal - and a member joining for themselves always joins at zero, because a queue a
        member can push themselves up is not a queue.

        A member joins under `accommodation.booking.create`; a desk joining on somebody's
        behalf holds `accommodation.waitlist.manage`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinWaitlistRequest'
      responses:
        '201':
          description: The place in the queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
        '403':
          description: PERMISSION_DENIED, PERSON_SCOPE or PERSON_BINDING_MISSING.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            WAITLIST_ALREADY_WAITING - this person already holds a live place in this
            property's queue for this arrival. It is a partial unique index, so a cancelled or
            expired entry does not stop them joining again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: VALIDATION_FAILED, PERSON_REQUIRED or ENROLLMENT_NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/accommodation/waitlist/{waitlistEntryId}/cancel:
    post:
      tags: [Accommodation]
      operationId: cancelWaitlistEntry
      description: |
        The member giving up their place.

        An entry that was holding an offer gives the room back with it: a room set aside for
        somebody who has walked away is a room nobody can book and nobody will use.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/WaitlistEntryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The place is given up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: WAITLIST_TRANSITION_INVALID - only a live entry can be given up.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/accommodation/waitlist/{waitlistEntryId}/accept:
    post:
      tags: [Accommodation]
      operationId: acceptWaitlistOffer
      description: |
        Turns the hold the sweep placed on this member's behalf into a confirmation.

        It confirms through the same path confirmBooking uses - the same quote staleness rule,
        the same step-up threshold, the same reservation request - because an offer accepted
        **is** a booking confirmed, and a second way to confirm one would be a second set of
        rules for the same act.

        An offer nobody accepts expires with its hold: the room goes back to the allotment and
        the entry returns to WAITING **behind** everybody who was already queued, because its
        `createdAt` moves to the moment it was requeued and the queue is ordered by it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/WaitlistEntryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The offer is accepted; the booking it became is in `offer`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
        '403':
          description: PERMISSION_DENIED, PERSON_SCOPE, or STEP_UP_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            WAITLIST_NOT_OFFERED for an entry with no live offer (an offer that expired while
            the member was looking at it is exactly this), or QUOTE_STALE,
            LODGING_TERMS_MISSING and BOOKING_TRANSITION_INVALID from the confirmation itself.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/invoices:
    get:
      tags: [Billing]
      operationId: listInvoices
      description: |
        The invoices of this tenant, newest first, each with the sum of what it allocates to
        claims and the batch it sits in.

        A provider-scoped caller reads its own invoices and nothing else; the boundary is
        applied in SQL rather than after the read, so an invoice outside it is genuinely not
        returned and 404 is the honest answer to asking for one by id.

        `allocationTotal` is summed on the server, in exact decimals, from the same rows the
        submit gate checks — so the figure a screen shows beside a draft is the figure that
        draft will be refused for.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: providerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - name: fiscalYear
          in: query
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: from
          in: query
          description: Invoice date, inclusive.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Invoice date, inclusive.
          schema:
            type: string
            format: date
        - name: batchId
          in: query
          description: |
            The WP-I7-03 icmal an invoice was put into. It is written by `submitBatch` and is
            null on every invoice no icmal is collecting.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        '400':
          description: |
            The paging cursor could not be read. CURSOR_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Billing]
      operationId: createInvoice
      description: |
        Records an invoice the provider raised somewhere else. KAPSORA issues no fiscal
        document here: this is the header as the provider entered it, held against the claims
        the payer has already approved.

        `lineExtensionAmount + taxAmount` must equal `payableAmount` exactly. It is a database
        CHECK as well; this is the copy that tells the caller which field.

        The provider's VKN is read from the directory and stored as its blind index, never as
        the number. A provider organization carrying no tax identity is refused with
        `PROVIDER_TAX_ID_MISSING` rather than having an invoice raised against a taxpayer
        nobody can name.

        **The number is unique in the provider's fiscal year** (v1.2 11.12), and a cancelled
        invoice frees the number it was using. Two different providers billing the same number
        is ordinary and is not refused.

        Sending `supersedesInvoiceId` opens the correction of a RETURNED or SUBMITTED invoice:
        the new draft starts with that invoice's header and its allocations, and the invoice it
        supersedes is cancelled only when this one is actually submitted. A correction that was
        abandoned leaves the document it was going to replace exactly where it was.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoice'
      responses:
        '201':
          description: Invoice draft opened
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '403':
          description: |
            A provider-scoped caller raising an invoice for somebody else's provider.
            INVOICE_PROVIDER_SCOPE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |
            The invoice a correction says it supersedes is not there. INVOICE_NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The number is already used by a live invoice of this provider in this fiscal year,
            or the invoice named by `supersedesInvoiceId` is not in a state a correction may
            replace. INVOICE_NUMBER_TAKEN, INVOICE_NOT_SUPERSEDABLE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            The provider is not a provider of this tenant, carries no tax identity, or the
            image names a document that is not a clean one of this tenant.
            INVOICE_PROVIDER_UNKNOWN, PROVIDER_TAX_ID_MISSING, INVOICE_DOCUMENT_UNUSABLE,
            VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/invoices/{invoiceId}:
    get:
      tags: [Billing]
      operationId: getInvoice
      description: |
        One invoice with its allocations, in the projection the caller has earned.

        A line description of a health claim may carry clinical text, so the allocation's
        `claimDescription` is served only in the clinical projection — the same rule WP-I5-01
        applies to a claim line, applied here to the invoice's claim links. The sponsor's HR
        user reads the header, the totals and which claims are covered, and never what the
        provider wrote on a line.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Invoice
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Billing]
      operationId: patchInvoiceDraft
      description: |
        Edits the header of a DRAFT. Anything else is 409 `INVOICE_FROZEN`: a submitted
        invoice's figures never change, and a correction is a new invoice in a chain.

        The three amounts travel together — sending one of them without the other two is a
        validation error, because `lineExtension + tax = payable` has to hold on the row that
        results rather than on the row somebody meant.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PatchInvoiceDraft'
      responses:
        '200':
          description: Invoice updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The invoice has left DRAFT, or the new number is already used in this fiscal year.
            INVOICE_FROZEN, INVOICE_NUMBER_TAKEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/invoices/{invoiceId}/allocations:
    put:
      tags: [Billing]
      operationId: putInvoiceAllocations
      description: |
        Replaces the whole set of claim allocations of a DRAFT. The pick list is
        `getProviderEarnings`: `invoiceableClaimIds` is exactly the claims this provider may
        put on an invoice, and a claim already sitting on a live invoice is not among them.

        Two rules the database holds and this endpoint only reports:

        * an allocation may not exceed what the payer approved for the claim —
          `ALLOCATION_EXCEEDS_APPROVED`, naming the claim and both figures. Billing *less* than
          was approved is ordinary and is allowed;
        * one claim sits on one live invoice — `CLAIM_ALREADY_INVOICED`, naming the claim and
          the invoice it is already on.

        A claim that is not APPROVED or PARTIALLY_APPROVED is `CLAIM_NOT_INVOICEABLE`, and an
        allocation denominated differently from the invoice is `ALLOCATION_CURRENCY`.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutInvoiceAllocations'
      responses:
        '200':
          description: Allocations replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The invoice has left DRAFT, or one of the claims is already on a live invoice.
            INVOICE_FROZEN, CLAIM_ALREADY_INVOICED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            An allocation exceeds the claim's approved total, names a claim nobody approved,
            names a claim of another provider, or is in another currency.
            ALLOCATION_EXCEEDS_APPROVED, CLAIM_NOT_INVOICEABLE, ALLOCATION_CURRENCY,
            VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/invoices/{invoiceId}/submit:
    post:
      tags: [Billing]
      operationId: submitInvoice
      description: |
        Submits a DRAFT to the payer. Three gates, in this order:

        * **the sum of the allocations equals `payableAmount` within the tenant's tolerance.**
          Otherwise `ALLOCATION_MISMATCH`, carrying `payableAmount`, `allocationTotal`,
          `difference` and the `tolerance` that was applied, so a screen can say by how much
          rather than that something is wrong. The tolerance is
          `billing.allocation_tolerance`, an exact decimal amount defaulting to `0.01`;
        * **the image is attached when the tenant requires one** — `billing.invoice_requires_image`,
          true by default. Otherwise `INVOICE_IMAGE_REQUIRED`;
        * **every allocated claim is still invoiceable.** A claim decided differently while the
          draft sat open is `CLAIM_NOT_INVOICEABLE`.

        Then the invoice becomes SUBMITTED, its claims move to INVOICED, its links and figures
        freeze in the database, and `invoice.submitted` goes to the outbox. When the invoice
        supersedes another, that other invoice becomes CANCELLED at this moment and not before.

        Replaying the command with the same `Idempotency-Key` answers the same body.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Invoice submitted
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The invoice is not a draft, the allocations do not add up to the payable amount
            within the tolerance, or the image the tenant requires is missing.
            INVOICE_TRANSITION_INVALID, ALLOCATION_MISMATCH, INVOICE_IMAGE_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            An allocated claim has stopped being invoiceable, or the invoice allocates nothing
            at all. CLAIM_NOT_INVOICEABLE, VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/invoices/{invoiceId}/cancel:
    post:
      tags: [Billing]
      operationId: cancelInvoice
      description: |
        Withdraws a DRAFT or a RETURNED invoice and releases the claims it was holding: they go
        back to the status they had when they were allocated, and the invoice's rows stay on
        the record marked inactive, because "which claims did this cancelled invoice cover" is
        a question a dispute asks.

        Nothing is deleted. A cancelled invoice also stops occupying its number, which is how a
        provider whose own books already carry it can reuse it on the correction.

        Anything already submitted and accepted is refused: a SUBMITTED, IN_BATCH, APPROVED,
        PARTIALLY_APPROVED, REJECTED or SETTLED invoice is the payer's business now.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Invoice cancelled
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The invoice is not in a state it can be withdrawn from.
            INVOICE_TRANSITION_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/invoices/{invoiceId}/versions:
    get:
      tags: [Billing]
      operationId: listInvoiceVersions
      description: |
        The supersede chain this invoice belongs to, oldest first: the invoice that was
        returned, the correction that replaced it, and the correction of that correction if
        there was one.

        It answers from either end — asking about the newest invoice or about the oldest gives
        the same chain in the same order — because "which document is the live one" is the
        question a payer's finance user actually has, and answering it from a link that only
        points one way would mean walking the chain in a client.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: The supersede chain, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceChain'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/batches:
    get:
      tags: [Billing]
      operationId: listBatches
      description: |
        The icmals of this tenant, newest first, with their totals and how many invoices each
        of them carries.

        A provider-scoped caller reads its own batches and nothing else; the boundary is
        applied in SQL rather than after the read, so a batch outside it is genuinely not
        returned and 404 is the honest answer to asking for one by id.

        The totals are the server's own, in exact decimals. Until the batch is decided the four
        decision totals are zero, which is the truthful answer rather than a guess from the
        decisions taken so far.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: providerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: payerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BatchStatus'
        - name: domainCode
          in: query
          schema:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        - name: currencyCode
          in: query
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
        - name: from
          in: query
          description: Overlaps the batch period, inclusive.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Overlaps the batch period, inclusive.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPage'
        '400':
          description: |
            The paging cursor could not be read. CURSOR_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Billing]
      operationId: createBatch
      description: |
        Opens a draft icmal for one provider, one payer, one currency, one domain and one
        period.

        All five are fixed here and never derived from whatever is put in afterwards, which is
        the whole reason `putBatchInvoices` can refuse a mixture: a total across currencies is
        not a total, and a batch spanning two payers is two conversations in one document.

        The reference is the server's: `IC-YYYYMM-XXXXXXXX`, where the tail is forty random
        bits. It is random rather than sequential because a sequential reference tells a
        competitor how many icmals a tenant settled last month.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatch'
      responses:
        '201':
          description: Batch draft opened
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '403':
          description: |
            A provider-scoped caller opening an icmal for somebody else's provider.
            INVOICE_PROVIDER_SCOPE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            The organization is not a provider of this tenant, or the period is not a period.
            INVOICE_PROVIDER_UNKNOWN, VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/batches/{batchId}:
    get:
      tags: [Billing]
      operationId: getBatch
      description: |
        One icmal with the invoices it covers, each with the payer's decision, the amount that
        decision approved and the reason where there is one.

        Both sides read the same body. A decision is visible to the provider from the moment it
        is taken, because an icmal a provider cannot see the reasoning of is an icmal they
        cannot dispute.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/batches/{batchId}/summary:
    get:
      tags: [Billing]
      operationId: getBatchSummary
      description: |
        The totals and the per-decision counts, for both sides: how many invoices were
        approved, cut, returned and rejected, what each group adds up to, and how much is still
        waiting for an answer.

        The counts are computed from the decisions rather than stored, because they are a view
        of the decisions and not a fact of their own — a stored count would be a second place
        for the same truth and therefore a second place for it to be wrong.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/batches/{batchId}/invoices:
    put:
      tags: [Billing]
      operationId: putBatchInvoices
      description: |
        Replaces the whole set of invoices a DRAFT icmal collects. The pick list is
        `listInvoices` filtered to this provider's SUBMITTED documents of the batch's payer,
        domain and currency.

        Two rules refuse a row, and each of them names the invoice rather than its position in
        the body, because a provider knows their documents by number:

        * an invoice that does not belong in this icmal — `BATCH_MIXED`, naming the field that
          disagreed (`providerOrganizationId`, `payerOrganizationId`, `currencyCode`,
          `domainCode` or `status`) and both values;
        * an invoice already in a live batch — `INVOICE_ALREADY_BATCHED`, naming that batch.

        An empty list clears the membership, which is how a provider starts over. It is not a
        state the icmal can be submitted from unless the tenant's minimum is zero, and it is
        not.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutBatchInvoices'
      responses:
        '200':
          description: Membership replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The batch has left DRAFT, or one of the invoices is already in a live batch.
            BATCH_FROZEN, INVOICE_ALREADY_BATCHED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            An invoice does not belong in this icmal. BATCH_MIXED, VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/batches/{batchId}/submit:
    post:
      tags: [Billing]
      operationId: submitBatch
      description: |
        Sends the icmal to the payer.

        The count has to be inside the tenant's `billing.batch_min_invoices` and
        `billing.batch_max_invoices`, otherwise `BATCH_SIZE_OUT_OF_RANGE` carrying all three
        figures. Above `billing.batch_decision_threshold` the caller re-enters their password
        first, which is `STEP_UP_REQUIRED`.

        Then the batch becomes SUBMITTED, its invoices become IN_BATCH, its membership and
        amounts freeze in the database, a work item is raised in the payer's `BATCH_REVIEW`
        queue and `batch.submitted` goes to the outbox and to the payer's finance.

        Replaying the command with the same `Idempotency-Key` answers the same body.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Batch submitted
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '403':
          description: |
            The caller is not scoped to this provider, or the amount is above the tenant's
            threshold and the step-up window has closed. INVOICE_PROVIDER_SCOPE,
            STEP_UP_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The batch is not a draft, one of its invoices has stopped being SUBMITTED, or the
            count is outside the tenant's bounds. BATCH_TRANSITION_INVALID, BATCH_MIXED,
            BATCH_SIZE_OUT_OF_RANGE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/batches/{batchId}/invoices/{invoiceId}/review:
    post:
      tags: [Billing]
      operationId: reviewBatchInvoice
      description: |
        The payer's answer to one invoice in the icmal. Taking the first decision moves the
        batch to UNDER_REVIEW and claims the work item.

        * `APPROVE` accepts the invoice for what it billed. `approvedAmount` is not sent and is
          not accepted: it is the submitted amount, exactly.
        * `CUT` accepts part of it. `approvedAmount` is required and has to be strictly between
          zero and the submitted amount, and the difference is written as WP-I7-01 `CUT`
          adjustments across the claims the invoice covers, in proportion to their allocations,
          exact, with the rounding difference on the largest allocation. `reasonCode` has to be
          one of the claim ledger's cut reasons.
        * `RETURN` sends the document back for correction: the invoice becomes RETURNED and its
          claims are freed, so the provider can raise the correction that supersedes it.
        * `REJECT` refuses it: the invoice becomes REJECTED and its claims are closed unpaid.

        **A decision may be changed while the batch is UNDER_REVIEW, and changing one never
        edits what the last one did.** A cut is reversed by a `REVERSAL` row in the claim ledger
        rather than rewritten, a return puts the invoice and its claims back where the batch had
        them, and a rejection is undone the same way. The last decision stands and every one of
        them is an audit row.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewBatchInvoice'
      responses:
        '200':
          description: Decision recorded
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The batch is not there, or the invoice is not in it. BATCH_NOT_FOUND,
            BATCH_INVOICE_NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The batch is not one a decision can be recorded on, or undoing the previous
            decision would take back a claim that is now on another live invoice.
            BATCH_TRANSITION_INVALID, CLAIM_ALREADY_INVOICED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            The decision, its amount or its reason is not one the row can carry.
            VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/batches/{batchId}/decide:
    post:
      tags: [Billing]
      operationId: decideBatch
      description: |
        Closes the icmal off: every invoice answered, the four totals recomputed on the server
        and the provider told.

        **Two people, at least.** The person who submitted the batch never decides it, at any
        amount — that is WP-I4-03 §2.4's rule — and above `billing.batch_decision_threshold`
        the person who took the last decision may not be the one who closes it either.

        The totals are recomputed from the decisions and written with the batch:
        `approved + cut + returned + rejected = submitted`, exactly, which is a database CHECK
        as well. Approved invoices become APPROVED and cut ones PARTIALLY_APPROVED at this
        moment and not before, so a reviewer who changed their mind halfway through never told
        a provider a document had been accepted.

        Then the work item is completed and `batch.decided` goes to the outbox, carrying the
        totals and each return's and rejection's reason code.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Batch decided
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '403':
          description: |
            The caller submitted this batch, or is the person who took the last decision on a
            batch above the tenant's threshold. BATCH_SUBMITTER_CANNOT_DECIDE,
            BATCH_SECOND_REVIEWER_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The batch is not under review, or an invoice in it has not been answered.
            BATCH_TRANSITION_INVALID, BATCH_NOT_FULLY_DECIDED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/settlements:
    get:
      tags: [Billing]
      operationId: listSettlements
      description: |
        What the payer owes each provider, newest first, with keyset paging.

        A settlement is opened by the platform when a batch is decided — there is no endpoint
        that creates one — so every row here has a decided icmal behind it and a figure that is
        that icmal's arithmetic.

        A provider-scoped caller reads its own settlements and nothing else; the boundary is
        applied in SQL rather than after the read, so a settlement outside it is genuinely not
        returned and 404 is the honest answer to asking for one by id.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: providerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: payerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: batchId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SettlementStatus'
        - name: currencyCode
          in: query
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
        - name: dueFrom
          in: query
          description: Due date, inclusive.
          schema:
            type: string
            format: date
        - name: dueTo
          in: query
          description: Due date, inclusive.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Settlements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementPage'
        '400':
          description: |
            A filter or the cursor is not readable. CURSOR_INVALID, VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/settlements/{settlementId}:
    get:
      tags: [Billing]
      operationId: getSettlement
      description: |
        One settlement with the recoveries it netted and the payments recorded against it.

        `approvedAmount` is the batch's approved total, frozen at the moment the settlement
        opened. `withheldAmount` is the open recoveries this settlement took back, each of them
        listed. `payableAmount` is the difference and is never above the approved amount, which
        is a database CHECK rather than an arithmetic this service is trusted to have got right.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/SettlementId'
      responses:
        '200':
          description: Settlement
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/settlements/{settlementId}/approve:
    post:
      tags: [Billing]
      operationId: approveSettlement
      description: |
        Releases what the batch owes.

        **Step-up** above `billing.settlement_checker_threshold`: releasing more than that on
        one person's word means re-entering a password.

        **A second pair of eyes** above the same figure: the person who decided the batch may
        not be the person who approves its settlement. That is WP-I4-03 §2.4's rule applied to
        the money rather than to the document.

        Then `settlement.approved` goes to the outbox — M9's accounting posting listens for it,
        nothing is posted here — and the provider is told the reference, what will actually
        arrive and the day it is due.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/SettlementId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Settlement approved
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller decided the batch this settlement pays, above the tenant's threshold, or
            the step-up window has closed. SETTLEMENT_DECIDER_CANNOT_APPROVE, STEP_UP_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The settlement is not waiting for approval. SETTLEMENT_TRANSITION_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/settlements/{settlementId}/cancel:
    post:
      tags: [Billing]
      operationId: cancelSettlement
      description: |
        Withdraws a wrong settlement with a reason. It is the only way a settlement's figures
        ever change, and they change by not being that settlement's any more: the next
        `batch.decided` replay opens version 2 on the same batch, and the recoveries this one
        had netted are open again.

        A settlement money has already moved against is not cancellable. The answer there is a
        dispute on the payment record, because pretending the settlement never existed would
        leave a payment pointing at a document nobody can explain.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/SettlementId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSettlement'
      responses:
        '200':
          description: Settlement cancelled
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The settlement is already cancelled, or a payment has been recorded against it.
            SETTLEMENT_TRANSITION_INVALID, SETTLEMENT_HAS_PAYMENTS.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            The reason code or its text is not one the row can carry. VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/settlements/{settlementId}/payment-records:
    get:
      tags: [Billing]
      operationId: listPaymentRecords
      description: |
        The payments entered against one settlement, oldest first, with the external reference
        each of them quotes.

        The settlement is read first, so a caller who may not see it is told it does not exist
        rather than handed an empty list they might read as "nothing has been paid".
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/SettlementId'
      responses:
        '200':
          description: Payment records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecordList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Billing]
      operationId: createPaymentRecord
      description: |
        Records that somebody outside this system transferred money against this settlement.
        KAPSORA transfers nothing (v1.2 §4.3); this is the note that it was transferred, with
        the bank's or the ERP's own reference.

        **The sum of the records never exceeds the settlement.** A record that would take it
        past `payableAmount` is refused with `PAYMENT_EXCEEDS_SETTLEMENT` carrying the
        remainder — what may still be entered — rather than only the fact that this one was too
        much. The settlement row is locked first, so two clerks entering a record at the same
        moment serialise rather than each seeing a stale sum.

        The settlement's status follows the sum: PARTIALLY_PAID while short of the payable
        amount, PAID when it is reached. Nothing here is ever deleted: a record entered wrongly
        becomes DISPUTED and stays with its reference.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/SettlementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRecord'
      responses:
        '201':
          description: Payment recorded
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The settlement is not payable, the sum would exceed it, or this provider's external
            reference has been entered before. PAYMENT_NOT_ALLOWED,
            PAYMENT_EXCEEDS_SETTLEMENT, PAYMENT_REFERENCE_TAKEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            The reference, the amount, the date or the source is not one the row can carry.
            VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/reimbursements:
    get:
      tags: [Billing]
      operationId: listReimbursements
      description: |
        The reimbursement requests the payer's finance side reviews, newest first.

        No response in this API ever carries a bank account number. `bankAccountMasked` is four
        characters and is every word this platform will say about an account; the number itself
        exists as one ciphertext in one column and is read by nothing.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: personId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReimbursementStatus'
        - name: from
          in: query
          description: Service date, inclusive.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Service date, inclusive.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Reimbursements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementPage'
        '400':
          description: |
            A filter or the cursor is not readable. CURSOR_INVALID, VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Billing]
      operationId: createReimbursement
      description: |
        Opens the member's draft reimbursement against a REIMBURSEMENT service request of
        WP-I4-01, and takes the account the money should go to.

        Whose reimbursement this is, is the server's answer: it comes from the caller's PERSON
        grant. A body that names the caller's own person is accepted; one that names anybody
        else is 403.

        **The account number is written once and read back never.** It goes through the platform
        cipher into a single column, and four characters of it into `bankAccountMasked`. There
        is no field in any response, audit row, notification or outbox payload that carries more
        than those four characters.

        Four checks refuse a draft, all of them here rather than at submission so a member who
        has just typed an IBAN is told immediately: the enrollment covered them on the service
        date, the receipt is a clean scanned document, the amount is inside the contract's
        ceiling for the service when it sets one, and the receipt is not one already claimed —
        by digest, or by the same provider, day and amount inside the tenant's window.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReimbursement'
      responses:
        '201':
          description: Reimbursement drafted
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reimbursement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller is not bound to a person, or named somebody else's.
            PERSON_BINDING_MISSING, PERSON_SCOPE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The same receipt, or the same provider, day and amount, has already been claimed
            inside the tenant's window. REIMBURSEMENT_DUPLICATE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            The request is not a live REIMBURSEMENT of this member, the receipt is not a clean
            document, the member was not covered on the service date, or the amount is above the
            contract's ceiling. REIMBURSEMENT_REQUEST_UNUSABLE, REIMBURSEMENT_RECEIPT_UNUSABLE,
            REIMBURSEMENT_NOT_ELIGIBLE, REIMBURSEMENT_CEILING_EXCEEDED, VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/reimbursements/{reimbursementId}:
    get:
      tags: [Billing]
      operationId: getReimbursement
      description: |
        One reimbursement. A member reading their own goes through the same route and sees the
        same shape; another member's is 404 rather than 403, because the two are the same answer
        and telling them apart would confirm the row exists.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReimbursementId'
      responses:
        '200':
          description: Reimbursement
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reimbursement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/reimbursements/{reimbursementId}/submit:
    post:
      tags: [Billing]
      operationId: submitReimbursement
      description: |
        Sends the member's draft to the payer's finance and raises the review work item.

        The duplicate check runs again here, and it is not a repeat of the one in the create:
        between the two, somebody else's submission may have claimed the same receipt, and the
        moment that matters is the moment it is actually claimed.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReimbursementId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Reimbursement submitted
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reimbursement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The reimbursement is not a draft, or the receipt has meanwhile been claimed.
            REIMBURSEMENT_TRANSITION_INVALID, REIMBURSEMENT_DUPLICATE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/reimbursements/{reimbursementId}/decide:
    post:
      tags: [Billing]
      operationId: decideReimbursement
      description: |
        A reviewer may not decide a file that belongs to their own person (selfPersonId on
        the tenant context): 403 OWN_FILE_DECISION, audited as a denial.

        Answers the member: approve in full, approve in part with a reason, or reject with a
        reason.

        **An approval consumes the member's money entitlement, on approval, for exactly the
        approved amount.** Not the requested amount, not at submission, and never nothing at
        all. In the same transaction it creates WP-I7-01's REIMBURSEMENT claim already decided,
        moves the row to PAYMENT_ORDERED and publishes `reimbursement.approved` for the payment
        adapter. A plan with no money entitlement the amount could come from is
        `ENTITLEMENT_ACCOUNT_NOT_FOUND` and nothing is approved.

        **A rejection consumes nothing at all.** The member's balance afterwards is the balance
        before, exactly.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReimbursementId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideReimbursement'
      responses:
        '200':
          description: Reimbursement decided
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reimbursement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The reimbursement is not one waiting for a decision, or the member's balance is not
            enough. REIMBURSEMENT_TRANSITION_INVALID, ENTITLEMENT_INSUFFICIENT.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            The decision, its amount or its reason is not one the row can carry, or the member
            has no money entitlement the amount could come from.
            ENTITLEMENT_ACCOUNT_NOT_FOUND, VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/reimbursements/{reimbursementId}/payment:
    post:
      tags: [Billing]
      operationId: recordReimbursementPayment
      description: |
        Marks the reimbursement PAID with the reference the bank gave back. It is somebody
        typing what happened elsewhere, exactly like a settlement's payment record: KAPSORA
        moved nothing (v1.2 §4.3) and this is the note that it was moved.

        The member is then told the amount and the four characters of the account it went to.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ReimbursementId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordReimbursementPayment'
      responses:
        '200':
          description: Reimbursement paid
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reimbursement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The reimbursement has not been approved, or has already been paid.
            REIMBURSEMENT_TRANSITION_INVALID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            The payment reference is not one the row can carry. VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/reimbursements:
    get:
      tags: [Billing]
      operationId: getMyReimbursements
      description: |
        The signed-in member's own reimbursements, newest first.

        There is no `personId` filter and there is nowhere in the request to name another
        person: the answer comes from the caller's PERSON grant, exactly as `getMyPerson` does.
        A caller whose grants carry no PERSON scope is 403 PERSON_BINDING_MISSING rather than an
        empty list, because "you are not bound to anybody" and "you have claimed nothing" are
        different facts.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReimbursementStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's own reimbursements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementPage'
        '400':
          description: |
            The cursor or the status filter is not readable. CURSOR_INVALID,
            VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/providers/{providerId}/statement:
    get:
      tags: [Reports]
      operationId: getProviderStatement
      description: |
        The numbers both sides argue about, on one page: what the provider billed in the period,
        what the payer decided, what was settled, what was actually paid, and what is still open.

        **Every figure in `totals` is a server sum of exact decimals, computed in one query.** It
        is not the invoice rows added up and it is not the settlement rows added up: `invoices`
        and `settlements` are capped at five thousand rows each and the totals are not, so a
        client that added the rows would get a different — and wrong — answer for a busy provider.
        Nothing on this page may be recomputed on the client.

        Each figure has its own window, and each window is one a list endpoint can reproduce:
        `invoicedTotal` is the invoices dated in the period, the four decision columns are the
        icmals decided in it, and the settlement columns are the settlements *due* in it.

        Read under `report.read` on the payer side. A provider reads its own and gets 403 for
        anybody else's, because it named an organization on purpose and is entitled to know its
        grants do not reach it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderId'
        - name: periodFrom
          in: query
          required: true
          description: Inclusive.
          schema:
            type: string
            format: date
        - name: periodTo
          in: query
          required: true
          description: Inclusive.
          schema:
            type: string
            format: date
        - name: currencyCode
          in: query
          description: |
            Defaults to TRY. A statement is per currency: two currencies added together is not a
            total.
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
      responses:
        '200':
          description: Provider statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderStatement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            A provider-scoped caller asking about somebody else's provider. REPORT_PROVIDER_SCOPE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/reconciliation-runs:
    get:
      tags: [Reports]
      operationId: listReconciliationRuns
      description: |
        The daily comparisons, newest first, with keyset paging.

        A run is written by the `billing.reconcile` job and by nothing else — there is no endpoint
        that creates one — and it is **append-only**: a second look at the same day is run number
        two and both stay, because "we looked again and it balanced" is part of the record.

        A `DIFFERENCES` run raised exactly one work item in the finance queue when it was written.

        A provider-scoped caller reads its own PROVIDER runs and never the tenant-wide ones: a
        TENANT run is every provider's figures added together.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/ReconciliationScope'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReconciliationRunStatus'
        - name: providerOrganizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: periodFrom
          in: query
          description: Runs whose period starts on or after this day.
          schema:
            type: string
            format: date
        - name: periodTo
          in: query
          description: Runs whose period ends on or before this day.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Reconciliation runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRunPage'
        '400':
          description: |
            A filter or the cursor is not readable. CURSOR_INVALID, VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/reconciliation-runs/{runId}:
    get:
      tags: [Reports]
      operationId: getReconciliationRun
      description: |
        One run with the settlements it disagreed with.

        `differences` carries references rather than ids, because the column is read by a person
        looking for the row on their own screen. `difference` is `settledTotal` minus the ERP's
        figure when there is one and minus `paidTotal` when there is not — which is a database
        CHECK rather than an arithmetic the job is trusted to have got right.

        `erpTotal` is null until M9.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Reconciliation run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/operations/dashboard:
    get:
      tags: [Reports]
      operationId: getOperationsDashboard
      description: |
        The counts and sums an operator reads every morning: claims by status and by how long they
        have waited, icmals awaiting a decision with the oldest SLA, settlements due this week and
        already overdue, reimbursements awaiting a decision, and work past its SLA.

        **Each figure is one server query and each carries the filter that reproduces it.** The
        filter is not decoration: a count a person cannot click through to a list of is a number
        they have to take on trust. There is no percentage on this page and no total across
        figures, because a ratio is a number two screens round differently and a total assembled
        from six queries is wrong for the moment between the first and the sixth.

        Read under `report.read`. A provider-scoped caller sees its own rows; the reimbursement
        figure is the payer's business with its own member and is zero for a provider.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Operations dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/exports:
    get:
      tags: [Reports]
      operationId: listExports
      description: |
        The exports, newest first, with keyset paging. `mine=false` widens the list to the whole
        tenant for a caller that holds `report.read`; the default is the caller's own, because an
        export is a file with somebody's name stamped on every row of it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/ExportKind'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ExportStatus'
        - name: mine
          in: query
          description: Defaults to true.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Exports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPage'
        '400':
          description: |
            A filter or the cursor is not readable. CURSOR_INVALID, VALIDATION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Reports]
      operationId: createExport
      description: |
        Queues one export. Nothing is rendered here: the worker writes the file, so a request that
        produced one would be a request whose duration is a function of how much data the tenant
        has. The answer is QUEUED, and the caller polls `getExport`.

        **`parameters` may not carry an identifier.** Which provider, which period and which
        currency an export covers are fields of their own; `parameters` is the remainder a screen
        sent — statuses, buckets, a free-text search — and a uuid or a key called `...Id` in it is
        refused by the database as well as by this endpoint.

        **`format` is CSV.** XLSX is a value of the column and is refused here: nothing in this
        release can write a spreadsheet, and an export that answered READY with a CSV inside a
        file called .xlsx would be worse than a refusal.

        `report.export` is required. `CLAIMS` additionally requires `report.export.sensitive`,
        because its rows carry claim line descriptions — what a member was treated for, written in
        words.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExport'
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '400':
          description: |
            The request body could not be read. INVALID_REQUEST_BODY.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller does not hold `report.export`, asked for `CLAIMS` without
            `report.export.sensitive`, or named a provider outside its own scope.
            EXPORT_SENSITIVE_REQUIRED, REPORT_PROVIDER_SCOPE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/exports/{exportId}:
    get:
      tags: [Reports]
      operationId: getExport
      description: |
        One export: what was asked for, what the worker produced, the watermark stamped on every
        row of the file, when it stops being downloadable and how many times it was downloaded.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/exports/{exportId}/download:
    post:
      tags: [Reports]
      operationId: downloadExport
      description: |
        A short-lived link to the file, through the document store's own download path.

        **The download is the access that is audited.** Two rows are written and each answers a
        question the other cannot: one naming the export, its kind and the requester, and the
        document store's own naming the file. The download is counted before the link is handed
        out, because a link that was issued and not counted is a download nobody knows happened.

        **After `expiresAt` it is refused** — `EXPORT_EXPIRED` — whether or not the nightly sweep
        has removed the bytes yet. "May I have this" and "is it still on disk" are different
        questions, and the first one is answered by the clock.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ExportId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportDownloadRequest'
      responses:
        '200':
          description: Download link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportDownload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The export is not downloadable. EXPORT_EXPIRED, EXPORT_NOT_READY, EXPORT_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-kapsora_session
      description: |
        Opaque session id. The server stores only its SHA-256 hash and the browser never
        holds a token of any kind. Local HTTP development uses the name kapsora_session
        because the __Host- prefix requires HTTPS.
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.kapsora.example/realms/kapsora/protocol/openid-connect/token
          scopes:
            kapsora.api: Call KAPSORA APIs
  parameters:
    AppHeader:
      name: X-Kapsora-App
      in: header
      required: false
      description: |
        The app the request comes from. It picks which of the account's grants apply: the
        backoffice gets the tenant-wide staff roles, the provider portal the ORGANIZATION
        grants, the member app the PERSON binding. It only narrows; without it every grant
        applies. An unknown value is 400 APP_HEADER_INVALID.
      schema:
        type: string
        enum: [backoffice, provider, member]
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: Selected tenant UUID. It must be one of the actor's active memberships.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key retained for at least 24 hours.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional on query-style POSTs; honoured when present.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when the request is authenticated with the BFF session cookie.
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Optimistic concurrency token returned as ETag.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from the previous response.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OrganizationId:
