  /api/v1/entitlement-accounts/{accountId}/adjustments:
    post:
      tags: [Benefit]
      operationId: createEntitlementAdjustment
      description: |
        Requests a manual correction of the account (positive or negative quantity) with a
        reason. Nothing moves until a different actor approves it (maker-checker); the
        request itself is audited.
      parameters:
