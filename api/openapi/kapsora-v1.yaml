        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: Adjustment page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntitlementAdjustment'
                  nextCursor:
                    type: [string, 'null']
  /api/v1/entitlement-adjustments/{adjustmentId}/approve:
    post:
      tags: [Benefit]
      operationId: approveEntitlementAdjustment
      description: |
        Approves a pending adjustment and writes the ADJUST ledger movement in the same
        transaction. The approver must differ from the requester (403
        MAKER_CHECKER_SAME_ACTOR) and must have re-entered their password (step-up).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AdjustmentId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewComment'
      responses:
        '200':
          description: Adjustment approved and applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementAdjustment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/entitlement-adjustments/{adjustmentId}/reject:
    post:
      tags: [Benefit]
      operationId: rejectEntitlementAdjustment
      description: Rejects a pending adjustment with a reason; nothing moves.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AdjustmentId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Adjustment rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementAdjustment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/eligibility/checks:
    post:
      tags: [Eligibility]
      operationId: checkEligibility
      description: |
        Query-style POST: evaluates eligibility deterministically and records an evaluation
        snapshot, but changes no business state. Idempotency-Key is therefore optional.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibilityCheckRequest'
      responses:
        '200':
          description: Deterministic eligibility result and explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityCheckResult'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/eligibility/evaluations/{evaluationId}:
    get:
      tags: [Eligibility]
      operationId: getEligibilityEvaluation
      description: |
        The stored snapshot of an earlier check: the request as it was understood (ids,
        dates, quantities), the result with explanations and the versions used. Evaluations
        are immutable and never contain identifiers.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/EvaluationId'
      responses:
        '200':
          description: Stored evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityEvaluation'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/imports/members:
    post:
      tags: [Imports]
      operationId: createMemberImport
      description: |
        Uploads a member file (CSV_V1, UTF-8, at most 20 MB / 50 000 rows) for a sponsor
        organization and stages it. Identifiers are blind-indexed, masked and encrypted on
        the way in; the plaintext file content is not kept. The same
        `sourceSystem + sourceVersion + file hash` answers 409 IMPORT_DUPLICATE. Small files
        are validated synchronously (201, status VALIDATING or REVIEW/READY); large files are
        queued (202). Requires `import.execute` and step-up.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, sponsorOrganizationId, sourceSystem, sourceVersion]
              properties:
                file:
                  type: string
                  format: binary
                sponsorOrganizationId:
                  type: string
                  format: uuid
                sourceSystem:
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
                sourceVersion:
                  type: string
                  maxLength: 64
                planId:
                  type: string
                  format: uuid
                  description: Default plan for rows without `plan_code`.
      responses:
        '201':
          description: Batch staged and validated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '202':
          description: Batch staged; validation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: File too large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [Imports]
      operationId: listMemberImports
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [RECEIVED, VALIDATING, REVIEW, READY, APPLYING, APPLIED, FAILED, CANCELLED]
      responses:
        '200':
          description: Import batches, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberImportBatch'
                  nextCursor:
                    type: [string, 'null']
  /api/v1/imports/members/{importId}:
    get:
      tags: [Imports]
      operationId: getMemberImport
      description: Batch status, counters and the reconciliation summary.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Import batch
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/imports/members/{importId}/rows:
    get:
      tags: [Imports]
      operationId: listMemberImportRows
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, VALID, INVALID, MATCHED, CONFLICT, APPLIED, SKIPPED]
      responses:
        '200':
          description: Rows of the batch in file order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberImportRow'
                  nextCursor:
                    type: [string, 'null']
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/imports/members/{importId}/rows/{rowId}/review:
    post:
      tags: [Imports]
      operationId: reviewMemberImportRow
      description: Records the operator's decision for a CONFLICT or INVALID row.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/ImportRowId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [CREATE, UPDATE, SKIP]
                matchedPersonId:
                  type: string
                  format: uuid
                  description: Required for UPDATE when the row was a CONFLICT.
      responses:
        '200':
          description: Row updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportRow'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/imports/members/{importId}/apply:
    post:
      tags: [Imports]
      operationId: applyMemberImport
      description: |
        Applies the batch in transactional chunks (worker job): persons, identifiers,
        memberships (principals first), relationships and enrollments. Rows marked SKIP or
        still INVALID are skipped and counted. Re-applying an APPLIED batch is a no-op.
        Requires `import.execute` and step-up.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Apply queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/imports/members/{importId}/cancel:
    post:
      tags: [Imports]
      operationId: cancelMemberImport
      description: Cancels a batch that has not started applying.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Batch cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberImportBatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/service-requests:
    get:
      tags: [Service Requests]
      operationId: listServiceRequests
      description: |
        Service requests of the tenant, newest first, with keyset paging. Every filter is
        optional and they combine with AND. A provider-scoped actor only ever sees the
        requests made for one of its own organizations: the boundary is applied in the
        repository rather than in the handler, so a request that belongs to another
        provider is not on the page and is not reachable by id either.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: Keep only the requests currently in this lifecycle state.
          schema:
            $ref: '#/components/schemas/ServiceRequestStatus'
        - name: personId
          in: query
          description: Keep only the requests raised for this person.
          schema:
            type: string
            format: uuid
        - name: programId
          in: query
          description: Keep only the requests raised under this benefit program.
          schema:
            type: string
            format: uuid
        - name: providerOrganizationId
          in: query
          description: Keep only the requests naming this provider organization.
          schema:
            type: string
            format: uuid
        - name: channel
          in: query
          description: Keep only the requests that arrived through this channel.
          schema:
            $ref: '#/components/schemas/ServiceRequestChannel'
        - name: serviceDateFrom
          in: query
          description: Keep only the requests whose service date is on or after this day.
          schema:
            type: string
            format: date
        - name: serviceDateTo
          in: query
          description: Keep only the requests whose service date is on or before this day.
          schema:
            type: string
            format: date
        - name: createdFrom
          in: query
          description: Keep only the requests created at or after this instant.
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          description: Keep only the requests created at or before this instant.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Service request page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Service Requests]
      operationId: createServiceRequest
      description: |
        Opens a request in DRAFT together with its first version and the lines it starts
        with. Nothing is decided here: the eligibility gate and the tenant's rules run at
        submit, and until then the draft is only a form somebody is filling in. The status
        cannot be chosen, because a request always starts in DRAFT, and supersedesRequestId
        is how a fresh attempt names the rejected request it replaces.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Draft service request created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}:
    get:
      tags: [Service Requests]
      operationId: getServiceRequest
      description: |
        One request with the lines of its current version and the evaluations that decided
        its last submit. A provider-scoped actor asking for another provider's request is
        answered 404 rather than 403: that such a request exists at all is itself
        information about somebody else's business.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Service request detail
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Service Requests]
      operationId: patchServiceRequestDraft
      description: |
        Merge-patches the header of the DRAFT version: the provider, the service date and
        the requested window. It never writes status. A body carrying status, or any other
        field this endpoint does not own, is answered 422 with the field code IMMUTABLE,
        because every move through the lifecycle is a command of its own with its own
        precondition, permission and reason. The lines are replaced through
        putServiceRequestItems rather than here.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Draft updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/service-requests/{requestId}/items:
    put:
      tags: [Service Requests]
      operationId: putServiceRequestItems
      description: |
        Replaces the whole line set of the DRAFT version. It is a replacement rather than a
        patch because a line number identifies a line only inside one version, and a partial
        write would leave the caller guessing which of the lines it sent survived. A version
        that has already been submitted is frozen: writing to it answers 409.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestItems'
      responses:
        '200':
          description: Draft lines replaced
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/service-requests/{requestId}/submit:
    post:
      tags: [Service Requests]
      operationId: submitServiceRequest
      description: |
        Freezes the DRAFT version and runs the gate in one transaction: the version is
        validated, the pure eligibility resolver answers whether the person may use the
        benefit on the service date, and the tenant's published DOCUMENT and PREAUTH rule
        sets are evaluated. The request lands in ELIGIBILITY_FAILED, PENDING_DOCUMENT,
        PENDING_REVIEW or APPROVED, and the eligibility evaluation and the rule evaluation
        that decided it are recorded so the outcome can be explained afterwards. Nothing is
        reserved: moving entitlement is the authorization's job, not this command's.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewComment'
      responses:
        '200':
          description: Submitted request after the eligibility and rule gate
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}/return:
    post:
      tags: [Service Requests]
      operationId: returnServiceRequest
      description: |
        Sends a request awaiting review or a document back to the requester. This is not a
        rejection and the two must never be collapsed: the request keeps its reference, goes
        back to DRAFT, opens the next version to be corrected in, and the reason stays on the
        version that was sent back, so what was submitted the first time is still readable
        exactly as it was. A returned request is a correctable mistake; a rejected one is a
        refusal, and mistaking the first for the second is what makes a member give up rather
        than fix a form.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Request returned to the requester as a new draft version
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}/reject:
    post:
      tags: [Service Requests]
      operationId: rejectServiceRequest
      description: |
        Refuses a request awaiting review. A rejected request is finished: it is closed, its
        version is frozen and it cannot be corrected. A fresh attempt is a new request that
        names this one in supersedesRequestId, which is what keeps "we asked again,
        differently" readable rather than hidden inside one row that changed its mind.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Rejected request
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}/approve:
    post:
      tags: [Service Requests]
      operationId: approveServiceRequest
      description: |
        Approves a request awaiting review in full. Every line is approved for what was
        requested unless the command names lines explicitly. Approval decides; it does not
        reserve anything, and no balance moves until an authorization is raised against this
        request.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestDecision'
      responses:
        '200':
          description: Approved request
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/service-requests/{requestId}/partially-approve:
    post:
      tags: [Service Requests]
      operationId: partiallyApproveServiceRequest
      description: |
        Approves some of what was asked for and refuses or reduces the rest. The line
        decisions are required and at least one of them has to differ from a full approval,
        otherwise the command is an approve and says so: a partial approval that approved
        everything would leave a member reading a word that does not match the numbers.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RequestId'
