        amount:
          type: [string, 'null']
        percent:
          type: [string, 'null']
        formulaKey:
          type: [string, 'null']
        minAmount:
          type: [string, 'null']
        maxAmount:
          type: [string, 'null']
        memberShareMethod:
          $ref: '#/components/schemas/MemberShareMethod'
        memberShareAmount:
          type: [string, 'null']
        memberSharePercent:
          type: [string, 'null']
        matchedVia:
          $ref: '#/components/schemas/PriceMatchTarget'
    ScoredPriceCandidate:
      type: object
      additionalProperties: false
      required: [priceItemId, priceListId, contractVersionId, score, matched, matchedVia]
      properties:
        priceItemId:
          type: string
          format: uuid
        priceListId:
          type: string
          format: uuid
        contractVersionId:
          type: string
          format: uuid
        score:
          type: integer
          description: Specificity score; the highest one wins and equal ones are a tie, never a coin flip.
        matched:
          type: boolean
          description: False for a candidate that was loaded and then ruled out.
        excluded:
          type: [string, 'null']
          description: Why it was ruled out, one of PERIOD, SEASON, WEEKDAY, LOCATION or SERVICE.
        matchedVia:
          $ref: '#/components/schemas/PriceMatchTarget'
        itemPriority:
          type: integer
        listPriority:
          type: integer
    ResolvePriceResult:
      type: object
      additionalProperties: false
      required: [outcome, serviceDate, considered, tied]
      properties:
        outcome:
          type: string
          description: |
            MATCHED when exactly one candidate scored highest, REVIEW_REQUIRED when several
            tied at the top, NOT_FOUND when nothing matched at all.
          enum: [MATCHED, REVIEW_REQUIRED, NOT_FOUND]
        reason:
          type: [string, 'null']
          description: PRICE_AMBIGUOUS or PRICE_NOT_FOUND; absent when a winner was found.
        serviceDate:
          type: string
          format: date
        winner:
          $ref: '#/components/schemas/ResolvedPrice'
        tied:
          type: array
          description: Every candidate that tied at the top when the outcome is REVIEW_REQUIRED.
          items:
            $ref: '#/components/schemas/ResolvedPrice'
        considered:
          type: array
          description: Every candidate with its score, winners and losers alike, highest first.
          items:
            $ref: '#/components/schemas/ScoredPriceCandidate'
    RuleSetPurpose:
      type: string
      description: |
        Which decision a rule set answers. A caller asking "what documents does this claim
        need" reads the DOCUMENT sets and never a PRICE one, so the purpose is what makes
        a set findable rather than a comment on it.
      enum: [ELIGIBILITY, DOCUMENT, PREAUTH, LIMIT, DUPLICATE, DIAGNOSIS_SERVICE, PRICE, ADJUDICATION]
    RuleSetStatus:
      type: string
      description: |
        Lifecycle of a rule set. INACTIVE stops it being offered for new decisions and
        changes nothing about the evaluations it already produced.
      enum: [ACTIVE, INACTIVE]
    RuleSetVersionStatus:
      type: string
      description: |
        Lifecycle of a rule set version. PUBLISHED is the only status the engine ever
        evaluates for a recorded decision, and nothing about it may change afterwards.
      enum: [DRAFT, UNDER_REVIEW, PUBLISHED, RETIRED]
    RuleInputType:
      type: string
      description: |
        The CEL type of one declared input variable (ADR-023). The environment offers
        these and nothing else: there is no type here that reaches a network, a file or a
        database, which is how v1.2 11.7's prohibitions are kept — by absence.
      enum: [string, int, double, bool, timestamp, duration, map, list]
    RuleInputSchema:
      type: object
      description: |
        The variables a condition of this version may name, and their CEL types. A
        condition reaching anything not declared here fails to compile at authoring time.
      additionalProperties:
        $ref: '#/components/schemas/RuleInputType'
    RuleActionType:
      type: string
      description: |
        What a matched rule asks the caller to do. The engine returns actions and performs
        none of them: eligibility, authorization and adjudication decide what to do with
        them, and that separation is what lets a simulation run without writing a row.
      enum:
        - APPROVE
        - REJECT
        - WARN
        - REQUIRE_DOCUMENT
        - REQUIRE_PREAUTH
        - REQUIRE_MEDICAL_REVIEW
        - REQUIRE_FINANCIAL_REVIEW
        - PARTIAL_APPROVE
        - RESERVE_ENTITLEMENT
        - ADJUST_PRICE
        - SET_LIMIT
    RuleOutcome:
      type: string
      description: |
        The one answer a whole pass folds to. Any REJECT wins; otherwise any REQUIRE_*
        means REVIEW_REQUIRED; otherwise any PARTIAL_APPROVE means PARTIALLY_APPROVED;
        APPROVED is what is left when nothing objected.
      enum: [APPROVED, REJECTED, REVIEW_REQUIRED, PARTIALLY_APPROVED]
    RuleSeverity:
      type: string
      description: How loud one line of the trace is; ERROR marks a rule that threw or timed out.
      enum: [INFO, WARNING, ERROR]
    RuleAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/RuleActionType'
        payload:
          type: object
          additionalProperties: true
          description: |
            The typed payload of the action, validated on write against the action type:
            REQUIRE_DOCUMENT needs a documentTypeCode, SET_LIMIT and RESERVE_ENTITLEMENT
            an amount, ADJUST_PRICE a method and a value. Every numeric value is an exact
            decimal string, never a JSON number.
    RuleSet:
      type: object
      additionalProperties: false
      required: [id, code, name, domainCode, purpose, status, versionCount, rowVersion]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        domainCode:
          $ref: '#/components/schemas/ServiceDomain'
        purpose:
          $ref: '#/components/schemas/RuleSetPurpose'
        status:
          $ref: '#/components/schemas/RuleSetStatus'
        versionCount:
          type: integer
          minimum: 0
          description: How many versions the set holds, drafts included.
        rowVersion:
          type: integer
          minimum: 1
    RuleSetPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuleSet'
        nextCursor:
