        validFrom:
          type: string
          format: date
        validTo:
          type: [string, 'null']
          format: date
        endReasonCode:
          type: [string, 'null']
        rowVersion:
          type: integer
          minimum: 1
    CreateRelationshipRequest:
      type: object
      additionalProperties: false
      required: [targetPersonId, relationshipType, validFrom]
      properties:
        targetPersonId:
          type: string
          format: uuid
        relationshipType:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
    EndPeriodCommand:
      type: object
      additionalProperties: false
      required: [endsOn, reasonCode]
      properties:
        endsOn:
          type: string
          format: date
        reasonCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
