                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntitlementAdjustment'
                  nextCursor:
                    type: [string, 'null']
  /api/v1/entitlement-adjustments/{adjustmentId}/approve:
    post:
      tags: [Benefit]
      operationId: approveEntitlementAdjustment
      description: |
        Approves a pending adjustment and writes the ADJUST ledger movement in the same
        transaction. The approver must differ from the requester (403
        MAKER_CHECKER_SAME_ACTOR) and must have re-entered their password (step-up).
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AdjustmentId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewComment'
      responses:
        '200':
          description: Adjustment approved and applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementAdjustment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/entitlement-adjustments/{adjustmentId}/reject:
    post:
      tags: [Benefit]
      operationId: rejectEntitlementAdjustment
      description: Rejects a pending adjustment with a reason; nothing moves.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/AdjustmentId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
