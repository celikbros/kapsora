          format: uuid
        reviewComment:
          type: [string, 'null']
        retireReasonCode:
          type: [string, 'null']
        rules:
          type: array
          description: The rules of the version in ascending priority order; 1 runs first.
          items:
            $ref: '#/components/schemas/Rule'
        testCases:
          type: array
