      operationId: listServiceCodeMappings
      description: |
        Every external code this definition is reported under, ordered by code system and
        validity start. The set is short by design, so it is returned whole rather than
        paged.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ServiceDefinitionId'
      responses:
        '200':
          description: Code mappings of the definition
          content:
