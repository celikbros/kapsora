                $ref: '#/components/schemas/Problem'
  /api/v1/code-systems:
    get:
      tags: [Catalog]
      operationId: listCodeSystems
      description: |
        External code systems known to the tenant, newest first, with keyset paging.
        Editions of the same system live side by side, so SUT 2024 and SUT 2025 are two
        rows.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Code or name search.
          schema:
            type: string
            maxLength: 120
        - name: authority
          in: query
          description: Only systems published by this authority.
          schema:
            $ref: '#/components/schemas/CodeSystemAuthority'
        - name: status
          in: query
          description: Only systems in this status.
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
      responses:
        '200':
          description: Code system page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSystemPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Catalog]
      operationId: createCodeSystem
      description: |
        Registers one edition of a code system. Code and version together are unique
        within the tenant (409 CODE_SYSTEM_TAKEN) and both are immutable, because mappings
        and imported values hang off the row. Set licensed when the content may not leave
        the tenant.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCodeSystemRequest'
      responses:
        '201':
          description: Code system created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSystem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/code-systems/{codeSystemId}:
    get:
      tags: [Catalog]
      operationId: getCodeSystem
      description: |
        One code system with its current ETag, which the caller needs before it can
        patch the system.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CodeSystemId'
      responses:
        '200':
          description: Code system
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSystem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Catalog]
      operationId: patchCodeSystem
      description: |
        Merge-patch of name, authority, licensing, status and validity end. Code and
        version are immutable: a body carrying either answers 422 with field code
        IMMUTABLE.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CodeSystemId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateCodeSystemRequest'
      responses:
        '200':
          description: Code system updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSystem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/code-systems/{codeSystemId}/values:
    get:
      tags: [Catalog]
      operationId: listCodeValues
      description: |
        Values of the system that are valid on asOf (today by default), so a claim from
        last year resolves against the codes that were valid then. This is the only reader
        of the table; code matches one value exactly and q searches display text and code.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CodeSystemId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: asOf
          in: query
          description: Date the values must be valid on; defaults to today.
          schema:
            type: string
            format: date
        - name: code
          in: query
          description: Exact code inside the system.
          schema:
            type: string
            maxLength: 64
        - name: q
          in: query
          description: Display text or code search.
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Code value page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeValuePage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/code-systems/{codeSystemId}/values:import:
    post:
      tags: [Catalog]
      operationId: importCodeValues
      description: |
        Upserts up to 5000 values on (code, validFrom) in one transaction. The call is
        all-or-nothing, so a rejected batch leaves nothing behind and the answer names the
        array index and the field code of every rejected row. Larger systems are loaded by
        repeating the call; the same Idempotency-Key replays the stored summary without a
        second write.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/CodeSystemId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCodeValuesRequest'
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeValueImportResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Request body larger than the import endpoint accepts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/providers:
    get:
      tags: [Providers]
      operationId: listProviders
      description: |
        Provider profiles of the tenant, newest first, with keyset paging. q searches the
        organization name, the other filters narrow to one provider type, one network tier
        or one status. An actor whose role grants are scoped to organizations sees only
        the providers inside that scope; the filter is applied in the repository, so no
        route can forget it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Organization name search.
          schema:
            type: string
            maxLength: 120
        - name: providerType
          in: query
          description: Only providers of this type.
          schema:
            $ref: '#/components/schemas/ProviderType'
        - name: status
          in: query
          description: Only providers in this status.
          schema:
            $ref: '#/components/schemas/ProviderStatus'
        - name: networkTier
          in: query
          description: Only providers in this tenant-defined network tier.
          schema:
            type: string
            maxLength: 32
      responses:
        '200':
          description: Provider page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Providers]
      operationId: createProvider
      description: |
        Gives an organization the tenant already knows a provider profile. The
        organization relationship must carry the PROVIDER role; one relationship may hold
        only one profile, so a second answers 409 PROVIDER_PROFILE_EXISTS. The profile
        starts in PENDING and is moved by the explicit status commands, never by a patch.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderRequest'
      responses:
        '201':
          description: Provider profile created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/providers/search:
    get:
      tags: [Providers]
      operationId: searchProviders
      description: |
        Answers the question eligibility and service requests actually ask: which provider
        locations can deliver this service on this date. A capability naming a service
        category covers every definition under it, including ones added later, so the
        search resolves the category tree at read time. Providers that are not ACTIVE and
        locations that are not ACTIVE are excluded, and the page walks the standard opaque
        cursor.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: serviceDefinitionId
          in: query
          required: true
          description: The service definition the location must be able to deliver.
          schema:
            type: string
            format: uuid
        - name: city
          in: query
          description: Only locations in this city.
          schema:
            type: string
            maxLength: 120
        - name: asOf
          in: query
          description: Date the capability must be valid on; defaults to today.
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Location code or name search.
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Provider search page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSearchPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/providers/{providerId}:
    get:
      tags: [Providers]
      operationId: getProvider
      description: |
        One provider profile of the tenant with its optimistic concurrency tag. A provider
        outside the caller's organization scope answers 404, not 403, so the existence of
        another provider does not leak.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Provider profile
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Providers]
      operationId: patchProvider
      description: |
        Merge-patch of provider type, network tier, contract dates and notes. The status is
        absent on purpose: it is moved by the activate, suspend and terminate commands, so
        every transition is auditable as an intent rather than as a field assignment. A
        body carrying status or tenantOrganizationId answers 422 with field code IMMUTABLE.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateProviderRequest'
      responses:
        '200':
          description: Provider profile updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{providerId}/activate:
    post:
      tags: [Providers]
      operationId: activateProvider
      description: |
        PENDING or SUSPENDED to ACTIVE. Only an ACTIVE provider is returned by the
        eligibility search, so this is the moment a contract starts being used. Any other
        starting status answers 409 PROVIDER_TRANSITION_INVALID.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Provider activated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{providerId}/suspend:
    post:
      tags: [Providers]
      operationId: suspendProvider
      description: |
        ACTIVE to SUSPENDED with a reason. The profile, its locations and its
        practitioners stay readable and nothing already delivered is undone; the provider
        simply stops being offered by the search. Any other starting status answers 409
        PROVIDER_TRANSITION_INVALID.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Provider suspended
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{providerId}/terminate:
    post:
      tags: [Providers]
      operationId: terminateProvider
      description: |
        Any status to TERMINATED with a reason. Termination is final: a terminated
        provider accepts no further transition and answers 409
        PROVIDER_TRANSITION_INVALID, because the contract history has to stay readable
        exactly as it ended.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCommand'
      responses:
        '200':
          description: Provider terminated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/providers/{providerId}/locations:
    get:
      tags: [Providers]
      operationId: listProviderLocations
      description: |
        The places this provider works from, newest first, with keyset paging. A location
        is where a service is delivered, so contracts price against it and the eligibility
        answer names it.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Location code or name search.
          schema:
            type: string
            maxLength: 120
        - name: city
          in: query
          description: Only locations in this city.
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          description: Only locations in this status.
          schema:
            $ref: '#/components/schemas/ProviderLocationStatus'
      responses:
        '200':
          description: Provider location page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderLocationPage'
        '400':
          description: Cursor invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Providers]
      operationId: createProviderLocation
      description: |
        Adds a location to the provider. The code is unique within the provider (409
        LOCATION_CODE_TAKEN) and immutable afterwards, because capabilities, contracts and
        service requests are read against it. Latitude and longitude are plain columns for
        putting a pin on a map; there is no distance search yet.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderLocationRequest'
      responses:
        '201':
          description: Location created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderLocation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/provider-locations/{locationId}:
    get:
      tags: [Providers]
      operationId: getProviderLocation
      description: |
        One provider location with its optimistic concurrency tag. A location belonging to
        a provider outside the caller's organization scope answers 404, not 403.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ProviderLocationId'
      responses:
        '200':
          description: Provider location
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderLocation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Providers]
      operationId: patchProviderLocation
      description: |
        Merge-patch of the address, the contact details and the location status. The code
