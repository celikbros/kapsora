            $ref: '#/components/schemas/ServiceCodeMapping'
    ServiceCodeMappingInput:
      type: object
      additionalProperties: false
      required: [codeSystemId, code, validFrom]
      properties:
        codeSystemId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 64
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, 'null']
          format: date
        primary:
          type: boolean
          default: false
    ReplaceServiceCodeMappingsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ServiceCodeMappingInput'
    ProviderType:
      type: string
      description: What kind of place the provider is; it drives the default location and capability picker.
      enum: [HOSPITAL, CLINIC, PHARMACY, LABORATORY, IMAGING, HOTEL, AGENCY, TRANSPORT, EDUCATION, SPORT, OTHER]
    ProviderStatus:
      type: string
      description: Lifecycle of a provider profile; only ACTIVE providers are offered by the search.
      enum: [PENDING, ACTIVE, SUSPENDED, TERMINATED]
    ProviderLocationStatus:
      type: string
      description: Lifecycle of one provider location.
      enum: [ACTIVE, SUSPENDED, CLOSED]
    PractitionerStatus:
      type: string
      description: Lifecycle of a practitioner registration at a provider.
      enum: [ACTIVE, SUSPENDED, ENDED]
    PractitionerRole:
      type: string
      description: The role a practitioner holds at one location.
      enum: [ATTENDING, CONSULTANT, TECHNICIAN, ADMINISTRATIVE]
