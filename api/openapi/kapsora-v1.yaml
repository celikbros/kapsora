        publishedAt:
          type: [string, 'null']
          format: date-time
        ruleCount:
          type: integer
          minimum: 0
        testCaseCount:
          type: integer
          minimum: 0
          description: How many test cases the version holds; submit refuses while this is zero.
        rowVersion:
          type: integer
          minimum: 1
    RuleSetVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuleSetVersionSummary'
    RuleSetVersion:
      type: object
