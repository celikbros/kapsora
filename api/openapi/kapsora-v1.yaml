        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateRuleSetRequest'
      responses:
        '200':
          description: Rule set updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSet'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: ETag mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Body is not application/merge-patch+json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '428':
          description: If-Match header missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/rule-sets/{ruleSetId}/versions:
    get:
      tags: [Rules]
      operationId: listRuleSetVersions
      description: |
        The version summaries of one rule set, highest version number first. A published
        or retired version is visible to anyone who may read rules; a draft or a version
        under review is an unagreed proposal and takes `rule.draft` to see at all.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/RuleSetId'
